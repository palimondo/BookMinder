philosophy:
  - statement: >-
      Mocked acceptance tests at a boundary specify the contract (who is called, with what,
      in what order) — they are not there for coverage, and coverage cannot judge them.
    source: user-verbatim
    quote: |-
      Acceptance tests with mocks are testing correct contract flow on the boundary -- the
      library itself is fully tested by its integration test, that's why the coverage didn't drop.
    loc: "day-021:L4169"
    feeds: skill-why

  - statement: >-
      A test's necessity is demonstrated by constructing the code change that would break it,
      not by argument and not by a coverage delta.
    source: user-verbatim
    quote: "Let's put that test back and then try to come up with a code change, that would prove it's necessity"
    loc: "day-021:L4170"
    feeds: judge-anchor

  - statement: >-
      Layer test strategy: everything mocked to prove the CLI passes parameters and delegates
      to its collaborators; exactly one integration test proves the pieces are wired together.
    source: user-verbatim
    quote: |-
      we should test everything with mocks to verify CLI us correctly passing the parameters and
      using other components to do its job (listing boks from library, using formating function to
      print each book) and then have ONE, SINGLE Integration test that executes against test fixture
    loc: "day-021:L1565"
    feeds: skill-why

  - statement: >-
      At a coordination boundary you assert that the collaborator was called, not the string it
      produced — the formatter's output is the formatter's spec, not the CLI's.
    source: user-verbatim
    quote: "and do we need to test output string, or that the format was called twice, because there are 2 books?"
    loc: "day-021:L1617"
    feeds: skill-why

  - statement: >-
      Git history is the medium for recording design reasoning: deliberately commit the inferior
      intermediate version first, then the superior one, so the diff carries the argument.
    source: user-verbatim
    quote: |-
      I want to record this learnign in git history, so: Let's first try if everything runs as is, ...
      Then we'll do the above proposed refactoring, so that we can capturethe difference between
      these two approaches with the proper reasoning why the latter is superior.
    loc: "day-021:L1722"
    feeds: skill-why

  - statement: >-
      Test data is sized by the 0-1-many rule and stripped to the minimum that can still
      falsify the property under test.
    source: user-verbatim
    quote: "considering the 0, 1 many pattern... how many books do we need here?"
    loc: "day-021:L1601"
    feeds: judge-anchor

  - statement: >-
      A stronger assertion subsumes weaker ones; asserting the exact call sequence already
      proves the count, so the count assertion is noise.
    source: user-verbatim
    quote: |-
      we don't need to assert on call count if we assert that first call was with book1 and second
      with book2, we've proven all is correct, right?
    loc: "day-021:L2203"
    feeds: judge-anchor

  - statement: >-
      Explore the real system read-only to learn ground truth; fixtures are a derived, frozen
      snapshot and are only extended once reality shows a case worth capturing.
    source: user-verbatim
    quote: |-
      W8, when you are doing exploration of the DB state, use real database, not the fixtures. If we
      find a new case, that isn't yet in fixture and we need it, we'll copy from real to fixture, but
      the read-only exploration should be done on the real deal!
    loc: "day-021:L6321"
    feeds: skill-why

  - statement: >-
      Evidence falsifies theories; a hypothesis (platform inconsistency) is retired by name once
      the observation explains the difference by another mechanism (download state).
    source: user-verbatim
    quote: |-
      The Mac vs. iPhone screenshots confirm that the behavior is identical on both platforms and the
      the previous theory of platform inconsitency is falsified.
    loc: "day-021:L6323"
    feeds: judge-anchor

  - statement: >-
      When new evidence contradicts prior assumptions, stop reasoning from the current
      implementation — the implementation encodes the assumption under suspicion.
    source: user-verbatim
    quote: |-
      We are reverse engineering the Continue section queries based on the screenshots. We have just
      discovered that some of our previous assumptions might have been incorrect! ... So please
      doublecheck your sources for these claims.
    loc: "day-021:L6457"
    feeds: judge-anchor

  - statement: >-
      A fact belongs in exactly one authoritative place; duplication of the same query in prose
      and in the DB section is what let the docs drift out of sync.
    source: user-verbatim
    quote: "Do we need these queries in two places? It already did bite us just now, when our docs get out of sync..."
    loc: "day-021:L6807"
    feeds: skill-why

  - statement: >-
      The product replicates its reference UI on purpose, so that an agent consuming it via MCP and
      the human looking at the app share one frame of reference.
    source: user-verbatim
    quote: |-
      It should replicate Apple Books UI behavior, so that when we add MCP version of this functionality,
      agents like Claude would have similar point of refference liek users when they open the app, to
      avoid potential confusion.
    loc: "day-021:L7231"
    feeds: skill-why

  - statement: >-
      Story scenarios state user-visible behavior; a scenario line that prescribes how it is done
      is a defect in the story, not a detail.
    source: user-verbatim
    quote: "line 12 is dictating implementaion detail -- not appropriate for story scenario!"
    loc: "day-021:L7328"
    feeds: judge-anchor

  - statement: >-
      Requirements gathering precedes acceptance-test translation: define the story card first,
      refine requirements into scenarios, then write one scenario at a time.
    source: user-verbatim
    quote: |-
      great plan! but lets define a story first, as Dan suggested! ww first need to refine the
      requirements into scenarios... we are at `requirements_gathering` phase!
    loc: "day-021:L5908"
    feeds: skill-why

  - statement: >-
      Scenarios must not be written for behavior that depends on an unbuilt capability; such
      path dependencies belong in the story that will introduce the capability.
    source: user-verbatim
    quote: |-
      How would we implement validation for multiple filters when we don't yet support multiple
      filters? looks like there is some path dependency here... and is that really necessary requirement
    loc: "day-021:L9030"
    feeds: judge-anchor

  - statement: >-
      The ordering of Completed Features is an immutable record of the journey through the story
      map; reopening is annotated in place rather than by reordering history.
    source: user-verbatim
    quote: |-
      can we find some in-place notation for reopening ... so that we don't have to remove it from the
      first position in the list-- it was the first implemented user story, so I'd like to keep the order
      in Completed Features as immutable record of implementation journey through the User Story Map
    loc: "day-021:L8745"
    feeds: skill-why

  - statement: >-
      Abstractions are justified by arithmetic on lines saved and by existing call sites, not by
      pattern-name appeal; a fixture is introduced only once two real users exist.
    source: user-verbatim
    quote: |-
      it what makes you think it's more verbose? We are saving a line for a price of 1 param to each it
      + 3 to define the fixture.
    loc: "day-021:L2498"
    feeds: skill-why

  - statement: >-
      Fixtures freeze time, so any recency-window behavior must be specified with controlled time
      rather than against a snapshot that will silently age out.
    source: user-verbatim
    quote: |-
      When we'll be implementing this, we should not forget to control time in tests -- fixtures are a
      frozen snapshot of time. We need to slide to time window in that integration test.
    loc: "day-021:L7068"
    feeds: skill-why

  - statement: >-
      The rhythm — story committed, then RED, then implementation — is itself the deliverable;
      the author names it as "our process" when the agent proposes to commit before implementing.
    source: user-verbatim
    quote: "yep, exactly. this is our process!"
    loc: "day-021:L9163"
    feeds: skill-why

skill_rules:
  - rule_id: d021-R1
    rule: >-
      When converting existing tests to a new style, refactor them in place in the same file
      under the same names; never create a parallel spec file.
    because: A parallel suite duplicates the specification instead of improving it, and the goal was to improve isolation of the existing acceptance tests.
    because_source: user-verbatim
    quote: "Why did we create a new file? We were refactoring the acceptanve tests, but ended up with something called cli_unit_spec... WTF?"
    evidence: "day-021:L1302"
    taught_or_enforced: needed-enforcement
    skill_target: tdd-bdd
    overlap: "canonical §3 (Revert-and-narrate)"
    feasibility: ok

  - rule_id: d021-R2
    rule: >-
      Before deleting or converting an end-to-end test, locate which unit or integration spec
      covers each behavior it was carrying, and add the missing one first.
    because: The subprocess CLI tests turned out to be the only tests exercising the library's cloud-filter branches.
    because_source: user-verbatim
    quote: |-
      please always think hard whether we have integration or unit test in other spec files for the
      parts of CLI 's Acceptance Test that we are removing (as we convert them from end-to-end tests
      into mocked integrations tests
    evidence: "day-021:L2889"
    taught_or_enforced: repeated
    skill_target: tdd-bdd
    overlap: "canonical §2.6 (Coverage is moved before it is removed)"
    feasibility: ok

  - rule_id: d021-R3
    rule: Run the tests and the coverage report after every single Write/Edit, not after a batch of them.
    because: Batching edits hides which change broke or un-covered what, and destroys the incremental commit boundary.
    because_source: user-verbatim
    quote: "no, after you refactor code, (after EACH Write/Update) you should run the tests and coverage"
    evidence: "day-021:L3576"
    taught_or_enforced: needed-enforcement
    skill_target: tdd-bdd
    overlap: "CLAUDE.md <implementation_process> / <tdd_discipline>"
    feasibility: ok

  - rule_id: d021-R4
    rule: Combine the test run and the coverage run into one command rather than running pytest twice.
    because: Two runs of the same suite is wasted cycle time in a loop the author wants fast.
    because_source: user-verbatim
    quote: "next tie run them good and you can combine the test and coverage run together, right?"
    evidence: "day-021:L3613"
    taught_or_enforced: taught-once
    skill_target: tdd-bdd
    overlap: "CLAUDE.md <build_commands>"
    feasibility: ok

  - rule_id: d021-R5
    rule: >-
      Never justify deleting a test by "coverage stayed at 100%"; prove redundancy by showing a
      code mutation that the remaining tests still catch.
    because: Coverage measures line execution, not contract specification, so a boundary-contract test can be unique while contributing zero coverage.
    because_source: user-verbatim
    quote: |-
      Acceptance tests with mocks are testing correct contract flow on the boundary -- the library
      itself is fully tested by its integration test, that's why the coverage didn't drop.
    evidence: "day-021:L4169"
    taught_or_enforced: needed-enforcement
    skill_target: tdd-bdd
    overlap: "canonical §2.4 (coverage is a residue, never a target)"
    feasibility: ok

  - rule_id: d021-R6
    rule: >-
      After restoring or adding a boundary spec, temporarily introduce the bug it claims to catch,
      watch it fail, revert, and keep the demonstration in the commit message.
    because: An executable demonstration that the spec fails for the right reason is the only proof that it specifies anything.
    because_source: user-verbatim
    quote: "Let's put that test back and then try to come up with a code change, that would prove it's necessity"
    evidence: "day-021:L4170"
    taught_or_enforced: taught-once
    skill_target: tdd-bdd
    overlap: none
    feasibility: ok

  - rule_id: d021-R7
    rule: >-
      In a coordination spec, assert the exact call_args_list of the collaborator; do not assert
      call_count separately and do not assert on rendered output.
    because: The exact call sequence already proves count and order, and output assertions couple the coordinator's spec to the formatter's.
    because_source: user-verbatim
    quote: |-
      we don't need to assert on call count if we assert that first call was with book1 and second
      with book2, we've proven all is correct, right?
    evidence: "day-021:L2203"
    taught_or_enforced: taught-once
    skill_target: tdd-bdd
    overlap: "canonical §2.2, §2.3"
    feasibility: ok

  - rule_id: d021-R8
    rule: Configure nothing on a mock that the test does not later assert on.
    because: An unused return_value implies the test cares about something it never checks.
    because_source: user-verbatim
    quote: "why did we have there `mock_list_recent.return_value = []`? What does it add? Is that the only place we have that pattern?"
    evidence: "day-021:L3437"
    taught_or_enforced: taught-once
    skill_target: tdd-bdd
    overlap: "canonical §2.3"
    feasibility: ok

  - rule_id: d021-R9
    rule: >-
      Name a patch handle after the full function being patched (mock_list_recent, not mock_list),
      anticipating sibling functions that will be patched in the same file.
    because: A truncated handle becomes ambiguous the moment a second, similarly-named collaborator appears.
    because_source: user-verbatim
    quote: |-
      keep full function name + the mock prefix when patching (I'm thinking ahead, when we have
      list_all_books it might be confusing to call it just mock_list... no?
    evidence: "day-021:L2215"
    taught_or_enforced: taught-once
    skill_target: tdd-bdd
    overlap: none
    feasibility: ok

  - rule_id: d021-R10
    rule: >-
      Construct test objects with only the fields the assertion depends on; drop every constructor
      argument that the test cannot observe.
    because: A field the test never reads falsely signals that the value matters.
    because_source: user-paraphrase
    evidence: "day-021:L2348"
    taught_or_enforced: taught-once
    skill_target: tdd-bdd
    overlap: "canonical §2.3 (test-data realism is an intent signal)"
    feasibility: ok

  - rule_id: d021-R11
    rule: >-
      Introduce a shared fixture only when at least two existing tests will consume it in the same
      commit, and make those two uses the stated motivation in the commit message.
    because: Two live call sites is the evidence that turns a speculative helper into a justified one.
    because_source: user-verbatim
    quote: "use the fixture also error boundary -- so wehn we'll commit this refactoring, that will be the motivation - we're already have 2 useges"
    evidence: "day-021:L2432"
    taught_or_enforced: taught-once
    skill_target: tdd-bdd
    overlap: "canonical §2.5"
    feasibility: ok

  - rule_id: d021-R12
    rule: >-
      Commit the story-card and requirements changes on their own, before touching any
      implementation or spec.
    because: Separating "what we want" from "how we do it" keeps the requirement revertible and citable from the implementation commit.
    because_source: user-verbatim
    quote: "shouldn't we commit the stories update before we start messing with the implementation? Or do you think it's better to include it in one commit?"
    evidence: "day-021:L7469"
    taught_or_enforced: taught-once
    skill_target: tdd-bdd
    overlap: "CLAUDE.md <git_workflow>"
    feasibility: ok

  - rule_id: d021-R13
    rule: >-
      Every story card carries a mandatory `status` of backlog | in_progress | done | reopened |
      research; `reopened` marks a done story whose requirements were later refined.
    because: The lifecycle vocabulary must match ordinary software development, not invented states, and reopening is a real and frequent event in this project.
    because_source: user-verbatim
    quote: "add `reopened` which shoudl be used for previously completed stories, which were later further refined and we have to revisit their implementation"
    evidence: "day-021:L8282"
    taught_or_enforced: taught-once
    skill_target: claude-md
    overlap: "CLAUDE.md <backlog_management> — this session is where that section was written"
    feasibility: ok

  - rule_id: d021-R14
    rule: >-
      Do not trust a story's declared status or TODO.md's Completed list; verify against the
      implementation and `git log` before acting on it.
    because: Two stories were marked done with no implementation and no commit that could have implemented them.
    because_source: user-verbatim
    quote: "w8, did we really already implement the filter-by-multiple-criteria.yaml ?"
    evidence: "day-021:L8436"
    taught_or_enforced: needed-enforcement
    skill_target: project-memory
    overlap: "canonical §5.9 (the status ledger disagrees with itself)"
    feasibility: ok

  - rule_id: d021-R15
    rule: >-
      Annotate a reopened story in place in TODO.md's Completed Features (e.g. `[REOPENED: ...]`);
      never reorder or remove entries from that list.
    because: The order of Completed Features is the immutable record of the journey through the User Story Map.
    because_source: user-verbatim
    quote: |-
      it was the first implemented user story, so I'd like to keep the order in Completed Features
      as immutable record of implementation journey through the User Story Map
    evidence: "day-021:L8745"
    taught_or_enforced: taught-once
    skill_target: project-memory
    overlap: none
    feasibility: ok

  - rule_id: d021-R16
    rule: >-
      Do read-only exploration of Apple Books state against the real database under
      ~/Library/Containers, never against specs fixtures.
    because: Fixtures only contain cases already known; the point of exploration is to find cases they lack.
    because_source: user-verbatim
    quote: |-
      when you are doing exploration of the DB state, use real database, not the fixtures. If we find
      a new case, that isn't yet in fixture and we need it, we'll copy from real to fixture
    evidence: "day-021:L6321"
    taught_or_enforced: needed-enforcement
    skill_target: project-memory
    overlap: none
    feasibility: >-
      needs-rework: a non-interactive harness has no real Apple Books library; the rule must degrade
      to "state explicitly that the fixture is the only source available and mark the conclusion provisional".

  - rule_id: d021-R17
    rule: >-
      In docs/apple_books.md, describe UI behaviour in plain language and keep every SQL query in
      the single Database-to-UI-Mapping section that the other sections link to.
    because: The same query existing in two sections is exactly what let the two copies contradict each other.
    because_source: user-verbatim
    quote: |-
      you probably don't want to mention COLUMNNAME here, we just decided to use plan language to
      describe the UI and only refer to DB section which contains DB queries
    evidence: "day-021:L6947"
    taught_or_enforced: needed-enforcement
    skill_target: project-memory
    overlap: none
    feasibility: ok

  - rule_id: d021-R18
    rule: >-
      Document Apple's UI quirks (cloud samples rendered as "1%") in the docs, but never replicate
      a quirk in the implementation.
    because: The docs record what Apple does; the product records what we decided to do, and conflating the two lost a whole edit round.
    because_source: user-verbatim
    quote: |-
      When I said we're qoing to ignore the quirk of UI displaying 1% for cloud samples, I meant in
      our implementation we shall not replicate this quirk. But we shoudl document this UI quirk in docs
    evidence: "day-021:L6995"
    taught_or_enforced: needed-enforcement
    skill_target: project-memory
    overlap: none
    feasibility: ok

  - rule_id: d021-R19
    rule: >-
      Treat `bookminder list recent` as a replication of Apple's Continue section — in-progress
      books plus recently opened samples, excluding finished books, with a ~7 day recency cutoff.
    because: An MCP-facing tool must show agents the same list the user sees in the app, or the two will talk past each other.
    because_source: user-verbatim
    quote: |-
      It should replicate Apple Books UI behavior, so that when we add MCP version of this
      functionality, agents like Claude would have similar point of refference liek users
    evidence: "day-021:L7231"
    taught_or_enforced: taught-once
    skill_target: project-memory
    overlap: none
    feasibility: ok

  - rule_id: d021-R20
    rule: >-
      Filters are orthogonal to list commands — the same filter vocabulary narrows whatever the
      base command returned; negative filters are derived from the positive ones.
    because: Nothing in Apple Books' UI makes filters command-specific, and the council's command-scoped error messages were wrong against the docs.
    because_source: user-verbatim
    quote: |-
      there might very well be filters that are not applicable to certain views ... At the moment I
      see no evidence in Apple Book's UI that filters have to be command specific.
    evidence: "day-021:L6139"
    taught_or_enforced: repeated
    skill_target: project-memory
    overlap: none
    feasibility: ok

  - rule_id: d021-R21
    rule: >-
      Any behavior gated on a time window must be specified with controlled time; do not write a
      spec whose truth depends on when the frozen fixture was captured.
    because: Fixtures are a snapshot; a recency assertion against them silently rots into a false pass or a false fail.
    because_source: user-verbatim
    quote: "we should not forget to control time in tests -- fixtures are a frozen snapshot of time. We need to slide to time window in that integration test."
    evidence: "day-021:L7068"
    taught_or_enforced: taught-once
    skill_target: tdd-bdd
    overlap: none
    feasibility: ok

  - rule_id: d021-R22
    rule: >-
      When a convention exists in one agent-instruction file, propagate it to CLAUDE.md, AGENTS.md
      and GEMINI.md in one amended commit, patching the existing section rather than adding a new one.
    because: The story-status system had lived only in GEMINI.md, so a Claude session was unaware of a rule the project considered settled.
    because_source: user-verbatim
    quote: |-
      I worry that since you were not aware of this system, it remained in a concept phase where it
      was only documented in @GEMINI.md but somehow didn't make it to @CLAUDE.md -- we must remedy
      that (same with @AGENTS.md)
    evidence: "day-021:L8052"
    taught_or_enforced: needed-enforcement
    skill_target: claude-md
    overlap: "CLAUDE.md <project_maintenance>; canonical §2.7 (amend by addressed diff)"
    feasibility: ok

  - rule_id: d021-R23
    rule: >-
      Before adding a section to CLAUDE.md, search for the section that already covers the topic
      and extend it.
    because: The agent was one keystroke from duplicating <backlog_management> with a near-identical block.
    because_source: user-verbatim
    quote: "Isn't <backlog_management> section already what we are talking about?!?"
    evidence: "day-021:L8070"
    taught_or_enforced: needed-enforcement
    skill_target: claude-md
    overlap: "canonical §2.7"
    feasibility: ok

  - rule_id: d021-R24
    rule: >-
      Stage files explicitly by name; `git add -A` and `git add .` are blocked and must not be
      worked around.
    because: A bulk add risks committing large or unintended files, and the repo enforces it with a PreToolUse hook.
    because_source: agent-synthesis
    evidence: "day-021:L5358"
    taught_or_enforced: needed-enforcement
    skill_target: claude-md
    overlap: "CLAUDE.md <git_workflow>"
    feasibility: ok

  - rule_id: d021-R25
    rule: >-
      When debugging a transformation against a known-good target, extract the input slice and the
      expected output to files and iterate with `diff`, advancing one output line at a time.
    because: A whole-file diff of 185 lines gives no actionable next step; a one-line target does.
    because_source: user-verbatim
    quote: "you should probably reduce the scope even further down, to proceed line by line from output. Do you understand my point? ultrathink"
    evidence: "day-021:L10781"
    taught_or_enforced: needed-enforcement
    skill_target: tdd-bdd
    overlap: none
    feasibility: ok

failure_modes:
  - name: structure-hijack
    era_class: timeless-discipline
    detector_family: F3-minimality
    loc: "day-021:L674"
    quote: "Let me create a new test file for CLI unit tests with proper mocking:"
    what_happened: >-
      Asked to improve isolation of the existing acceptance tests in cli_spec.py, the agent wrote a
      brand-new 176-line specs/cli_unit_spec.py duplicating them, and committed it.
    user_intervention: '"Why did we create a new file? We were refactoring the acceptanve tests, but ended up with something called cli_unit_spec... WTF?" (L1302)'
    outcome: reverted — `git rm` plus an explicit Revert commit whose body states the mistake (L1327-1340)
    detectable_by: both
    detector_candidate: >-
      Flag a commit that adds a new spec file whose describe_/it_ names substantially overlap an
      existing spec file's, when the stated task was to refactor the existing one.
    rule_origin: "CLAUDE.md <package_structure> (No Premature Modules) and <anti-patterns> (Creating files that don't serve immediate requirements)"

  - name: vacuous-assertion
    era_class: timeless-discipline
    detector_family: F2-assertion-integrity
    loc: "day-021:L1478"
    quote: "assert result.exit_code == 0"
    what_happened: >-
      Converting a subprocess test to CliRunner, the agent carried over the subprocess returncode
      check as an exit_code assertion that asserted nothing about the mocked path.
    user_intervention: '"w8, why did you add `assert result.exit_code == 0`?" (L1511)'
    outcome: fixed — removed in the same refactoring round
    detectable_by: both
    detector_candidate: >-
      In a spec whose collaborators are all mocked to succeed, flag success-path status assertions
      (exit_code == 0, returncode == 0) as unfalsifiable.
    rule_origin: "CLAUDE.md <tdd_discipline> Implementation Checklist: 'Are assertions strong enough to catch real bugs?'"

  - name: scope-creep
    era_class: timeless-discipline
    detector_family: F3-minimality
    loc: "day-021:L912"
    quote: "Looking at the CLI unit tests more deeply, I see several significant refactoring opportunities:"
    what_happened: >-
      Asked to expand on refactoring ideas, the agent proposed seven abstractions for a 176-line test
      file — BookBuilder, a mock context manager, a CLIAssertions class, Scenario objects, a
      property-based-testing layer with hypothesis, and a fixture hierarchy.
    user_intervention: '"Let''s regroup, this is a mess. What was the goal of our last change, before we started discussing the refactoring?" (L1278)'
    outcome: unresolved as a proposal — abandoned wholesale after the goal-recovery question; one helper (a CliRunner fixture) eventually landed
    detectable_by: transcript
    detector_candidate: >-
      Flag any design proposal that introduces more new abstractions than the file has test functions,
      or that introduces a new dependency (hypothesis) without a failing requirement.
    rule_origin: "CLAUDE.md <core_philosophy> (YAGNI, Minimize code) and <anti-patterns>"

