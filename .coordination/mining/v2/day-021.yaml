pairing_rules:
  - rule_id: p021-R1
    rule: >-
      Before proposing any refactor, state the goal of the change currently in flight; if you cannot
      state it in one sentence, stop and recover it before writing anything.
    class: mirror
    because: The author's single goal-recovery question collapsed a seven-abstraction tangent instantly.
    because_source: user-verbatim
    quote: "Let's regroup, this is a mess. What was the goal of our last change, before we started discussing the refactoring?"
    evidence: "day-021:L1278"
    guards_against: scope-creep

  - rule_id: p021-R2
    rule: >-
      For every assertion you add, be able to answer: what does this test, is it already covered
      elsewhere, and what unique thing does it add at this boundary? Answer it before writing, not after.
    class: mirror
    because: The author replaced line-by-line correction with three standing questions that the agent must apply itself.
    because_source: user-verbatim
    quote: |-
      What is this testing? Are other parts of our specs already covering the same thing? If so, what is
      the unique thing this acceptance test shoudl add to our specification of the interaction accross
      the boundaries of various systems?
    evidence: "day-021:L1530"
    guards_against: vacuous-assertion

  - rule_id: p021-R3
    rule: >-
      When you conclude something is redundant, obsolete or dead, propose the experiment that would
      falsify your conclusion and run it before acting.
    class: mirror
    because: Coverage staying flat was treated as proof of redundancy; a wrong-function mutation proved the opposite in one run.
    because_source: user-verbatim
    quote: "Let's put that test back and then try to come up with a code change, that would prove it's necessity"
    evidence: "day-021:L4170"
    guards_against: unverified-diagnosis

  - rule_id: p021-R4
    rule: >-
      Never attribute a conclusion to the user that the user did not state; if you originated it,
      own it, and say what evidence you have.
    class: reciprocal
    because: '"You were right - the test was redundant" laundered the agent''s own inference through the user''s authority, removing the person who could have challenged it.'
    because_source: agent-synthesis
    evidence: "day-021:L3893"
    guards_against: sycophantic-fold

  - rule_id: p021-R5
    rule: >-
      When the user offers a hedged permission ("you can try", "maybe I was wrong"), treat it as a
      request for evidence, not as approval of the outcome.
    class: reciprocal
    because: The user explicitly flagged low confidence — "I probably was, cause I'm calling asleep now" — and the agent took the hedge as a mandate.
    because_source: user-verbatim
    quote: "you can try, but verify with coverage, maybe I was wrong (I probably was, cause I'm calling asleep now)"
    evidence: "day-021:L3851"
    guards_against: sycophantic-fold

  - rule_id: p021-R6
    rule: >-
      When you disagree with the user's proposal, say so and make the argument; the author invites it
      explicitly and expects to be talked out of things.
    class: reciprocal
    because: '"maybe you''ll talk me out of it" is a standing invitation to push back, and the agent''s most useful turn in the fixture debate was arithmetic that disagreed with itself.'
    because_source: user-verbatim
    quote: "one more refactoring round on that function, maybe you'll talk me out of it, but how much of the Book parameters do we actually have to use in that constructor?"
    evidence: "day-021:L2348"
    guards_against: sycophantic-fold

  - rule_id: p021-R7
    rule: >-
      Explain a proposed mechanism before applying it, and correct your own explanation when the user's
      counting contradicts it.
    class: reciprocal
    because: The agent asserted a fixture would be "MORE verbose" without counting; the user counted, and the arithmetic settled it.
    because_source: user-verbatim
    quote: "it what makes you think it's more verbose? We are saving a line for a price of 1 param to each it + 3 to define the fixture."
    evidence: "day-021:L2498"
    guards_against: alternatives-theater

  - rule_id: p021-R8
    rule: >-
      When new evidence lands, name which prior claims it invalidates and re-check every document that
      repeats them, before proposing the next change.
    class: mirror
    because: The samples-in-Continue discovery invalidated the list-recent story, the filter story, the implementation and two doc sections at once, and the author enumerated all of them.
    because_source: user-verbatim
    quote: |-
      as a next step after commit we have to review our stories, scenatios and implementations for
      consistency with this new learnig that we just captured in the docs update. Think harder
    evidence: "day-021:L7069"
    guards_against: unverified-diagnosis

  - rule_id: p021-R9
    rule: >-
      Verify an inherited convention against the artifacts before propagating it; report which files
      actually carry it and which do not.
    class: mirror
    because: A researched-and-summarized convention was reported as "fully implemented" when no story file carried the field at all.
    because_source: user-verbatim
    quote: "We should verify that. I worry that since you were not aware of this system, it remained in a concept phase where it was only documented in @GEMINI.md"
    evidence: "day-021:L8052"
    guards_against: fabricated-claim

  - rule_id: p021-R10
    rule: >-
      When delegating to another agent, give it a high-level goal and boundary parameters; do not
      micromanage its file access or pre-chew its inputs.
    class: council-mechanics
    because: The agent's attempt to hand Gemini a list of @file includes was rejected; the free-form goal prompt with a "use rg, files are huge" boundary worked.
    because_source: user-verbatim
    quote: |-
      No, you do NOT have to use @filename syntax to include files in prompt. Gemini CLI is as capable as
      you. Give it high live goal, set the boundary parameters (use `rg` to search etc) and let it extract
      the historical context we want. Don't try to micromanage it too much
    evidence: "day-021:L7810"
    guards_against: alternatives-theater

  - rule_id: p021-R11
    rule: >-
      A sub-agent's report is a lead, not a finding: check its conclusions against the repository
      before acting on them.
    class: council-mechanics
    because: Gemini's research correctly located the status vocabulary but wrongly concluded "The feature was implemented"; the story files had no status field.
    because_source: agent-synthesis
    evidence: "day-021:L9674"
    guards_against: council-as-rubber-stamp

  - rule_id: p021-R12
    rule: >-
      When convening personas, put the current proposal in front of them to be attacked, and report
      the dissent verbatim rather than collapsing it into a unanimous recommendation.
    class: council-mechanics
    because: The one council that produced real value opened by demolishing the agent's own approach; every council that opened with "Unanimous Recommendations" was reversed on the next user turn.
    because_source: agent-synthesis
    evidence: "day-021:L5958"
    guards_against: council-as-rubber-stamp

  - rule_id: p021-R13
    rule: >-
      Do not put a story template in an expert's mouth to justify a developer-facing task; if the
      motivation is not user-visible, say it is a developer concern in your own voice.
    class: council-mechanics
    because: The author judged the invented "As a developer maintaining BookMinder" story a misinterpretation of BDD attributed to its creator.
    because_source: user-verbatim
    quote: "Dan North's ficticious 'As a developer maintatining Bookinder' looks like a ridiculous anit-pattern and misinterpretation of BDD. Do better!"
    evidence: "day-021:L5098"
    guards_against: simulacra-shallowness

  - rule_id: p021-R14
    rule: >-
      Before proposing a change to project memory, run git blame / git show on the line in question
      and read what the introducing commit claimed.
    class: mirror
    because: The author routes questions about "why is this here" through history rather than through inference from the current code.
    because_source: user-verbatim
    quote: "also, why does it call `_books_plist(user_home)`? Will anything break if it didn't? check git blame for projects history to relearn why/how it was addded think hard"
    evidence: "day-021:L5099"
    guards_against: unverified-diagnosis

  - rule_id: p021-R15
    rule: >-
      When iterating toward a known-good target, propose the smallest comparison harness (extracted
      input slice, extracted expected slice, a diff loop) before the first attempt, not after failures.
    class: reciprocal
    because: The author twice had to introduce the harness the agent should have proposed — first the slice-and-diff files, then the line-by-line scope reduction.
    because_source: user-verbatim
    quote: "let's extract the input slice and the output slice we'll be comparing into files, so that we don't need to `sed` it all the time."
    evidence: "day-021:L10407"
    guards_against: alternatives-theater

council_episodes:
  - loc: "day-021:L372"
    trigger: >-
      After the ZISSAMPLE-deletion experiment showed 12/37 tests failing, to interpret what the blast
      radius said about the test architecture.
    invoked_by: user
    personas: [Kent Beck, Dave Farley, Dan North, Steve Freeman & Nat Pryce]
    voices: individual
    disagreement_use: >-
      A scripted four-line "Synthesis and Debate" (Kent YAGNI vs Steve's BookRepository) was immediately
      dissolved into "Unanimous Recommendations"; the disagreement changed nothing downstream.
    outcome: accepted
    fidelity:
      - persona: Kent Beck
        assessment: caricature
        evidence: >-
          "What strikes me immediately is that we have test-induced design damage" (L398) — the phrase is
          DHH's 2014 coinage against TDD, which Beck publicly argued with; here it is voiced as his own
          diagnostic vocabulary (attribution-drift). The persona then recommends "Replace subprocess tests
          with the mock pattern" (L408), inverting Beck's well-known classicist scepticism of mocks.
      - persona: Dave Farley
        assessment: faithful
        evidence: "Test pyramid, deterministic tests, separate stages, optimize for feedback speed (L420-424) — his actual and actionable position."
      - persona: Dan North
        assessment: faithful
        evidence: "'you're testing implementation, not behavior... A user doesn't care about ZISSAMPLE columns' (L430,442) — recognisably North, though generic."
      - persona: Steve Freeman & Nat Pryce
        assessment: faithful
        evidence: "'Listen to test pain - Difficult mocking indicates poor boundaries' and 'Mock at architectural boundaries' (L455-456) are genuine GOOS doctrine; the ports-and-adapters framing is Cockburn's vocabulary borrowed, not misattributed doctrine."
    user_reaction: Accepted the plan and asked for the last session's todo state; no challenge.
    lesson: >-
      A council that converges on the interpretation the agent already presented adds confidence without
      adding information.

  - loc: "day-021:L1118"
    trigger: The agent's own seven-abstraction refactoring proposal for the new CLI unit tests.
    invoked_by: user
    personas: [Kent Beck, Dave Farley, Dan North, Steve Freeman & Nat Pryce]
    voices: individual
    disagreement_use: >-
      Genuine — "Debate: Fundamental Disagreement" runs four exchanges and ends in Kent's compromise
      ("Extract ONE helper function"), which is the recommendation that survives.
    outcome: accepted
    fidelity:
      - persona: Kent Beck
        assessment: faithful
        evidence: "'The BookBuilder is overengineering. You have 3 test books. Just use 3 constants' (L1167) — simplicity-over-flexibility, actionable, and correct here."
      - persona: Dave Farley
        assessment: caricature
        evidence: >-
          "Property-based testing - Great idea, but it could make tests non-deterministic" (L1183). Hypothesis
          runs seeded and shrinks deterministically, and Farley advocates property-based testing publicly;
          the persona is generating generic CD caution rather than his position.
      - persona: Steve Freeman & Nat Pryce
        assessment: caricature
        evidence: >-
          "InMemoryBookRepository ... No mocking needed!" (L1227-1232) — GOOS's signature move is mocking the
          interface you own, not substituting a hand-written in-memory fake; the persona argues the classicist
          alternative under the mockists' name.
      - persona: Dan North
        assessment: faithful
        evidence: "'No user cares if a mock was called!' with a Given/When/Then rewrite (L1191-1213)."
    user_reaction: '"Let''s regroup, this is a mess." — the whole thread, council included, was discarded."'
    lesson: >-
      Consulting about a proposal you should not have made spends a turn ratifying the premise; the cheaper
      move was recovering the goal.

  - loc: "day-021:L1634"
    trigger: >-
      The user asked one named expert to justify one specific decision — mocking `format` and asserting the
      calls rather than the output string.
    invoked_by: user
    personas: [Steve Freeman]
    voices: individual
    disagreement_use: "None sought — a single-expert explanation, not a deliberation."
    outcome: accepted
    fidelity:
      - persona: Steve Freeman
        assessment: faithful
        evidence: >-
          Role-based testing, "Listen to the Tests", change-pattern reasoning and "Tell, Don't Ask"
          (L1644-1671) are all genuine GOOS material, correctly applied to this seam. The author's verdict:
          "this was very good. Please remember that." (L1722)
    user_reaction: Praised it and commissioned a two-commit sequence to record the resulting design in git history.
    lesson: >-
      A single named expert answering one concrete "why" produced the session's only durable council
      artifact; the four-persona panels produced none.

  - loc: "day-021:L3913"
    trigger: The agent had deleted it_shows_all_books_in_library and asked to amend the commit; the user refused and convened the council instead.
    invoked_by: user
    personas: [Kent Beck, Dave Farley, Dan North, Steve Freeman & Nat Pryce]
    voices: flattened-to-consensus
    disagreement_use: >-
      Round 1 staged a debate then declared "Despite different perspectives, all experts agree" that removal
      was correct. After one user pushback, round 2 declared "All experts agree: Add the test back." Two
      unanimous verdicts in opposite directions, with no new evidence gathered between them.
    outcome: rejected-as-slop
    fidelity:
      - persona: Kent Beck
        assessment: caricature
        evidence: >-
          Round 1 leaps from two similar tests to "why have two commands ... maybe these commands should be
          unified" (L3939) — speculative redesign from a test smell. Round 2 announces "Found it! The error
          boundary test is calling list all ... this is accidental coverage" (L4123), a diagnosis the user
          then rejected outright.
      - persona: Dave Farley
        assessment: faithful
        evidence: "'Every test should earn its place' and the commendation of coverage-checked incremental change (L3946-3957) — plausible and in character, though it endorsed a wrong conclusion."
      - persona: Dan North
        assessment: faithful
        evidence: "'These are different user stories with different acceptance criteria!' (L3966) — correct, and the only round-1 voice pointing away from the wrong answer."
      - persona: Steve Freeman & Nat Pryce
        assessment: caricature
        evidence: >-
          Round 1's "The CLI is too thin ... Should 'recent' vs 'all' be a parameter to a single command"
          (L3978-3988) recasts a testing question as an architecture indictment — GOOS's "listen to the tests"
          reduced to a slogan that licenses any redesign.
    user_reaction: >-
      "I think hardest that we have talked som BS above" — then supplied the correct explanation himself
      (the coverage came from the library's own integration tests).
    lesson: >-
      Unanimity that flips on pushback is not deliberation; the council tracked the last user message, and
      the human out-reasoned all four personas in three sentences.

  - loc: "day-021:L4833"
    trigger: The agent was about to add a mocked sqlite3 test asserting ZISSAMPLE appears in the SQL string; the user interrupted and convened the council.
    invoked_by: user
    personas: [Kent Beck, Dave Farley, Dan North, Steve Freeman & Nat Pryce]
    voices: flattened-to-consensus
    disagreement_use: >-
      Kent vs Dave is a real and useful axis (implementation-detail coupling vs external-schema contract
      testing). But the panel produced three successive consensus positions across three user turns —
      "belongs at integration level" (L4909), then "No additional SQL structure test is needed" (L4989),
      then "we should split" (L5079) — each aligned with the user's most recent prompt.
    outcome: rerun-escalated
    fidelity:
      - persona: Kent Beck
        assessment: faithful
        evidence: "'If we renamed that column to IS_SAMPLE, should our tests break? I think not.' (L4864) — genuine Beck, and the sharpest formulation of the real tension."
      - persona: Kent Beck
        assessment: fabrication
        evidence: "'The failed experiment proved our test coverage was complete.' (L4984) — an invented entailment; the experiment measured failure locality, and the very next turn found the gap it denied."
      - persona: Dave Farley
        assessment: faithful
        evidence: "'The SQL query IS a contract - it's the contract between our code and Apple's database schema' (L4868) — contract testing against an uncontrolled external system, his actual position."
      - persona: Dan North
        assessment: caricature
        evidence: >-
          "'As a developer maintaining BookMinder, I need confidence that our queries match Apple's schema'
          (L4884) — the user's verdict: "a ridiculous anit-pattern and misinterpretation of BDD" (L5098).
          BDD's creator is made to endorse the developer-as-user template his own writing argues against.
      - persona: Steve Freeman & Nat Pryce
        assessment: faithful
        evidence: "'_query_books is doing too much - it's both building queries AND executing them' with the concrete _build_books_query split (L4892, L5042) — actionable and adopted."
    user_reaction: >-
      Took the split, rejected the North story-template outright, and separately demanded a git-blame
      investigation of a line the council had listed as a responsibility without questioning it.
    lesson: >-
      A persona's most confident sentence is the one to check: the same panel produced the session's best
      concrete proposal and its clearest fabricated claim.

  - loc: "day-021:L5710"
    trigger: Discovery that `--filter nonsense` silently returns all books — no validation anywhere between CLI and library.
    invoked_by: user
    personas: [Dan North, Steve Freeman & Nat Pryce, Kent Beck, Dave Farley]
    voices: individual
    disagreement_use: >-
      Real: Kent opens with YAGNI resistance ("Is this causing real problems?"), Steve answers with the
      concrete evidence, Kent concedes — "I'm convinced. But let's keep it simple." The convergence is earned
      rather than declared, and the outcome (validate at the CLI boundary against a shared vocabulary) drove
      the rest of the session.
    outcome: accepted
    fidelity:
      - persona: Kent Beck
        assessment: faithful
        evidence: "'YAGNI says don't add complexity until needed. However, the silent failure mode is problematic.' (L5745) — genuine tension, genuinely resolved."
      - persona: Steve Freeman & Nat Pryce
        assessment: faithful
        evidence: "'The filter parameter is stringly-typed with no validation. This violates the ports & adapters pattern' (L5739) with the per-function evidence enumerated."
      - persona: Dave Farley
        assessment: faithful
        evidence: "'I strongly advocate for fail-fast behavior. Validate early, give clear errors.' (L5752)"
      - persona: Dan North
        assessment: faithful
        evidence: "'The current silent failure violates the principle of least surprise' (L5730) — correct, if generic."
    user_reaction: '"so let''s revert !sample spec to skipped step an think harder about a plan of attack in our ATDD paradigm" — adopted the finding and re-sequenced the work.'
    lesson: >-
      The councils that worked were the ones convened on a concrete defect with observable evidence already
      on the table, not on a judgment call.

  - loc: "day-021:L5944"
    trigger: >-
      The agent had answered "let's gather requirements" with a 14-question implementation questionnaire
      (strict vs lenient, case sensitivity, partial matches).
    invoked_by: user
    personas: [Dan North, Kent Beck, Steve Freeman & Nat Pryce, Dave Farley]
    voices: individual
    disagreement_use: >-
      The panel is unanimous against the agent rather than with it — the only episode where the council's
      target is the agent's own output.
    outcome: accepted
    fidelity:
      - persona: Dan North
        assessment: faithful
        evidence: >-
          "No, no, no! This is exactly backwards! You're asking implementation questions like 'should it be
          strict or lenient?' That's jumping to solutions." (L5958) plus a proper Feature/Scenario rewrite —
          correct BDD doctrine, correctly applied, and notably the same persona that fabricated a developer
          story one episode earlier.
      - persona: Kent Beck
        assessment: faithful
        evidence: "'all those questions about case sensitivity, partial matches, etc.? YAGNI!' (L5974)"
      - persona: Steve Freeman & Nat Pryce
        assessment: faithful
        evidence: "'Questions like Static vs Dynamic validation are implementation details, not requirements.' (L5978)"
      - persona: Dave Farley
        assessment: faithful
        evidence: "Reframes the requirement as feedback-loop properties: what feedback, when, how to recover (L5985-5988)."
    user_reaction: '"good, let''s capture this in `stories`, then proceed to acceptance test translation of the scenarions" — went straight to a story card.'
    lesson: >-
      Its confident consensus still smuggled in a domain error nobody checked — command-scoped filter
      vocabularies — which the user caught three hours later against the docs ("Really?!? @docs/apple_books.md
      think harder", L8951). Council agreement is not domain verification.

pairing_gems:
  - loc: "day-021:L1722"
    why_exemplary: >-
      Turning a mistake into pedagogy: the author has the inferior mocked-output version committed first,
      then the coordination version, so the git diff itself carries the argument for why the second is
      better. The commit sequence becomes the teaching artifact.

  - loc: "day-021:L1529"
    why_exemplary: >-
      "I only have som many hours to live, so I'll cut to the chase... by asking questions." — instead of
      line-editing the agent's output, the author hands over three reusable questions the agent can apply
      to every subsequent test. Teaching the check rather than performing it.

  - loc: "day-021:L4169"
    why_exemplary: >-
      The author overrules two rounds of unanimous expert consensus, names the reasoning as "BS", supplies
      the correct model (mocked acceptance tests specify contracts; coverage comes from elsewhere) and then
      demands an executable proof of it. Correction, explanation and falsification in three sentences.

  - loc: "day-021:L2348"
    why_exemplary: >-
      "maybe you'll talk me out of it" — an explicit invitation to disagree, attached to a real question
      about minimal test data. The author models the pairing norm he wants back.

  - loc: "day-021:L6321"
    why_exemplary: >-
      Two corrections at once: use the real database for exploration (fixtures only contain what you already
      know), and retire the falsified platform-inconsistency theory by name. Method and result, separated.

  - loc: "day-021:L6455"
    why_exemplary: >-
      Catches the agent explaining away contradicting screenshot evidence with the project's own SQL, names
      the epistemic error ("you are confusing yourself"), and redirects to the sources — then immediately
      asks a concrete falsifiable question about the recency cutoff.

  - loc: "day-021:L9030"
    why_exemplary: >-
      Spots a path dependency inside an acceptance criterion — validation for multiple filters, in a system
      with no multiple filters — and asks whether the scenario belongs in this story or the later one, rather
      than just deleting it.

  - loc: "day-021:L8745"
    why_exemplary: >-
      Refuses a mechanically correct TODO.md edit because it would destroy an ordering that carries meaning
      (the sequence of the journey through the story map), and asks for an in-place notation instead.

  - loc: "day-021:L7810"
    why_exemplary: >-
      Delegation coaching: "Gemini CLI is as capable as you. Give it high live goal, set the boundary
      parameters ... Don't try to micromanage it too much." A precise statement of how to brief a peer agent.

gaps:
  - >-
    No commit-after-RED. Every commit in this session lands GREEN; the one deliberate RED (the filter
    validation test at L9213) was written, verified failing, and the session ended before it was committed.
    The rule postdates this session.
  - >-
    No `pytest --spec` invocation anywhere in 12k lines, despite it being the project's stated way to read
    the suite as documentation; the agent's feedback loop was `pytest --cov` exclusively.
  - >-
    No use of the story card as the source of the spec's docstring: the pending `!sample` scenario carries
    `reason="Implement after basic list all works"` rather than the story's when/then.
  - >-
    No mutation testing tool and no repeated use of the mutation technique — the deliberate-bug proof
    (L4253) happens exactly once, on the user's instruction, and is not generalised into a habit.
  - >-
    No pre-commit `mypy` execution observed on any commit — every hook run reports
    "mypy ... (no files to check) Skipped" because only spec/story files were staged.
  - >-
    No discussion of `__main__.py` / entry-point coverage while converting the last subprocess tests away —
    the risk that later cost the project its only wiring test is not raised here.
  - >-
    The final two sessions (log reconstruction) contain no tests at all: reconstruct.jq is developed against
    an expected-output file by diff, and shipped with a known-divergent formula, with no spec.

parked:
  - >-
    Off-scope but load-bearing for the archive: this session invented the day-020 recovery pipeline
    (`~/.claude/projects/*.jsonl` -> `reconstruct.jq` -> day-020-reconstructed.md). The scout report's claim
    that local JSONL "auto-purge already happened" is consistent with this — the recovery worked on
    2025-07-12 and the file was preserved as day-020-reconstructed.md.
  - >-
    `reconstruct.jq` and `day-020-reconstructed.md` were deliberately kept while session.jsonl, input_slice
    and both expected_output files were deleted (L12392) — so the fidelity of the reconstruction can no
    longer be re-verified against its source.
  - >-
    The Gemini sub-agent needed `--yolo` to function non-interactively (L8004); the agent burned six turns
    misdiagnosing silent output as an execution failure before the user identified the permission prompt.
  - >-
    Gemini's session summary reports "User Agreement: 76.9% (26 reviewed)" (L10651) — a machine-readable
    pairing-friction metric that no Claude Code session in this archive emits.
  - >-
    docs/ui/apple/"Continue tiles iPhone.jpg" and "Continue tiles Mac.jpg" were added by the user in this
    session as primary evidence; the Apple Books findings here (cloud sample = ZSTATE 6 / ZISSAMPLE 0
    rendered as fake 1%; downloaded sample = ZSTATE 1 / ZISSAMPLE 1 rendered as "Sample") rest on them.
