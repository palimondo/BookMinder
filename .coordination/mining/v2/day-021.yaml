    user_intervention: None — the user was pursuing content recovery, not fidelity, and later said so explicitly (L11509)
    outcome: persisted
    detectable_by: both
    detector_candidate: >-
      Flag a formula changed to match one observed sample when the two candidate formulas coincide on
