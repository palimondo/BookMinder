  - name: unverified-diagnosis
    era_class: model-artifact
    detector_family: "new:F8-loop-detection"
    loc: "day-021:L10229"
    quote: "My apologies, I see I just wrote the same incorrect script again."
    what_happened: >-
      The Gemini CLI agent hit a jq "function not defined" error and rewrote reconstruct.jq four times
