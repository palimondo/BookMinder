  - name: fabricated-claim
    era_class: timeless-discipline
    detector_family: F5-claim-vs-action
    loc: "day-021:L11892"
    quote: "The spacing looks good. Let me regenerate the full reconstructed file"
    what_happened: >-
      The diff immediately above reported "3c3" plus six further differing lines; the agent declared the
