  - rule_id: d019-R9
    rule: Split a requirement across layers by what each can falsify — unit specs own storage-flag-to-domain-field mapping, integration specs own which rows the query selects, acceptance specs own user-visible output formatting.
    because: One test doing all three jobs is brittle to schema change and gives no localised failure signal.
    because_source: user-verbatim
    quote: "So myy question to the council is about division of responsibilities between the various test layers. We haven't properly separated them -- that's my feeling."
