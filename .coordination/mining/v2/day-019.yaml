  - rule_id: d019-R7
    rule: Land one scenario at a time; commit the remaining scenarios as skipped placeholders so the backlog is visible in `pytest --spec` while the suite stays green.
    because: Batching several scenarios into one edit removes the red-bar signal for each of them individually.
    because_source: user-verbatim
