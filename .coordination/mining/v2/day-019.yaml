pairing_gems:
  - loc: "day-019:L1247"
    why_exemplary: Faced with an implementation built on a misunderstanding, the user reverts all code, commits only the documentation the episode produced, and re-runs the task in a fresh session as an explicit benchmark. Discarding work to preserve the integrity of the evaluation is the rarest move in the archive.
  - loc: "day-019:L3806"
    why_exemplary: "\"maybe make it wrong now on purpose?\" — the user turns a green codebase into a red-bar opportunity so a new assertion is proven falsifiable before it is trusted."
  - loc: "day-019:L2613"
