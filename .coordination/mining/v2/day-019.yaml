philosophy:
  - statement: Code produced from a misunderstanding is disposable; the knowledge extracted while producing it is the durable artifact. Revert the code, commit the documentation, and re-run the attempt from a clean context as an explicit evaluation of the agent.
    source: user-verbatim
    quote: "No. I'd like you now to revert your coding changes. Let's commit the crytical documentation update and I'd like to see you try to tackle this again in a fresh session. This is in the end a test of your coding abilities."
    loc: "day-019:L1247"
    feeds: skill-why
  - statement: Documentation's job is to describe how the data is actually stored, not to prescribe how the implementation should query it; a doc that ships SQL for the feature you are about to write has become implementation guidance in disguise.
    source: user-verbatim
    quote: "But aren't you now trying to prescribe the implemenation instead of docuemnting how the data is stored in database, which IMHO these existing sql code sample do already. Am I missing somethign crucial here? Please think harder"
    loc: "day-019:L1176"
    feeds: skill-why
  - statement: Each requirement belongs at the layer that can falsify it. An acceptance test that knows a specific book's ZSTATE value has absorbed a domain rule that belongs in a unit test; the acceptance test should only own the user-visible formatting contract.
    source: user-verbatim
    quote: "It smells to me, that the acceptance test should be the place that understands this implementation detail. It shoudl care about output formatting for command line, but not about whether the .is_sample is working correctly when we create a Book."
    loc: "day-019:L4469"
    feeds: judge-anchor
  - statement: In outside-in ATDD a failing acceptance test is not an instruction to write implementation — it is evidence that a unit test is missing, and the unit test is what drives the design.
    source: user-verbatim
    quote: "but Outside-In ATDD... Acceptance is failing, which tells you that you are missing the unit test to drive the implementation."
    loc: "day-019:L3899"
    feeds: skill-why
  - statement: TDD is a process discipline whose value lies in the sequence, not in the artifacts; rushing to implementation destroys the value even when the resulting code and tests look correct.
    source: user-verbatim
    quote: "we should consider how to improve your ATTD process adherence. Because I really dislike how you always rush to implementation withthout proper thinking!"
    loc: "day-019:L3179"
    feeds: judge-anchor
  - statement: Minimal constraint is the design skill — express only what the next step needs, in the fewest fields, the fewest assertions, and the shortest expression that still falsifies.
    source: user-verbatim
    quote: "the Stub doesn't need to have more fields than what we're testing... I think here ZSTATE would be enough."
    loc: "day-019:L4702"
    feeds: skill-why
  - statement: Slice work to one scenario at a time; unfinished scenarios stay visible as skipped placeholders rather than being carried as unlanded work-in-progress.
    source: user-verbatim
    quote: "I want us to be working only on one scenario at a time. Mark the latter two as skipped for now!"
    loc: "day-019:L1859"
    feeds: skill-why
  - statement: A test that has never been observed failing is not evidence; if the codebase makes it hard to observe the failure, break the implementation on purpose to see the red bar.
    source: user-verbatim
    quote: "Good, but do we have a test that would actually test for that? Is not, TodoWrite so that we don't forget, and maybe make it wrong now on purpose?"
    loc: "day-019:L3806"
    feeds: judge-anchor
  - statement: Test-double vocabulary is not pedantry — the name states what the test is for. A double that only supplies data is a stub; a Mock is what you reach for when you must verify calls.
    source: user-verbatim
    quote: "think harder about proper testing terminology, if we're not testing behavior, we probably don't need a Mock object (that would be necessary for verifying calls), is this a Stub? Or Fake?"
    loc: "day-019:L4651"
    feeds: skill-why
  - statement: Pretrained expert simulacra default to slogans; without being forced through the project's actual history they produce shallow caricatures of the very experts' strong suits, and will invent plausible project facts.
    source: user-verbatim
    quote: "the first take answers Opus imagined are extremely shallow caricatures of expert's strong suits"
    loc: "day-019:L709"
    feeds: judge-anchor
  - statement: The agent's lack of persistent project memory is a first-class engineering constraint, not an excuse — the console-log archive is the project's long-term memory, and a second model with access to it can audit both the docs and the code.
    source: user-verbatim
    quote: "I guess this is a bit of a problem with you lacking persistent memory of the project's evolution."
    loc: "day-019:L791"
    feeds: skill-why
  - statement: The user is explicitly out of his depth on Python idiom and asks to be taught the reasoning, not handed a patch — teaching is part of the pairing contract, in both directions.
    source: user-verbatim
    quote: "are private decorators a thing? think harder with me on what's the most Pythonic way, I'm out of my depths here"
    loc: "day-019:L2818"
    feeds: skill-why
  - statement: A story card is a living spec — when a design decision changes the command surface, the story is edited before the tests are, so the acceptance criteria never lag the design.
    source: user-paraphrase
    loc: "day-019:L1786"
    feeds: skill-why
  - statement: The next session's opening prompt is itself an engineered artifact — it reloads the discovered knowledge, names the fixture census, and front-loads the questions that must be answered before code.
    source: user-verbatim
    quote: "what shoudl we our starting prompt for our next session for implementing the sample filter, so that we avoid the pitfalls we encounter? think harder about it and prepare the opening prompt"
    loc: "day-019:L1344"
    feeds: skill-why

skill_rules:
  - rule_id: d019-R1
    rule: Never write a disjunctive assertion in a spec; if the test would pass under two contradictory outcomes, it asserts nothing.
    because: A test that passes whether or not the feature works provides false confidence and cannot ever go red for the right reason.
    because_source: user-paraphrase
    evidence: "day-019:L303, L574"
    taught_or_enforced: needed-enforcement
    skill_target: tdd-bdd
    overlap: "canonical §2.3"
    feasibility: ok
  - rule_id: d019-R2
    rule: When a newly written test passes on its first run, stop and treat that as a defect in the test — do not mark the step done.
    because: The agent wrote a test, watched it pass for the wrong reason, narrated exactly that, and closed the task anyway.
    because_source: user-paraphrase
    evidence: "day-019:L336"
    taught_or_enforced: needed-enforcement
    skill_target: tdd-bdd
    overlap: "CLAUDE.md <tdd_discipline> Run & Verify RED"
    feasibility: ok
  - rule_id: d019-R3
    rule: To prove a newly added assertion can fail, implement the opposite behavior on purpose, watch it go red, then fix it.
    because: Adding an assertion to already-green code proves nothing about the assertion.
    because_source: user-verbatim
    quote: "Good, but do we have a test that would actually test for that? Is not, TodoWrite so that we don't forget, and maybe make it wrong now on purpose?"
    evidence: "day-019:L3806"
    taught_or_enforced: taught-once
    skill_target: tdd-bdd
    overlap: none
    feasibility: ok
  - rule_id: d019-R4
    rule: Implement only what the currently failing assertion demands; do not add the symmetric or negated case until its own test is red.
    because: The agent was about to implement both `sample` and `!sample` when only `sample` was under test.
    because_source: user-verbatim
    quote: "what is our acceptance test asking ask to implement? kitchen sink? think harder!"
