        evidence: "\"You've discovered a classic ports-and-adapters violation\" (L4532); mild attribution drift (hexagonal architecture is Cockburn's) but Freeman & Pryce do argue in exactly these terms in GOOS, and the falsifiable consequence given — a new ZSTATE would force acceptance-test edits — is correct and actionable."
    user_reaction: "\"I want to keep the acceptance test as is, because it is just testing the output formatting logic ... We were missing the unit and integration tests you outlined, so please add those!\" (L4577)"
    lesson: A council run in-context on a sharply framed question produces distinguishable, actionable positions — and the user overruling part of the consensus is what proves the voices were real inputs and not a verdict.
