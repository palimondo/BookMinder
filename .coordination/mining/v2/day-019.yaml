  - rule_id: d019-R8
    rule: Route a failing acceptance test inward to a unit test that names the missing behavior; never go from a red acceptance test straight to production code.
    because: The acceptance test states the goal; the unit test is what drives the design of the piece that closes the gap.
    because_source: user-verbatim
    quote: "We are practicing ATTD, we shoudl be going outside-in from acceptance test to unit test to implementation."
    evidence: "day-019:L1951, L3899"
