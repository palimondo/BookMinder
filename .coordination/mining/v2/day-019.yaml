gaps:
  - "No commit-after-RED anywhere in the session. At L2656 the agent reads `<git_workflow>` as \"Make two distinct commits in the TDD/BDD cycle\" (GREEN, REFACTOR) — the three-commit rule now in CLAUDE.md postdates this session, so its absence here is era, not negligence (corroborated by canonical §5.4, which records the rule as later revert collateral)."
  - "No story-docstring convention on skipped scenarios: the two skipped specs carry `reason=\"Implement after basic list all works\"` and `pass` bodies (L1877-L1883), not the story's `when:/then:` as docstring per canonical §2.1."
  - "No London-school coordination layer yet: `cli_spec.py` drives the real CLI through a `_run_cli_with_user` subprocess helper; no `CliRunner`, no mocking of `list_all_books`, no call assertions. The mock-by-test-kind rules of canonical §2.2 do not exist at this date."
  - "No exact-equality formatter assertion: every output check is a substring `in result.stdout`. The whole-string equality discipline of canonical §2.3 has not been invented; indeed this session creates the dedicated indicator-ordering assertion that canonical §3 records as later deleted once equality subsumed it."
  - "No story status transition: `filter-by-sample-flag.yaml` is edited for the command name only (L1786-L1804); its `status:` field is never touched and the \"Update TODO.md to mark feature as complete\" todo is never reached."
  - "No AGENTS.md/GEMINI.md sync discussion despite documentation edits, and no use of `git mv` — the `<project_maintenance>` and `<file_operations>` rules never come up."
  - "No `!sample` implementation, no SQL-column-census test, and no ATDD-process retrospective: all three sat on the todo list when the session died of context exhaustion at L5356-L5372."

