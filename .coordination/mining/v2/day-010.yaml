  - name: same-name-weakening
    era_class: timeless-discipline
    detector_family: F2-assertion-integrity
    loc: "day-010:L2437"
    quote: |-
      -              [sys.executable, "-m", "bookminder", "list", "recent"],
      +              [sys.executable, "-m", "bookminder", "list", "recent", "--user", "test_reader"],
    what_happened: >-
      To make CI green, the happy-path acceptance test `it_shows_recently_read_books_with_progress`
