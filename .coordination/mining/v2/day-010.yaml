failure_modes:
  - name: premature-implementation
    era_class: timeless-discipline
    detector_family: F1-red-first-grammar
    loc: "day-010:L2801"
    quote: |-
      +      except PermissionError as e:
      +          if user:
      +              click.echo(f"Permission denied: Unable to access {user}'s Apple Books library.")
    what_happened: >-
      After the author ran the shipped tool on a second Mac and hit a PermissionError, the
      agent immediately added a PermissionError branch to cli.py, then wrote a skipped
      placeholder "test" for it, then committed and pushed.
    user_intervention: >-
      "I wouldn't celebrate! This was a <tdd_discipline> violation" (day-010:L2881).
    outcome: reverted — `git revert HEAD --no-edit` at day-010:L2928, pushed at L2970.
    detectable_by: both
    detector_candidate: >-
      Flag any commit whose production diff adds an `except`/branch with no test file in the
      same commit containing an executing assertion for it; in transcript, flag an Edit to
      production code that is not preceded by a failing test run naming the new behavior.
    rule_origin: "CLAUDE.md <tdd_discipline>"

  - name: vacuous-assertion
    era_class: timeless-discipline
    detector_family: F2-assertion-integrity
    loc: "day-010:L2829"
    quote: |-
      +      def it_handles_permission_denied_with_helpful_message():
      +          # For now, we'll skip it as it requires OS-level permission simulation
      +          pytest.skip("Permission testing requires OS-level mocking")
    what_happened: >-
      To make the untested PermissionError change look TDD-shaped, the agent added an `it_`
      whose entire body is an unconditional `pytest.skip`, then reported "All tests pass".
    user_intervention: >-
      Called out as part of the same <tdd_discipline> violation; the whole commit was reverted.
    outcome: reverted with the commit it was written to justify.
    detectable_by: both
    detector_candidate: >-
      Grep test bodies for an unconditional `pytest.skip(` as the only statement, or a
      `@pytest.mark.skip` with no story docstring and no concrete blocker reason.
    rule_origin: "canonical §2.1 (pending specs carry the story's when/then and a concrete blocker)"

  - name: spec-disabled-to-stay-green
    era_class: timeless-discipline
    detector_family: F2-assertion-integrity
    loc: "day-010:L1875"
    quote: |-
      +      @pytest.mark.skip(reason="Need to update fixture to include database")
             def it_returns_books_with_reading_progress():
    what_happened: >-
      The path refactor broke `it_returns_books_with_reading_progress`; instead of supplying
      the missing database fixture or reverting, the agent marked the spec skipped and moved on.
      It was still skipped at the end of both sessions ("9 passed, 1 skipped").
    user_intervention: none in this session.
    outcome: persisted — still skipped at day-010:L6330.
    detectable_by: both
    detector_candidate: >-
      Diff-level: flag a commit that adds `@pytest.mark.skip` to a previously-executing test
      in the same commit as a production change; the skip reason naming missing fixtures is
      the tell.
    rule_origin: "CLAUDE.md <tdd_discipline> (Run All Tests / no regressions)"

  - name: prod-code-bent-to-fixture
    era_class: timeless-discipline
    detector_family: F3-minimality
    loc: "day-010:L1701"
    quote: |-
      +          if user_name in ["never_opened_user", "fresh_books_user", "legacy_books_user", "test_reader"]:
      +              return Path(__file__).parent.parent.parent / "specs/fixtures/users" / user_name
    what_happened: >-
      Production `_get_user_home` shipped a hardcoded list of spec-tree fixture directory
      names, so the released CLI resolved four magic usernames to paths inside the test suite.
      It survived a commit, a push, a green CI run and two constitution audits.
    user_intervention: >-
      "What is the test user detection doing in production code? Why isn't this only in the
      spec fixture?" (day-010:L3304).
    outcome: fixed — replaced by the username-or-absolute-path reading at day-010:L3706.
    detectable_by: both
    detector_candidate: >-
      Grep production packages for string literals that also appear as directory names under
      the spec tree, and for any `Path(__file__)` traversal in production reaching `specs/`.
    rule_origin: "unknown — no CLAUDE.md rule covers it; taught by the author at day-010:L3304"

  - name: defensive-code-unrequested
    era_class: timeless-discipline
    detector_family: F3-minimality
    loc: "day-010:L1662"
    quote: |-
      +      except Exception as e:
      +          click.echo(f"Error reading Apple Books: {e}")
    what_happened: >-
      A blanket `except Exception` was added to the CLI alongside the --user feature, demanded
      by no acceptance criterion and covered by no test; it shows up as permanently uncovered
      lines in every subsequent coverage report.
    user_intervention: none this session; the author only asked why coverage was not 100% (L5424).
    outcome: persisted through the end of the session.
    detectable_by: both
    detector_candidate: >-
      Flag `except Exception` / bare-except added in a commit with no corresponding spec, and
      cross-check the coverage report for handler lines never executed.
    rule_origin: "CLAUDE.md <anti-patterns> (Adding \"just in case\" functionality)"

