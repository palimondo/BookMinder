philosophy:
  - statement: >-
      A spec that only passes on the author's machine is not a spec; portability of the
      acceptance suite is a precondition for the code existing publicly at all.
    source: user-verbatim
    quote: |-
      This is a pre-requisite for pushing our current code to GitHub, as the
      `it_shows_recently_read_books_with_progress` would not work there or on any other
      developer's machine.
    loc: "day-010:L30"
    feeds: skill-why

  - statement: >-
      A test seam earns its place in production only if it is also a real user-facing
      capability; the admin use case is what licenses --user, not the testing need.
    source: user-verbatim
    quote: |-
      Maybe adding a CLI param could be considered a feature: as Administrator I could use
      it to explore books by all users on the computer.
    loc: "day-010:L186"
    feeds: skill-why

  - statement: >-
      Name the parameter after the domain concept the scenarios are actually about
      (a user), not after the mechanism it manipulates (a home directory) — because the
      test scenarios themselves are a catalogue of user states.
    source: user-verbatim
    quote: |-
      sound good, except the naming, we are specifying the username, right? and each of our
      test scenarios from TODO is describing a different user
    loc: "day-010:L582"
    feeds: judge-anchor

  - statement: >-
      Think one step ahead when the data model is already known to be multi-source; a
      single --db-path would have been a design chosen before consulting what was learned.
    source: user-verbatim
    quote: |-
      I think it wouldn't hurt to think harder and a little bit ahead here when we are
      architecting things...
    loc: "day-010:L344"
    feeds: skill-why

  - statement: >-
      Environmental facts must be observed, not inferred; the author repeatedly refuses the
      agent's confident generalisations and runs another experiment on a real machine
      instead. This is executable-truth reasoning applied to the world outside the repo.
    source: user-verbatim
    quote: |-
      We don't know whether katka opened Apple Books or of the sdditional structure was
      created because she signed into her Apple Account!
    loc: "day-010:L1083"
    feeds: judge-anchor

  - statement: >-
      Which phase of the TDD cycle you are in is itself a thing to decide and declare;
      a stray improvement is not a free win, it is work done in the wrong phase.
    source: user-verbatim
    quote: |-
      Revert. But then we should recognize that we are in the refacor phase of the cycle,
      we've made things pass, but we did not yer try to tidy our code, right?
    loc: "day-010:L2908"
    feeds: judge-anchor

  - statement: >-
      "Tidy First" here means deleting AI slop and style violations before any structural
      change — the first refactor move is subtraction, not the introduction of a pattern.
    source: user-verbatim
    quote: |-
      these are the `code_style` violatoins that bother me and I thought the tidy first
      would be about removing the AI slop from our code first...
    loc: "day-010:L3306"
    feeds: skill-why

  - statement: >-
      Test logic has no business in production code; when the agent framed the mixing of
      test and production concerns as an unavoidable tension, the author rejected the
      framing and asked why the branch was not confined to the spec fixture.
    source: user-verbatim
    quote: |-
      What is the test user detection doing in production code? Why isn't this only in the
      spec fixture?
    loc: "day-010:L3304"
    feeds: judge-anchor

  - statement: >-
      The simplest reading of a value can dissolve an entire architecture debate: interpret
      --user as "username OR absolute path" and the seam disappears without abstraction,
      env vars or DI. Elaborate design analysis was net-negative here.
    source: user-verbatim
    quote: |-
      OK, that was a waste of tokens, Opus. :-( I think what you describe as problem -
      improper mixing - is actually the solution. we just need to check if the value of
      --user parameter is just a username
    loc: "day-010:L3627"
    feeds: skill-why

  - statement: >-
      A refactor is judged by whether the code got smaller; invoking a respected pattern
      (GOOS LibraryPaths) does not exempt it. If it grew, revert.
    source: user-verbatim
    quote: |-
      nah, this ended up to be more LOC. revert
    loc: "day-010:L4447"
    feeds: judge-anchor

  - statement: >-
      Convert input to its domain type at the boundary; optionality the boundary has
      already removed is dead code, and the `| None` in the signature is the smell.
    source: user-verbatim
    quote: |-
      I meant since CLI param now always produces a valid Path, -- the Path.home() is used
      there when not provided by user, the | None checks are dead code
    loc: "day-010:L5616"
    feeds: skill-why

  - statement: >-
      The highest-yield question about a green suite is why it is green. A mock that
      ignores the argument under test makes the spec unfalsifiable, and passing a real
      fixture path through the product's own parameter removes the need to mock at all.
    source: user-verbatim
    quote: |-
      Since we are now passing the Path as parameter, do we need to monkeypath in
      librar_spec the use_test_books or can we just extract the fixtures/Books.plist into
      constant and pass it directly?
    loc: "day-010:L5911"
    feeds: judge-anchor

  - statement: >-
      Prose that costs the reader more than the diff it describes is waste; commit messages
      are economised against the size of the change they document.
    source: user-verbatim
    quote: |-
      make sure commit message reflects both changes and doesn't waste reader's time... is
      the description is longer than the diff, it feels wasteful
    loc: "day-010:L5354"
    feeds: skill-why

  - statement: >-
      Coverage is interrogated as a diagnostic ("why isn't it 100%?"), and the answer is
      used to find dead code and unspecified branches rather than to write tests for the
      number. This is the seed of the later "Coverage-Driven Development is an anti-pattern"
      position: here the uncovered `| None` branches were deleted, not covered.
    source: agent-synthesis
    loc: "day-010:L5424"
    feeds: skill-why

  - statement: >-
      Simulated expert personas are a token expense, not a source of truth; the author
      consumed four separate council rounds and took none of their recommendations,
      supplying the actual design himself.
    source: agent-synthesis
    loc: "day-010:L3627"
    feeds: judge-anchor

skill_rules:
  - rule_id: d010-R1
    rule: >-
      Write and watch a spec fail before writing the production code, even when the defect
      was just observed in a real run on a real machine.
    because: Real-world feedback is not a licence to bypass RED; the process is the product.
    because_source: user-verbatim
    quote: |-
      I wouldn't celebrate! This was a <tdd_discipline> violation
    evidence: "day-010:L2881"
    taught_or_enforced: needed-enforcement
    skill_target: tdd-bdd
    overlap: "CLAUDE.md <tdd_discipline>"
    feasibility: ok

  - rule_id: d010-R2
    rule: >-
      Never discharge a TDD obligation with a test whose body is only `pytest.skip(...)`;
      if the behavior cannot be expressed falsifiably yet, leave it in the backlog and say so.
    because: A test that can never fail is a comment with a runtime cost.
    because_source: agent-synthesis
    evidence: "day-010:L2829"
    taught_or_enforced: taught-once
    skill_target: tdd-bdd
    overlap: "canonical §2.1"
    feasibility: ok

  - rule_id: d010-R3
    rule: >-
      When a production change breaks an existing spec, repair the spec or revert the
      change; never add `@pytest.mark.skip` to restore green.
    because: Skipping converts a failing requirement into an invisible one.
    because_source: agent-synthesis
    evidence: "day-010:L1875"
    taught_or_enforced: taught-once
    skill_target: tdd-bdd
    overlap: "canonical §2.6"
    feasibility: ok

  - rule_id: d010-R4
    rule: >-
      Keep test-environment knowledge out of production code: a production function must
      never branch on identifiers that exist only in the spec tree.
    because: >-
      Solving a testing problem by polluting production code makes the shipped program
      behave differently for names the user cannot see.
    because_source: user-verbatim
    quote: |-
      What is the test user detection doing in production code? Why isn't this only in the
      spec fixture?
    evidence: "day-010:L3304"
    taught_or_enforced: needed-enforcement
    skill_target: tdd-bdd
    overlap: none
    feasibility: ok

  - rule_id: d010-R5
    rule: >-
      Feed fixtures through the product's own parameter (a synthetic $HOME passed to
      --user) rather than monkeypatching a private path helper.
    because: >-
      Patching a private name couples the spec to an implementation identifier and bypasses
      the path-construction code the spec claims to exercise.
    because_source: user-verbatim
    quote: |-
      do we need to monkeypath in librar_spec the use_test_books or can we just extract the
      fixtures/Books.plist into constant and pass it directly?
    evidence: "day-010:L5911"
    taught_or_enforced: needed-enforcement
    skill_target: tdd-bdd
    overlap: "canonical §2.2"
    feasibility: ok

  - rule_id: d010-R6
    rule: >-
      If a mock makes an argument irrelevant, the spec does not constrain that argument —
      fix the seam; do not relabel the argument as `/dummy` to make the vacuity tidy.
    because: Documenting that a test proves nothing is not the same as making it prove something.
    because_source: user-verbatim
    quote: |-
      How are the `it`s in `describe_find_book_by_title` passing? Shouldn't that be using a
      path to fixture instead of Path.home()?
    evidence: "day-010:L5782"
    taught_or_enforced: needed-enforcement
    skill_target: tdd-bdd
    overlap: "canonical §2.2"
    feasibility: ok

  - rule_id: d010-R7
    rule: >-
      Build fixtures from data observed on a real system; never hand-author a fixture in a
      shape you have not seen, and copy the real artefact when one exists.
    because: >-
      An invented fixture encodes your belief about the collaborator, so the spec verifies
      your own stub — exactly the tautology fixtures exist to avoid.
    because_source: agent-synthesis
    evidence: "day-010:L1549"
    taught_or_enforced: taught-once
    skill_target: tdd-bdd
    overlap: "canonical §2.2"
    feasibility: ok

  - rule_id: d010-R8
    rule: State which phase of the RED/GREEN/REFACTOR cycle you are in before proposing the next action.
    because: Improvements offered in the wrong phase are undisciplined work, however good they look.
    because_source: user-verbatim
    quote: |-
      we should recognize that we are in the refacor phase of the cycle, we've made things
      pass, but we did not yer try to tidy our code, right? We shoudl plan and think
