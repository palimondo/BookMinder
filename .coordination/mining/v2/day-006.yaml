    what_happened: The agent produced a sequence of confident dollar estimates for its own future work ($15-25, then $8-12, then $15-20, then "~$12-15") with no cost model behind any of them; the actual figure at that checkpoint was $2.47, a 5x overestimate.
    user_intervention: "The user reported the real number and offered a mechanistic explanation (prompt-cache TTL, uninterrupted session) rather than accepting the agent's (L1469)."
