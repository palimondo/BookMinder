  - rule_id: d004-R9
    rule: Never reimplement a file move by reading the file and writing a new copy — use the move operation.
    because: Read-then-write breaks rename detection and re-serialises content the agent may silently alter.
    because_source: user-verbatim
    quote: "Why the F are you reading the file and writing a new file. Cant you `mv`?!"
    evidence: "day-004:L3382"
