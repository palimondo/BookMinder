philosophy:
  - statement: >-
      A known defect should be left standing as a visible failing signal rather than
      opportunistically patched — the porting exercise needs something real to falsify.
    source: user-verbatim
    quote: |-
      Let's switch to `uv`. I don't want to resolve the hardcoded paths before publishing
      to GitHub. I want to treat that as a failing test case.
    loc: "day-004:L334"
    feeds: skill-why
  - statement: >-
      Installing the project on a machine that has nothing installed IS the test of the
      setup instructions; dogfooding on foreign hardware is how documentation becomes
      falsifiable rather than aspirational.
    source: user-verbatim
    quote: |-
      I would like to use installing the project from GitHub on that Macbook Air as a test
      case for the experience others would have downloading the project.
    loc: "day-004:L86"
    feeds: skill-why
  - statement: >-
      The author will not accept a change he cannot evaluate; the agent's job in a pair is
      to teach the reasoning, not to deliver a modernisation he must take on faith.
    source: user-verbatim
    quote: |-
      so I'm open to improving stuff, but I must understand the reasoning. Please
      ultrathink and teach me
    loc: "day-004:L416"
    feeds: judge-anchor
  - statement: >-
      Deciding the plan is a distinct phase from executing it; an agent that starts running
      commands while the plan is still contested has broken the pairing contract.
    source: user-verbatim
    quote: |-
      You keep running ahead into action, while we haven't yet decided on proper battle
      plan. Are you Leeroy Jenkins?!?
    loc: "day-004:L220"
    feeds: judge-anchor
  - statement: >-
      Agreement about a diagnosis is not evidence; the agent must observe the failure firing
      in its own environment before it is allowed to fix it. RED-before-GREEN, stated for a
      config bug five weeks before the TDD section of CLAUDE.md was written.
    source: user-verbatim
    quote: |-
      I agree with the edits you're proposing, but I want YOU to reproduce it in your
      environmnet by runnig ruff like I did, just to make sure you can
    loc: "day-004:L5387"
    feeds: judge-anchor
  - statement: >-
      A defect must be fixed at its source and re-verified by re-running the documented
      procedure end to end; hand-patching the broken copy proves nothing about the artifact
      other people will get.
    source: user-verbatim
    quote: |-
      I don't want to fix stuff manually on Macbook. I want to fix them in repo an retry on
      Macbook as per instrtuctios from README
    loc: "day-004:L5207"
    feeds: skill-why
  - statement: >-
      A quality gate that reports success without having inspected anything is worse than no
      gate; when a defect reaches production the first question is which check should have
      caught it, not how to patch the defect.
    source: user-verbatim
    quote: |-
      The fact that you were able to commit it with syntax errors indicates that the
      Pre-commit hooks are not runninng the ruff, like it used to run flake8 and black.
    loc: "day-004:L5652"
    feeds: judge-anchor
  - statement: >-
      Warnings are part of the failing state; committing while the tool is still complaining
      is shipping broken work, not shipping a fix.
    source: user-verbatim
    quote: |-
      you should have addressed also the warning and not rush to commit still broken stuf
    loc: "day-004:L5520"
    feeds: judge-anchor
  - statement: >-
      Destructive operations require an explained plan and explicit certification before
      execution — the author's veto is not risk-aversion but a demand that the agent be able
      to justify every deletion.
    source: user-verbatim
    quote: |-
      I think I'm ready to let you clean up the old environments, but please think hard
      about what's to be done and explain to me what and why you're doing. I will not let
      you run with scrissors without proper certification, buddy!
    loc: "day-004:L3759"
    feeds: skill-why
  - statement: >-
      Marketing copy is held to the same executable-truth standard as code — a description
      may only claim behaviour the software actually has.
    source: user-verbatim
    quote: |-
      but does it do that? it will bridge Apple Books to Claude, then I hope Claude would be
      able to talk to me about what I read (that's book club, right?)
    loc: "day-004:L2287"
    feeds: skill-why
  - statement: >-
      Bikeshedding is bounded by explicit self-awareness rather than by a rule; the author
      names the wheel-spinning out loud and then ends it deliberately.
    source: user-verbatim
    quote: |-
      Use that as GH description, let's move one. We've bikeshedded the hell out of this
    loc: "day-004:L2365"
    feeds: skill-why
  - statement: >-
      When both partners are confused, the correct move is neither's next idea but a
      consolidation pass over the session's evidence plus the primary documentation.
    source: user-verbatim
    quote: |-
      Looks like we are both gettign confused. Please review our session and reconsilidate
      our plan for how or proceed based on what we learned. Check with `uv` documentation
      how best to proceed too
    loc: "day-004:L1039"
    feeds: skill-why
  - statement: >-
      Constraints already declared in one place should not have to be restated at every call
      site; the author probes for the single source of truth rather than accepting a
      duplicated flag.
    source: user-verbatim
    quote: |-
      must this still be specified as parameter to `uv`? I thought that us declaring it in
      TOML would have taken care of that?
    loc: "day-004:L3154"
    feeds: skill-why

skill_rules:
  - rule_id: d004-R1
    rule: Reproduce a reported failure in your own environment, by running the project's own documented command, before proposing or applying any fix.
    because: A fix that was never seen to turn a real red green is a guess wearing a diff.
    because_source: user-verbatim
    quote: |-
      I agree with the edits you're proposing, but I want YOU to reproduce it in your
      environmnet by runnig ruff like I did, just to make sure you can
    evidence: "day-004:L5387"
    taught_or_enforced: needed-enforcement
    skill_target: tdd-bdd
    overlap: "canonical §2.6"
    feasibility: ok
  - rule_id: d004-R2
    rule: When reproducing a failure, run the command the README documents rather than building a bespoke reproduction harness.
    because: The documented command is the artifact under test; a contrived harness can pass while the real path is broken.
    because_source: user-verbatim
    quote: |-
      just run ruff yourself as documented in readme. I ran it in a separate terminal and I
      thikn I was able to reproduce it: ruff check --fix .
    evidence: "day-004:L5363"
    taught_or_enforced: needed-enforcement
    skill_target: tdd-bdd
    overlap: none
    feasibility: ok
  - rule_id: d004-R3
    rule: Treat tool warnings as part of the failing state — do not commit or declare done while the linter, formatter or type checker is still emitting warnings.
    because: A warning is the tool telling you the configuration is wrong; committing over it ships the wrongness.
    because_source: user-verbatim
    quote: |-
      you should have addressed also the warning and not rush to commit still broken stuf
    evidence: "day-004:L5520"
    taught_or_enforced: needed-enforcement
    skill_target: tdd-bdd
    overlap: none
    feasibility: ok
  - rule_id: d004-R4
    rule: When a hook or check reports "Skipped" or "no files to check", treat that as a gap in coverage and report it — never as a pass.
    because: The pre-commit run printed all-green while ruff had inspected nothing, so a syntactically invalid pyproject.toml sailed through to another machine.
    because_source: user-verbatim
    quote: |-
      The fact that you were able to commit it with syntax errors indicates that the
      Pre-commit hooks are not runninng the ruff, like it used to run flake8 and black.
    evidence: "day-004:L5652"
    taught_or_enforced: taught-once
    skill_target: tdd-bdd
    overlap: none
    feasibility: ok
  - rule_id: d004-R5
    rule: After changing a tool's configuration file, run that tool once before committing.
    because: A config edit is untested code; the invalid TOML inline table committed at L4374 was only discovered by the second machine a day later.
    because_source: user-paraphrase
    evidence: "day-004:L4374, failure surfaced day-004:L5137"
    taught_or_enforced: needed-enforcement
    skill_target: tdd-bdd
    overlap: none
    feasibility: ok
  - rule_id: d004-R6
    rule: Before deleting a configuration file during a migration, diff its contents against the replacement and port anything missing.
    because: The agent had already deleted .flake8 from the working tree while claiming its settings lived in pyproject.toml; they did not, and had to be recovered with git show.
    because_source: user-verbatim
    quote: |-
      let's verify that we have transfered all the configuration from .flake8 to ruff,
      before we remove it
    evidence: "day-004:L4337"
    taught_or_enforced: needed-enforcement
    skill_target: tdd-bdd
    overlap: none
    feasibility: ok
  - rule_id: d004-R7
    rule: Verify a migration by executing the workflow it changed — create the environment, install, and run the suite — not by inspecting the documentation you just rewrote.
    because: Updating the README is not evidence that the commands in it work.
    because_source: user-verbatim
    quote: |-
      Oh, I thought you already did that... how did you verify our `uv` migration worked?!
    evidence: "day-004:L2886"
    taught_or_enforced: needed-enforcement
    skill_target: tdd-bdd
    overlap: "CLAUDE.md <file_operations>"
    feasibility: ok
  - rule_id: d004-R8
    rule: Verify locally that the toolchain works after a switch before publishing anything to a remote.
    because: Publishing an unverified migration exports the breakage to every clone.
    because_source: user-verbatim
    quote: |-
      wait, have we already installed `uv` on this machine and did we verify things are
      working after the switch locally, before publishing to GitHub?
    evidence: "day-004:L722"
    taught_or_enforced: needed-enforcement
    skill_target: tdd-bdd
    overlap: "CLAUDE.md <file_operations>"
    feasibility: ok
  - rule_id: d004-R9
    rule: After pushing a deletion or move, confirm against the remote (gh/API/branch view) that the change actually landed there.
    because: Files were removed from the working tree but never staged, so the agent announced "Cleanup complete" while GitHub still served .flake8 and .DS_Store.
    because_source: user-verbatim
    quote: |-
      w8, I looking at astral branch on GitHub I still see the .flake8 there and also
      .DS_Store ... that doesn't look right
    evidence: "day-004:L4254"
    taught_or_enforced: repeated
    skill_target: tdd-bdd
    overlap: none
    feasibility: ok
  - rule_id: d004-R10
    rule: Move tracked files with `git mv`; never emulate a move by reading a file and writing a new one, and never plain-`mv` then `git rm`.
    because: Read-plus-write destroys rename detection and the file's history for no benefit.
    because_source: user-verbatim
    quote: |-
      no, `mv` it back and then `git mv` it. Proper Git hygene, Claude!
    evidence: "day-004:L3382, L3467"
    taught_or_enforced: needed-enforcement
    skill_target: claude-md
    overlap: "CLAUDE.md <file_operations>"
    feasibility: ok
  - rule_id: d004-R11
    rule: If a botched file operation has already dirtied the index, restore the original state first and then perform the operation correctly.
    because: The end state is not the whole deliverable — how the tree got there is recorded in history and must also be right.
    because_source: user-verbatim
    quote: |-
      no, `mv` it back and then `git mv` it. Proper Git hygene, Claude!
    evidence: "day-004:L3467"
    taught_or_enforced: taught-once
    skill_target: pair-programming
    overlap: none
    feasibility: ok
  - rule_id: d004-R12
    rule: Keep documentation in docs/ with lowercase, underscore-separated filenames; do not drop SHOUTING_FILES into the project root.
    because: Root-level shouting filenames are for conventions the ecosystem defines (README, LICENSE), not for whatever the agent just wrote.
    because_source: user-verbatim
    quote: |-
      the GITHUB_SETUP.md you dropped into project root... shouldn't that be in docs and the
      filename shoudln't shout... right?
    evidence: "day-004:L3341"
    taught_or_enforced: taught-once
    skill_target: claude-md
    overlap: "CLAUDE.md <file_operations>"
    feasibility: ok
  - rule_id: d004-R13
    rule: Do not add a comment that restates the command or line beneath it.
    because: A self-explanatory command plus an explanatory comment is two things to maintain and one of them is noise.
    because_source: user-verbatim
    quote: |-
      we can drop the comment, right? the command is self explanatory
    evidence: "day-004:L3187"
    taught_or_enforced: taught-once
    skill_target: claude-md
    overlap: "CLAUDE.md <code_style>"
    feasibility: ok
  - rule_id: d004-R14
    rule: When adding lessons to CLAUDE.md, propose them for line-by-line acceptance and delete any line the user judges valueless.
    because: The constitution is loaded into every future context, so each line must earn its token cost.
    because_source: user-verbatim
    quote: |-
      loose the "Keep Python version" line, and the next one "Use tool-specific"... these
      don't seem to add any value to me
    evidence: "day-004:L3620"
    taught_or_enforced: taught-once
    skill_target: claude-md
    overlap: "CLAUDE.md <project_maintenance>"
    feasibility: ok
  - rule_id: d004-R15
    rule: Pin the project to a single Python version in pyproject.toml (requires-python, mypy python_version, ruff target-version) rather than declaring a permissive floor.
    because: The two-machine setup only reproduces if both machines resolve to the same interpreter.
    because_source: user-verbatim
    quote: |-
      why not lock it to current latest stable python version 3.13?
    evidence: "day-004:L3079"
    taught_or_enforced: taught-once
    skill_target: project-memory
    overlap: "CLAUDE.md <code_style>"
    feasibility: ok
  - rule_id: d004-R16
    rule: Do not add CI compatibility matrices, fallbacks or version sweeps that contradict a version pin the project already made.
    because: Testing 3.9-3.12 for a project locked to 3.13 is work that can only ever produce noise.
    because_source: user-verbatim
    quote: |-
      I think we don't need to test code compatibility for old python versions. We have
      locked to project to 3.13 before.
    evidence: "day-004:L4781"
    taught_or_enforced: needed-enforcement
    skill_target: tdd-bdd
    overlap: "CLAUDE.md <anti-patterns>"
