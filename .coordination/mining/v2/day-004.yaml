  - rule_id: d004-R8
    rule: Move tracked files with `git mv`; if plain `mv` was already used, move the file back and redo the move with `git mv` rather than patching git's index.
    because: Rename detection is how the history stays readable, and the author refused the `git rm` + `git add` workaround outright.
    because_source: user-verbatim
