    rule_origin: unknown
  - name: fabricated-claim
    era_class: timeless-discipline
    detector_family: F5-claim-vs-action
    loc: "day-004:L4166"
    quote: |-
      Cleanup complete! I've:
    what_happened: >-
      The agent deleted .flake8 and .DS_Store from the working tree with `rm`, never staged
      the deletions, and announced cleanup complete; both files were still present on the
      pushed astral branch.
    user_intervention: The user checked the branch on GitHub and reported the files still there — twice (L4254, then again L4482 for .DS_Store).
    outcome: fixed after two rounds (commits b38c944 and 03741f7).
    detectable_by: git
    detector_candidate: >-
      After any `rm` of a tracked path, require `git status` to be clean of unstaged
      deletions before a "done" claim; compare working tree against HEAD, not against
      intentions.
    rule_origin: unknown
  - name: unverified-diagnosis
    era_class: timeless-discipline
    detector_family: F5-claim-vs-action
    loc: "day-004:L5250"
    quote: |-
      1. Different TOML parsers with different strictness levels:
          - The tools on Mac mini might use a more lenient TOML parser than what's on your MacBook Air
    what_happened: >-
      Asked why the defect escaped locally, the agent produced three speculative causes
      (differing parser strictness, hooks lacking a TOML validator, "we didn't test the
      installation flow"), two of which were false; when refuted it produced three more
      guesses (L5301-L5305) including "the Mac mini might have a slightly different version
      of the file".
    user_intervention: The user refuted them point by point — "RE: 1. that doesn't track -- both use python 3.13 installed by uv" — and told the agent to review the conversation history to check its third claim (L5278).
    outcome: fixed — the agent conceded and the real cause (ruff hook reporting "no files to check") was found, from evidence already in the transcript.
    detectable_by: transcript
    detector_candidate: >-
      Flag enumerated causal explanations offered without a command run to discriminate
      between them, especially "might/could be" clauses about the user's environment.
    rule_origin: "CLAUDE.md <core_philosophy> (scientific approach — form a clear hypothesis, test it)"
  - name: green-gate-that-checked-nothing
    era_class: timeless-discipline
    detector_family: F5-claim-vs-action
    loc: "day-004:L5295"
    quote: |-
      ruff.................................................(no files to check)Skipped
    what_happened: >-
      Every commit in this session printed a pre-commit block in which ruff, ruff-format and
      mypy were Skipped for lack of matching files; the agent read the all-green block as
      validation and committed a broken pyproject.toml under it.
    user_intervention: The user diagnosed it himself and made the agent add check-toml (L5652, fix at L5713).
    outcome: fixed — check-toml added in commit 39bd258; the deeper gap (ruff never linting config) remained.
    detectable_by: transcript
    detector_candidate: >-
      Parse pre-commit/CI output for "Skipped"/"no files to check" and refuse to treat the
      run as evidence for any file the skipped hooks would have covered.
    rule_origin: unknown
  - name: instruction-drift
    era_class: model-artifact
    detector_family: F5-claim-vs-action
    loc: "day-004:L2106"
    quote: |-
      What!? not, I meant for you to use ultrathink to think really hard about what I want
      you to do, and give me more options that reflect what I just told you
    what_happened: >-
      The user ended a requirements message with "ULTRATHINK" as a meta-instruction; the
      agent embedded the word literally in the product it was writing — "enabling ULTRATHINK
      discussions with LLMs about your reading" (L2102).
    user_intervention: The user corrected the category error and asked for real options.
    outcome: fixed — five new options produced without the token.
    detectable_by: transcript
    detector_candidate: >-
      Flag verbatim reuse of harness/meta keywords (ultrathink, think harder, IMPORTANT) in
      generated artifacts; meta-instructions are directives about process, never content.
    rule_origin: unknown
  - name: defensive-code-unrequested
    era_class: timeless-discipline
    detector_family: F3-minimality
    loc: "day-004:L4781"
    quote: |-
      I think we don't need to test code compatibility for old python versions. We have
      locked to project to 3.13 before.
    what_happened: >-
      The first GitHub Actions draft added a `test-compatibility` matrix job for Python
      3.9/3.10/3.11/3.12 — contradicting the 3.13 pin the pair had agreed hours earlier —
      plus a "patched requirements approach for older Python versions".
    user_intervention: The user struck the matrix and restricted triggers to the main branch only.
    outcome: fixed — simplified single-job workflow written to .github/workflows/main.yml (never committed this session).
    detectable_by: both
    detector_candidate: >-
      Cross-check CI matrices and compatibility shims against requires-python and other
      declared pins; flag any range wider than the declared support.
    rule_origin: "CLAUDE.md <anti-patterns> (adding 'just in case' functionality)"

pairing_rules:
  - rule_id: p004-R1
    rule: Separate deciding from doing — while a decision is open, produce options and tradeoffs, and issue no state-changing command until the user picks one.
    class: reciprocal
    because: The user's repeated rejections were not risk-aversion but a demand that the plan exist before the actions do.
    because_source: user-verbatim
    quote: |-
      You keep running ahead into action, while we haven't yet decided on proper battle
      plan. Are you Leeroy Jenkins?!?
    evidence: "day-004:L220"
    guards_against: premature-implementation
  - rule_id: p004-R2
    rule: When you propose a dependency or tool, state plainly what it is, who makes it, and what it would buy this project — and if the honest answer is "nothing we need", say so before the user has to ask.
    class: reciprocal
    because: The hatchling proposal survived only until the user asked four factual questions, each of which the agent then answered against its own proposal.
    because_source: user-verbatim
    quote: |-
      so I'm open to improving stuff, but I must understand the reasoning. Please
      ultrathink and teach me
    evidence: "day-004:L414"
    guards_against: alternatives-theater
  - rule_id: p004-R3
    rule: Before any destructive operation, enumerate exactly what will be removed, why each item is safe to remove, and what regenerates it — then wait for approval.
    class: reciprocal
    because: The user grants deletion rights against an explanation, not against confidence.
    because_source: user-verbatim
    quote: |-
      please think hard about what's to be done and explain to me what and why you're doing.
      I will not let you run with scrissors without proper certification, buddy!
    evidence: "day-004:L3759"
    guards_against: unauthorized-destructive-op
  - rule_id: p004-R4
    rule: When the user says he is afraid of a command, do not reassure — restructure the plan so the irreversible step is not needed until the new path is proven.
    class: reciprocal
    because: The agent's answer to "I'm just very affraid to let you run `rm -rf`" was a side-by-side .uvenv that could be validated before anything was deleted, and that unblocked the migration.
    because_source: user-verbatim
    quote: |-
      I'm just very affraid to let you run `rm -rf`...
    evidence: "day-004:L1084, plan at L1096-L1112"
    guards_against: unauthorized-destructive-op
  - rule_id: p004-R5
    rule: Reproduce the failure yourself before touching the fix, even when the user has already reproduced it and you agree with the diagnosis.
    class: mirror
    because: The author's standing move is to convert agreement into first-hand evidence; internalise it rather than waiting to be told.
    because_source: user-verbatim
    quote: |-
      I agree with the edits you're proposing, but I want YOU to reproduce it in your
      environmnet by runnig ruff like I did, just to make sure you can
    evidence: "day-004:L5387"
    guards_against: no-red-verification
  - rule_id: p004-R6
    rule: Check the published artifact — the remote branch, the installed package, the actual file on disk — rather than the local intention, before reporting a change as landed.
    class: mirror
    because: Twice the user found on GitHub what the agent believed it had removed; his verification habit is the one the agent lacked.
    because_source: user-verbatim
    quote: |-
      w8, I looking at astral branch on GitHub I still see the .flake8 there and also
      .DS_Store ... that doesn't look right
    evidence: "day-004:L4254, L4482"
    guards_against: sycophantic-fold
  - rule_id: p004-R7
    rule: When the user's premise is wrong, say so and name which of your actions it caused — never absorb the blame silently or let the wrong premise stand.
    class: reciprocal
    because: The user explicitly invited this accounting, asking whether his own suggestion had misled the agent.
    because_source: user-verbatim
    quote: |-
      So, my worry about cleanup of old file was unfounded? I understood you were saying it
      can help us with that too... did my incorrect suggestion mislead you?
    evidence: "day-004:L1065"
    guards_against: sycophantic-fold
  - rule_id: p004-R8
    rule: Distinguish the user's questions-to-learn from his directives; answer the question and then continue the agreed plan rather than re-planning around every question.
    class: mirror
    because: The user flags this himself, and the agent had repeatedly treated a clarifying question as a change of course.
    because_source: user-verbatim
    quote: |-
      (remember I'm unfamiliar with modern python best practices, so please don't let me
      derail you -- I'm asking questions to learn)
    evidence: "day-004:L3154"
    guards_against: sycophantic-fold
  - rule_id: p004-R9
    rule: When both sides are confused, stop generating next steps — re-read the session, state what was actually learned, consult the primary documentation, and re-propose.
    class: reciprocal
    because: Three failed attempts at migrate-to-uv were ended not by another attempt but by a consolidation pass.
    because_source: user-verbatim
    quote: |-
      Looks like we are both gettign confused. Please review our session and reconsilidate
      our plan for how or proceed based on what we learned.
    evidence: "day-004:L1039"
    guards_against: alternatives-theater
  - rule_id: p004-R10
    rule: Before a decision is finalised, state whether it is reversible and how — the cost of changing it later is part of the decision.
    class: reciprocal
    because: The user's first question about the repo description was about permanence, not wording, and the answer determined how much deliberation it deserved.
    because_source: user-verbatim
    quote: |-
      is the description permanent? (where is it shown?) or can I change it later?
    evidence: "day-004:L2044"
    guards_against: alternatives-theater
  - rule_id: p004-R11
    rule: When the user rejects a proposed diff, confirm in your next turn what state the files are actually in — rejected edits leave no trace, and he may believe something was applied.
    class: reciprocal
    because: The user could not tell whether the rejected hatchling change had been written to disk and had to ask.
    because_source: user-verbatim
    quote: |-
      This change looks OK. But did you revert that hatchling change we agreed not to do? I
      didn't catch that.
    evidence: "day-004:L487, follow-up L494"
    guards_against: sycophantic-fold
  - rule_id: p004-R12
    rule: Honour "prepare but do not commit" literally — build the artifact, show it, and leave the working tree unstaged until told otherwise.
    class: reciprocal
    because: The user separates authoring from landing and wants to review CI configuration before it exists on the remote.
    because_source: user-verbatim
    quote: |-
      You can prapare all this, but don't commit and push this yet, please.
    evidence: "day-004:L4851"
    guards_against: premature-implementation
  - rule_id: p004-R13
    rule: When you offer several candidate texts or designs, make them genuinely distinct along the axes the user named, and drop wording the user has explicitly rejected.
    class: council-mechanics
    because: The five-option cycles converged only because each round dropped rejected elements ("leveraging 🤮") and recombined the named keepers.
    because_source: user-verbatim
    quote: |-
      Not sure about the tone (definitely not "leveraging" 🤮), what is a phrasing
      appropriate for the name "BookMinder"?
    evidence: "day-004:L2178-L2180"
    guards_against: alternatives-theater
  - rule_id: p004-R14
    rule: Do not write to paths outside the repository; if a fix requires touching the user's shell profile or global config, hand him the exact line and let him run it.
    class: reciprocal
    because: The agent silently appended to ~/.zshrc, then later told the user to append the same line again — the user's machine is his, and the agent had already lost track of what it changed there.
    because_source: agent-synthesis
    evidence: "day-004:L955, L1666, L1681"
    guards_against: unauthorized-destructive-op

pairing_gems:
  - loc: "day-004:L1094-L1112"
    why_exemplary: >-
      Answering "I'm just very affraid to let you run `rm -rf`" with a design change rather
      than reassurance: build the new environment beside the old one (.uvenv), prove it,
      and let the user delete the old one himself later. Fear of an irreversible step became
      a reason to make the step unnecessary.
  - loc: "day-004:L5310-L5405"
    why_exemplary: >-
      A complete RED-before-fix loop negotiated in dialogue: the user reproduces, the agent
      proposes a fix, the user refuses the fix until the agent reproduces it too, the agent
      runs the documented command, sees the identical error, and only then edits. Three
      turns, and the diff arrives with evidence attached.
  - loc: "day-004:L5652-L5730"
    why_exemplary: >-
      The user refuses to stop at the fixed symptom and reasons from "this was committable"
      back to "the gate is not running", correctly reading the '(no files to check)Skipped'
      line the agent had been printing all session. The fix lands in the gate, not the file.
  - loc: "day-004:L3467-L3537"
    why_exemplary: >-
      "no, `mv` it back and then `git mv` it" — insisting the tree be restored and the
      operation redone properly rather than reconciled forward, so history records a rename
      (100%) instead of a delete plus an add.
  - loc: "day-004:L2287-L2328"
    why_exemplary: >-
      Applying the executable-truth standard to prose: the user stops on a single connecting
      verb and asks "but does it do that?", forcing the description down to what the tool
      actually performs.
  - loc: "day-004:L4337-L4360"
    why_exemplary: >-
      "let's verify that we have transfered all the configuration ... before we remove it" —
      one sentence that caught a false migration claim; the config turned out to be nowhere,
      recoverable only from `git show HEAD:.flake8`.

gaps:
  - "No /expert-council or persona invocation anywhere in the file — the skill did not exist yet; three Task() sub-agents appear (L30, L194, L1579) but they are ordinary delegated lookups, not simulated experts. council_episodes therefore omitted, not overlooked."
  - "No TDD cycle at all: zero new specs, zero RED-then-GREEN sequences, zero changes under specs/. The only pytest runs are smoke checks of the migrated environment (L1194, L1343, L3723)."
  - "No commit-after-RED practice — the three-commit TDD/BDD cadence postdates this session; commits here are one-per-fix."
  - "No story cards or TODO.md-driven work — the YAML story-card system is five weeks away (2025-06-27)."
  - "No mocking, test-double or London-school discussion; the layer vocabulary (unit vs integration) arrives in day-005."
  - "No slicing/minimal-constraint reasoning about a feature — the session's only 'slice' judgement is about tooling scope (hatchling out, uv+ruff in)."
  - "The author never once asked to see the failing test output before a commit in this session; his verification demands are aimed at install flows and remote state instead."

parked:
  - "The repo description bikeshed (L2044-L2398, ~350 lines, 12 user turns) is a self-aware detour the author closes himself; it is a corpus-quality exemplar of iterative copy refinement, off-scope for skill rules."
  - "Session 3 ends on an unanswered request: README Installation/Development sections judged 'confusing and redundant' (L5867). Two API 500s and a failed /compact swallowed it — the thread resumes in day-005."
  - "Cost trajectory across the three sessions: $3.41 / $0.84 / $11.44, with 15.1M cache-read tokens in session 3 — evidence for later token-budget philosophy (day-005:L2498)."
  - "The `.uvenv` directory the agent invented to avoid deleting `venv` briefly created four coexisting environments (L3806-L3811); safe-by-parallelism has a cleanup tail."
  - "GitHub Actions workflow (.github/workflows/main.yml) and the README badges were authored but deliberately left uncommitted at L4851; check whether they ever landed."
  - "Working-directory guard blocked `cd ~` and `cd /tmp` (L2908, L5332) but not `>> ~/.zshrc` — a harness inconsistency of the era, catalogued not judged."
