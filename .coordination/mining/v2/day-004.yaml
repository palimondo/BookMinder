philosophy:
  - statement: A known defect should be left standing as a visible failing signal rather than opportunistically patched, so the porting exercise has something real to falsify.
    source: user-verbatim
    quote: "Let's switch to `uv`. I don't want to resolve the hardcoded paths before publishing to GitHub. I want to treat that as a failing test case."
    loc: "day-004:L334"
    feeds: skill-why
  - statement: Installing the project on a machine that has nothing installed IS the test of the setup instructions; dogfooding on foreign hardware is how documentation becomes falsifiable.
    source: user-verbatim
    quote: "I would like to use installing the project from GitHub on that Macbook Air as a test case for the experience others would have downloading the project. You know, I think it would make sense to dogfood the project on a new machine myself..."
    loc: "day-004:L86"
    feeds: skill-why
  - statement: The author will not accept a change he cannot evaluate; the agent's job in a pair is to teach the reasoning, not to deliver a modernisation he must take on faith.
    source: user-verbatim
    quote: "Remember, I'm unfamiliar with modern Python development practices... so I'm open to improving stuff, but I must understand the reasoning. Please ultrathink and teach me"
    loc: "day-004:L414"
    feeds: judge-anchor
  - statement: Deciding the plan is a distinct phase from executing it; an agent that starts running commands while the plan is still contested has broken the pairing contract.
    source: user-verbatim
    quote: "You keep running ahead into action, while we haven't yet decided on proper battle plan. Are you Leeroy Jenkins?!?"
    loc: "day-004:L220"
    feeds: judge-anchor
  - statement: Agreement about a diagnosis is not evidence; the agent must observe the failure firing in its own environment before it is allowed to fix it. (RED-before-GREEN, stated for a bug fix, five weeks before the TDD rules were written down.)
    source: user-verbatim
    quote: "I agree with the edits you're proposing, but I want YOU to reproduce it in your environmnet by runnig ruff like I did, just to make sure you can"
    loc: "day-004:L5387"
    feeds: judge-anchor
  - statement: A defect must be fixed at its source and re-verified by re-running the documented procedure end to end; hand-patching the broken copy proves nothing about the artifact other people will get.
    source: user-verbatim
    quote: "I don't want to fix stuff manually on Macbook. I want to fix them in repo an retry on Macbook as per instrtuctios from README"
    loc: "day-004:L5207"
    feeds: skill-why
  - statement: When a broken artifact reaches a commit, the interesting defect is the gate that let it through, not the artifact — the escape is evidence the automation is not doing what its predecessor did.
    source: user-verbatim
    quote: "these checks should have been executed in our pre-commit hooks, so we should have caught this misconfiguration on TOML file earlier. The fact that you were able to commit it with syntax errors indicates that the Pre-commit hooks are not runninng the ruff"
    loc: "day-004:L5652"
    feeds: skill-why
  - statement: Rules in the project constitution must earn their place individually; a plausible-sounding line that changes no behaviour is deleted on sight.
    source: user-verbatim
    quote: "loose the \"Keep Python version\" line, and the next one \"Use tool-specific\"... these don't seem to add any value to me"
    loc: "day-004:L3620"
    feeds: skill-why
  - statement: Documentation should address the audience that exists; pretending to serve users the project does not have is what produced the duplicated Installation/Development sections.
    source: user-verbatim
    quote: "Maybe we shoudl not preted we have users and focus on developers only at this moment?"
    loc: "day-004:L5869"
    feeds: skill-why
  - statement: Destructive operations require an explained plan first — competence must be demonstrated before autonomy is granted.
    source: user-verbatim
    quote: "please think hard about what's to be done and explain to me what and why you're doing. I will not let you run with scrissors without proper certification, buddy!"
    loc: "day-004:L3759"
    feeds: judge-anchor
  - statement: A migration is not complete until the replacement is shown to carry every setting the removed thing carried; deletion comes after the diff, not before.
    source: user-verbatim
    quote: "let's verify that we have transfered all the configuration from .flake8 to ruff, before we remove it"
    loc: "day-004:L4337"
    feeds: skill-why
  - statement: A comment that restates a self-explanatory command is noise and gets cut, even in a README.
    source: user-verbatim
    quote: "we can drop the comment, right? the command is self explanatory"
    loc: "day-004:L3187"
    feeds: skill-why
  - statement: The author reads this whole session as an exercise in disciplined process, not just tooling — the project's own public description was negotiated to say so.
    source: user-paraphrase
    quote: "What do you think of \"through disciplined TDD/BDD\" (does that match my vision?)"
    loc: "day-004:L2331"
    feeds: judge-anchor

skill_rules:
  - rule_id: d004-R1
    rule: Reproduce a reported failure yourself, in your own environment, with the exact command that produced it, before editing anything.
    because: Agreeing that a proposed fix looks right is not evidence the fix addresses the actual failure.
    because_source: user-verbatim
    quote: "I agree with the edits you're proposing, but I want YOU to reproduce it in your environmnet by runnig ruff like I did, just to make sure you can"
    evidence: "day-004:L5387"
    taught_or_enforced: needed-enforcement
    skill_target: tdd-bdd
    overlap: "canonical §2.6"
    feasibility: ok
  - rule_id: d004-R2
    rule: Fix defects in the repository and re-run the documented procedure from a clean state; never hand-edit the failing copy on the affected machine.
    because: A local hand-patch leaves the published artifact broken and destroys the evidence that the fix works as documented.
    because_source: user-verbatim
    quote: "I don't want to fix stuff manually on Macbook. I want to fix them in repo an retry on Macbook as per instrtuctios from README"
    evidence: "day-004:L5207"
    taught_or_enforced: taught-once
    skill_target: tdd-bdd
    overlap: none
    feasibility: ok
  - rule_id: d004-R3
    rule: When a broken artifact gets past the automated gate, repair the gate in the same session, and demonstrate the repaired gate catching the class of defect.
    because: The escape proves the automation is not covering what its predecessor covered; fixing only the artifact leaves the hole open.
    because_source: user-verbatim
    quote: "The fact that you were able to commit it with syntax errors indicates that the Pre-commit hooks are not runninng the ruff, like it used to run flake8 and black."
    evidence: "day-004:L5652"
    taught_or_enforced: taught-once
    skill_target: tdd-bdd
    overlap: none
    feasibility: ok
  - rule_id: d004-R4
    rule: Never mark a verification step done, or state that something works, unless the transcript shows the verifying command run and its output.
    because: The agent reported the uv migration verified while the only end-to-end attempt had been abandoned half-finished.
    because_source: user-verbatim
