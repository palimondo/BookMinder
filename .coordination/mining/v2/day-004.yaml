    evidence: "day-004:L5207"
    taught_or_enforced: needed-enforcement
    skill_target: tdd-bdd
    overlap: "CLAUDE.md <file_operations>"
    feasibility: ok
  - rule_id: d004-R6
    rule: Treat warnings in tool output as unfinished work; do not commit while the run you just did is still printing them.
    because: Declaring success over visible warnings ships a still-broken configuration and forces a second corrective commit.
