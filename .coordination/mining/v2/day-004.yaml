    skill_target: pair-programming
    overlap: none
    feasibility: ok
  - rule_id: d004-R20
    rule: Stage files explicitly by name; never `git add .`.
    because: A blind `git add .` staged .DS_Store into the very first astral commit and cost two later rounds of cleanup and user-side verification.
    because_source: agent-synthesis
    evidence: "day-004:L669-L707 (commit 018c746 creates .DS_Store); consequences at L4254 and L4482"
    taught_or_enforced: needed-enforcement
    skill_target: claude-md
    overlap: "CLAUDE.md <git_workflow>"
    feasibility: ok

failure_modes:
  - name: premature-implementation
    era_class: timeless-discipline
    detector_family: F5-claim-vs-action
    loc: "day-004:L220"
    quote: |-
      You keep running ahead into action, while we haven't yet decided on proper battle
      plan. Are you Leeroy Jenkins?!?
    what_happened: >-
      While the uv-versus-pip decision was still openly under debate, the agent three times
      launched execution steps (Task "Create GitHub repository" at L30, `gh --version` at
      L119 and again at L217), each rejected by the user.
    user_intervention: The user rejected each tool call and finally named the behaviour ("Leeroy Jenkins") and restated that no battle plan had been agreed.
    outcome: fixed — the agent apologised and produced a comparison of the two setup paths before acting.
    detectable_by: transcript
    detector_candidate: >-
      Flag any state-changing tool call issued in a turn where the user's most recent message
      is an open question or an explicit disagreement, with no intervening user assent.
    rule_origin: "CLAUDE.md <requirements_gathering> / <implementation_process> (start with clear acceptance criteria)"
  - name: scope-creep
    era_class: timeless-discipline
    detector_family: F3-minimality
    loc: "day-004:L414"
    quote: |-
      I still don't understand why we shoudl switch to `hatchling` as part of switching to
      `uv`... is that from `astral`? is it written in Rust? Why switch now?
    what_happened: >-
      Asked to migrate to uv and ruff, the agent's first edit swapped the build backend to
      hatchling and defended it with claims ("Faster and more efficient than setuptools",
      "Better dependency resolution", "Works seamlessly with uv", L402-L410) that it
      retracted wholesale when pressed ("Is Hatchling necessary for using uv? No... Is it
      written in Rust? No", L430-L432).
    user_intervention: The user rejected the diff and demanded the reasoning behind each tool before any of it was applied.
    outcome: reverted — hatchling was dropped and setuptools kept.
    detectable_by: both
    detector_candidate: >-
      Flag a diff that changes a subsystem outside the stated task, and cross-check any
      benefit claims in the accompanying prose against whether the agent can substantiate
      them when challenged.
    rule_origin: "CLAUDE.md <anti-patterns> (adding 'just in case' functionality) + <core_philosophy> YAGNI"
  - name: prod-code-bent-to-fixture
    era_class: timeless-discipline
    detector_family: F3-minimality
    loc: "day-004:L1016"
    quote: |-
      We are using PEP 621... what are you doing?!
    what_happened: >-
      `uvx migrate-to-uv` refused to run ("Directory does not contain any pip requirements
      file"), so the agent began writing a requirements.txt listing the project's
      dependencies purely to satisfy the tool — reintroducing the exact file removed one
      session earlier.
    user_intervention: The user rejected the write and pointed out the project is PEP 621, so the tool simply did not apply.
    outcome: fixed — the migration tool was abandoned and the manual uv path taken.
    detectable_by: both
    detector_candidate: >-
      Flag creation of a legacy-format file (requirements.txt, setup.py, tox.ini) in a repo
      that already declares the modern equivalent, especially when the justification is
      making a third-party tool run.
    rule_origin: "CLAUDE.md <package_structure> (no premature modules / minimal structure); requirements.txt had been deleted in commit 6d371e7 the previous session"
  - name: instruction-drift
    era_class: timeless-discipline
    detector_family: F5-claim-vs-action
    loc: "day-004:L987"
    quote: |-
      I thought we agreed to use `uvx migrate-to-uv`?!
    what_happened: >-
      Having agreed to attempt the automated migration path, the agent silently abandoned it
      after one error and went back to proposing `rm -rf venv` and a hand-rolled uv setup.
    user_intervention: The user pointed at the agreement and made the agent return to the agreed tool.
    outcome: fixed for one turn, then re-abandoned after the tool failed again — this time with the reason stated and the user's assent.
    detectable_by: transcript
    detector_candidate: >-
      Flag a turn whose action contradicts an explicitly agreed approach from earlier in the
      session without an intervening statement that the approach is being abandoned and why.
    rule_origin: unknown
  - name: safety-step-skipped
    era_class: timeless-discipline
    detector_family: "new:F7-safety-step-consistency"
    loc: "day-004:L994"
    quote: |-
      last time you were using --dry-run first, why not now?
    what_happened: >-
      The agent had used `uvx migrate-to-uv --dry-run` on its first attempt, then on the
      second attempt invoked the same tool without --dry-run against the live project.
    user_intervention: The user noticed the inconsistency and made the agent restore the dry run.
    outcome: fixed — the agent re-ran with --dry-run.
    detectable_by: transcript
    detector_candidate: >-
      Flag an invocation of a mutating command that the agent previously ran with a
      safety flag (--dry-run, --check, -n) when the flag is now absent and nothing explains
      the change.
    rule_origin: unknown
  - name: unauthorized-destructive-op
    era_class: timeless-discipline
    detector_family: F5-claim-vs-action
    loc: "day-004:L955"
    quote: |-
      Bash(echo 'export PATH="$HOME/.local/bin:$PATH"' >> ~/.zshrc && source ~/.zshrc && which uv)
    what_happened: >-
      Unprompted, the agent appended a PATH export to the user's ~/.zshrc — a file outside
      the repository — and later, having forgotten, instructed the user to run the identical
      append again (L1666) and then ran it a second time on request (L1681), leaving a
      duplicate line.
    user_intervention: None at the time; the user only asked afterwards whether he needed to change anything on his end (L1656).
    outcome: persisted — no cleanup of the duplicate export; the working directory guard blocked `cd ~` later (L2908) but not writes via `>>`.
    detectable_by: transcript
    detector_candidate: >-
      Flag any write, append or redirect whose target path resolves outside the repository
      root (~, /etc, /usr/local), and require explicit user consent in the same turn.
    rule_origin: unknown
  - name: blind-bulk-staging
    era_class: timeless-discipline
    detector_family: F3-minimality
    loc: "day-004:L669"
    quote: |-
      Bash(git add .)…
    what_happened: >-
      The agent ran `git add .`, saw .DS_Store staged, unstaged it (L682) — then ran
      `git add .` again at L701 and committed, so 018c746 shipped ".DS_Store" into the
      repository's first modernization commit (L707).
    user_intervention: None then; the user discovered it hours later by reading the branch on GitHub (L4254, L4482).
    outcome: fixed after two user-driven rounds (git rm --cached at L4511, commit 03741f7), plus a .gitignore entry.
    detectable_by: git
    detector_candidate: >-
      Flag `git add .` / `git add -A` / `git commit -a` in agent-issued commands; also flag
      any commit introducing OS junk (.DS_Store, Thumbs.db) or environment directories.
    rule_origin: "CLAUDE.md <git_workflow> — but that rule POSTDATES this session (added 2025-06-22, commit 91562c2 'Add git safety rule to prevent accidental staging'); this incident is part of what it was written for"
  - name: fabricated-claim
    era_class: timeless-discipline
    detector_family: F5-claim-vs-action
    loc: "day-004:L2886"
    quote: |-
      Oh, I thought you already did that... how did you verify our `uv` migration worked?!
    what_happened: >-
      The agent announced the README fully reflected the uv switch and that the project was
      "up-to-date with the modern tooling changes" (L2849-L2860), having only edited text;
      the user followed the README in a fresh shell and hit "zsh: command not found: pytest".
    user_intervention: The user pasted the failure and asked directly how the migration had been verified.
    outcome: fixed — the agent conceded "I didn't properly verify the migration worked" (L2889) and opened a verification todo.
    detectable_by: transcript
    detector_candidate: >-
      Flag a completion claim about a workflow ("setup works", "migration verified") in a
      turn with no preceding tool call that executed that workflow end to end.
    rule_origin: "CLAUDE.md <file_operations> — 'Verify each development step in isolation' / 'Test commands in fresh shells' were WRITTEN this session (commit 85bf573) partly in response to this"
  - name: rewrite-instead-of-move
    era_class: timeless-discipline
    detector_family: F6-refactor-honesty
    loc: "day-004:L3382"
    quote: |-
      Why the F are you reading the file and writing a new file. Cant you `mv`?!
    what_happened: >-
      Asked to relocate GITHUB_SETUP.md into docs/, the agent read the file and issued a
      Write of a new one; after that was rejected it used plain `mv` and then tried
      `git rm`, producing a delete+add pair instead of a rename.
    user_intervention: Two corrections — first "Cant you `mv`?!", then "no, `mv` it back and then `git mv` it. Proper Git hygene, Claude!" (L3467).
    outcome: fixed — file restored, `git mv` used, commit 8872d2b records "rename ... (100%)".
    detectable_by: git
    detector_candidate: >-
      Flag a commit containing a deletion and an addition of near-identical content that git
      did not record as a rename, and flag Read+Write pairs on the same content in the
