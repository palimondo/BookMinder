    user_intervention: "let's verify that we have transfered all the configuration from .flake8 to ruff, before we remove it" (L4337).
    outcome: fixed — settings ported, but in invalid TOML (see next entry).
    detectable_by: both
    detector_candidate: >-
      When a deletion is justified by "already migrated", require a diff of the old file's
