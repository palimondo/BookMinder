  - rule_id: d004-R17
    rule: BookMinder's toolchain is uv plus ruff on Python 3.13, with per-file docstring ignores for specs/ and __init__.py living in [tool.ruff.lint.per-file-ignores]; setuptools stays as the build backend.
    because: This is the settled toolchain decision of the astral branch — hatchling was explicitly considered and rejected as unnecessary for the uv/ruff goals.
    because_source: user-paraphrase
    evidence: "day-004:L466, L5421-L5434, L5566-L5578"
    taught_or_enforced: taught-once
    skill_target: project-memory
    overlap: "CLAUDE.md <build_commands>"
    feasibility: ok
  - rule_id: d004-R18
    rule: Keep check-toml alongside check-yaml in .pre-commit-config.yaml.
    because: It was added specifically because an invalid pyproject.toml passed an all-green pre-commit run and broke the second machine.
    because_source: user-paraphrase
    evidence: "day-004:L5713-L5730"
    taught_or_enforced: taught-once
    skill_target: project-memory
    overlap: none
    feasibility: ok
  - rule_id: d004-R19
    rule: Do not modify files outside the repository (shell profiles, global config, home directory) without asking first.
    because: The agent appended a PATH export to ~/.zshrc unprompted, then later told the user to run the same append again — the user's environment is not the agent's workspace.
    because_source: agent-synthesis
