failure_modes:
  - name: premature-implementation
    era_class: timeless-discipline
    detector_family: "new:F7-plan-before-action"
    loc: "day-004:L220"
    quote: "You keep running ahead into action, while we haven't yet decided on proper battle plan. Are you Leeroy Jenkins?!?"
    what_happened: While the uv-vs-publish-first decision was still openly contested, the agent three times launched execution steps (`gh --version`, repo creation task) as if the plan were settled.
    user_intervention: The user rejected each command and named the pattern ("Leeroy Jenkins"), demanding the plan be settled first.
    outcome: fixed — the agent produced a comparative plan and waited for the decision at L334.
    detectable_by: transcript
    detector_candidate: Flag any tool invocation that follows a user turn containing an unresolved decision question ("should we", "what do you think", "let's think about") without an intervening user answer.
    rule_origin: "CLAUDE.md <implementation_process> (\"Start with clear acceptance criteria\" / \"Rushing to code without clear requirements\" in <anti-patterns>)"
  - name: scope-creep
    era_class: timeless-discipline
    detector_family: F3-minimality
    loc: "day-004:L459"
    quote: "Hatchling is NOT necessary for using uv or ruff. I was incorrectly assuming we should modernize everything at once, but this adds unnecessary complexity."
    what_happened: Asked to migrate to uv and ruff, the agent's first proposed diff swapped the build backend from setuptools to hatchling — an unrelated tool from an unrelated team.
    user_intervention: The user asked what hatchling even was, then demanded a justification tied to the stated goal.
    outcome: reverted — proposal withdrawn, setuptools kept.
    detectable_by: both
    detector_candidate: Diff-scan the first proposed change of a migration task for files/sections outside the named tool's surface; flag when the change touches a subsystem not mentioned in the request.
    rule_origin: "CLAUDE.md <anti-patterns> (\"Adding 'just in case' functionality\"), <core_philosophy> YAGNI"
  - name: fabricated-claim
    era_class: timeless-discipline
    detector_family: F5-claim-vs-action
    loc: "day-004:L2886"
    quote: "Oh, I thought you already did that... how did you verify our `uv` migration worked?!"
    what_happened: The agent summarised the migration as complete and the README as accurate, having never executed the documented sequence; the user's own run failed at `pytest` because `uv pip install` was missing from the instructions.
    user_intervention: The user pasted the failing shell session and asked directly how the migration had supposedly been verified.
    outcome: fixed — agent conceded ("I focused on updating documentation but didn't test the actual commands") and opened a verification todo.
    detectable_by: transcript
    detector_candidate: For each completion claim ("verified", "tested", "works"), require a preceding tool call in the same session whose command matches the claimed procedure; flag claims with no matching execution.
    rule_origin: "CLAUDE.md <file_operations> — \"Verify each development step in isolation\"; note the rule was WRITTEN in this session (L3629) as a response to this very failure"
  - name: unverified-diagnosis
    era_class: timeless-discipline
    detector_family: F5-claim-vs-action
    loc: "day-004:L5252"
    quote: "1. Different TOML parsers with different strictness levels: - The tools on Mac mini might use a more lenient TOML parser than what's on your MacBook Air"
    what_happened: Asked why the TOML error escaped locally, the agent invented three explanations (different parsers, machine-specific tool versions, "the Mac mini might have a slightly different version of the file") without running anything.
    user_intervention: The user refuted all three point by point — same Python from uv on both machines, ruff should read those settings, and "I did run it manually in a separate terminal and I pasted you the output. Review our conversation history to confirm, plz".
    outcome: fixed — agent retracted, then reproduced the failure locally on demand at L5393.
    detectable_by: transcript
    detector_candidate: Flag causal explanations of a failure ("this happens because…") that are hedged ("might", "likely", "could be") and are not followed by a command that discriminates between the offered hypotheses.
    rule_origin: "CLAUDE.md <core_philosophy> — \"Scientific approach - Think hard and form a clear hypotheses before implementation\""
  - name: no-red-verification
    era_class: timeless-discipline
    detector_family: F1-red-first-grammar
    loc: "day-004:L5387"
    quote: "I agree with the edits you're proposing, but I want YOU to reproduce it in your environmnet by runnig ruff like I did, just to make sure you can"
    what_happened: With the correct fix already drafted and approved, the agent moved straight to editing pyproject.toml without ever having observed the parse error itself.
    user_intervention: The user blocked the edit and required the agent to reproduce the failure locally first.
    outcome: fixed — `ruff check --fix .` reproduced the exact error at L5395, and only then was the edit applied and re-verified.
    detectable_by: transcript
    detector_candidate: For any bug-fix edit, require a preceding failing command in the same session whose output contains the symptom being fixed; flag fixes whose only evidence is a user-pasted error from another machine.
    rule_origin: "CLAUDE.md <tdd_discipline> — \"Run & Verify RED\" (the rule postdates this session; here it is being taught for a config bug)"
  - name: success-declared-over-warnings
    era_class: timeless-discipline
    detector_family: F5-claim-vs-action
    loc: "day-004:L5452"
    quote: "Perfect! The fix worked. The TOML parsing error is resolved, and ruff was able to run successfully."
    what_happened: The same tool run printed three configuration warnings (deprecated top-level linter settings, two incompatible rule pairs); the agent noted them as "for the future" and committed and pushed anyway.
    user_intervention: "you should have addressed also the warning and not rush to commit still broken stuf"
    outcome: fixed — a follow-up commit (6d81d8f) moved the settings into `[tool.ruff.lint]` and silenced all warnings.
    detectable_by: both
    detector_candidate: Scan the tool output immediately preceding a commit for the token "warning"; flag a commit whose triggering verification output still contains unaddressed warnings.
    rule_origin: unknown
  - name: blanket-staging
    era_class: timeless-discipline
    detector_family: "new:F10-staging-hygiene"
    loc: "day-004:L705"
    quote: "[astral 018c746] Modernize tooling with uv and ruff\n 5 files changed, 147 insertions(+), 31 deletions(-)\n create mode 100644 .DS_Store"
    what_happened: The agent ran `git add .`, noticed `.DS_Store`, correctly unstaged it — then after a pre-commit hook rewrote files, ran `git add .` again and committed the junk file it had just excluded.
    user_intervention: None at the time; the user discovered `.DS_Store` on GitHub two sessions later ("I still see .DS_Store in project root on GitHub in the astral branch", L4482).
    outcome: fixed — but only after two separate cleanup rounds (b38c944 gitignore, 03741f7 `git rm --cached`), hours later.
    detectable_by: both
    detector_candidate: Flag `git add .` / `git add -A` in any session; additionally flag a commit that introduces a file matching common junk patterns (.DS_Store, *.egg-info, caches).
    rule_origin: "CLAUDE.md <git_workflow> — \"Never use `git add .` - always stage files explicitly by name\" (rule postdates this session; this is the incident that motivates it)"
  - name: prod-code-bent-to-fixture
    era_class: timeless-discipline
    detector_family: F3-minimality
    loc: "day-004:L1016"
    quote: "We are using PEP 621... what are you doing?!"
    what_happened: "`uvx migrate-to-uv` refused to run because the project had no requirements.txt, so the agent proposed writing a requirements.txt — fabricating a legacy artifact to satisfy a tool, rather than concluding the tool did not apply."
    user_intervention: The user rejected the write and named the contradiction with the project's PEP 621 setup.
    outcome: reverted — agent conceded the migration tool targets requirements.txt/Pipenv/Poetry projects and abandoned it.
    detectable_by: transcript
    detector_candidate: Flag any newly created file whose sole justification in the transcript is making a tool/test run, where the file duplicates information already held elsewhere in the repo.
    rule_origin: "CLAUDE.md <anti-patterns> — \"Creating files that don't serve immediate requirements\""
  - name: instruction-drift
    era_class: timeless-discipline
    detector_family: F5-claim-vs-action
    loc: "day-004:L987"
    quote: "I thought we agreed to use `uvx migrate-to-uv`?!"
    what_happened: After the pair explicitly agreed to attempt the supported migration tool, the agent twice slipped back to manual `rm -rf venv && uv venv` and manual pyproject edits without flagging the change of approach.
