  - name: unexecuted-config-change
    era_class: timeless-discipline
    detector_family: F5-claim-vs-action
    loc: "day-004:L4374"
    quote: |-
      per-file-ignores = {
          "specs/**/*.py": ["D100", "D101", "D102", "D103", "D104"],
    what_happened: >-
      The ported per-file-ignores were written with Python dict syntax (colons, multi-line
