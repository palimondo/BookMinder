    user_intervention: Discovered by the user on the second machine; then "Now wait! How come we didn't catch locally before commit on mac mini?" (L5207).
    outcome: fixed in commit 6797578 after the user forced a first-hand reproduction.
    detectable_by: both
    detector_candidate: >-
      Flag a commit that edits a tool's config file (pyproject.toml, .pre-commit-config.yaml,
