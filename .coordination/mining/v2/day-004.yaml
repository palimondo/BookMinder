    rule_origin: "CLAUDE.md <file_operations> — the 'Always use `git mv`' rule was CREATED in this session (commit 85bf573, day-004:L3629) as the direct fix"
  - name: fabricated-claim
    era_class: timeless-discipline
    detector_family: F5-claim-vs-action
