file: day-009
date: 2025-06-23
agent_era: claude-code
model: >-
  Two models driven manually as a two-seat pair: claude-opus-4-20250514 as reviewer/architect and
  claude-sonnet-4-20250514 as implementer, switched 18 times via /model (every switch echoed by the
  harness, e.g. L307, L605, L1004 — no silent downgrade). claude-3-5-haiku runs as the background
  utility model and dominates raw input tokens (803.9k input vs Opus 947 / Sonnet 1.3k at the final
  /cost, L8903-L8905). One harness artifact: at L6445 the user typed "/model Sonnet let's write these
  down…" and the whole sentence was accepted as a model name (L6447-L6448) before being corrected at
  L6451. In-content date anchors: commits dated "Mon Jun 23 01:03:58 2025" (L3556),
  "Mon Jun 23 08:57:11 2025" (L7579) and "Mon Jun 23 21:30:03 2025" (L8881).
sub_sessions:
  - "L1-L8907: main session. 2025-06-23, wall 22h 3m / API 2h 20m, $84.02. Outside-in build of `bookminder list recent` from acceptance test to real SQLite, then an ATDD post-mortem and rollback. Auto-compaction at L6527-L6534 (agent-generated summary, not dialogue). A 'Credit balance too low' interrupt lands mid-turn at L4782; the user tops up and re-sends the same message at L4799 — the session does NOT end there."
  - "L8909-L9019: second session, cwd wrongly set to claude-dev-log-diary/, $0.84. Aborted after the agent proposed rewriting history for a file it could not see and hit the cwd sandbox (L8995-L8999)."
  - "L9021-L9337: third session, `claude --model opus`, $1.76. Interactive rebase to remove day-008.md from commit 8c99021 while keeping it on disk."

philosophy:
  - statement: Pairing is the unit of work, not review — the agent is expected to stop at every stable point so the human can steer while the design is still cheap to change, and both parties are learning.
    source: user-verbatim
    quote: "very good, and please stop at each stable point and let me review your work! I want to oversee you working and guide you -- we are pair programming partners here. Do not rush to solutions. We are also learning together!"
    loc: "day-009:L753-L754"
    feeds: skill-why
  - statement: Process is worth micromanaging explicitly — the plan must say when and how each phase of the discipline will be executed, not merely which code will be written.
    source: user-verbatim
    quote: "thinking about <tdd_discipline/>, outline in the plan when and how you'd go about things. I wan't to micromanage the process here, to make sure you'll stick with the metodology"
    loc: "day-009:L464-L465"
    feeds: judge-anchor
  - statement: Direction of travel is outside-in — the acceptance test at the user-visible boundary comes first and drives inward to units; starting at the unit is a process error, not a style preference.
    source: user-verbatim
    quote: "But now I'm thinking we made a more fundamental process error when we formulated our plan with Opus -- we should have started from outside and then go in. Acceptande test -> Unit tests"
    loc: "day-009:L945-L946"
    feeds: skill-why
  - statement: A red acceptance test is meant to be endured. Making it green with fake data removes the only thing pulling the implementation forward, and every subsequent test smell descends from that one impatience.
    source: user-verbatim
    quote: "It didn't tolerate failing acceptance test until we drove the implementation with unit tests, but first made the acceptance test pass by returning page data from implementation."
    loc: "day-009:L7329-L7331"
    feeds: judge-anchor
  - statement: Coverage is a residue of good specs and never a goal — chasing the number produces "Coverage-Driven Development", in which tests are retrofitted to ratify code that should never have existed.
    source: user-verbatim
    quote: "that last part we did wasn't exactly ATTD, we were fighting to retroactively add test coverage for somethig that should have not been in the implementation in the first place."
    loc: "day-009:L6334-L6335"
    feeds: judge-anchor
  - statement: When provenance is wrong, the repair is deletion and re-derivation, not patching forward — and process hygiene outranks the convenience of an exception the author himself had already granted.
    source: user-verbatim
    quote: "I said before that we should make a process exception before, but I changed my mind. I think it's more important to establish good ATTD process hygene. Let's first remove all of the defensively coded implementation that the current acceptance tests did not call for."
    loc: "day-009:L6672-L6674"
    feeds: judge-anchor
  - statement: Defensiveness must be earned by observed data, not by imagination — the question is never "could this be NULL?" but "is it NULL in the database I have?", answered by querying it.
    source: user-verbatim
    quote: "it looks impossible, but check in the real db directly"
    loc: "day-009:L5564"
    feeds: skill-why
  - statement: Naming is a design act with a source of truth — the right name is usually already present in the domain (here the DB column), and a good enough name makes its explanatory comment redundant.
    source: user-verbatim
    quote: "If we named it `reading_progress_percentage` we can event delete the comment, as it woudl be 100% redundant (pun intended!)"
    loc: "day-009:L4590"
    feeds: skill-why
  - statement: Comments are triaged as signal or noise individually, and a comment marking a genuinely open question is signal — the right form is a TODO/FIXME that keeps the unfinished issue tracked.
    source: user-verbatim
    quote: "Seems like a good question... we might not have a good answer yet -- in such cases a FIXME/TODO comment might help us keep track of an unfinished issue"
    loc: "day-009:L4438-L4439"
    feeds: skill-why
  - statement: The project's own documentation is not an authority — citing it as the reason for code is an appeal to revelation, because docs are only a record of an earlier exploration.
    source: user-verbatim
    quote: "I strongly disagree -- how is this helpful?! It might as well say query from God. Our docs are not a revelations from higher powers -- it's just where we stored our learning from exploratory phase."
    loc: "day-009:L4439-L4441"
    feeds: judge-anchor
  - statement: Accumulated AI-generated documentation is a liability to be justified, not an asset to be grown; the author suspects his own docs/ folder is dead weight.
    source: user-verbatim
    quote: "I'm not sure it is worth its weight. It might be just turn out ot be just a big  baggage of AI slop in the end."
    loc: "day-009:L8038-L8039"
    feeds: judge-anchor
  - statement: BookMinder is a benchmark for the process, not only a utility — the durable artifacts are the story cards and their acceptance tests, with working code as the output an agentic system must derive from them.
    source: user-verbatim
    quote: "one of the ideas I was playing in my head for this project is to turn it into a benchmark of sorts... the inputs being ATTD specs and the goal of agentic coding systems woudl be to produce the working code artifacts from these inputs."
    loc: "day-009:L8039-L8041"
    feeds: skill-why
  - statement: Product-owner practice is the missing outer loop — story cards organised as a walk through the system, each expanded into acceptance tests, is the artifact chain worth accumulating, and AI augmentation of an expert PO is a first-class use case.
    source: user-verbatim
    quote: "In my day job, I am a Product Owner. So, Let's bring in the perspective of Jeff Patton as Described in his book User Stories Mapping."
    loc: "day-009:L8222-L8223"
    feeds: skill-why
  - statement: Consistency with an existing pattern in the codebase beats a cleverer new mechanism — when a seam already exists for one data source, the second source should copy it literally.
    source: user-verbatim
    quote: "Almost, but I was being literal. Why not follow the exact same pattern:"
    loc: "day-009:L5191"
    feeds: skill-why
  - statement: A model's self-assessment is evidence to be contested, not accepted — and the correction the author wants is usually the concrete checklist item that was skipped, not a broader indictment.
    source: user-verbatim
    quote: "I think you're being too critical and missing my main point. Did you review \"Before commiting, verify\" checklist? Let's focus on that and do what we skipped, then reflect again"
    loc: "day-009:L4139-L4140"
    feeds: judge-anchor
  - statement: History rewriting is only safe once its blast radius has been verified and its effect on the working tree explained — the author will not approve a destructive git operation he cannot restate himself.
    source: user-verbatim
    quote: "will this keep it on my disk? I want ot manually add it in a separate commit, I don't want to loose it!"
    loc: "day-009:L9145"
    feeds: judge-anchor
  - statement: Test seams should be discovered rather than invented — the author repeatedly points the agent at the shape the code already has instead of accepting new mocking machinery.
    source: user-verbatim
    quote: "If you look at how we structure our code in library.py for Books.plist and then how we are monkey patching it in spec, isn't that pattern worth following here with DB too? (I have a feeling it might make it simpler?)"
    loc: "day-009:L5037-L5038"
    feeds: skill-why
  - statement: Visibility of a helper is decided by whether a spec needs to address it, and the decision is reversible in both directions within one session.
    source: user-verbatim
    quote: "it's fine we want to test it separately, but then it shouldn't be a private function anymore, so don;t forget to properly rename it"
    loc: "day-009:L5426"
    feeds: skill-why

skill_rules:
  - rule_id: d009-R1
    rule: Begin every story at the outermost observable boundary named in its acceptance criteria (the CLI invocation), see that test fail, and let it drive inward to units; never open with a unit test for a function the criteria do not mention.
    because: The story's Gherkin already states what the user sees, so any test written above it is a guess about internal structure.
    because_source: user-verbatim
    quote: "we should have started from outside and then go in. Acceptande test -> Unit tests"
    evidence: "day-009:L945-L946 → premature unit test deleted at L1103-L1121, acceptance spec written at L1257-L1267, RED confirmed at L1276-L1289"
    taught_or_enforced: taught-once
    skill_target: tdd-bdd
    overlap: "both — CLAUDE.md <tdd_discipline> (\"outside-in ATDD approach: the acceptance test stays RED until the feature is fully implemented\") and canonical §3; this session is the provenance of the CLAUDE.md sentence"
    feasibility: ok
  - rule_id: d009-R2
    rule: Do not satisfy a red acceptance test with hardcoded data unless you drive the fake out through unit specs in the same sitting; if you do fake it, say so in the commit body and treat the acceptance test as still owing you a real implementation.
    because: Once the acceptance test is green on a fake, nothing is pulling the implementation forward, and the next test you write will be a meta-test that detects the fake instead of specifying behavior.
    because_source: user-verbatim
    quote: "It didn't tolerate failing acceptance test until we drove the implementation with unit tests, but first made the acceptance test pass by returning page data from implementation."
    evidence: "day-009:L7329-L7331; the fake lands at L1460-L1463 (\"# Minimal hardcoded output to make acceptance test pass\"), the meta-test it forced at L2879-L2894, deleted at L7410-L7431"
    taught_or_enforced: needed-enforcement
    skill_target: tdd-bdd
    overlap: "canonical §3 (\"Walking skeleton, honest fake\") — in tension: canonical rules the labelled fake legitimate because \"the red acceptance test holds the target fixed\", whereas here the fake made the acceptance test GREEN, which is exactly the condition canonical's justification assumes away. Reconciliation: the fake is legitimate only while something red still pulls."
    feasibility: ok
  - rule_id: d009-R3
    rule: Never write a test that asserts the absence of a specific wrong implementation; assert the presence of the correct behavior instead.
    because: Negative space is unbounded, the assertion cannot fail for the right reason, and it becomes a historical artifact the moment the wrong implementation is gone.
    because_source: user-verbatim
    quote: "as it is, it seems smelly to me"
    evidence: "day-009:L7266-L7267 → indictment at L7314-L7326 → deleted at L7410-L7431; the test itself at L2879-L2894"
    taught_or_enforced: needed-enforcement
    skill_target: tdd-bdd
    overlap: "canonical §2.3 (\"Never assert the absence of a problem. A test asserting output ≠ three hardcoded titles was deleted\") — this session is the verbatim provenance of that rule"
    feasibility: ok
  - rule_id: d009-R4
    rule: Write no defensive branch that the current acceptance criteria do not demand, and when you find one already written, delete it rather than adding a test to cover it.
    because: A branch nothing specified is unspecified behavior, and a test written afterwards can only ratify whatever the code already does.
    because_source: user-verbatim
    quote: "Let's first remove all of the defensively coded implementation that the current acceptance tests did not call for."
    evidence: "day-009:L6672-L6674; guards added unbidden at L3046-L3048 and L3086-L3088, deleted at L6885-L6929 and L6949-L6967"
    taught_or_enforced: needed-enforcement
    skill_target: tdd-bdd
    overlap: "both — CLAUDE.md <package_structure> (\"No Implementation Without Tests\", cited verbatim by the user at L4277-L4278) and canonical §2.4"
    feasibility: ok
  - rule_id: d009-R5
    rule: Never write a test in order to raise a coverage number; read an uncovered line as evidence that code exists which no requirement asked for, and remove the line.
    because: Retrofitting tests to reach 100% is Coverage-Driven Development — the metric goes green while the discipline it is supposed to measure has been inverted.
    because_source: user-verbatim
    quote: "we were fighting to retroactively add test coverage for somethig that should have not been in the implementation in the first place"
    evidence: "day-009:L6334-L6335; the retrofit runs L4189-L6301, peaking at \"🎉 100% COVERAGE ACHIEVED!\" (L6256); the author's verdict written into TODO.md at L6518"
    taught_or_enforced: needed-enforcement
    skill_target: tdd-bdd
    overlap: "canonical §2.4 (\"Coverage is a residue of good specs, never a target… one commit reached 100% by pointing the DB path at /dev/null\") — this session is that commit"
    feasibility: ok
  - rule_id: d009-R6
    rule: Before adding any None/NULL guard, query the real data source and report the counts; if the null case does not occur, delete the guard and narrow the type signature.
    because: The whole point of a defensive branch is a claim about reality, and reality was one SQL query away.
    because_source: user-verbatim
    quote: "it looks impossible, but check in the real db directly"
    evidence: "day-009:L5531 and L5564 → query at L5570-L5575 (\"Books with progress > 0: 221 / Books with progress > 0 but NULL ZLASTOPENDATE: 0\") → guard and `| None` removed at L5593-L5610"
    taught_or_enforced: taught-once
    skill_target: tdd-bdd
    overlap: "canonical §2.4 (\"not 'could this be NULL?' but 'is it NULL in the data I have?', answered by querying the real database\") — verbatim provenance"
    feasibility: ok
  - rule_id: d009-R7
    rule: Question every defensive fallback against the query that produced the data — if the SQL already excludes the case, the Python guard is dead code.
    because: "`WHERE ZREADINGPROGRESS > 0` cannot return a NULL row, so `or 0` guarded nothing and merely suggested to the reader that it could."
    because_source: user-verbatim
    quote: "why is the defensive \"or 0\" necessary when the SQL query says \"WHERE ZREADINGPROGRESS > 0\" -- have we seen this value be null?"
    evidence: "day-009:L4645 → removed at L4664"
    taught_or_enforced: taught-once
    skill_target: tdd-bdd
    overlap: "CLAUDE.md <anti-patterns> (\"Adding 'just in case' functionality\")"
    feasibility: ok
  - rule_id: d009-R8
    rule: Name specs for the behavior they pin, never for the mechanism they exercise; a name containing "attempts to", "database", "mock" or any implementation noun is a rewrite request.
    because: The describe/it sentence is the requirements document, and a mechanism name documents how the code happens to work today.
    because_source: user-verbatim
    quote: "that test name isn't BDD"
    evidence: "day-009:L5508 (rejecting `it_returns_min_datetime_for_none`) → `it_handles_missing_timestamp_gracefully` at L5522; the unfixed sibling `it_attempts_to_read_from_bklibrary_database` is judged \"misleading name\" at L7319"
    taught_or_enforced: repeated
    skill_target: tdd-bdd
    overlap: "canonical §2.1 (\"`describe_` names the feature or command, never a test category, mechanism, or directory\")"
    feasibility: ok
  - rule_id: d009-R9
    rule: If a spec needs to address a helper directly, make the helper public and rename it in the same edit; if the reason for the spec later evaporates, make it private again.
    because: A test reaching into a leading-underscore name declares the name public by fact while the code still claims it is not.
    because_source: user-verbatim
    quote: "it's fine we want to test it separately, but then it shouldn't be a private function anymore, so don;t forget to properly rename it"
    evidence: "day-009:L5426 → public at L5432-L5455; reverted to private at L5958 (\"w8, let's put a pin into that\") → L5965-L5987"
    taught_or_enforced: taught-once
    skill_target: tdd-bdd
    overlap: none
    feasibility: ok
  - rule_id: d009-R10
    rule: Choose the test seam before writing the assertion — `monkeypatch` mutates the current interpreter only, so it cannot influence anything you launch with `subprocess.run`.
    because: A patch that cannot reach the code under test produces a red test that proves nothing, and the agent read exactly that red as a legitimate RED phase.
    because_source: agent-synthesis
    evidence: "day-009:L6566-L6584 (monkeypatch + subprocess in one acceptance test) → L6606 (\"The test is failing as expected (RED phase). The issue is that the monkeypatch isn't working for the subprocess call\") → test removed at L7036-L7060"
    taught_or_enforced: taught-once
    skill_target: tdd-bdd
    overlap: "canonical §2.7 (\"The patch target is part of the specification… getting it wrong makes the spec unrunnable rather than merely weak\")"
    feasibility: ok
  - rule_id: d009-R11
    rule: Reuse the module's existing seam for a new data source — declare the resolved artifact as a module constant with the same shape as the one already there, so specs substitute it the same way.
    because: A second data source that invents its own discovery function forces a second, unlike mocking technique in the specs.
    because_source: user-verbatim
    quote: "Why not follow the exact same pattern: BKLIBRARY_DB_FILE = Path("
    evidence: "day-009:L5037-L5038 and L5191-L5192 → `_find_bklibrary_database()` deleted and `BKLIBRARY_DB_FILE` introduced at L5263-L5325"
    taught_or_enforced: repeated
    skill_target: tdd-bdd
    overlap: "canonical §2.2 (\"Fixtures enter through the front door\") — in tension: this session's module-constant seam is the one canonical later replaces with the `--user` front door, precisely because module-level resolution is unpatchable across a process boundary (this session discovers that at L6043-L6061)"
    feasibility: "needs-rework: the constant is resolved at import time, so it is only substitutable in-process; state the limitation whenever recommending this pattern"
  - rule_id: d009-R12
    rule: Run the whole pre-commit checklist explicitly before committing — formatter, linter, type check, full suite AND `pytest --cov` — and show the output of each, not a claim that you ran it.
    because: Coverage was silently skipped twice and had to be demanded by name both times.
    because_source: user-verbatim
    quote: "I haven't seen you running coverage... did you?"
    evidence: "day-009:L7453 (\"you forgot to perform some steps from the pre-commit tdd_discipline\") → L7457-L7462 (ruff, mypy) → L7470 → L7474-L7478"
    taught_or_enforced: needed-enforcement
    skill_target: tdd-bdd
    overlap: "CLAUDE.md <tdd_discipline> \"Before committing, verify\" items 3 and 4"
    feasibility: ok
  - rule_id: d009-R13
    rule: One `it_` asserts one behavior; if a single test checks existence, cardinality, shape and type, split it before writing the implementation.
    because: A bundled test cannot tell you which behavior broke, and it lets an implementation satisfy four claims by accident.
    because_source: user-verbatim
    quote: "I think this combines several independent things into same test and that we should go with more minimal step..."
    evidence: "day-009:L945; the offending test at L874-L883 (len>0 + three key checks + isinstance in one `it_`)"
    taught_or_enforced: taught-once
    skill_target: tdd-bdd
    overlap: "canonical §2.3 (assertion calibration per test kind)"
    feasibility: ok
  - rule_id: d009-R14
    rule: When a design question has no answer yet, leave a TODO/FIXME naming the open question rather than a comment restating the code or a guessed fix.
    because: The unresolved item then stays visible and tracked instead of being either forgotten or prematurely closed.
    because_source: user-verbatim
    quote: "in such cases a FIXME/TODO comment might help us keep track of an unfinished issue"
    evidence: "day-009:L4438-L4439 → `# TODO: Path not in BKLibrary DB - need Books.plist correlation` at L4809 and `# TODO: Handle specific errors` at L4505"
    taught_or_enforced: taught-once
    skill_target: claude-md
    overlap: "CLAUDE.md <code_style> (\"NEVER add redundant comments that restate what the code already expresses\") — this sharpens it: the test is whether the comment carries information the code cannot"
    feasibility: ok
  - rule_id: d009-R15
    rule: Never cite the project's own documentation as the justification for a line of code; explain what the code does or delete the comment.
    because: Docs are a record of an earlier exploration, not an authority, and "from docs" tells the reader nothing checkable.
    because_source: user-verbatim
    quote: "It might as well say query from God. Our docs are not a revelations from higher powers -- it's just where we stored our learning from exploratory phase."
    evidence: "day-009:L4440-L4441 → `# Query from docs/apple_books.md` deleted at L4493"
    taught_or_enforced: taught-once
    skill_target: claude-md
    overlap: "CLAUDE.md <code_style> Documentation"
    feasibility: ok
  - rule_id: d009-R16
    rule: Never stage with `git add -A` or `git add .`; name every path, and read back the commit's file list and insertion count before moving on.
    because: One `git add -A` swept a 257 KB session transcript out of the protected diary directory into a feature commit — "6 files changed, 8843 insertions(+)" for a change that touched three files — and undoing it cost a separate session and an interactive rebase.
    because_source: agent-synthesis
    evidence: "day-009:L1480 (`git add -A`) → L1528-L1529 → discovered at L8921 → rebased out at L9255-L9286; the same footgun recurs at L3219, L4748, L4815, L8876"
    taught_or_enforced: needed-enforcement
    skill_target: claude-md
    overlap: "both — CLAUDE.md <git_workflow> (\"Never use `git add .` - always stage files explicitly by name\") and <file_operations> (\"Never access `claude-dev-log-diary/` … without first asking for explicit user permission\"); this incident is part of that rule's provenance"
    feasibility: ok
  - rule_id: d009-R17
    rule: A commit message may claim only what the diff does; if it names a capability ("handles errors gracefully"), point at the code that delivers it or drop the phrase.
    because: Two `return []` statements are error swallowing, not graceful handling, and the log would have recorded a capability the product does not have.
    because_source: user-verbatim
    quote: "I think we should also rewrite the last commit message -- i think \"Handle database errors gracefully (missing DB, locks, etc.)\" isn't quite right, or?"
    evidence: "day-009:L3478-L3479 → agent's own concession \"This is more like 'swallow errors silently' than 'handle gracefully'!\" (L3519) → amended at L3552-L3556"
    taught_or_enforced: needed-enforcement
    skill_target: claude-md
    overlap: "both — CLAUDE.md <git_workflow> (\"Commit messages should be descriptive and explain the 'why'\") and canonical §2.6 (\"Commit labels must tell the truth\")"
    feasibility: ok
  - rule_id: d009-R18
    rule: Write project documents in plain markdown with word markers such as [COMPLETED]; no emoji status decoration in TODO.md, docs/ or commit bodies.
    because: Emojis are unsearchable, unmaintainable and set a precedent the whole repo then inherits.
