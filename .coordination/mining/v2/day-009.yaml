  - rule_id: d009-R20
    rule: Reading progress lives in the BKLibrary SQLite database, not in Books.plist — query `ZBKLIBRARYASSET` for `ZTITLE, ZAUTHOR, ZREADINGPROGRESS, ZLASTOPENDATE` with `WHERE ZREADINGPROGRESS > 0 ORDER BY ZLASTOPENDATE DESC`.
    because: Books.plist carries `BKPercentComplete` only for finished books — 22 of 179 entries, every one of them exactly 1.0.
    because_source: agent-synthesis
    evidence: "day-009:L231-L255 (fixture census), query implemented at L3057-L3064, corrected to multiply in Python at L4625-L4634; DB path `~/Library/Containers/com.apple.iBooksX/Data/Documents/BKLibrary/BKLibrary-*.sqlite` at L5269-L5274"
    taught_or_enforced: taught-once
    skill_target: project-memory
    overlap: none
    feasibility: ok
  - rule_id: d009-R21
    rule: "`ZLASTOPENDATE` is never NULL for rows with `ZREADINGPROGRESS > 0` — verified 221 rows, 0 nulls; do not guard for it."
    because: The guard and the `float | None` signature were speculation, and checking took one query.
    because_source: agent-synthesis
    evidence: "day-009:L5570-L5575 (\"Books with progress > 0: 221 / Books with progress > 0 but NULL ZLASTOPENDATE: 0\")"
    taught_or_enforced: taught-once
    skill_target: project-memory
    overlap: "canonical §2.4 (evidence-based defensiveness) — this is the measurement behind it"
    feasibility: ok
  - rule_id: d009-R22
    rule: Apple Core Data timestamps are seconds from 2001-01-01 UTC, not the Unix epoch; convert with `datetime.datetime(2001, 1, 1, tzinfo=datetime.UTC) + timedelta(seconds=t)`.
    because: Every date read out of an Apple Books database is otherwise 31 years wrong.
    because_source: agent-synthesis
    evidence: "day-009:L3636-L3645 (`_apple_timestamp_to_datetime`)"
