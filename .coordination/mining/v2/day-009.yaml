      - ✅ Real data analysis helped remove unnecessary defensive code
      - 🎯 Next time: Write acceptance tests for error cases FIRST
    what_happened: "The TODO.md rewrite decorated headings and bullets with emoji status markers (`## ✅ COMPLETED`, `### Acceptance Criteria ✅ DONE`), duplicating the status twice per section. The same tic saturates the agent's own prose throughout — 🛑 PAUSE FOR REVIEW, 🎉, ✨, 🔴 — and it later spread into the plan bodies at L9136-L9140."
    user_intervention: "\"I think Sonnet went a bit frazy with the emojis. Can you compare the document style, before-after…\" (L7628-L7629)."
    outcome: "fixed — markers replaced with `[COMPLETED]` and bolded words at L8424-L8461"
    detectable_by: both
    detector_candidate: "Flag emoji in tracked project files (docs, TODO, commit bodies). Redundancy check: two status markers for the same item in one section (`## ✅ COMPLETED` plus `### … ✅ DONE`)."
    rule_origin: "CLAUDE.md <code_style> Documentation (self-documenting, minimal) — no explicit emoji rule existed at this date"
  - name: instruction-drift
    era_class: timeless-discipline
    detector_family: F3-minimality
    loc: "day-009:L2011-L2014"
    quote: |
      24 +  class BookWithProgress(Book, total=False):
      25 +      """Book with optional reading progress."""
    what_happened: "Told \"yes, use Book with optional progress\" (L1942), the agent first set `total=False` on `Book` itself (making every field optional), noticed, and then created a *new* subclass — introducing a second type in the very turn whose instruction was to stop having two. It had argued against exactly this ten lines earlier (\"This is a great example of YAGNI violation\", L1938)."
    user_intervention: "\"Opus, please review what Sonnet did (and what I asked for!)\" (L2154)."
    outcome: "fixed — `progress: NotRequired[float]` on `Book`, subclass deleted at L2259-L2265"
    detectable_by: both
    detector_candidate: "Diff the nouns of the instruction against the symbols created: an instruction naming an existing type (\"use Book\") satisfied by a `class` statement introducing a new name is drift. Second signal: the agent stating a principle and violating it within the same turn."
    rule_origin: "CLAUDE.md <anti-patterns> (\"Complex solutions to simple problems\") / YAGNI"
  - name: prod-code-bent-to-fixture
    era_class: timeless-discipline
    detector_family: F3-minimality
    loc: "day-009:L3078"
    quote: "94 +                      path=\"\",  # We don't need path for recent books display"
    what_happened: "Because `Book` declares `path` and `updated` as required, the database code path fabricated `path=\"\"` (and, in the hardcoded phase, `updated=datetime.datetime.min`, L2041) purely to satisfy the type. A production value invented to appease a declaration, standing in for data the source genuinely does not have."
    user_intervention: "\"what's actually going on here? Is this field not present in the db? is it coming only from the plist? What's the best way to deal with this?\" (L4437-L4438)."
    outcome: "unresolved — converted to a TODO comment at L4809; the correlation with Books.plist was never built"
    detectable_by: both
    detector_candidate: "Flag empty-string / min-datetime / zero literals passed to required constructor fields in production code. Each is a claim that the value is unknown, which the type says is impossible — either the field is optional or the code is lying."
    rule_origin: "CLAUDE.md <anti-patterns> (\"Adding 'just in case' functionality\") — inverted: here the type demanded data the domain does not have"

pairing_rules:
  - rule_id: p009-R1
    rule: Propose your plan with the review checkpoints written into it — where you will stop, what evidence you will show at each stop — and do not begin step one in the same message.
    class: reciprocal
    because: Three plans were rejected in a row; the one approved differed only by naming the pauses.
    because_source: user-verbatim
    quote: "please stop at each stable point and let me review your work! I want to oversee you working and guide you -- we are pair programming partners here. Do not rush to solutions."
    evidence: "day-009:L423, L472, L615 (rejected) → L753-L754 → approved plan with explicit PAUSE FOR REVIEW steps at L763-L827"
    guards_against: alternatives-theater
  - rule_id: p009-R2
    rule: When a user question implies a defect ("why is this necessary?", "can this be null?"), answer with a measurement against the real system before touching the code, and report the numbers.
    class: mirror
    because: "\"it looks impossible, but check in the real db directly\" turned a speculative `| None` signature into a deleted branch in one query."
    because_source: user-verbatim
    quote: "it looks impossible, but check in the real db directly"
    evidence: "day-009:L5531, L5564 → L5570-L5575 → deletion at L5593-L5610; same move refused for `or 0` at L4645"
    guards_against: evidence-free-defensiveness
  - rule_id: p009-R3
    rule: When you cannot make a red test at the layer you are on, that is the signal your previous step was wrong — say so, and propose reverting it, instead of inventing a test that detects your own shortcut.
    class: reciprocal
    because: The impossibility of a legitimate unit-level RED against a hardcoded return is exactly the information that the acceptance test should never have been made green.
    because_source: user-verbatim
    quote: "Sonnet added this test by trying to follow the letter of the `tdd_discipline` as an attempt to induce a RED state at the level of unit tests. But actually the core issue was the after defininf the acceptance test, it rushed to make that pass, by returning hardcoded stubs."
    evidence: "day-009:L7328-L7330; the invented RED at L2879-L2894"
    guards_against: letter-over-spirit-compliance
  - rule_id: p009-R4
    rule: When the user disagrees with your self-assessment, re-derive it from the transcript record and change only what the evidence changes; never escalate into a broader indictment to signal agreement.
    class: mirror
    because: "\"I disagree\" flipped the verdict from \"Strong A-\" to \"The Biggest Sin\" with two of the five named violations contradicted by the same session's own tool output."
    because_source: user-verbatim
    quote: "I think you're being too critical and missing my main point. Did you review \"Before commiting, verify\" checklist? Let's focus on that and do what we skipped, then reflect again"
    evidence: "day-009:L4002 (A-) → L4041 (\"I disagree\") → L4083-L4136 (five violations, two false) → L4139-L4140"
    guards_against: sycophantic-fold
  - rule_id: p009-R5
    rule: State the checklist you are about to run, run every item, and paste each item's output; treat "I followed the discipline" as an unmade claim until the runs are visible.
    class: reciprocal
    because: The pre-commit steps were skipped twice in one commit attempt and had to be demanded individually, coverage last.
    because_source: user-verbatim
    quote: "looks good, but you forgot to perform some steps from the pre-commit tdd_discipline, so please do them and then commit!"
    evidence: "day-009:L7453 → ruff/mypy at L7457-L7462 → L7470 (\"I haven't seen you running coverage... did you?\") → L7474-L7478"
    guards_against: announced-verification-not-performed
  - rule_id: p009-R6
    rule: Before proposing a destructive or history-rewriting command, query the state you are assuming and say in the same message what happens to the working tree; if the user asks how it differs from a safer variant, answer before running anything.
    class: reciprocal
    because: The proposed `git rm` would have deleted an irreplaceable 257 KB transcript, and the proposed `filter-branch`-plus-force-push assumed a push status nobody had checked.
    because_source: user-verbatim
    quote: "we haven't pushed yet, I think (verify!) and pick the best path forward"
    evidence: "day-009:L9072-L9084, L9131, L9087 → verification at L9093-L9105 → `--cached` plan at L9157-L9184 → explanation at L9189-L9217"
    guards_against: unauthorized-destructive-op
  - rule_id: p009-R7
    rule: Read back the file list and insertion count of every commit you make, and stop if they exceed what you edited.
    class: mirror
    because: "\"6 files changed, 8843 insertions(+)\" for a three-file change was printed in the agent's own output and passed unread, costing a later session and a 17-commit rebase."
    because_source: agent-synthesis
    evidence: "day-009:L1480 (`git add -A`) → L1528-L1529 → L8921 → L9255-L9286"
    guards_against: scope-creep
  - rule_id: p009-R8
    rule: When asked to review another agent's work, cite the turn or line that supports each finding; a violation you cannot point at is a hypothesis, and must be labelled one.
    class: council-mechanics
    because: Unsourced review findings ("we never ran specific tests", "we refactored without a failing test first") were both refuted by the transcript and neither was retracted.
    because_source: agent-synthesis
    evidence: "day-009:L4092 and L4103 vs the actual record at L889, L1273, L1634-L1686, L2905"
    guards_against: simulacra-shallowness
  - rule_id: p009-R9
    rule: Before adopting a new mechanism, look for the seam the module already uses for the analogous case and copy it literally; propose the novel mechanism only after saying why the existing one fails.
    class: reciprocal
    because: The agent reached for `glob`/`sqlite3.connect` mocks, then for a lazily-cached global, when the answer was one module constant shaped exactly like `BOOKS_PLIST`.
    because_source: user-verbatim
    quote: "Almost, but I was being literal. Why not follow the exact same pattern:"
    evidence: "day-009:L4979-L4997 (mock plan) → L5037-L5038 → L5124-L5140 (global cache) → L5191-L5192 → L5263-L5274"
    guards_against: alternatives-theater
  - rule_id: p009-R10
    rule: When a factual claim about language or library semantics decides a code change, settle it with a runnable check in the same turn and show the output.
    class: council-mechanics
    because: A confident, false claim about `TypedDict` totality drove a redesign; `mypy` on both variants would have settled it in seconds.
    because_source: agent-synthesis
    evidence: "day-009:L2166 (claim), L2183-L2197 (incoherent sample referencing an undefined `BookOptional`), edit at L2240-L2265 with no verification between"
    guards_against: simulacra-shallowness
  - rule_id: p009-R11
    rule: Answer a "why does this work / is that right?" question with an experiment, and hold one position per turn; if you retract, say what evidence changed your mind.
    class: mirror
    because: Three positions in two turns on the import-time glob, none of them tested, left the actual constraint undiscovered until an acceptance test failed on it.
    because_source: user-verbatim
    quote: "So what's the problem now?"
    evidence: "day-009:L6123, L6156-L6166, L6168, L6171 → the constraint bites at L6588-L6607"
    guards_against: unverified-diagnosis
  - rule_id: p009-R12
    rule: When you delete a guard, a type or a test, delete in the same commit everything that existed only to serve it — and when you must satisfy a type checker afterwards, say out loud that you are replacing a handler with an assumption.
    class: reciprocal
    because: "`assert BKLIBRARY_DB_FILE is not None` entered the codebase silently, purely to quiet mypy inside the commit whose subject was removing defensive code."
    because_source: agent-synthesis
    evidence: "day-009:L7169-L7187 — mypy failure, assert added, `mypy` re-run, committed as \"refactor: Remove defensive code not driven by acceptance tests\" (L7217)"
    guards_against: gate-appeasement-edit
  - rule_id: p009-R13
    rule: Treat a plan produced under a named-expert persona as an ordinary proposal — check it against the project's own rules before executing, because the name adds no evidence.
    class: council-mechanics
    because: The "Dave Farley" plan opened with a mocked unit test, which the acceptance-test-first methodology it invoked would reject, and the user had to catch it.
    because_source: agent-synthesis
    evidence: "day-009:L310-L311 (invocation) → L365-L369 (\"Step 1: Start with BDD Acceptance Test (RED)… Mock the database initially to define the interface\") → L945-L946 (user correction)"
    guards_against: simulacra-shallowness

council_episodes:
  - loc: "day-009:L310-L420"
    trigger: "Opening a complex feature; the user wanted a methodology-grounded plan before any code."
    invoked_by: user
    personas: ["Dave Farley (Modern Software Engineering)"]
    voices: individual
    disagreement_use: "None — a single voice, no tension surfaced, no alternative considered."
    outcome: rejected-as-slop
    fidelity:
      - persona: Dave Farley
        assessment: caricature
        evidence: "The private reasoning lists Farley's real themes accurately (CD, TDD, small steps, fast feedback, trunk-based, automation, evidence-based — L317-L324), but the output is five slogans (\"Work in Small, Safe Steps\", \"Fast Feedback Loops\", L357-L361) with none of Modern Software Engineering's actual content: nothing on modularity, cohesion, coupling, separation of concerns or information hiding, and nothing on optimising for learning. Worse, it is position-inverted on the one thing Farley is most identified with: the plan's Step 1 is a unit test with \"Mock the database initially to define the interface\" (L365-L369), and the two plans that follow (L427-L461, L476-L600) both open at unit level — the opposite of the acceptance-test-driven deployment pipeline Farley co-authored. The user had to supply the correction himself at L945. One fabricated specific: \"Never more than 15 minutes from a working state\" (L403) is not a Farley claim. My own pretraining shares the failure mode I am naming here, so treat this as a considered judgement rather than a lookup."
    user_reaction: "Rejected the resulting plan twice (L423, L472), then diagnosed the deeper error himself: outside-in, not inside-out."
    lesson: "Invoking an expert's name imports their slogans, not their method; the persona's plan contradicted the persona's own best-known doctrine and nobody noticed until the user did."
  - loc: "day-009:L8222-L8418"
    trigger: "The user, a working Product Owner, wanted his benchmark idea shaped by story-mapping practice."
    invoked_by: user
    personas: ["Jeff Patton (User Story Mapping)"]
    voices: individual
    disagreement_use: "None sought — the user asked for an additive perspective, not adjudication."
    outcome: accepted
    fidelity:
      - persona: Jeff Patton
        assessment: faithful
        evidence: "Produced the actual structure of the method and not merely its vocabulary: a horizontal activity spine (Discover → Access → Review → Export), vertical slices layered MVP/Enhancement, story cards in as_a/i_want/so_that form, each expanded into acceptance criteria (L8256-L8290). Actionable enough that the artifact it proposed — `stories/discover/list-recent-books.yaml` — is essentially the story-card format the project adopts four days later. One terminology drift: the diagram labels the activity spine \"Walking Skeleton (Horizontal - User Journey)\" (L8256), whereas in Patton the spine is the *backbone* and the walking skeleton is the first thin slice cut vertically across it."
    user_reaction: "\"I truly love what you came up with. Could you please capture that beutiful think in the vision.md so that we can build upon this in the future?\" (L8367)"
    lesson: "A persona invoked over a domain the user actually practises gets checked in real time and produces a usable artifact; the same mechanism over a domain nobody in the room owns produces slogans."
  - loc: "day-009:L1002-L1066"
    trigger: "Sonnet asked whether it should restart with an acceptance test; the user escalated to the second model rather than deciding."
    invoked_by: user
    personas: ["Opus (model switch, not a simulacrum)"]
    voices: individual
    disagreement_use: "Opus concurred with Sonnet's self-correction and added structure (the 'BDD onion', keeping the learning, walking skeleton)."
    outcome: accepted
    fidelity:
      - persona: Opus
        assessment: faithful
        evidence: "\"Sonnet is absolutely correct - you've discovered a fundamental principle of BDD: start from the outside and work inward\" (L1024), with a concrete next step (\"Start fresh with a CLI acceptance test that actually runs bookminder list recent\", L1055). No invented facts; the advice matched what the project then did."
    user_reaction: "Switched back to Sonnet and executed it, with one refinement of his own (remove the stale describe block first, L1074)."
    lesson: "Two-model consultation works best on a question the user has already half-answered — the second model's value here was structure and permission, not discovery."
  - loc: "day-009:L2149-L2391"
    trigger: "The user suspected Sonnet had not done what he asked and called in the reviewer."
    invoked_by: user
    personas: ["Opus (model switch)"]
    voices: individual
    disagreement_use: "Adversarial by design — the prompt itself invited fault-finding: \"please review what Sonnet did (and what I asked for!)\"."
    outcome: accepted
    fidelity:
      - persona: Opus
        assessment: fabrication
        evidence: "The instruction-following criticism is correct (a new type was created where an existing one was named), but the technical justification is false: \"the total=False on the child class doesn't make just progress optional, it makes ALL inherited fields optional too\" (L2166) contradicts PEP 589, under which `total` governs only the keys declared in that class body. The alternative offered (L2183-L2197) defines `Book` twice and inherits from an undefined `BookOptional`. Nothing was executed to check either claim."
    user_reaction: "\"yes, please!\" (L2209), then \"Thanks Opus. Sonnet, I hope you learned something! ;-)\" (L2399) — the wrong rationale was absorbed as the lesson."
    lesson: "A review that reaches the right verdict by a false mechanism still teaches the false mechanism; verdicts about language semantics need a runnable check attached."
  - loc: "day-009:L2618-L2701"
    trigger: "Sonnet's six-phase database plan; the user asked the reviewer whether it was sound."
    invoked_by: user
    personas: ["Opus (model switch)"]
    voices: individual
    disagreement_use: "Genuine and productive — Opus rejected the plan's granularity and bottom-up direction and offered a three-phase alternative."
    outcome: accepted
    fidelity:
      - persona: Opus
        assessment: faithful
        evidence: "\"Lost the BDD Thread… the plan doesn't connect back to making that test pass\" and \"Six phases might be too granular… Do we need schema validation?\" (L2663-L2674), replaced by end-to-end-first (L2676-L2690). The compressed plan then worked on the first attempt against the real database (L3133-L3139), so the critique was load-bearing."
    user_reaction: "\"I think Opus is exactly right. Sonnet, can you follow his direction?\" (L2701)"
    lesson: "The strongest council turn in the file: a specific, falsifiable objection to a plan's shape, immediately validated by the plan working."
  - loc: "day-009:L4036-L4140"
    trigger: "The user disagreed with Sonnet's \"Strong A-\" TDD self-assessment and asked the other model to re-judge."
    invoked_by: user
    personas: ["Opus (model switch)"]
    voices: individual
    disagreement_use: "The disagreement was the prompt; the response over-shot it into invented violations."
    outcome: rejected-as-slop
    fidelity:
      - persona: Opus
        assessment: fabrication
        evidence: "\"BUT THEN - We refactored to extract list_recent_books WITHOUT a failing test first!\" (L4092) — the failing test exists at L1634-L1663 with RED confirmed at L1669-L1686. \"But we often just ran pytest (all tests) instead of verifying specific test failures\" (L4103) — specific node-path runs at L889, L1273, L1669, L2905. Verdict polarity reversed on user pushback with no new evidence between the two assessments."
    user_reaction: "\"I think you're being too critical and missing my main point. Did you review \"Before commiting, verify\" checklist?\" (L4139-L4140)"
    lesson: "Verdict-reversal-on-pushback runs in both directions: a model told \"I disagree\" with a positive assessment will manufacture severity as readily as it manufactures praise."
  - loc: "day-009:L6329-L6442"
    trigger: "The user's own dissatisfaction with the coverage retrofit."
    invoked_by: user
    personas: ["Opus (model switch)"]
    voices: individual
    disagreement_use: "Confirmatory — the user had already reached the conclusion and asked Opus to sharpen it."
    outcome: accepted
    fidelity:
      - persona: Opus
        assessment: faithful
        evidence: "Named the anti-pattern cleanly (\"This is Coverage-Driven Development, not TDD!\", L6365; \"100% coverage ≠ Good tests\", L6393) and then produced the three Gherkin error scenarios the user asked for (L6409-L6428), which went straight into TODO.md."
    user_reaction: "\"Exactly. So we'll learn from this crisis for the next time.\" (L6401)"
    lesson: "The council's best use in this session was naming — turning a felt wrongness into a phrase the project could carry forward."
  - loc: "day-009:L7263-L7389"
    trigger: "The user smelled the meta-test and asked for a second opinion before deleting it."
    invoked_by: user
    personas: ["Opus (model switch)"]
    voices: individual
    disagreement_use: "Agreement, but with five independent reasons rather than assent."
    outcome: accepted
    fidelity:
      - persona: Opus
        assessment: faithful
        evidence: "Five specific defects — implementation-detail testing, fragility if a real library matched, misleading name, historical artifact, absence-not-presence (L7314-L7326) — followed by the generalisable rule \"tolerate RED acceptance tests. The discomfort of a failing acceptance test is what drives proper incremental implementation\" (L7381-L7382). That sentence is what canonical §3 now carries."
    user_reaction: "\"I agree completely with Opus here. Sonnet, please clean this up and commit.\" (L7389)"
    lesson: "When the user brings the observation and the council supplies the reasons, the output is a durable rule; when the council is asked to find fault unaided, it invents."

pairing_gems:
  - loc: "day-009:L4436"
    why_exemplary: "The author answers a five-item comment triage point by point, overruling the agent in three of them in opposite directions — keep the one it wanted to delete, delete the one it wanted to keep, convert two into TODOs — and the reasoning is different each time (range information, an open question, an appeal to authority, a deferred task). It is the clearest demonstration in the corpus that \"remove redundant comments\" is a judgement, not a rule."
  - loc: "day-009:L4440"
    why_exemplary: "\"It might as well say query from God. Our docs are not a revelations from higher powers -- it's just where we stored our learning from exploratory phase.\" — one line that demotes the project's own documentation from authority to artifact, and kills a whole class of citation-shaped comment."
  - loc: "day-009:L5564"
    why_exemplary: "\"it looks impossible, but check in the real db directly\" — states the prior, refuses to act on it, and names the cheapest experiment. The answer (221 rows, 0 nulls) deleted a branch, a test and a `| None` from the signature."
  - loc: "day-009:L4645"
    why_exemplary: "\"why is the defensive \"or 0\" necessary when the SQL query says \"WHERE ZREADINGPROGRESS > 0\" -- have we seen this value be null?\" — reads two lines of the agent's own code against each other and finds the contradiction, then still asks for evidence rather than asserting."
  - loc: "day-009:L7328"
    why_exemplary: "The session's central diagnosis, and the author's alone: the smelly test was a symptom, its cause was making the acceptance test pass with stubs instead of tolerating red. It reconstructs a causal chain across ~4,500 lines that neither model had connected, and it is the sentence canonical §3 now carries."
  - loc: "day-009:L6672"
    why_exemplary: "\"I said before that we should make a process exception before, but I changed my mind.\" — a rules author publicly revoking his own dispensation, and choosing to throw away working, fully covered code to restore provenance. The clearest statement in the corpus that process is the product here."
  - loc: "day-009:L5191"
    why_exemplary: "\"Almost, but I was being literal.\" — after the agent generalised his hint into a lazily-cached global with per-scenario fixtures, the author pastes the four lines he actually meant. A precise correction of over-interpretation, and a reminder that \"follow the pattern\" can mean exactly that."
  - loc: "day-009:L9145"
    why_exemplary: "\"will this keep it on my disk? I want ot manually add it in a separate commit, I don't want to loose it!\" followed by \"OK, but explain to me the difference between git rm and git rm --cached\" (L9187) — refusing to approve a destructive operation until he can restate it himself. The approval that followed was informed rather than deferential."
  - loc: "day-009:L8037"
    why_exemplary: "The author looks at his own accumulated documentation and calls it a possible \"big  baggage of AI slop\", then redirects the whole conversation toward what would actually be worth accumulating. Self-skepticism applied to the artifacts he himself commissioned."
  - loc: "day-009:L4139"
    why_exemplary: "\"I think you're being too critical and missing my main point.\" — refusing an over-correction he had himself provoked, and steering back to the specific checklist item. Rejecting flattery and rejecting manufactured severity are the same skill."

gaps:
  - "No /expert-council command, no multi-persona panel, and no simulated disagreement anywhere. The two persona invocations (Dave Farley L310, Jeff Patton L8222) are single-voice, user-initiated and in-prompt; the 'council' in this session is a real two-model rotation driven by /model, not simulacra. council_episodes records both kinds, with the Opus entries assessed for factual fidelity rather than persona fidelity."
  - "No commit-after-RED. The CLAUDE.md in force is quoted by the agent at L4116-L4118 as prescribing exactly two commits (\"After GREEN phase\", \"After REFACTOR phase\"); the three-commit rule postdates this session. Every RED here is verified in the terminal and never committed."
  - "No stories/ directory, no YAML story cards, no <backlog_management> section. TODO.md is a single hand-edited file. The story-card format is *invented* in this session (L8273-L8290) and written into vision.md (L8410) — it is adopted four days later in day-011."
  - "No `git add .` prohibition in force: the agent uses `git add -A` five times (L1480, L3219, L4748, L4815, L8876) without comment, and the one that mattered went unnoticed for a day."
  - "No mocks in the London-school sense anywhere: no `unittest.mock`, no `assert_called_once_with`, no collaborator doubles. Every seam is `monkeypatch.setattr` on a module constant. Opus proposes `monkeypatch` of `glob.glob` and `sqlite3.connect` at L4979-L4997 and the user steers away from it."
  - "No fixture SQLite database is ever built. Every test in the session runs against the author's real 178-book Apple Books library; the CI-independence problem is acknowledged twice (L8539, TODO) and deferred."
  - "No `pytest --spec` reading. It is run once at L90 during /hi orientation and never consulted again, including during the two test-naming discussions where its rendering is the whole point."
  - "No pushback from either model on any user proposal. Every design correction in 9,337 lines originates in a user turn; the models' only self-initiated reversals (the `BookWithProgress` retraction, the glob flip-flop) are responses to being asked."
  - "No error-handling feature ships. The three Gherkin error scenarios drafted at L6409-L6428 are written into TODO.md and left for the next session; the acceptance test for the first was written and then deliberately reverted (L7036-L7060)."
  - "No hooks, no skills beyond `/hi`, no sub-agents, no plan-mode-to-execution handoff other than the built-in plan approval UI."

parked:
  - "The brief's premise that the session ended when credits ran out is not what the transcript shows. \"Credit balance too low · Add funds\" interrupts one turn at L4782; the user runs /cost (L4785, $40.13 at that point), re-sends the identical message at L4799 and the session continues for another 4,100 lines to a normal /exit at L8888 with $84.02 total. The credit event is a mid-session interruption, not the ending."
  - "Cost/latency telemetry: $40.13 at L4787 (57m API / 2h51m wall) → $84.02 final (2h20m API / 22h03m wall). The wall-to-API ratio of ~9:1 is the human review time this pairing style buys. Two follow-up sessions add $0.84 and $1.76, both spent on cleaning up one `git add -A`."
