philosophy:
  - statement: The product is a vehicle; the real object of study is whether an AI coding agent can hold a strict ATDD process as a pair programmer. Process artifacts are therefore not cruft — they are the deliverable.
    source: user-verbatim
    quote: "The factual description is accurate, though I'd argue that the original and current vision were always clear that the BookMinder project itself is a vehicle for evaluating the use of AI coding agents in a role of pair programmer following a strict ATDD process, wouldn't you agree?"
    loc: "day-018:L5021"
    feeds: skill-why
  - statement: Every rule in CLAUDE.md was written in response to an observed process failure — but the rules are untested hypotheses, possibly bloated to the point of being counterproductive, and some are trauma responses to a model that no longer exists.
    source: user-verbatim
    quote: "Most of these were added to these files in response to actual process failures. But I have not yet developed a solid way to benchmark their effectiveness. Maybe they don't work or have bloated to the point off being counterproductive? I don't really know."
    loc: "day-018:L5048"
    feeds: judge-anchor
  - statement: Deleting documentation is not destroying it — git history is the archive. Deletion is about clearing the current thinking space so only what serves the present vision is in front of you.
    source: user-verbatim
    quote: "(for the record, everything will stay in the git history anyway, so this is about cleaning current thinking space to keep just what's relevant for new vision)"
    loc: "day-018:L5059"
    feeds: skill-why
  - statement: Test fixtures must be copies of observed reality, never data edited into the shape the test wants. Hand-editing a fixture row destroys the one property that makes a collaborator test worth running — that your beliefs about the collaborator can be proved wrong.
    source: user-verbatim
    quote: "Also, I just noticed you have manually manipulated the record in DB to fit your test. Let's not -- I want only copies of real books, so that we are sure twe don't accidentally introduce some data inconsistency."
    loc: "day-018:L2216"
    feeds: judge-anchor
  - statement: Refactoring means simplifying what exists. Restructuring to accommodate features that do not yet exist is not refactoring; it is speculation wearing the refactor label.
    source: user-verbatim
    quote: "Nah, this doesn't simplify the current implemenation, you are doing preparatory work for future features. Is that what our process calls for at this point?"
    loc: "day-018:L1167"
    feeds: judge-anchor
  - statement: An assertion should constrain the behavior and nothing else. Prefer the looser assertion that names the property (non-empty output, no cloud indicator) over the tighter one that hardcodes incidental fixture content.
    source: user-verbatim
    quote: "good, but negative example can be tested by the absence of cloud, without tying us to any specific book, right? Looser here is better?"
    loc: "day-018:L585"
    feeds: skill-why
  - statement: The order of stories in TODO.md is itself a design artifact — the chosen best path through the user story map — not an arbitrary list to pick from.
    source: user-verbatim
    quote: "what does the order in TODO suggest? We made it as a best path through out user story map, remember?"
    loc: "day-018:L1112"
    feeds: skill-why
  - statement: Knowledge discovered during a session is perishable; it must be written down before context runs out, because the recovery mechanism (compaction) cannot be relied on.
    source: user-verbatim
    quote: "Let'd think hard about what we learned and how to document it. Then we shold make some sense for it in next session, because we're running out of context and the compact was failing us."
    loc: "day-018:L2552"
    feeds: skill-why
  - statement: A guardrail hook's job is to remind the agent of instructions already in its own context, not to re-explain them; and it must carry an escape hatch modelled on a mechanism the agent already understands (git's hook override).
    source: user-verbatim
    quote: "We are using the Hook to remind you of parts of your system prompt anyway, so we don't have to bother with additional explanations for reasons, which are already in your context, right?"
    loc: "day-018:L3167"
    feeds: skill-why
  - statement: A second model's report is evidence to be checked, not a verdict to adopt. Read it for facts, then find your own position.
    source: user-verbatim
    quote: "The above Gemini report provides a factual basis for your analysis, but thing harder to find your own perspective and don't get swayed by the Gemini's conclusions."
    loc: "day-018:L7081"
    feeds: judge-anchor
  - statement: Programmatic guardrails should encode hard constraints (actions objectively wrong in this project), never soft preferences (tool choices that depend on context) — the latter are what the agent's reasoning is for, and blocking them only produces friction.
    source: user-paraphrase
    quote: "keep the original GIT_STAGING_MSG, remove the comment documenting the removal"
    loc: "day-018:L7132"
    feeds: judge-anchor

skill_rules:
  - rule_id: d018-R1
    rule: Implement exactly one acceptance scenario per RED→GREEN cycle; never write two failing specs before implementing either.
    because: Two failing specs at once destroy the one-to-one link between a failure and the implementation step it drove.
    because_source: user-verbatim
    quote: "# ONE SCENARIO AT A TIME!"
    evidence: "day-018:L1242"
    taught_or_enforced: needed-enforcement
    skill_target: tdd-bdd
    overlap: "canonical §2.6"
    feasibility: ok
  - rule_id: d018-R2
    rule: Never write an assertion whose expected value is an accident of the current fixture; if the fixture cannot exhibit the behavior, fix the fixture first.
    because: An assertion encoding a fixture's emptiness passes without the feature existing, so it can never go RED for the right reason.
    because_source: user-verbatim
    quote: "When you say \"# No sample books in fixture, so should be empty\", what does that imply?"
    evidence: "day-018:L1260"
    taught_or_enforced: needed-enforcement
    skill_target: tdd-bdd
    overlap: "canonical §2.3"
    feasibility: ok
  - rule_id: d018-R3
    rule: Before asserting on specific data, run the product against the fixture and read the actual output.
    because: An assertion invented from memory can name a book that has never been in the fixture.
    because_source: user-verbatim
    quote: "We don't have \"The Pragmatic Programmer\" book. Where did you get this idea from? (we should remove it from any docs if that's the source). Run `bookminder list recent --user ...` to see what's actually in our fixture..."
    evidence: "day-018:L516"
    taught_or_enforced: taught-once
    skill_target: tdd-bdd
    overlap: "canonical §2.3"
    feasibility: ok
  - rule_id: d018-R4
    rule: Prefer the assertion that names the property over the one that hardcodes incidental content; pair a non-emptiness guard with the property check.
    because: Tying the test to a particular book couples it to fixture churn rather than to the behavior under test.
    because_source: user-verbatim
    quote: "almost, how about we checked the output length is bigger than 0 and doesn't contain any clouds? even better?"
    evidence: "day-018:L592"
    taught_or_enforced: repeated
    skill_target: tdd-bdd
    overlap: "canonical §2.3"
    feasibility: ok
  - rule_id: d018-R5
    rule: One positive example is enough; do not enumerate every negative case alongside it.
    because: Extra negative examples add maintenance surface without adding constraint.
    because_source: user-verbatim
    quote: "one positive example shoudl suffice, right?"
    evidence: "day-018:L578"
    taught_or_enforced: taught-once
    skill_target: tdd-bdd
    overlap: none
    feasibility: ok
  - rule_id: d018-R6
    rule: Commit the passing test plus minimal implementation immediately after GREEN, before starting any refactoring.
    because: Refactoring on top of an uncommitted GREEN loses the revertible checkpoint the cycle exists to create.
    because_source: user-verbatim
    quote: "OK, and what does `git_workflow` say about GREEN? Maybe CLAUDE.md is missing hint to commit after reaching GREEN before we start to refactor?"
    evidence: "day-018:L817"
    taught_or_enforced: needed-enforcement
    skill_target: claude-md
    overlap: "CLAUDE.md <tdd_discipline> / <git_workflow>"
    feasibility: ok
  - rule_id: d018-R7
    rule: If the refactor phase is abandoned mid-cycle for a digression, return to it before starting the next story.
    because: A cycle left at GREEN is an unfinished cycle, and the next story will bury the evidence that it was skipped.
    because_source: user-verbatim
    quote: "Yes... but we Skipped the refactor phase on cloud negation, when we got distracted by forgotten commit and we got to uproving the process documentation... shouldn't we go back?"
