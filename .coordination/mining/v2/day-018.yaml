  - rule_id: d018-R16
    rule: Treat ZSTATE=6 (cloud sample, not downloaded) as the common sample case and ZISSAMPLE=1 (downloaded sample) as the edge case; cover both.
    because: The common case is what users mostly have, and specifying only the edge case leaves the mainline unspecified.
    because_source: user-verbatim
