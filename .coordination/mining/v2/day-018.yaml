  - rule_id: d018-R17
    rule: In shell fixture scripts use FIXTURE_USER, never USERNAME, and SQL-escape interpolated book titles by doubling single quotes.
    because: USERNAME is already set in the user's zsh environment and silently shadows the argument; an apostrophe in a title ("What's Our Problem?") breaks the SQL.
    because_source: user-verbatim
    quote: "I just ran this in a fresh teminal:\n  ```zsh\n  echo $USERNAME\n  palimondo\n  ```"
