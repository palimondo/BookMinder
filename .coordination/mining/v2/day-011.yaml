philosophy:
  - statement: >-
      A model of the domain that is merely logical is not yet knowledge; it becomes
      knowledge only when it has been checked against the real data and survived a
      chance to be wrong.
    source: user-verbatim
    quote: |-
      The proposed relationship appears logical, but shoudl be verified vith data. Perform a short data research now.
    loc: "day-011:L6944"
    feeds: judge-anchor

  - statement: >-
      Fixtures are constructions and can only confirm what was built into them; a
      hypothesis about the world must be tested against the world, i.e. the author's
      real Apple Books database.
    source: user-verbatim
    quote: |-
      No, you need to perform the research on my read databases, not on the fixtures!
    loc: "day-011:L7172"
    feeds: judge-anchor

  - statement: >-
      Before designing a command surface or writing stories, the pair must settle the
      domain language — what the concepts are and which data source each lives in —
      approached from several angles rather than one plausible taxonomy.
    source: user-verbatim
    quote: |-
      So, to begin with, we should get our Domain Languauge straght. Can you try to approach this problem from multiple sides and help us get better calarity, so
      that we can then chart an incremental path through this design space together?
    loc: "day-011:L6812"
    feeds: skill-why

  - statement: >-
      Backlog format is driven by observed friction, not by aspiration: the YAML story
      cards were adopted the moment status tags on a monolithic TODO became ambiguous,
      and the agent was asked to sanity-check the proposal before adopting it.
    source: user-verbatim
    quote: |-
      Our TODO list is getting unweildy... check @vision.md for a proposal how to handle stories with YAML. Let me know it that makes sense and if co, you can
      star using it with what we have
    loc: "day-011:L9019"
    feeds: skill-why

  - statement: >-
      A backlog is a walk, not a set: each card must be a brick that rests on the
      previous one, and the pair explicitly asks whether the proposed sequence really
      is incremental before writing any of it down.
    source: user-verbatim
    quote: |-
      Does this story journey make logical progression that incrementally adds small improvements brick-by-brick?
    loc: "day-011:L9093"
    feeds: skill-why

  - statement: >-
      Extending a feature must not disturb the assertions that already specify it —
      the existing expected output stays valid as a prefix, and the new work is
      specified as the suffix that appears after it.
    source: user-verbatim
    quote: |-
      We probably should not rewrite the original acceptance test examples and assertions. The format remains valid in the prefix form. We should now add filter
      for flag and confirm it contains the expected suffixes in the book like
    loc: "day-011:L9089"
    feeds: judge-anchor

  - statement: >-
      Stories are reverse-engineered from what the tests actually do; when one test
      file honestly serves two purposes, the fix is a single story whose structure
      matches the tests, not two stories that each half-describe them.
    source: user-verbatim
    quote: |-
      We just need to describe them together in single story, that structurally matches our acceptance tests. So let's try to draft together a unified story.
    loc: "day-011:L10710"
    feeds: skill-why

  - statement: >-
      A scenario docstring is a debt against the assertions: it may only be deleted
      once every one of its clauses is actually asserted in code and the scenario lives
      in the story card.
    source: user-verbatim
    quote: |-
      w8, I'll remove the docstring with gherkin scenario, now that all of its requirements are met.
    loc: "day-011:L12323"
    feeds: judge-anchor

  - statement: >-
      Docstrings earn their place by what they add: a Gherkin scenario on an acceptance
      test is specification, prose restating the code on a private helper is waste.
    source: user-verbatim
    quote: |-
      The ones on acceptance test spelling out the scenatios in gherking syntax were actually usefull. The inline comments we shit and the docstring on
      _run_cli_with_user was redundant because it was restating in prose what code already said
    loc: "day-011:L5461"
    feeds: skill-why

  - statement: >-
      Process metadata is subject to YAGNI exactly like production code — one field
      that changes behavior is adopted, speculative ones are refused.
    source: user-verbatim
    quote: |-
      I like the status, not the other optional fields (YAGNI for now).
    loc: "day-011:L11281"
    feeds: skill-why

  - statement: >-
      A proposed test scenario must justify itself by the failure mode it exercises;
      "we have no coverage there" is not a reason if no realistic environment produces
      it, and two scenarios that trigger the same exception are one scenario.
    source: user-verbatim
    quote: |-
      Do you see something in our missing coverage that points to need to add this scenarion?  2. might be something we need, but how does it materially differ
      from the legacy user scenario?
    loc: "day-011:L1671"
    feeds: judge-anchor

  - statement: >-
      Coverage-driven development is named by the author as a past violation, not a
      method: tests retrofitted to move a number are not specifications.
    source: user-verbatim
    quote: |-
      - **Violation**: We retrofitted tests for coverage (Coverage-Driven Development, not TDD)
    loc: "day-011:L9470"
    feeds: judge-anchor

  - statement: >-
      Tool friction is diagnosed and worked with, not routed around: the author's
      instinct on a failing quality gate is to try the intended workflow once more,
      not to disable the gate.
    source: user-verbatim
    quote: |-
      Don't try to resolve ruff failure from comit hooks manually with format -fix. Try `ruff check` first? I think just trying commit again after ruff modifies
      the files from pre-commit hook it should succseed. Give that tactic a try
    loc: "day-011:L4598"
    feeds: skill-why

  - statement: >-
      Attribution is a factual claim about who did the work: the tool is the vehicle,
      the specific model version is the author, and it must be looked up rather than
      guessed.
    source: user-verbatim
    quote: |-
      in Co-Authored-By: Gemini 2.5 Pro <noreply@google.com>. Also fix the guidance for contribtor attribution. This should be update whenever your model gets
      upgraded to new version. Therefore it needs to list specific model -- not the tool!
    loc: "day-011:L798"
    feeds: skill-why

skill_rules:
  - rule_id: d011-R1
    rule: >-
      When a test fails because production output changed, decide and state which of
      the two is wrong before editing either; never edit the assertion to match
      whatever the code now prints.
    because: >-
      An assertion rewritten to match observed output stops being a specification and
      becomes a transcript of current behavior.
    because_source: agent-synthesis
    evidence: "day-011:L2091"
    taught_or_enforced: needed-enforcement
    skill_target: tdd-bdd
    overlap: "canonical §2.7"
    feasibility: ok

  - rule_id: d011-R2
    rule: >-
