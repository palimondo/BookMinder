      name; if the specified behavior changed, the story and the test name change with
      it.
    because: >-
      `it_handles_user_who_never_opened_apple_books` silently went from specifying
      "Apple Books not found" to "Apple Books database not found" — a different
      user-visible contract under an unchanged sentence in `pytest --spec`.
    because_source: agent-synthesis
    evidence: "day-011:L3629"
    taught_or_enforced: needed-enforcement
    skill_target: tdd-bdd
    overlap: "canonical §2.7"
    feasibility: ok

