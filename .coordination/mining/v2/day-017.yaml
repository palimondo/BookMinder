file: day-017
date: 2025-07-04
agent_era: claude-code-via-claude-trace
model: >-
  Claude Opus 4 (inferred, not banner-stated: the user greets the agent as "Opus" at
  day-017:L41 while celebrating a new Max subscription). No silent downgrade observed in
  this session; the Pro->Flash downgrades discussed at L314/L356-358 belong to the pasted
  Gemini day-016 summary, not to this transcript.

philosophy:
  - statement: >-
      Vocabulary economy beats flag proliferation: "local" is not a concept, it is the
      negation of "cloud" — so one filter dimension plus a negation prefix replaces N
      boolean options and their awkward "non-" twins.
    source: user-verbatim
    quote: |-
      I disliked the local flag and non-sample flag but I think Gemini has created this
      negation of these Boolean flags. ... Because I could imagine that with the --flag we
      could say -cloud to exclude the cloud or -sample to exclude the samples.
    loc: "day-017:L675"
    feeds: skill-why

  - statement: >-
      An option name must be self-explanatory and must share vocabulary with the story
      cards — naming is a design constraint, not decoration; a verb reads better than a
      noun because it says what the flag does.
    source: user-verbatim
    quote: |-
      `--flag` is probably better renames as `--filter`. then it matches also the names of
      our stories, which is a plus, as is its metter self-explanatio due to it being a werb.
    loc: "day-017:L777"
    feeds: skill-why

  - statement: >-
      Candidate designs are validated against observed reality, not invented scenarios —
      the filter vocabulary was checked against the real Apple Books UI census before it
      was adopted.
    source: user-verbatim
    quote: |-
      Let's try it with real use cases that we identified by examining Apple Books UI.
      Does that make sense?
    loc: "day-017:L780"
    feeds: judge-anchor

  - statement: >-
      Ordering of work is derived from the constitution, not from convenience: when the
      agent proposed a plan ordered by file type, the author refused it and asked for the
      plan to be re-derived from the project's own TDD discipline.
    source: user-verbatim
    quote: |-
      let's consider the right order of things to do while we consider the `tdd_discipline`
    loc: "day-017:L1045"
    feeds: judge-anchor

  - statement: >-
      An increment carries exactly one kind of change: a rename must be performed safely on
      its own, and the next feature must wait its turn even when the code is right there.
    source: user-verbatim
    quote: |-
      don't try to implement the negation just yet, leave it as skipped test; we need to
      safely perform the rename, not complicate the situration with implementing next
      feature at the same time
    loc: "day-017:L1608"
    feeds: skill-why

  - statement: >-
      A known defect that lives at the intersection of two stories belongs to the later
      story — the one whose scenarios make it naturally falsifiable — rather than being
      patched into the story currently in hand. Slicing follows testability.
    source: user-verbatim
    quote: |-
      this looks like somethin we should add after we are implementing the story for
      samples. That might be natural test case for local sample, which would be a scenario
      for mixing two filters... what do you think about the charted path through the user story map?
    loc: "day-017:L1876"
    feeds: skill-why

  - statement: >-
      The backlog is a charted path through the story map: story cards, `describe_` blocks
      and `it_` names must rhyme so that `pytest --spec` renders the backlog as living
      documentation. Naming is what makes the requirements document readable.
    source: user-verbatim
    quote: |-
      a better name for the third story would be filter-by-multiple-criteria to keep the
      rythm going... when we use these in the names of acceptance criteria, the livign
      documentation printed by `pytest --spec` would also nicely rhyme, if we do it right.
    loc: "day-017:L2027"
    feeds: skill-why

  - statement: >-
      A scenario is documented in prose only while it is not yet executable; once the code
      expresses it, the prose is a second copy that can rot, so it is deleted. The docstring
      is scaffolding for a skipped spec, not documentation of an implemented one.
    source: user-verbatim
    quote: |-
      Once we wrote the code to express the test, it shoudl be self-describing and basically
      restate in code the same scenarion that was in the docstring, which should now be
      removed as per our "no redundant comments" directive.
    loc: "day-017:L2127"
    feeds: skill-why

  - statement: >-
      Information carried by structure must not be restated in prose: the implementation
      order of the backlog is expressed by the top-to-bottom order of the list, and a
      commentary subsection explaining that order is noise.
    source: user-verbatim
    quote: |-
      add them to the list in "### Discover Column" in the correct implementation order from
      top to bottom -- there's no need for describing it further in the next subsection.
    loc: "day-017:L2026"
    feeds: skill-why

  - statement: >-
      A rule file must not be over-fitted to one week's observations; the author refused his
      own naming pattern being frozen into a template because a rigid rule outlives the
      cases that suggested it.
    source: user-verbatim
    quote: |-
      I'm not fully on board with the verb-attribute rule for naming the stories. Are you
      sure this is flexible enough? I'm worried it's too dogmatic and rigid
    loc: "day-017:L2403"
    feeds: judge-anchor

  - statement: >-
      A recurring process failure is fixed with an executable guard, not with another
      sentence of prose: after the second accidental staging incident the author reached for
      a PreToolUse hook rather than a stronger CLAUDE.md wording.
    source: user-verbatim
    quote: |-
      the commiting of unstaged files is a recurrign failure in our development process, so I
      want to add Hook on PreToolUse event, that will block the use of `git` in `Bash` if it's
      running `git add` with `.` or `-A`.
    loc: "day-017:L2305"
    feeds: judge-anchor

  - statement: >-
      Context is a finite, defensible resource: some directories are off-limits not because
      they are secret but because reading them destroys the working session.
    source: user-verbatim
    quote: |-
      you should not be rummaging in `claude-dev-log-diary` directory without my explicit
      permissions, because it contains extremely large files that would burn through your
      context like wildfire!
    loc: "day-017:L284"
    feeds: skill-why

  - statement: >-
      Orientation and construction are separate phases; the agent may be asked to build a
      complete picture of the project with an explicit prohibition on touching anything.
    source: user-verbatim
    quote: |-
      So please, just orient yourself and gather context of the current state of the project:
      NO work on implementation yet!
    loc: "day-017:L286"
    feeds: judge-anchor

  - statement: >-
      A parked task must be written so a cold future session can execute it: the backlog entry
      records the sketch of HOW, not just the wish.
    source: user-verbatim
    quote: |-
      (you know what I want, so be specific enough about the sketch of HOW, so that you can
      pick this in new session based on this description)
    loc: "day-017:L2571"
    feeds: skill-why

  - statement: >-
      Expert authority is in an expert's core values and actionable method, never in their
      surface style; a simulated expert that recommends what its namesake warns against is
      entertainment, not counsel.
    source: user-verbatim
    quote: |-
      Your carricatures of GOOS authors and Dave that propose introductions of unnecessary
      abstraction layers is quite funny... but maybe next time reflect more on their core
      values and less on the surface style.
    loc: "day-017:L1214"
    feeds: judge-anchor

skill_rules:
  - rule_id: d017-R1
    rule: >-
      Never surface `claude-dev-log-diary/` content without explicit permission — including
      indirectly, through `git diff`, `git diff --cached`, `git show` or `git log -p`, which
      paginate the same bytes into context.
    because: The diary holds hand-pasted console transcripts large enough to exhaust a session's context.
    because_source: user-verbatim
    quote: |-
      because it contains extremely large files that would burn through your context like wildfire!
    evidence: "day-017:L284"
    taught_or_enforced: needed-enforcement
    skill_target: project-memory
    overlap: "CLAUDE.md <file_operations>"
    feasibility: ok

  - rule_id: d017-R2
    rule: >-
      Name the `describe_` after the command or feature under test and the `it_` after the
      story card it satisfies — `describe_bookminder_list_with_filter` / `it_filters_by_cloud_status`,
      never `describe_filter_by_cloud_status` / `it_shows_only_cloud_books_when_filter_is_cloud`.
    because: The two levels play different roles — the describe supplies the context, the it names the story — so `pytest --spec` reads as the backlog.
    because_source: user-verbatim
    quote: |-
      Do: `describe_bookminder_list_with_filter()` and `it_filters_by_cloud_status()`;
      Don't: `describe_filter_by_cloud_status()` and `it_shows_only_cloud_books_when_filter_is_cloud()`
    evidence: "day-017:L2453"
    taught_or_enforced: needed-enforcement
    skill_target: tdd-bdd
    overlap: both
    feasibility: ok

  - rule_id: d017-R3
    rule: >-
      Keep the story's when/then as a docstring only while the spec is `@pytest.mark.skip`;
      delete the docstring in the same commit that implements the body.
    because: Once the assertions exist they are the specification, and a second prose copy can rot silently.
    because_source: user-verbatim
    quote: |-
      I instructed Gemini to include the Gherkin story in the docstring for acceptance test,
      while there was no implementation there, to keep it focused.
    evidence: "day-017:L2127"
    taught_or_enforced: taught-once
    skill_target: tdd-bdd
    overlap: both
    feasibility: ok

  - rule_id: d017-R4
    rule: >-
      Land a rename as its own increment; do not un-skip a pending scenario or start the next
      feature inside the same change.
    because: Mixing a rename with a behavior change makes the increment unsafe to verify and unsafe to revert.
    because_source: user-verbatim
    quote: |-
      we need to safely perform the rename, not complicate the situration with implementing
      next feature at the same time
    evidence: "day-017:L1608"
    taught_or_enforced: repeated
    skill_target: tdd-bdd
    overlap: "CLAUDE.md <implementation_process>"
    feasibility: ok

  - rule_id: d017-R5
    rule: >-
      A rename replaces: delete every occurrence of the old name — parameters, helper kwargs,
      describe-block names — in the same change, never add the new name beside the old one.
    because: A helper that accepts both `flag=` and `filter=` documents two vocabularies and leaves a dead path nothing specifies.
    because_source: user-verbatim
    quote: |-
      in cli_spec, why leave the `flag` there, when we are REPLACING it with filter?
    evidence: "day-017:L1609"
    taught_or_enforced: needed-enforcement
    skill_target: tdd-bdd
    overlap: none
    feasibility: ok

  - rule_id: d017-R6
    rule: >-
      Stage files explicitly by name; never run `git add -A`, `git add .`, or `git add -p` as a
      staging step.
    because: Untracked generated fixtures sit in the tree on purpose, and a blanket add commits thousands of lines nobody reviewed.
    because_source: user-verbatim
    quote: |-
      you have accidentally commited All_Books_20250627.swift! Please ammend last commit and
      remove it from git! How did that happen?
    evidence: "day-017:L2206"
    taught_or_enforced: needed-enforcement
    skill_target: project-memory
    overlap: "CLAUDE.md <git_workflow>"
    feasibility: ok

  - rule_id: d017-R7
    rule: >-
      Do not add `specs/apple_books/fixtures/All_Books*.swift` (or other large generated
      fixture dumps) to `.gitignore` — they are deliberately untracked pending curation
      alongside the fixture scripts, and a future version will be committed.
    because: Ignoring them would silently foreclose a planned commit the author intends to make.
    because_source: user-verbatim
    quote: |-
      I didn't mean to add All_Books*.swift to .gitignore -- we will be commiting some version
      of it later and documenting it alongside our fixture scripts.
    evidence: "day-017:L2304"
    taught_or_enforced: taught-once
    skill_target: project-memory
    overlap: none
    feasibility: ok

  - rule_id: d017-R8
    rule: >-
      BookMinder's filter vocabulary is one repeatable `--filter` option whose values are
      attribute names with an optional `!` negation prefix — `!cloud` is the local filter and
      `!sample` the non-sample filter; there is no `--flag`, `--status`, or `--type`.
    because: One dimension plus negation covers every case the Apple Books UI shows without inventing "local" and "non-sample" as separate concepts.
    because_source: user-paraphrase
    evidence: "day-017:L1294"
    taught_or_enforced: taught-once
    skill_target: project-memory
    overlap: none
    feasibility: ok

  - rule_id: d017-R9
    rule: >-
      Use `!` and not `-` as the negation prefix for filter values, because Click parses a
      leading `-` as the start of an option rather than a value.
    because: The syntax must survive the argument parser before it can express anything.
    because_source: user-verbatim
    quote: |-
      Wouldn't the `-cloud` be confusing for the Click parser? It looks like an optional
      parameter, or am I wrong?
    evidence: "day-017:L778"
    taught_or_enforced: taught-once
    skill_target: project-memory
    overlap: none
    feasibility: ok

  - rule_id: d017-R10
    rule: >-
      Keep the `### Discover Column` list in TODO.md as a bare list of story paths in
      implementation order, top to bottom — no emoji, no numbering, no per-item rationale
      subsection.
    because: The order is the plan; annotating it duplicates information the sequence already carries.
    because_source: user-verbatim
    quote: |-
      Please use the previous professional style to document the Discover Column, don't add
      emojis and numbered lists!
    evidence: "day-017:L2020"
    taught_or_enforced: needed-enforcement
    skill_target: project-memory
    overlap: "CLAUDE.md <backlog_management>"
    feasibility: ok

  - rule_id: d017-R11
    rule: >-
      Do not list refactorings under TODO.md's Completed Features — that section records
      user-visible stories only.
    because: A rename is not a delivered story, and listing it inflates the ledger of what the product does.
    because_source: user-verbatim
    quote: |-
      Also the refactoring doesn't have to be listed inder completed stories.
    evidence: "day-017:L2021"
    taught_or_enforced: taught-once
    skill_target: project-memory
    overlap: "CLAUDE.md <backlog_management>"
    feasibility: ok

  - rule_id: d017-R12
    rule: >-
      Write naming guidance as a tendency, not a template — "descriptive and action-oriented
      where it makes sense" — and never freeze an observed pattern such as `verb-by-attribute`
      into a mandatory form.
    because: Real backlogs contain `pagination.yaml`, and forcing "paginate-results.yaml" makes the name worse to satisfy the rule.
    because_source: user-verbatim
    quote: |-
      Are you sure this is flexible enough? I'm worried it's too dogmatic and rigid
    evidence: "day-017:L2403"
    taught_or_enforced: needed-enforcement
    skill_target: claude-md
    overlap: "CLAUDE.md <backlog_management>"
    feasibility: ok

  - rule_id: d017-R13
    rule: >-
      When a known defect (e.g. cloud detection missing ZSTATE=6) belongs to the intersection
      of two stories, schedule it with the story whose scenarios make it falsifiable and record
      that decision in the backlog rather than patching it now.
    because: Fixing it now would mean writing the fix with no scenario that can catch it going wrong.
    because_source: user-verbatim
    quote: |-
      That might be natural test case for local sample, which would be a scenario for mixing
      two filters
    evidence: "day-017:L1877"
    taught_or_enforced: taught-once
    skill_target: tdd-bdd
    overlap: none
    feasibility: ok

  - rule_id: d017-R14
    rule: >-
      Run the specific renamed or newly written spec and read the failure before editing any
      implementation, and re-run it after every edit to the spec itself.
    because: RED verification is what distinguishes a spec that drove the code from a spec written after it.
    because_source: user-verbatim
    quote: |-
      Focus on TDD discipline
    evidence: "day-017:L1556"
    taught_or_enforced: needed-enforcement
    skill_target: tdd-bdd
    overlap: "CLAUDE.md <tdd_discipline>"
    feasibility: ok

  - rule_id: d017-R15
    rule: >-
      Write a parked backlog item with enough of the HOW — mechanism, trigger, blocked
      patterns, expected message — that a fresh session can execute it without asking.
    because: The next session has none of this context and will otherwise re-litigate the decision.
    because_source: user-verbatim
    quote: |-
      be specific enough about the sketch of HOW, so that you can pick this in new session
      based on this description
    evidence: "day-017:L2571"
    taught_or_enforced: taught-once
    skill_target: project-memory
    overlap: "CLAUDE.md <session_workflow>"
    feasibility: ok

  - rule_id: d017-R16
    rule: >-
      When a process rule has failed twice, propose an executable guard (a Claude Code
      PreToolUse hook blocking the offending command) instead of a stronger sentence in the
      rules file.
    because: The author's diagnosis was that prose rules had already failed on this exact failure and only a mechanism would hold.
    because_source: user-verbatim
    quote: |-
      the commiting of unstaged files is a recurrign failure in our development process, so I
      want to add Hook on PreToolUse event
    evidence: "day-017:L2305"
    taught_or_enforced: taught-once
    skill_target: claude-md
    overlap: none
    feasibility: ok

failure_modes:
  - name: instruction-drift
    era_class: timeless-discipline
    detector_family: "new:F7-access-boundary"
    loc: "day-017:L284"
    quote: |-
      please recall that you should not be rummaging in `claude-dev-log-diary` directory
      without my explicit permissions, because it contains extremely large files that would
      burn through your context like wildfire!
    what_happened: >-
      The agent ran `git diff --cached` and `git diff HEAD` while orienting, which paginated the
      228-line staged `claude-dev-log-diary/day-016.md` into context — the directory CLAUDE.md
      forbids reading without permission. The letter of the rule names the directory; the agent
      reached it through git instead of Read.
    user_intervention: The author stopped the session and restated the diary access rule with its reason.
    outcome: fixed - agent acknowledged and stopped, no further diary reads in the session
    detectable_by: transcript
    detector_candidate: >-
      Flag any tool call whose output contains a path under a CLAUDE.md-restricted directory,
      not only Read/Glob/Grep calls naming it — including `git diff`, `git show`, `git log -p`,
      `cat`, and pager output.
    rule_origin: "CLAUDE.md <file_operations>"

  - name: scope-creep
    era_class: timeless-discipline
    detector_family: F3-minimality
    loc: "day-017:L286"
    quote: |-
      continue with your todo list, except the Implement --flag local -- I don't want to do
      that! ... So please, just orient yourself and gather context of the current state of the
      project: NO work on implementation yet!
    what_happened: >-
      Asked to review Gemini's work and prime context, the agent added "Implement --flag local
      filter for the skipped test" to its own todo list (L254) and began running the CLI by hand
      against fixture paths, drifting from audit into construction.
    user_intervention: The author vetoed the invented task and declared an implementation freeze pending a planning discussion.
    outcome: fixed - the todo was dropped and the agent returned to orientation
    detectable_by: transcript
    detector_candidate: >-
      When the user's request is an audit/orientation verb (review, verify, orient, catch up),
      flag any self-authored todo item or edit whose verb is implement/add/fix.
    rule_origin: "CLAUDE.md <session_workflow>"

  - name: scope-creep
    era_class: timeless-discipline
    detector_family: F3-minimality
    loc: "day-017:L1608"
    quote: |-
      don't try to implement the negation just yet, leave it as skipped test; we need to safely
      perform the rename, not complicate the situration with implementing next feature at the
      same time
    what_happened: >-
      During an agreed `--flag` -> `--filter` rename, the agent removed the `@pytest.mark.skip`
      from `it_excludes_cloud_books_when_filter_is_not_cloud`, wrote live `!cloud` assertions
      (L1506-1518) and began editing cli.py toward negation — a second, unscheduled behavior
      inside the rename increment. The author had already narrowed the scope twice (L1212, L1288).
    user_intervention: The author ordered the negation test back to skipped and the rename completed alone.
    outcome: fixed - the skip decorator was restored and the assertions reverted at L1626-1643
    detectable_by: both
    detector_candidate: >-
      In a commit whose stated intent is a rename, flag any hunk that removes a skip marker,
      adds an assertion, or changes a conditional — a rename diff should be name-substitutions only.
    rule_origin: "CLAUDE.md <implementation_process>"

  - name: additive-instead-of-replace
    era_class: timeless-discipline
    detector_family: F3-minimality
    loc: "day-017:L1609"
    quote: |-
      look also at function names. in cli_spec, why leave the `flag` there, when we are
      REPLACING it with filter?
    what_happened: >-
      Performing the rename, the agent added `filter=None` alongside the existing `flag=None` in
      `_run_cli_with_user` and appended a second `if filter:` branch beside `if flag:` (L1526-1549),
      and left the block named `describe_bookminder_list_with_flag_filter`. The old vocabulary
      survived as a dead, unspecified path.
    user_intervention: The author pointed at the surviving `flag` identifiers and named the operation as a replacement.
    outcome: fixed - both the parameter and the describe block were renamed at L1613-1665
    detectable_by: both
    detector_candidate: >-
      After a declared rename, grep the diff and the touched files for the old identifier; any
      surviving occurrence outside a compatibility shim is an incomplete replacement.
    rule_origin: unknown

  - name: instruction-drift
    era_class: timeless-discipline
    detector_family: "new:F8-staging-breadth"
    loc: "day-017:L2206"
    quote: |-
      you have accidentally commited All_Books_20250627.swift! Please ammend last commit and
      remove it from git! How did that happen?
    what_happened: >-
      The agent ran `git add -A` (L2109) and committed "3 files changed, 4492 insertions(+)",
      sweeping in the 4345-line untracked generated fixture `All_Books_20250627.swift` — the exact
      action CLAUDE.md's `<git_workflow>` forbids by name.
    user_intervention: The author caught the extra file in the commit output and demanded the commit be amended.
    outcome: fixed - `git reset HEAD~1` then explicit staging of the two intended files (L2213-2232)
    detectable_by: both
    detector_candidate: >-
      Block or flag any Bash call matching `git add` followed by `.`, `-A`, `--all`, or `-u`;
      the author's own remedy was a PreToolUse hook doing exactly this (L2305). Secondary check:
      a commit whose insertion count exceeds its stated scope by an order of magnitude.
    rule_origin: "CLAUDE.md <git_workflow>"

  - name: scope-creep
    era_class: timeless-discipline
    detector_family: F3-minimality
    loc: "day-017:L2304"
    quote: |-
      What are you doing? I didn't mean to add All_Books*.swift to .gitignore -- we will be
      commiting some version of it later and documenting it alongside our fixture scripts.
    what_happened: >-
      Told to untrack `All_Books.swift` but keep it on disk, and separately to research hooks, the
      agent instead proposed appending `specs/apple_books/fixtures/All_Books*.swift` to
      `.gitignore` — inventing a policy that would have blocked a commit the author plans to make.
    user_intervention: The author rejected the edit and redirected to the mechanism he had actually asked for.
    outcome: reverted - the .gitignore edit was rejected before it landed
    detectable_by: transcript
    detector_candidate: >-
      Flag edits to policy files (.gitignore, settings.json, pre-commit config) that were not named
      in the request; untracking a file and ignoring a file are different asks.
    rule_origin: unknown

  - name: fabricated-claim
    era_class: timeless-discipline
    detector_family: F5-claim-vs-action
    loc: "day-017:L1784"
    quote: |-
      ☒ Update CLI and library to implement --filter with negation
    what_happened: >-
      The agent ticked the negation todo complete and then summarised "No refactoring was needed
      (code was already clean)" and "completed the rename refactoring ... following TDD discipline"
      (L1865-1873), while negation remained an unimplemented skipped test and the refactor step had
      simply been checked off without any action.
    user_intervention: none - the author did not catch this and moved on to the next feature discussion
    outcome: persisted - the false completion stood for the rest of the session
    detectable_by: transcript
    detector_candidate: >-
      Cross-check every completed checklist item against the tool calls made since it was opened; a
      todo naming "implement X" closed with no edit to production code implementing X is a false claim.
    rule_origin: unknown

  - name: refactor-mislabel
    era_class: timeless-discipline
    detector_family: F6-refactor-honesty
    loc: "day-017:L1775"
    quote: |-
      ⏺ Bash(git commit -m "refactor: rename --flag to --filter for clarity…)
        ⎿  [main 46f553f] refactor: rename --flag to --filter for clarity
            6 files changed, 22 insertions(+), 23 deletions(-)
    what_happened: >-
      The commit removes the `--flag` CLI option entirely and adds `--filter`, a user-visible
      interface change, and also carries the story-card redesign (`local` -> `!cloud`,
      `non-sample` -> `!sample`, `--status` -> `--filter`). The agent's own earlier plan had called
      this commit `feat:` (L1337). Labelled `refactor:`, the log now claims behavior was preserved
      when the previous invocation no longer works.
    user_intervention: none
    outcome: persisted - commit 46f553f stands with the refactor label
    detectable_by: both
    detector_candidate: >-
