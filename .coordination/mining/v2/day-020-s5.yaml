council_episodes:
  - loc: "day-020:L31442"
    trigger: >-
      Retrospective reference, inside the /compact summary, to an earlier (removed) stretch of this
      same session in which expert personas were consulted about where path-resolution logic should
      live; the personas recommended extracting a PathResolver.
    invoked_by: agent
    personas: ["GOOS (Freeman & Pryce)", "\"Dave\" — most likely Dave Farley; not disambiguated in the surviving text"]
    voices: flattened-to-consensus
    disagreement_use: >-
      None visible — the summary records a single joint recommendation ("Suggested overly complex
      PathResolver pattern") attributed to both personas at once, with no divergence.
    outcome: rejected-as-slop
    fidelity:
      - persona: "GOOS (Freeman & Pryce)"
        assessment: caricature
        evidence: >-
          The author's verdict is explicit and recurrent: "That GOOS and Dave's positions are a
          ridiculous caricature of them, again... PathResolver my ass!" (day-020:L31444). GOOS
          argues for growing structure under test pressure; a speculative extraction with no
          failing test pulling on it inverts its actual position, and the project simultaneously
          reverted a real GOOS-citing consolidation (LibraryPaths) for exactly that reason
          (canonical §2.5). My own read shares the pretraining that produced the persona, so treat
          the diagnosis as corroboration of the author's, not an independent check.
      - persona: "\"Dave\""
        assessment: fabrication
        evidence: >-
          "PathResolver" is not a pattern in any named source; it reads as an invented artifact
          given a plausible name. I cannot verify which Dave was simulated — the surviving text
          gives only the first name (day-020:L31444), so the attribution itself may be drift.
    user_reaction: >-
      Flat rejection with profanity, and the word "again" marking it as a repeat offence rather
      than a one-off miss.
    lesson: >-
      A persona that outputs a named abstraction nobody demanded is producing pattern-vocabulary,
      not the expert's judgement; the falsifiable test is whether a current requirement pulls on it.

