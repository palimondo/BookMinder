    because_source: user-paraphrase
    evidence: "day-020:L32292"
    taught_or_enforced: repeated
    skill_target: claude-md
    overlap: "CLAUDE.md <code_style>"
    feasibility: ok

  - rule_id: d020s5-R13
    rule: >-
      Delete a docstring that repeats the it_ name; the code is the specification.
