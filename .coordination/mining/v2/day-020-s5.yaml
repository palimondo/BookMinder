philosophy:
  - statement: >-
      A coverage gap is a question about the implementation, not a metric to shrug at;
      the author refuses the "remaining 2% is defensive code, not worth testing" dismissal
      because the session's whole yield came from chasing exactly one such gap.
    source: user-verbatim
    quote: "NO! and also that 2% don't care conclusion is bogus. Our marathon session here was chasing 1 coverage gap and we've uncovered and fixed a significant issue"
    loc: "day-020:L31219"
    feeds: judge-anchor

  - statement: >-
      Untested defensive code is treated as evidence of a process violation (implementation
      written before the spec that demanded it), and the default remedy is deletion, not a
      retroactive test — the test would only ratify code that was never demanded.
    source: user-verbatim
    quote: "It's entirely possible that the defensive coding was your or one of the other models doing what you always do -- adding implementation code before you've writen spec that calls for it (a recurring failure to follow strict TDD discipline in AI coding sessions), then the proper fix would be to just remove it."
    loc: "day-020:L31476"
    feeds: skill-why

  - statement: >-
      Provenance is investigable and worth investigating: before deciding what to do with a
      line of code, find the commit that introduced it and check whether any spec ever drove
      it. Git history plus the session diary are the two instruments.
    source: user-verbatim
    quote: "Can we find whether these test for functions that work with Book.plist were ever covered to 100% (remember, to use rg in a smart way, you still have my permission to analyze files in claude-dev-log-diary."
    loc: "day-020:L31475"
    feeds: skill-why

  - statement: >-
      A design decision has a reason, and the reason is recoverable; undoing it without
      recovering it is not allowed. The author blocks a proposed rewrite not because it is
      wrong but because the rationale for the existing shape has not been retrieved yet.
    source: user-verbatim
    quote: "We have introduced the mock for a reason. Check history and ask gemini to research it in logs from the day when we did that (you rg for CliRunner to fing the day)"
    loc: "day-020:L32335"
    feeds: judge-anchor

  - statement: >-
      A replacement test must be shown equivalent-or-stronger property-by-property; the
      author audits the proposed rewrite against the original's coverage of both commands
      before considering its merits at all.
    source: user-verbatim
    quote: "first of all, your rewrite isn't an equivalent mocks were testing first list recent and then list all; you are running _run_cli_with_user with defaults for command."
    loc: "day-020:L32334"
    feeds: judge-anchor

  - statement: >-
      London-school-in-Python, questioned honestly: the author probes whether a hand-written
      fake could replace the mock at the CLI seam, explicitly not wanting the library to run
      against a fixture in a coordination spec — and frames it as a question, not a directive.
    source: user-verbatim
    quote: "So, we need to use CliRunner to use mocks, that couldn't be tested via subproces, right? So... can't we somehow use fake instead of mock here? We don't really want the library to run against a fixture."
    loc: "day-020:L32275"
    feeds: skill-why

  - statement: >-
      A revert is a claim about the tree, and the author verifies it from memory when a
      symptom (ResourceWarnings) points at machinery that should no longer exist — leftover
      residue of a reverted approach is a defect, not a detail.
    source: user-verbatim
    quote: "What do you mean `CliRunner`?!? I thought we reverted that change?"
    loc: "day-020:L32244"
    feeds: judge-anchor

  - statement: >-
      Pretrained expert simulacra are, in the author's retrospective verdict, slogan-level
      caricatures that invent architecture their namesakes never prescribed — recorded here
      as recurring ("again"), not a one-off.
    source: user-verbatim
    quote: "That GOOS and Dave's positions are a ridiculous caricature of them, again... PathResolver my ass!"
    loc: "day-020:L31444"
    feeds: judge-anchor

  - statement: >-
      Green CI is not clean CI: the author asks about warnings the agent never mentioned,
      treating the build log as something to be read rather than a pass/fail oracle.
    source: user-verbatim
    quote: "are there any deprication warning about GH actions anywhere ? I though I saw something like that somewhere"
    loc: "day-020:L32115"
    feeds: skill-why

  - statement: >-
      Coverage moves the other way here than in the constitution: the author uses the gap as
      a diagnostic pointer at suspect implementation, then reaches 100% by subtraction
      (98%→99%→100%, two deletions, zero new tests). Coverage is still never the target —
      the removals are what the target produced.
    source: agent-synthesis
    loc: "day-020:L31854"
    feeds: skill-why

skill_rules:
  - rule_id: d020s5-R1
    rule: >-
      When a line is uncovered, trace its provenance (git log -S, git blame, the session
      diary) and ask whether any spec ever demanded it before deciding the gap is acceptable.
    because: >-
      Untested code is usually the residue of implementation written ahead of its spec, and
      the fix for that is removal, not a retroactive test.
    because_source: user-verbatim
    quote: "then the proper fix would be to just remove it. Oralternatively add test for it, if usefull..."
    evidence: "day-020:L31477"
    taught_or_enforced: needed-enforcement
    skill_target: tdd-bdd
    overlap: "canonical §2.4"
    feasibility: ok

  - rule_id: d020s5-R2
    rule: >-
      Prove a suspected-unreachable error branch unreachable by executing the path and
      observing the actual exception type, then delete it.
    because: >-
      The FileNotFoundError handler was justified by plausible reasoning and was in fact dead
      code — sqlite3.connect raises OperationalError, which one throwaway command established.
    because_source: agent-synthesis
    evidence: "day-020:L31933"
    taught_or_enforced: taught-once
    skill_target: tdd-bdd
    overlap: "canonical §2.4"
    feasibility: ok

  - rule_id: d020s5-R3
    rule: >-
      Never write off a coverage gap as "defensive programming not worth testing" without
      first checking reachability and provenance.
    because: >-
      The dismissal was made twice in this session and was wrong both times; investigating
      the same two lines removed eight lines of code and closed the gap entirely.
    because_source: user-verbatim
    quote: "NO! and also that 2% don't care conclusion is bogus."
    evidence: "day-020:L31219"
    taught_or_enforced: needed-enforcement
    skill_target: tdd-bdd
    overlap: "canonical §2.4"
    feasibility: ok

  - rule_id: d020s5-R4
    rule: >-
      Before rewriting an existing test, enumerate the properties it constrains and show the
      replacement constrains each one; if it does not, say so instead of proposing the edit.
    because: >-
      The proposed subprocess rewrite silently dropped the `list all` command path and
      changed the property from "any BookminderError is handled" to "these two fixtures
      produce these two messages", under the same it_ name.
    because_source: user-verbatim
    quote: "first of all, your rewrite isn't an equivalent mocks were testing first list recent and then list all"
    evidence: "day-020:L32334"
    taught_or_enforced: needed-enforcement
    skill_target: tdd-bdd
    overlap: "canonical §2.7"
    feasibility: ok

  - rule_id: d020s5-R5
    rule: >-
      Keep library-owned error message text out of CLI acceptance assertions; assert the
      contract (a message is shown, no Traceback), not which message.
    because: >-
      Asserting "Error reading Apple Books database" through the CLI couples the CLI suite to
      the library's wording, so one behavior change breaks two suites.
    because_source: agent-synthesis
    evidence: "day-020:L32295"
    taught_or_enforced: needed-enforcement
    skill_target: tdd-bdd
    overlap: "canonical §2.4"
    feasibility: ok

  - rule_id: d020s5-R6
    rule: >-
      After a revert, grep the tree for the reverted mechanism instead of trusting the revert
      commit to have removed all of it.
    because: >-
      The CliRunner revert missed describe_cli_error_boundary because that test was written
      after the conversion and so was outside the reverted range — invisible for a day until
      a ResourceWarning exposed it.
    because_source: agent-synthesis
    evidence: "day-020:L32266"
    taught_or_enforced: taught-once
    skill_target: tdd-bdd
    overlap: "canonical §2.6"
    feasibility: ok

  - rule_id: d020s5-R7
    rule: >-
      Reading `claude-dev-log-diary/` requires explicit permission, and the permission is
      scoped to the manner granted — targeted `rg`, in the foreground, never a broad
      `grep … | head -200` sweep and never inside a background subagent.
    because: >-
      The author granted diary access in the same sentence that constrained how to use it,
