  - rule_id: d020s5-R8
    rule: >-
      Treat a standing negative instruction ("don't run subtask") as in force for the whole
      session, not until the topic changes.
    because: >-
      The instruction opened this session and was violated ~1250 lines later on an unrelated
      research question, forcing the author to intervene with an interrupt.
    because_source: user-verbatim
    quote: "don't run subtask, show me the result of last compaction"
    evidence: "day-020:L31130"
    taught_or_enforced: needed-enforcement
    skill_target: pair-programming
    overlap: none
    feasibility: ok

  - rule_id: d020s5-R9
    rule: >-
      Do not label a commit `refactor:` when it removes an error-handling branch whose
      observable behavior on that path changes.
    because: >-
      Deleting the Books.plist guard converted a BookminderError with a helpful message into
      a raw FileNotFoundError from open(); "refactor" claims behavior preservation, which
      makes the log auditable, and the claim here is unverified.
    because_source: agent-synthesis
    evidence: "day-020:L32013"
    taught_or_enforced: taught-once
    skill_target: tdd-bdd
    overlap: "canonical §2.6"
    feasibility: ok

  - rule_id: d020s5-R10
    rule: >-
      Stage files explicitly by name; never `git add .` and never `git add -u`.
    because: >-
      Blanket staging is the same defect the constitution names, and it hides what is being
      committed behind a later diff review that may not happen.
    because_source: agent-synthesis
    evidence: "day-020:L31996"
    taught_or_enforced: repeated
    skill_target: claude-md
    overlap: "CLAUDE.md <git_workflow>"
    feasibility: ok

  - rule_id: d020s5-R11
    rule: >-
      When reporting CI, report the warnings you read, not only the pass/fail verdict; if you
      could not extract the number you set out to extract, say the check is incomplete.
    because: >-
      The agent declared 100% coverage in CI from inference after four failed log greps, and
      only reported the pre-commit deprecation warning once the author asked whether one existed.
    because_source: user-verbatim
    quote: "are there any deprication warning about GH actions anywhere ? I though I saw something like that somewhere"
    evidence: "day-020:L32115"
    taught_or_enforced: needed-enforcement
    skill_target: pair-programming
    overlap: none
    feasibility: ok

  - rule_id: d020s5-R12
