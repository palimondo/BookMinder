file: day-015
date: 2025-07-03
agent_era: gemini-cli
model: "gemini-2.5-pro at start (CLI 0.1.9, /about at day-015:L31-33). Auto-downgraded to gemini-2.5-flash mid-session at day-015:L1717 with the visible 'Slow response times detected' banner; the user never acknowledged it in-session and only diagnosed it afterwards (day-015:L3741 'we at the end could not fix the issues with Flash, we need Pro model'). Confirmed by /about at L3674. Session totals (L3717-L3718): pro 51 reqs / 3,342,082 input tok, flash 70 reqs / 8,789,942 input tok. Tail session downgraded again at L3785 after a single Pro request."
sub_sessions:
  - "L1-L3720: main session — 3h07m wall, 1h10m agent-active, 105 tool calls (81 ok / 24 fail, 77.1% success), user agreement 61.9% of 63 reviewed. Contains the Pro-to-Flash downgrade at L1717."
  - "L3722-L3861: tail session — recovery attempt, asked for a summary of day-015 itself, downgraded to Flash again at L3785, user quit after 2 tool calls (1 ok / 1 fail)."

philosophy:
  - statement: The human is a callable oracle for observations the agent cannot verify; before adopting a more complicated model, spend a turn asking the human to adjudicate the anomalies that motivated it.
    source: user-verbatim
    quote: "Use me, human, to review the edge-cases that complicate the simple hypothesis that ZSTATE=3 is cloud."
    loc: "day-015:L440-L441"
    feeds: judge-anchor
  - statement: Simplicity is the null hypothesis — conflicting data points are suspected of being transcription errors and confirmed with the human before they are allowed to force a more complex data pattern.
    source: user-verbatim
    quote: "if there are other conflicting data points, let me confirm them before we jump to conclusion that a more complicated data pattern is necessary to find Cloud books!"
    loc: "day-015:L444-L446"
    feeds: skill-why
  - statement: Domain research is finished and written down before implementation is touched — the learning is the deliverable of the research phase, not a by-product of making a test pass.
    source: user-verbatim
    quote: "But while we are analyzing the ZSTATE, we should first properly finish documenting our learning about \"ZSTATE Values for Cloud Status\" from our \"Research Backlog\"! Tell me all we know about it"
    loc: "day-015:L639-L640"
    feeds: skill-why
  - statement: The story cards are the completeness criterion for domain research — documentation is done when it covers every acceptance criterion in the backlog, not when the current failing test is explained.
    source: user-verbatim
    quote: "We should make sure our documentation will cover all cases we need to implement for @stories/discover/*"
    loc: "day-015:L691"
    feeds: skill-why
  - statement: A test fixture is a reduced copy of observed production data, never a hand-authored artifact — an invented fixture encodes the agent's beliefs and can be silently wrong in exactly the place the spec is supposed to be falsifiable.
    source: user-verbatim
    quote: "The test fixture was created by you (Gemini) or Claude in some of the previous sessions and might very well be incorrect. I would preffer if we could later establish the test fixture by copy of my full database which we'll reduce to a minimal set of books required to cover our test cases."
    loc: "day-015:L1314-L1316"
    feeds: judge-anchor
  - statement: An unknown schema is triangulated from both ends — UI-to-DB (what does this screen show) and DB-to-UI (enumerate every distinct value and characterize it) — because either direction alone leaves values you have never seen.
    source: user-verbatim
    quote: "Overall, we shoud check all distinct values for ZSTATE and investigate it systematically from DB level up, in addition to our previous UI -> DB approach"
    loc: "day-015:L1317-L1318"
    feeds: skill-why
  - statement: When a spec's expectation and the data disagree, the expectation is the requirement — fix the data, not the assertion.
    source: user-verbatim
    quote: "No, let's correct the incorrect data in the fixture"
    loc: "day-015:L2132"
    feeds: judge-anchor
  - statement: Disconfirming one sub-hypothesis does not license discarding the model; name precisely what is now established and what is still unknown.
    source: user-verbatim
    quote: "We don't know if the other books in the series that I don't own are listed in my database and we don't know what's the relation betweeen the Series entry and the Books in the series."
    loc: "day-015:L1644-L1645"
    feeds: judge-anchor
  - statement: A procedure is documented only after it has been executed successfully — and it is documented tersely, because the agent, not the human, is its future reader.
    source: user-verbatim
    quote: "let's test it first, if it works, you can document it without much explanation, you'll be the one using it in the future"
    loc: "day-015:L2423"
    feeds: skill-why
  - statement: Tooling the project builds for itself must be portable by construction — no machine, no username, no absolute home path baked in.
    source: user-verbatim
    quote: "First document the transfer script; make sure it's portable and not specific to my machine and user!"
    loc: "day-015:L2743"
    feeds: skill-why
  - statement: A regression has a cause; when something that worked stops working, the move is differential debugging, not substituting a hardcoded value for the failing expression.
    source: user-verbatim
    quote: "debug your script How come it worked before and not it is failing!?!?"
    loc: "day-015:L3638"
    feeds: judge-anchor
  - statement: Pretrained world-knowledge about a domain is a hypothesis generator, never evidence about this user's data — the user's account of how a book entered the library overrides any inference from the book's publishing history.
    source: user-verbatim
    quote: "I appreciate your knowledge of Doctorow's work and correctly identifying the series, but Cory is principaled about working with stores that require DRM for books"
    loc: "day-015:L1101-L1102"
    feeds: judge-anchor
  - statement: Exploration must not deform the product; the agent that cannot probe safely should say so and negotiate a workaround rather than instrument the implementation.
    source: user-verbatim
    quote: "DO NOT FUCKING TOUCH OUR IMPLEMENTATION for exploratory probing of databases. Describe what is your issue, we'll find a workaround together."
    loc: "day-015:L1217"
    feeds: judge-anchor
  - statement: The author tracks the agent's operational envelope more accurately than the agent does, and corrects the agent's model of its own capabilities.
    source: user-verbatim
    quote: "I can't see how you would be able to use the sqlite3 in interactive mode -- you can only execute the commands. You currently do not have any MCP server that would facilitate a statefull session for you"
    loc: "day-015:L1249-L1250"
    feeds: judge-anchor

skill_rules:
  - rule_id: d015-R1
    rule: Never edit production code to add debug printing or exploratory queries; probe with the database/CLI tool directly, or state the obstacle and ask for a workaround.
    because: Instrumenting the implementation corrupts the very suite you are using to judge it and leaves debris in the product.
    because_source: user-verbatim
    quote: "DO NOT FUCKING TOUCH OUR IMPLEMENTATION for exploratory probing of databases."
    evidence: "day-015:L897-L926, L1070-L1089, L1211-L1214, L1217-L1218"
    taught_or_enforced: needed-enforcement
    skill_target: tdd-bdd
    overlap: none
    feasibility: ok
  - rule_id: d015-R2
    rule: When a spec fails because the fixture lacks the datum the spec names, change the fixture — never rewrite the assertion to name whatever datum happens to be present.
    because: Rewriting the expectation to match the data destroys the requirement the spec encoded and makes the test unfalsifiable against the real behaviour.
    because_source: user-verbatim
    quote: "No, let's correct the incorrect data in the fixture"
    evidence: "day-015:L1060-L1061, L1094-L1096, L1099, L2120-L2129, L2132"
    taught_or_enforced: needed-enforcement
    skill_target: tdd-bdd
    overlap: "canonical §2.7 (same it_ name, weaker assertion, is the most dangerous edit in the suite) and §2.3 (assertion strength maximal per kind)"
    feasibility: ok
  - rule_id: d015-R3
    rule: Populate test fixtures by copying complete rows out of the real database and reducing to the minimal set the scenarios need; never hand-write rows or invent field values.
    because: A hand-authored fixture records the agent's guesses, so any spec that passes against it is only checking the guess.
    because_source: user-verbatim
    quote: "No manual inserts. Let's extract the script into a .sh in `fixtures` directory."
    evidence: "day-015:L1314-L1318, L2139-L2181, L2461-L2463, L2926-L2927"
    taught_or_enforced: repeated
    skill_target: tdd-bdd
    overlap: "canonical §2.2 (each persona home encodes one environmental hypothesis, observed on a real machine rather than imagined)"
    feasibility: ok
  - rule_id: d015-R4
    rule: "Treat the fixture BKLibrary sqlite as needing the real schema verbatim: 108 columns (Z_PK … ZFINISHEDDATEKIND, including the ZAUTHORNAMES/ZGENRES/ZNARRATORNAMES BLOBs) plus all ten indexes, taken from `.schema ZBKLIBRARYASSET` on the live database."
    because: The legacy fixture had only 20 hand-picked columns, so every attempt to transfer a real row failed with column-count and no-such-column errors.
    because_source: user-verbatim
    quote: "The problem is that the test fixture was created \"manually\" by you or Claude and you didn't transfer the complete schema. We need to fix that.\nWe need to create a new fixture DB with complete schema matching the real DB."
    evidence: "day-015:L2144-L2168 (20-column fixture), L2510-L2543 (real schema), L2444, L2618, L2899-L2903, L2461-L2463"
    taught_or_enforced: taught-once
    skill_target: project-memory
    overlap: none
    feasibility: ok
  - rule_id: d015-R5
    rule: "Copy a book between the real database and a fixture with `ATTACH DATABASE` plus an explicit column list that omits Z_PK, generated at run time from `PRAGMA table_info(ZBKLIBRARYASSET)`; do not use `.mode insert` piping or `SELECT *`."
    because: "`SELECT *` carries Z_PK and mismatches the target arity; the ATTACH form is the only one that actually completed and was verifiable."
    because_source: user-paraphrase
    evidence: "day-015:L2383-L2409 (.mode insert attempt), L2444 (parse error), L2687-L2734 (ATTACH works, verified), L3249-L3275 (script), L2926-L2927"
    taught_or_enforced: taught-once
    skill_target: project-memory
    overlap: none
    feasibility: ok
  - rule_id: d015-R6
    rule: "Record the ZSTATE vocabulary as observed in the real library: 1 = local book, 3 = cloud book, 6 = cloud sample, 5 = the Series entity itself AND the unowned books of that series, all joined by ZSERIESID; NULL is not a legal value."
    because: "`SELECT DISTINCT ZSTATE` on the live database returned exactly {3,1,5,6} and the ZSERIESID join produced the Hainish container plus its two unowned titles."
    because_source: agent-synthesis
    evidence: "day-015:L1371-L1378 (distinct values), L1539 (206 rows at ZSTATE=5), L1708-L1715 (ZSERIESID join), L1721-L1728, L2099-L2109 (documented)"
    taught_or_enforced: taught-once
    skill_target: project-memory
    overlap: "canonical §1 (the ZSTATE×ZISSAMPLE truth table in unit specs is the later, falsifiable form of this knowledge)"
    feasibility: ok
  - rule_id: d015-R7
    rule: "Distinguish the Series entity from an unowned series book by ZTITLE (the entity's ZTITLE is the series name, e.g. 'Hainish'), never by ZAUTHOR — 'MultipleAuthors' is a red herring."
    because: The author rejected the author-field heuristic outright and pushed the discriminator onto the entry/seriesid structure.
    because_source: user-verbatim
    quote: "I don't think that's the correct differentiation criteria, it must be something with the entries and seriesid, the Multiple Authors is definitely a red herring"
    evidence: "day-015:L2070-L2085, L2092-L2094, L2105-L2108"
    taught_or_enforced: needed-enforcement
    skill_target: project-memory
    overlap: none
    feasibility: ok
  - rule_id: d015-R8
    rule: "Treat the 'Want to Read' shelf as unread-or-sample (ZREADINGPROGRESS = 0.0 and ZISFINISHED not 1, OR ZSTATE = 6 / ZISSAMPLE = 1) and treat its ordering as an OPEN question — ZCREATIONDATE was not established as the sort key."
    because: The composition held for all seven observed titles, but the ordering conclusion recorded in the docs rests on an arithmetic error (see failure_modes) and was never re-derived.
    because_source: user-verbatim
    quote: "You are correct about New, unread books appearing in this list. But Want to Read includes also Sample books. We should try to find out what orders them into this list."
    evidence: "day-015:L1599-L1606, L1642-L1643, L1888-L1898, L1933-L1938, L2034-L2047"
    taught_or_enforced: taught-once
    skill_target: project-memory
    overlap: none
    feasibility: ok
  - rule_id: d015-R9
    rule: Do not write a command, script, or one-liner into the documentation until you have executed it and shown the output that proves it worked.
    because: The author explicitly gated documentation on a successful run, and the untested one-liner that had already been drafted turned out not to work at all.
    because_source: user-verbatim
    quote: "let's test it first, if it works, you can document it without much explanation, you'll be the one using it in the future"
    evidence: "day-015:L2414-L2424, L2441-L2446, L3444-L3467, L3516-L3518"
    taught_or_enforced: needed-enforcement
    skill_target: project-memory
    overlap: "CLAUDE.md <file_operations> (verify each development step in isolation; test commands in fresh shells)"
    feasibility: ok
  - rule_id: d015-R10
    rule: Repo scripts take the user and the subject as parameters and derive every path from $HOME plus one shared base constant; never hardcode /Users/<name> or a fixed database filename.
    because: The author restated portability three times and the third time in capitals, after each 'fix' replaced a relative path with an absolute one.
    because_source: user-verbatim
    quote: "STOP FUCKING UP THE RELATIVE PATHS WITH ABSOLUTE ONES!!!!!!"
    evidence: "day-015:L2743, L3203-L3206, L3356-L3357, L3474-L3486, L3629-L3635, L3638"
    taught_or_enforced: needed-enforcement
    skill_target: project-memory
    overlap: "canonical §2.3 (never depend on the developer's machine) and CLAUDE.md <file_operations> (test project setup on a clean environment)"
    feasibility: ok
  - rule_id: d015-R11
    rule: A script has one job — copying rows is not the same script as creating the schema; split them rather than growing one script that also rebuilds and replaces the fixture.
    because: The author refused the combined script the moment it appeared, because a copy tool that also recreates and moves the fixture cannot be run safely.
    because_source: user-verbatim
    quote: "this script shoudl only copy books, it does not need to re-create the table with the schema, we did that sucessfully before and if necessary, then it should be in a script of its own!"
    evidence: "day-015:L3113-L3197 (combined script, incl. an unexecuted `mv` over the tracked fixture at L3194), L3203-L3206, L3222-L3283"
    taught_or_enforced: needed-enforcement
    skill_target: tdd-bdd
    overlap: "CLAUDE.md <core_philosophy> (minimize code; simple solutions) — no rule at HEAD about single-purpose scripts"
    feasibility: ok
  - rule_id: d015-R12
    rule: Before answering a question that depends on unknown domain values, run a query that enumerates every distinct value of the column and characterize each one, rather than reasoning from the values you have already seen.
    because: The author redirected the whole investigation to the DB-first direction and it immediately produced the ZSTATE=5 breakthrough that UI-first analysis had missed for three sessions.
    because_source: user-verbatim
    quote: "Overall, we shoud check all distinct values for ZSTATE and investigate it systematically from DB level up, in addition to our previous UI -> DB approach"
    evidence: "day-015:L1317-L1318, L1349-L1378, L1536-L1541, L1696-L1715"
    taught_or_enforced: taught-once
    skill_target: project-memory
    overlap: "canonical §2.4 (defensive code needs demonstrated evidence in the actual data — not 'could this be NULL?' but 'is it NULL in the data I have?', answered by querying the real database) — this session is the episode where the NULL question was actually put to the real database"
    feasibility: ok
  - rule_id: d015-R13
    rule: Validate domain documentation against every card in stories/discover/ and state, per card, the concrete database predicate that satisfies its acceptance criteria, for the user to check.
