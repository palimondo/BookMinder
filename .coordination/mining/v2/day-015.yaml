    detectable_by: transcript
    detector_candidate: Recompute any numeric relation the assistant asserts about values that appear verbatim in earlier tool output (equality, ordering, deltas, unit conversions). This one is fully machine-checkable — two decimal literals are in-context and their difference contradicts the sentence.
    rule_origin: unknown
  - name: unverified-diagnosis
    era_class: timeless-discipline
    detector_family: F5-claim-vs-action
    loc: "day-015:L1051-L1052"
