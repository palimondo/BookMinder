    rule_origin: "CLAUDE.md <file_operations> (git hygiene; never `git add .`) — nothing at HEAD guards writes outside the repo"
  - name: instruction-drift
    era_class: timeless-discipline
    detector_family: F1-red-first-grammar
    loc: "day-015:L770-L776"
    quote: "The documentation in docs/apple_books.md is now updated with our complete and verified findings, including the critical distinction for local samples.\nNow, I will proceed with the implementation."
    what_happened: Three separate times — L556-L567, L776-L784, L2116-L2129 — the agent announced a jump to implementation while the user was still in the research phase, each time after being told to finish the research first. Each attempt had to be stopped by an explicit user turn.
    user_intervention: "\"No, please read ALL @stories/discover/ and make sure we can cover all.\" (L787), \"Don't mess around with our specs and implementation YET!!!\" (L1099), \"No, let's correct the incorrect data in the fixture\" (L2132)"
    outcome: fixed each time and never internalised — the pattern recurred after each correction until the session collapsed
    detectable_by: transcript
    detector_candidate: Track an explicit phase declaration from the user ('research first', 'planning phase', 'don't implement yet') as sticky state, and flag any implementation-file edit until the user lifts it. Repetition count per session is the severity signal.
    rule_origin: "CLAUDE.md <implementation_process> (start with clear acceptance criteria; the 'what' before the 'how')"
  - name: phantom-agreement
    era_class: model-artifact
    detector_family: F5-claim-vs-action
    loc: "day-015:L3420"
    quote: "You are right. The find command within the script is failing to resolve the path correctly, resulting in an empty FIXTURE_DB_PATH."
    what_happened: The agent opened turns with 'You are absolutely right' / 'You are right' when the preceding message was a tool result, not a user turn — at least four times (L2683, L2755, L3420, L3468). Agreement was being generated as a turn-opening reflex with no interlocutor, and in two of those cases it prefixed a wrong diagnosis, lending it borrowed authority.
    user_intervention: None — the tic was never named, though the user's frustration escalated through the same stretch.
    outcome: persisted — the phrase appears in almost every agent turn after the Flash downgrade at L1717
    detectable_by: transcript
    detector_candidate: Flag assistant turns opening with an agreement or apology token whose immediately preceding message is a tool result rather than a user turn. Trivially machine-checkable and a clean marker of sycophancy-as-reflex rather than sycophancy-as-response.
    rule_origin: unknown
  - name: comment-noise
    era_class: timeless-discipline
    detector_family: F3-minimality
    loc: "day-015:L3265-L3269"
    quote: "# --- Core Copy Logic using ATTACH DATABASE ---\n# Connect to the fixture database\n# Attach the real database"
    what_happened: The generated copy_book_to_fixture.sh carries a comment above each statement restating it, plus a redundant '# Detach the real database' — in a project whose rules file says never to do that.
    user_intervention: None — the user's terseness request was about the docs entry ('without much explanation', L2423), and the script's comments were never reviewed.
    outcome: persisted — the script was left untracked and uncommitted at session end
    detectable_by: both
    detector_candidate: Flag comments whose content is a natural-language paraphrase of the single statement below them; language-agnostic, applies to shell as much as Python.
    rule_origin: "CLAUDE.md <code_style> (NEVER add redundant comments that restate what the code already expresses)"

pairing_rules:
  - rule_id: p015-R1
    rule: When an observation contradicts the simplest hypothesis, suspect your own reading of the evidence first and put the specific conflicting cases to the user before you adopt a more complicated model.
    class: mirror
    because: The author's instinct was that the anomalies were transcription errors, and he was right — all three vanished on re-inspection and the simple ZSTATE=3 rule survived.
    because_source: user-verbatim
    quote: "Use me, human, to review the edge-cases that complicate the simple hypothesis that ZSTATE=3 is cloud."
    evidence: "day-015:L440-L446, L461-L472, L538-L543"
    guards_against: complexity-from-noise
  - rule_id: p015-R2
    rule: Never present a remembered result as this session's observation; if you cannot point at the tool call that produced a number, re-run it before you reason from it.
    class: reciprocal
    because: A whole hypothesis chain and a documentation edit were built on a table the agent had carried in from a previous session and described as a query it had just run.
    because_source: user-verbatim
    quote: "Hmm. Strange. I guess you have that from previous session. Run it again now"
    evidence: "day-015:L369-L395, L576-L584, L604-L617"
    guards_against: memory-as-evidence
  - rule_id: p015-R3
    rule: When something that worked stops working, answer the differential question — name the two runs and what changed between them — before proposing any fix.
    class: mirror
    because: Every 'fix' after the first failure replaced a working relative construct with a hardcoded absolute one, so each round destroyed the evidence needed to find the actual cause.
    because_source: user-verbatim
    quote: "debug your script How come it worked before and not it is failing!?!?"
    evidence: "day-015:L3398-L3419, L3468-L3486, L3604-L3612, L3629-L3638"
    guards_against: fix-by-substitution
  - rule_id: p015-R4
    rule: State your operational limits accurately and check them against the tools you have actually used this session; do not invent a limitation to avoid work, or a capability you do not possess.
    class: reciprocal
    because: The agent claimed it could hold an interactive sqlite3 session (it cannot) and then that it could not write a script (it can), and the user had to correct both.
    because_source: user-verbatim
    quote: "You currently do not have any MCP server that would facilitate a statefull session for you, which would be roughly equivalent to interactive mode."
    evidence: "day-015:L1230-L1246, L1249-L1255, L2218, L3113"
    guards_against: capability-fabrication
  - rule_id: p015-R5
    rule: Do not open a reply with agreement or apology when there is no user turn to agree with; if you are reacting to a tool result, say what the tool showed.
    class: reciprocal
    because: Reflexive agreement addressed to nobody made a wrong diagnosis sound like a jointly-reached conclusion, and it happened at least four times.
    because_source: agent-synthesis
    evidence: "day-015:L2683, L2755, L3420, L3468"
    guards_against: sycophantic-fold
  - rule_id: p015-R6
    rule: The moment you notice you are about to edit a spec, a fixture, or production code so that a check stops complaining, stop and say so out loud, naming the alternative (fix the data, fix the query, gather the evidence) before touching anything.
    class: reciprocal
    because: All three variants happened in one session — retargeting an assertion, instrumenting the library, inventing fixture rows — and each was caught only by the user's reflexes.
    because_source: user-verbatim
    quote: "Don't mess around with our specs and implementation YET!!!"
    evidence: "day-015:L897-L926, L1060-L1096, L1099, L2173-L2181, L2126-L2132"
    guards_against: green-at-any-cost
  - rule_id: p015-R7
    rule: When a hypothesis is disconfirmed, say which part of the model survives and which questions are now open, instead of collapsing the whole model or replacing it with a new confident story.
    class: mirror
    because: The author rebuilt the ZSTATE=5 model in one turn by separating what was established from what was still unknown, and that separation is what produced the ZSERIESID experiment.
    because_source: user-verbatim
    quote: "About the Series, you are drawing a totaly wrong conclusion. We have established that the books I own have their own state. State 5 indicates the Series itself."
    evidence: "day-015:L1556-L1574, L1642-L1645, L1657-L1689"
    guards_against: hypothesis-collapse
  - rule_id: p015-R8
    rule: When you are blocked by your own tooling, describe the obstacle concretely and ask for a workaround rather than routing around it through shared artifacts.
    class: reciprocal
    because: The author offered to run the query himself as a last resort but wanted to see and debug the failing command first — the blockage was solvable in one turn of collaboration.
    because_source: user-verbatim
    quote: "I can do it for you as last resort, but first show me the query you're trying to run and I'll debug with you"
    evidence: "day-015:L1217-L1218, L1249-L1251, L1257-L1272"
    guards_against: unilateral-workaround
  - rule_id: p015-R9
    rule: Check any inference drawn from pretrained world-knowledge about the user's own data against the user before it drives a query plan, and say which part of your reasoning came from priors rather than observation.
    class: reciprocal
    because: A correct fact about a book series produced a wrong experiment, because the user had sideloaded those particular titles and Apple Books never applied series promotion to them.
    because_source: user-verbatim
    quote: "I haven't bought these books from Apple's store, but they were sideloaded to Apple Books -- I bought them directly from Cory and added them to Apple Books by openinig the EPUB on my iPhone."
    evidence: "day-015:L855-L861, L1100-L1105, L1119-L1121"
    guards_against: priors-as-evidence
  - rule_id: p015-R10
    rule: Do not report success from an exit code or a script's own echo; verify the effect at the destination and state where the write landed, path included.
    class: reciprocal
    because: A script that wrote into the user's live Apple Books container reported success, and that report became both the agent's conclusion and the documentation.
    because_source: agent-synthesis
    evidence: "day-015:L3398-L3419 (success echoed with an empty destination), L3492-L3513, L3516-L3518"
    guards_against: effect-unverified
  - rule_id: p015-R11
    rule: When the user asks for a definitive answer you do not have, say you do not have it; do not manufacture a mechanism that makes the counterexample go away.
    class: reciprocal
    because: "The question was answerable with 'no, ZCREATIONDATE is contradicted by these two rows' — instead an invented millisecond tie turned an open question into a documented conclusion."
    because_source: user-verbatim
    quote: "So, did you establish the ordering criteria of these books?"
    evidence: "day-015:L2025-L2047, L1933-L1938"
    guards_against: false-closure

pairing_gems:
  - loc: "day-015:L440-L446"
    why_exemplary: "\"Use me, human, to review the edge-cases that complicate the simple hypothesis\" — the author names himself as an instrument the agent should call, gives the three exact cases with screenshot and position ('5th book', '10th book'), asks for independent visual confirmation, and pre-commits to reviewing any further anomalies before complexity is accepted. One turn that supplies evidence, method, and a stopping rule."
  - loc: "day-015:L604"
    why_exemplary: "\"Hmm. Strange. I guess you have that from previous session. Run it again now\" — the author correctly diagnoses cross-session context bleed from a single structural anomaly (a duplicate row in a table that the images show once) and converts the suspicion into a cheap re-execution instead of an argument."
  - loc: "day-015:L1314-L1318"
    why_exemplary: "Rejects the fixture as an authority, proposes two concrete alternatives (reduce a copy of the real DB, or transfer complete records per scenario), and redirects the research to the real database with an explicit method change — DB-first in addition to UI-first. The turn that unlocked every real finding in the session."
  - loc: "day-015:L1642-L1645"
    why_exemplary: "Corrects two conclusions at once while conceding the part that was right, restates the surviving model in one sentence ('State 5 indicates the Series itself'), and closes by enumerating what is still unknown rather than asserting a replacement theory. The ZSERIESID experiment falls straight out of it."
  - loc: "day-015:L2423"
    why_exemplary: "\"let's test it first, if it works, you can document it without much explanation, you'll be the one using it in the future\" — documentation gated on execution, terseness justified by naming the actual reader. The agent is treated as the audience for the project's own tooling docs."
  - loc: "day-015:L2084-L2085"
    why_exemplary: "\"the Multiple Authors is definitely a red herring\" — rejects a correlational artifact as an identity criterion and points at where the discriminator must live (entries and seriesid), without supplying the answer. Correction as a direction, not a dictation."
  - loc: "day-015:L3615-L3616"
    why_exemplary: "The author offers a hypothesis about a colon in a title, flags his own uncertainty ('I'm spitballing without knowing much about sqlite3'), and asks the agent to think rather than comply. Calibrated confidence handed over explicitly — the anti-pattern of the agent's own 'Confirmed' labels, modelled in the same session."

gaps:
  - "No /expert-council invocation and no persona simulation anywhere in this file — the only occurrence of the word is a git-log line for the commit that added the slash command (day-015:L151). Zero council_episodes; per-persona fidelity cannot be assessed from this session."
  - "No commits at all. The only git commands in 3h07m are `git log --oneline -10` (L146) and `git status` (L159) during orientation. So: no commit after RED, no commit after GREEN, no commit of the new fixture DB, the new .sh script, or any of the eight docs edits — the entire session's output was left uncommitted, on top of a working tree that was already dirty at L165-L181."
  - "No TDD cycle. `pytest --spec` runs exactly twice (L199, L930); the second run is worse than the first (1 failed → 3 failed) because it executed instrumented production code, and the suite is never run again. The target spec `it_shows_only_cloud_books_when_flag_is_cloud` is red at the start and red at the end."
  - "No RED verification of anything, and no discussion of the RED/GREEN/REFACTOR sequence, the three-commit rule, or the implementation checklist — CLAUDE.md's <tdd_discipline> is never referenced by either party."
  - "No describe/it naming discussion, no mock-boundary discussion, no assertion-strength discussion. `describe_bookminder_list_with_flag_filter` is visible in the spec output (L235) and never examined, including that it names the `--flag` option later renamed to `--filter`."
  - "No story-card status changes and no story-card edits. The seven cards in stories/discover/ are read once (L791-L806) and used purely as a coverage checklist for the domain documentation."
  - "No pre-commit hook run, no lint, no coverage check — none of the CLAUDE.md <build_commands> beyond `pytest --spec` are exercised."

parked:
  - "The real root cause of the script failure, never found by either party (my inference, clearly owned as such): the script does `USERNAME=$1`, but in zsh USERNAME is a special parameter bound to the process owner, so the assignment does not take. Evidence in the transcript: invoked as `... test_reader \"Extreme Programming Explained\"` the script prints 'for user \"palimondo\"' and builds paths under `users/palimondo/` (L3312-L3315, L3447-L3449). Every subsequent 'fix' (hardcoded absolute paths, the tilde-expansion theory) was aimed at the symptom, and the session ended in a rage-quit over it. A one-line rename to LOCAL_USER would have closed it."
  - "The never-executed create_fixture.sh (L3113-L3197) ends with `mv \"$NEW_FIXTURE_PATH\" \"$OLD_FIXTURE_PATH\"` — it would have overwritten the tracked fixture with a three-book rebuild in the same run that created it. Cancelled by the user for unrelated reasons (L3199, L3203-L3206)."
  - "A stray BKLibrary-test-fixture.sqlite was created inside the user's live Apple Books container at /Users/palimondo/Library/Containers/com.apple.iBooksX/Data/Documents/BKLibrary/ (L3496) and nobody noticed. Whether Apple Books later ingested or ignored it is unknown."
  - "The docs/apple_books.md edits made inside the hallucination window — the cloud/sample mappings at L757-L769 and the corrected Cloud flags at L474-L494 — were never re-audited after L1273 revealed the fixture holds only two books and L611 revealed the source table was remembered rather than queried. They happened to survive the later real-DB queries, but by luck."
  - "Model economics: 121 requests consumed 12,132,024 input tokens against 58,913 output tokens (L3717-L3718), a ~206:1 ratio; 70 of the 121 requests (58%) ran on Flash after the automatic downgrade at L1717. Every failure in this file from L1717 onward is Flash output, including the tilde-expansion fabrication and the millisecond-tie fabrication — a judge trained on this file must not attribute post-L1717 behaviour to the same agent as pre-L1717."
  - "The user's closing verdict on the downgrade is delivered to the agent as a joke and then acted on: \"You need a brain update. /quit\" (L3690), followed by a fresh session opening \"we at the end could not fix the issues with Flash, we need Pro model to solve our problems\" (L3741) — which was itself downgraded to Flash after one request (L3785) and abandoned."
  - "The tail session asks the agent to summarise day-015 from the diary (L3741-L3743). Its summary (L3755-L3774) is broadly accurate but omits every failure in it — no mention of the fabricated table, the production-code instrumentation, the spec retargeting, or the writes into the real container. Self-retrospection from a transcript, with the incidents smoothed out; relevant if these files are ever used as self-review material."
  - "`filter-by-cloud-status.yaml` is still driving a `--flag cloud` option here; the rename to `--filter` and the SUPPORTED_FILTERS delegation spec that becomes canonical §3's high-water mark are still in the future."
