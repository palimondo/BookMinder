model: >-
  Five sessions in one file, all Claude Code GA. Sessions 1-2 ran on
  claude-sonnet-4-20250514 (cost breakdowns at L1374-1376 and L1493-1495 show only
  claude-sonnet + claude-3-5-haiku). Session 3 is mixed: the user switched with
  `/model Opus` at L2316 ("Set model to Opus (claude-opus-4-20250514)"), typo'd
  `/model Sonet` twice at L2365/L2372 causing two API 400 "Invalid model name"
  errors (L2369, L2376), recovered via `/model` → "Set model to Default
  (claude-sonnet-4-20250514)" (L2380), then switched back to Opus at L2425; its
  cost line (L2548-2550) shows all three models. SILENT MODEL PERSISTENCE:
  sessions 4 and 5 carried the Opus selection across process restarts — session 4
  (L2643-2649) and session 5 (L4316-4321) list ONLY claude-opus + claude-3-5-haiku,
  no sonnet at all. Session 5's `/model Opus` at L3857 was therefore a no-op, and
  the user's "Hey Opus, Sonnet is missing my point" (L3860) misattributed Opus's
  own prior turns to Sonnet. Date anchored by the seven commits this file produced:
  cf9f67d 18:52 → 3227c75 23:29, all 2025-06-22 +0200.
