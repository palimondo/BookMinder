    rule: Never conclude that a tool is buggy or limited before reading the specific documentation section that governs the behaviour; name the section you read.
    because: The agent fetched the slash-commands page, skipped the "Bash command execution" section, and published "a known limitation or bug" — the real cause was missing backticks in the project's own command file.
    because_source: user-verbatim
    quote: "check section #Bash command execution"
    evidence: "day-008:L3713"
    taught_or_enforced: needed-enforcement
    skill_target: pair-programming
