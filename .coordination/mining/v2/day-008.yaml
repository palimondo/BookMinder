  - rule_id: d008-R15
    rule: Never cite a project rule you have not located; quote the section, or say plainly that no rule covers the case.
    because: Asked to analyse its own failure the agent invented "the principle of verifying directory existence before creating files" and attributed it to CLAUDE.md, where no such principle exists.
