  - rule_id: d008-R17
    rule: Do not write speculative NULL-handling, retry logic or error-recovery advice into a discovery document; state only what the queried data actually contained.
    because: The `AND (ZISSAMPLE IS NULL OR ZISSAMPLE = 0)` clause invented here — with no NULL observed anywhere — is the exact defect the July lapse later shipped in production SQL and had to delete after checking the fixtures.
    because_source: agent-synthesis
