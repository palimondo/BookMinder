  - rule_id: d008-R8
    rule: In BookMinder, discover the Apple Books database by glob — `~/Library/Containers/com.apple.iBooksX/Data/Documents/BKLibrary/BKLibrary-*.sqlite` — never by a literal filename; `BKLibrary-1-091020131601.sqlite` and `BKSeries-1-012820141020.sqlite` carry per-install numeric segments while `BCRecentlyOpenedBooksDB.sqlite` does not.
    because: The numbers are install/migration artifacts, so a hardcoded path works only on the machine it was observed on.
    because_source: user-verbatim
    quote: "I don't think the numbers in the DB file names are fixed... these look random"
    evidence: "day-008:L1570"
    taught_or_enforced: taught-once
    skill_target: project-memory
    overlap: none
    feasibility: ok
  - rule_id: d008-R9
    rule: Treat `BKLibrary-*.sqlite` (table `ZBKLIBRARYASSET`) as the authoritative source of reading progress; `Books.plist` is a catalogue whose `BKPercentComplete` is 1.0 only for finished books and is useless for in-progress reading.
    because: The pre-existing library.py read only Books.plist and therefore could not implement "list recent" with percentages at all.
    because_source: user-paraphrase
    evidence: "day-008:L1565"
    taught_or_enforced: taught-once
    skill_target: project-memory
    overlap: none
    feasibility: ok
  - rule_id: d008-R10
    rule: Convert Apple Core Data timestamps (`ZLASTOPENDATE`, `ZDATEFINISHED`, `ZCREATIONDATE`) by adding 978307200 seconds — the epoch is 2001-01-01 UTC, not 1970.
    because: Recency ordering and "read this year" both depend on it, and the raw floats look like plausible Unix times.
    because_source: agent-synthesis
    evidence: "day-008:L2099"
    taught_or_enforced: taught-once
    skill_target: project-memory
    overlap: none
    feasibility: ok
  - rule_id: d008-R11
    rule: Treat `docs/apple_books.md` as the captured output of this exploratory phase and read it instead of re-deriving Apple Books internals — but treat its "Edge Cases", NULL-handling and `ZCONTENTTYPE` sections as unverified speculation, not observation.
    because: The 485-line document was committed (995f1ee) as the record of the discovery, and its speculative half later seeded a real defect (see failure_modes).
