  - rule_id: d008-R16
    rule: Write only observed facts into a discovery document; mark every inference with its hedge and never restate a hedged claim as fact elsewhere in the same document.
    because: "`ZCONTENTTYPE` was written \"(likely: 1 = Book, 3 = PDF)\" and then asserted flatly 55 lines later; both forms are still in docs/apple_books.md at HEAD (lines 60 and 114-115), contradicting each other."
