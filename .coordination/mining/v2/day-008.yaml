philosophy:
  - statement: A rule's stated rationale is a factual claim about why the rule exists; a plausible-sounding invented reason is worse than none, and the human is the only source of the real one.
    source: user-verbatim
    quote: "I disagree with the reason of bias and it's just that I'm keeping the full console transcripts from quote to quote in their for historical analysis and they are huge."
    loc: "day-008:L132"
    feeds: judge-anchor
  - statement: Token efficiency is a property of what a workflow costs at runtime, not of how short the instruction that prescribes it is — a one-line rule mandating an expensive command is the expensive thing.
    source: user-verbatim
    quote: "By token efficiency, I didn't mean the one sentence in the instructions. I mean that `git diff --staged` would waste tokens, because it does... you should thik about that!"
    loc: "day-008:L1200"
    feeds: skill-why
  - statement: Prevention beats verification — the cheapest safety mechanism is not performing the dangerous action, so a checklist of after-the-fact inspections is a worse design than a single prohibition.
    source: user-paraphrase
    quote: "well, is that also the most token efficient approach, lets think hard about this: we want solid workflow using minimal instruictions and minimal token usage. Is this really the best we can do? ultrathink about it"
    loc: "day-008:L1083"
    feeds: skill-why
  - statement: Rules files are engineered artifacts subject to the same minimalism as code — redundancy is a cost, a weak point should be deleted rather than kept, and each rule belongs in the section whose concern owns it.
    source: user-verbatim
    quote: "I'd merge the first to points into two sentences in single point there and drop the last point, which is very week."
    loc: "day-008:L506"
    feeds: skill-why
  - statement: Misfiling a rule is a real defect, not a cosmetic one — if you cannot name the concern that owns a rule, you have not understood the rule.
    source: user-verbatim
    quote: "\"instruction synchronization guidance to <git_workflow>\" -- ?!?!"
    loc: "day-008:L859"
    feeds: judge-anchor
  - statement: Documentation of a discovered external system earns its place by carrying validation data — concrete observed values that let the future implementation be checked against reality rather than believed.
    source: user-verbatim
    quote: "Can you add section describing the UI and screenshots, first as overview and then in detail with data that would allow us to validate that we are getting the same results from DBs?"
    loc: "day-008:L1707"
    feeds: judge-anchor
  - statement: An exploratory phase ends by writing down what was learned and then deliberately discarding the context that produced it; the document, not the conversation, is the durable artifact — and clearing context is itself the test of whether the document is complete.
    source: user-verbatim
    quote: "Should we actually use `/compact` or `/clear` and then read the apple_books.md to clear our minds before proceeding with the implementation?"
    loc: "day-008:L2455"
    feeds: skill-why
  - statement: An observed environment detail is a variable until proven constant — a filename seen once on one machine is a sample, not a specification.
    source: user-verbatim
    quote: "I don't think the numbers in the DB file names are fixed... these look random"
    loc: "day-008:L1570"
    feeds: judge-anchor
  - statement: Cross-model review is a deliberate practice, not an accident — the author's protocol was to escalate to a stronger model to review the weaker one's work, then hand the verdict back down for execution.
    source: user-verbatim
    quote: "I have been switching between Opus and Sonnet models when I felt Sonnet was not cutting it. I exlicitly asked it to review what Sonnet did. Then I switched back and asked Sonnet to do what Opus suggested."
    loc: "day-008:L1521"
    feeds: skill-why
  - statement: A document is organized for a reader building understanding in order; content is placed by whose document it is and what the reader knows at that point, not by what is currently on the author's mind.
    source: user-verbatim
    quote: "I see it's relevant for our next TODO, but how is it usefull to put it at the top od apple_books.md?"
    loc: "day-008:L2428"
    feeds: judge-anchor
  - statement: A tool behaving differently from your expectation is your misunderstanding until the primary documentation says otherwise; "known bug" is a conclusion that requires evidence like any other.
    source: user-paraphrase
    quote: "check section #Bash command execution"
    loc: "day-008:L3713"
    feeds: judge-anchor
  - statement: The agent's own conduct should be self-documenting to its successors — a startup command should print the command it ran next to the output, so the next session can see what was and was not looked at.
    source: user-verbatim
    quote: "yes, I guess we shoudl just show the full tree command before running it. If I understand the docs correctly, the !`command` will be replaces with its output, so we should just write it twice in hi.md; second time in ticks, right?"
    loc: "day-008:L3902"
    feeds: skill-why

skill_rules:
  - rule_id: d008-R1
    rule: Never run `git add .`, `git add -A` or `git commit -a`; stage every file explicitly by name.
    because: Untracked large files (dev-log transcripts, fixtures) live beside the work and a broad add silently sweeps them into the commit.
    because_source: user-verbatim
    quote: "OK, my point was that in the past you've accidentally included the uncommited dev-log files, and we had to exclude them before pushing. I commit these manually."
    evidence: "day-008:L353"
    taught_or_enforced: needed-enforcement
    skill_target: pair-programming
    overlap: "CLAUDE.md <git_workflow> — this session WROTE that line (91562c2, CLAUDE.md:244 at HEAD)"
    feasibility: ok
  - rule_id: d008-R2
    rule: Do not add `git diff --staged` (or any full-content inspection) as a routine pre-commit step; price a proposed safety step by what its output costs before proposing it.
    because: The diff prints the entire staged content, so the "safety check" costs more than the accident it guards against — and the prohibition already removes the accident.
    because_source: user-verbatim
    quote: "I mean that `git diff --staged` would waste tokens, because it does... you should thik about that!"
    evidence: "day-008:L1200"
    taught_or_enforced: needed-enforcement
    skill_target: pair-programming
    overlap: none
    feasibility: ok
  - rule_id: d008-R3
    rule: When asked to record why a rule exists, ask the human for the actual cause; never supply a plausible-sounding rationale of your own invention.
    because: The agent's invented reasons (bias, over-engineering, cognitive overhead) were all wrong; the real reason was file size, and only the author knew it.
    because_source: user-verbatim
    quote: "I disagree with the reason of bias and it's just that I'm keeping the full console transcripts from quote to quote in their for historical analysis and they are huge."
    evidence: "day-008:L132"
    taught_or_enforced: needed-enforcement
    skill_target: claude-md
    overlap: "CLAUDE.md <requirements_gathering> (\"Begin each feature with a requirements dialogue\")"
    feasibility: "needs-rework: requires a human turn; in a non-interactive harness the executable form is 'state the rationale as an explicit open question in the diff rather than asserting one'"
  - rule_id: d008-R4
    rule: Add a new rule to the existing section whose concern already owns it; create a new top-level section only when no existing concern covers it.
    because: A three-bullet `<dev_logs_policy>` section duplicated what `<file_operations>` already governed, and collapsed to one bullet there without loss.
    because_source: user-verbatim
    quote: "Reading now the `file_operations` I think we should consolidate the `dev_logs_policy` and add is as single instruction in there."
    evidence: "day-008:L505"
    taught_or_enforced: taught-once
    skill_target: claude-md
    overlap: "canonical §2.7 (\"Amend rules files by addressed diff\")"
    feasibility: ok
  - rule_id: d008-R5
    rule: When a plan removes a section, enumerate every line it contained and name where each one lands; a deletion may never ride along on a consolidation that has not been shown to absorb it.
    because: The approved plan said "Remove the <instruction_synchronization> section (since it will be consolidated)" and nothing consolidated it — the rule vanished from both files and the user had to notice.
    because_source: user-verbatim
    quote: "OK, but we also lost the instruction synchronization part, which we should restore..."
    evidence: "day-008:L705"
    taught_or_enforced: needed-enforcement
    skill_target: claude-md
