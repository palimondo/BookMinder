  - rule_id: d008-R12
    rule: In a `.claude/commands/*.md` slash command, wrap every shell command in backticks after the bang — !`tree -h .` — and declare `allowed-tools` with per-command patterns, e.g. `Bash(tree:*), Bash(pytest:*), Bash(git log:*), Bash(git status:*), Read`.
    because: Bare `!tree -h .` is inert text; the /hi command silently delivered no project structure and the next session wasted turns rediscovering it with `find`.
    because_source: user-verbatim
    quote: "I think the syntax of allowed-tools a bit more nuanced"
    evidence: "day-008:L4105"
    taught_or_enforced: needed-enforcement
    skill_target: claude-md
    overlap: none
    feasibility: ok
  - rule_id: d008-R13
    rule: In a slash command, print each command as plain text immediately above its executed !`backtick` form.
    because: The bang form is replaced by its output, so without the echo the next session cannot tell which command produced the listing or what was excluded from it.
    because_source: user-verbatim
    quote: "yes, I guess we shoudl just show the full tree command before running it."
    evidence: "day-008:L3902"
    taught_or_enforced: taught-once
    skill_target: claude-md
    overlap: none
