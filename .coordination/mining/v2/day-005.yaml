model: "claude-sonnet (unversioned label in /cost; Sonnet-4 era, released 2025-05-22) with claude-3-5-haiku as background model. locs: day-005:L2222-2223, L2976-2977, L3116-3117. Haiku consumed 645k input vs Sonnet's 432 input / 12.4M cache-read — background/utility traffic, not a silent downgrade of the main loop."
