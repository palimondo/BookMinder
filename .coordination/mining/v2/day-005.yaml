    detector_candidate: "Flag proposed CLI flags, config keys, or tool options that never appear in any file read, `--help` output, or fetched doc in the session; require a citation-or-probe before a flag is offered as a solution. Cheap high-signal check: does the same option name change spelling across turns?"
