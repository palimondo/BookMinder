  - "The day-005 decision to delete `trailing-whitespace` and `end-of-file-fixer` persists at HEAD, and has since been extended: `ruff-format` is commented out entirely in .pre-commit-config.yaml. The project's formatting gate has been eroding since this session."
  - "CLAUDE.md <git_workflow> carries two rules whose provenance is this session: \"Never use `git add .`\" (from L2853) and \"Stage all files after running pre-commit hooks that modify files\" (from the L2497-L2954 thread). Neither commit message records the incident."
  - "The environment split (Mac mini + MacBook Air, L2082) is what made machine-dependence visible; the two-machine setup is itself a testing asset the project never named as one."
  - "Cost telemetry is dense here: $7.18 at L2217, $11.32 at L2971, $11.79 final at L3111 — ~$4.6 of the session went to the trailing-whitespace thread alone, which is why the author's frustration at L2497 is an engineering observation, not a mood."
  - "Branch `astral` fast-forward-merged to main at L1356 with no PR and no review; CI was added and immediately red on main (L1412) and stayed red for the remainder of the session. The walking skeleton had no green baseline at any point in this session."
  - "Agreement-opener density: 43 occurrences of \"You're absolutely right\" / \"You're right\" / \"Perfect!\" / \"Excellent\" across 47 user turns — roughly one per turn. Useful as a corpus-wide sycophancy baseline for the claude-code (Sonnet-4) era."
