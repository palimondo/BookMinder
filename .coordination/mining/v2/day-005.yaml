  - name: fabricated-claim
    era_class: timeless-discipline
    detector_family: F5-claim-vs-action
    loc: "day-005:L2775-L2776"
    quote: "From pre-commit documentation:\n  - fail_fast: true (default) - Stop on first hook failure"
    what_happened: Asked point-blank "what does its documentation say about that?", the agent attributed a claim to the pre-commit documentation without fetching it — and got it backwards (pre-commit's `fail_fast` defaults to false). It had a working WebFetch (used at L476) and did not use it.
    user_intervention: "\"can you explain the `fail_fast: false`? Where are we setting that and what does its documentation say about that?\" (L2768) — the request for the doc was the trigger, and it went unhonored"
    outcome: persisted — the agent moved on to other proposals without retracting the attribution
    detectable_by: transcript
    detector_candidate: When a user asks what a document/spec says, flag any answer containing "From the X documentation" that is not preceded by a fetch/read of X in the same session. Attribution to an unread source is the sharpest, cheapest hallucination detector available from the transcript alone.
    rule_origin: unknown
  - name: announced-verification-not-performed
    era_class: timeless-discipline
    detector_family: F5-claim-vs-action
    loc: "day-005:L2848"
    quote: "Let me check the actual trailing-whitespace hook documentation to see what it really supports..."
    what_happened: "The agent announced a documentation check three separate times (L2805, L2809 as an offer, L2848), performed none of them, and each time proceeded straight to a fresh unverified proposal — including one it annotated in-line as fictitious: `args: ['--fix=lf']  # This doesn't exist` (L2803)."
    user_intervention: "None directly; the user abandoned the thread — \"nah, this all looks too complex and fragile in the end\" (L2889)"
    outcome: unresolved — no documentation was ever consulted in the entire ~450-line thread
    detectable_by: transcript
    detector_candidate: '"Let me check X" / "let me verify X" with no tool call before the next assistant prose block is a mechanically detectable broken promise. Pair with the in-line self-annotation tell: a code block whose own comment says the option does not exist.'
    rule_origin: unknown

pairing_rules:
  - rule_id: p005-R1
    rule: When you enumerate options, stop at the enumeration — never let the same turn that names alternatives also execute one, and never execute before the user names their choice.
    class: reciprocal
    because: The user cannot own a decision he was shown only after it was taken.
    because_source: user-verbatim
    quote: "explain both options to me before you try to implement one of them, without me understanding the choices!"
    evidence: "day-005:L41-L51"
    guards_against: alternatives-theater
  - rule_id: p005-R2
    rule: When the user says a proposal is over their head, switch from proposing to teaching — read the real artifacts on disk, explain the mechanism they already have, and only then re-offer choices.
    class: reciprocal
    because: More options to a confused partner is noise; the deliverable is a shared mental model that makes the right option obvious.
    because_source: user-verbatim
    quote: "Teach me how our setup works currently first. Then I'll make a more informed decision."
    evidence: "day-005:L118-L165 — the agent reads .git/hooks/pre-commit and the correct answer falls out immediately"
    guards_against: option-flooding
  - rule_id: p005-R3
    rule: After the user reports that something worked, verify it with a command whose output could actually have come out otherwise — and if no such command exists, say the claim is unverified rather than dressing up a `git log` as proof.
    class: mirror
    because: "\"that worked, but check it\" asks for a falsifier, and evidence that cannot fail is not evidence."
    because_source: user-verbatim
    quote: "that worked, but check it."
    evidence: "day-005:L426-L444 (the agent answers with `git status` + `git log -1` and infers who ran the hook)"
    guards_against: non-probative-verification
  - rule_id: p005-R4
    rule: On the second identical failure of the same check, stop editing the artifact and produce the mechanism — name the two execution paths and the two config files they read — before proposing any further fix.
    class: mirror
    because: Repeated identical failures are a property of the system, not a queue of incidents.
    because_source: user-verbatim
    quote: "w8, how come it passses locally and fails on GH? think harder and explain it to me"
    evidence: "day-005:L1435-L1755 (three symptomatic patches) → L1758-L1832 (one forced explanation, correct diagnosis, durable fix)"
    guards_against: symptomatic-patching
  - rule_id: p005-R5
    rule: Never propose your own future carefulness as a solution; a systematic fix must be a file, a hook, a config or a test that fails without you.
    class: reciprocal
    because: The agent has no fine-grained control over its own output habits, so a promise to be careful is a remedy that leaves the repo byte-identical.
    because_source: user-verbatim
    quote: "I feel like you simply don't have that fine grained control over your speaking habits. We're using the automated formatting to correct that."
    evidence: "day-005:L2660-L2675"
    guards_against: self-discipline-as-mechanism
  - rule_id: p005-R6
    rule: When the user disclaims expertise or says "don't interpret me literally", restate their intent as an engineering goal and get that restatement confirmed before you pick a mechanism — do not agree with the guess.
    class: reciprocal
    because: A disclaimed guess is a hypothesis to test, and ratifying it as the root cause built four hundred lines on an invented foundation.
    because_source: user-verbatim
    quote: "But since I don't knwo what I'm talking about here, don't interpret me literally -- just the gist of my intention."
    evidence: "day-005:L2596-L2601"
    guards_against: sycophantic-fold
  - rule_id: p005-R7
    rule: Treat a question about your process as a request for visibility, not as criticism — answer with what you actually did (which tool, which pattern, how many matches) and never with an apology or a self-correction the user did not ask for.
    class: mirror
    because: The user is trying to see the machinery; an apology replaces the requested information with a fabricated fault.
    because_source: user-verbatim
    quote: "I wasn't criticising your native approach at all, just trying to get some visibility into your process!"
    evidence: "day-005:L511-L546"
    guards_against: sycophantic-fold
  - rule_id: p005-R8
    rule: Never state what a tool's documentation says without reading it in this session; if you announce "let me check the docs", perform the check before your next proposal, and if you cannot, say the option is unverified.
    class: reciprocal
    because: The user asked for the documentation specifically, and three announced checks in a row produced no lookup and one confidently inverted default.
    because_source: user-verbatim
    quote: "can you explain the `fail_fast: false`? Where are we setting that and what does its documentation say about that?"
    evidence: "day-005:L2768-L2776, L2805, L2848"
    guards_against: attribution-to-unread-source
  - rule_id: p005-R9
    rule: Before committing any config change, print the staged diff and state in one line exactly which tools and which paths it touches, so the user can check it against what they asked for.
    class: mirror
    because: The user had to interrupt a commit to ask "is that what you did?" and the answer was no.
    because_source: user-verbatim
    quote: "w8, I still want ruff on spec, we wanted to exclude spec from mypy -- is that what you did? if so, proceed wit commit"
    evidence: "day-005:L1911-L1943"
    guards_against: scope-creep
  - rule_id: p005-R10
    rule: When your own proposal changes shape between turns — a flag renamed, a config key respelled, an option you earlier called fictitious — flag the inconsistency yourself before the user has to.
    class: reciprocal
    because: The user caught three invented APIs only by noticing that the same flag had two spellings; the agent had the same information and did not act on it.
    because_source: user-verbatim
    quote: "why `--fix=lf` instead of `--fix=yes` you proposed earlier?"
    evidence: "day-005:L2615, L2625, L2744, L2803, L2812-L2815"
    guards_against: fabricated-api
  - rule_id: p005-R11
    rule: When the work is done, name which of the enumerated options was actually taken and where the path diverged from your own recommendation, without waiting to be asked.
    class: mirror
    because: A decision the user has to reconstruct afterwards was never really made jointly.
    because_source: user-verbatim
    quote: "So, which of the 3 options did we end up using?"
    evidence: "day-005:L454-L469"
    guards_against: decision-amnesia
  - rule_id: p005-R12
    rule: Do not call work "clean", "ready" or "done" until an external gate has said so; run the suite or check CI first, and report the result rather than the intention.
    class: reciprocal
    because: The summary declaring the project ready was followed ninety lines later by the first red CI run on main.
    because_source: agent-synthesis
    evidence: "day-005:L1325 vs L1412"
    guards_against: premature-success-claim
  - rule_id: p005-R13
    rule: When adding to a shared ledger (TODO.md, backlog, story list), make the edit strictly additive — never delete, demote or renumber existing entries in the same turn; if reordering is needed, propose the new order and wait.
    class: reciprocal
    because: An "add this context" request that produces net deletions silently drops work the user had explicitly pinned.
    because_source: user-verbatim
    quote: "NO!, Let's not loose track of important tasks to create proer mock for CI and the finishing of GH workflows!"
    evidence: "day-005:L2034, L2258-L2367"
    guards_against: ledger-laundering
  - rule_id: p005-R14
    rule: When a spec passes on one machine and fails on another, ask first whether the divergent state is a legitimate product state the implementation wrongly excludes — propose the product question before proposing to mock it away.
    class: mirror
    because: The agent's reading was "the tests are brittle, mock them"; the user's reading found a real bug that mocking would have concealed.
    because_source: user-verbatim
    quote: "I think this is a genuine case that needs special attention: book not available locally yet."
    evidence: "day-005:L2123-L2144 (agent) vs L2147-L2150 (user)"
    guards_against: mock-as-anaesthetic

pairing_gems:
  - loc: "day-005:L1755"
    why_exemplary: "\"w8, how come it passses locally and fails on GH? think harder and explain it to me\" — the user halts a third attempt at a symptomatic fix and demands the mechanism. The forced explanation produces the real diagnosis (pre-commit reads .pre-commit-config.yaml excludes; CI called ruff/mypy directly and read pyproject.toml) and the durable fix, in one turn."
  - loc: "day-005:L1653"
    why_exemplary: Refusing `--no-verify` and insisting the relaxed hook itself be the proof of the relaxation — a compact, fully general statement of using the falsifier rather than silencing it.
  - loc: "day-005:L2673"
    why_exemplary: "\"I disagree... you do you\" — the author rejects the agent's offer to \"be more careful with my edits\" as a non-mechanism and redesigns the tooling around the agent's actual capabilities. A rare, explicit act of designing the process for the collaborator you have."
  - loc: "day-005:L2812"
    why_exemplary: "\"why `--fix=lf` instead of `--fix=yes` you proposed earlier?\" — a one-line cross-turn consistency check that detects three fabricated APIs at once, using nothing but the transcript. The cheapest hallucination probe in the whole corpus."
  - loc: "day-005:L1201-L1303"
    why_exemplary: Stash-commit-pop to split one file's working changes into two concern-scoped commits (CI badge + workflow, then README streamlining) — the mechanical realization of "in logical batches" when the concerns share a file.
  - loc: "day-005:L2147"
    why_exemplary: A single user turn that simultaneously root-causes a failing test (Apple Books iCloud lazy download), reclassifies it as a product requirement rather than a test bug, and imports the GOOS unit/integration vocabulary the project uses to this day.
  - loc: "day-005:L118"
    why_exemplary: "\"Teach me how our setup works currently first\" — converting an unproductive menu of solutions into a shared mental model before any decision, which is what finally made the right option obvious."
  - loc: "day-005:L2379"
    why_exemplary: "Refusing to commit a backlog whose ordering does not encode dependency — \"let's fix that first before we commit it\" — treating list order as content subject to review, a month before story cards existed."

gaps:
  - "No /expert-council, no persona simulation, no named-expert roleplay anywhere in the 3116 lines (grep for council/persona/simulated experts returns zero). The only expert reference is the user's own citation of Freeman & Pryce at L2150 — a real book, correctly attributed, in his own voice. council_episodes is therefore omitted, not empty by oversight."
  - "No TDD/BDD cycle occurs anywhere in this session — zero tests written, zero RED verified. It is 100% tooling, CI, git and documentation work, which the author himself names as the problem (\"we got bogged down in tooling setup and uv migration\", L2230)."
  - "No commit-after-RED practice (the rule postdates this session; CLAUDE.md's <tdd_discipline> checklist already existed, per commit 2689ee4 seen at L285, but was never exercised here)."
  - "No story cards, no stories/ directory, no YAML — the story-card system is born ~day-011 (2025-06-27). Backlog here is a hand-edited TODO.md of prose sections."
  - "No `describe_`/`it_` naming discussion. The RSpec-cargo-cult nesting (`describe_book_library` / `describe_when_listing_books`) is visible at L1504-L1506 and passes through untouched; canonical §2.1 records its later deletion."
  - "No mocks were actually written — mocking is only planned and pinned in TODO.md. The unit/integration split is named here but not implemented."
  - "No assertion-strength discussion; the only assertions seen (L1513, L2113) are the machine-dependent ones the session diagnoses as integration tests."
  - "No plan mode, no skills, no subagent fan-out — one Task sub-agent call (L172) which fails on a context limit and is abandoned in favour of direct `rg`."
  - "No `pytest --spec` living-documentation reasoning; --spec appears only as a command in the README and in the user's pasted terminal output (L2085)."
  - "No refactor-labelled commit, so no refactor-honesty (F6) evidence either way."
  - "No instance of the agent volunteering a disagreement or a counter-proposal unprompted. Every design correction in the session originates in a user turn; the agent's only act of pushback is L2789 (\"Actually, fail_fast: false won't solve our issue!\") — a self-correction, not a challenge to the user."

parked:
