  - "L3099-L3117: post-compact empty tail (/compact, cost totals)"

philosophy:
  - statement: The user must understand a choice before the agent acts on it; implementation without comprehension is not collaboration.
    source: user-verbatim
    quote: "explain both options to me before you try to implement one of them, without me understanding the choices!"
    loc: "day-005:L51"
    feeds: skill-why
  - statement: When the user is out of their depth, the correct move is teaching the existing mechanism, not offering more solutions — understanding precedes decision.
    source: user-verbatim
    quote: "All of this looks too complex. I'm apparently also out of my depth when talking about git precommit hooks. Teach me how our setup works currently first. Then I'll make a more informed decision."
    loc: "day-005:L118"
    feeds: skill-why
  - statement: A fix is not validated until the real gate validates it; bypassing the gate to land the commit destroys the only evidence that the fix works.
    source: user-verbatim
    quote: "I'd preffer if we fixed that in the project setup first and used it to verify that our relaxation of rules for pre-commit check actually worked."
    loc: "day-005:L1653"
    feeds: judge-anchor
  - statement: Repeated identical failures are a signal about the system, not a queue of incidents — demand a root cause before accepting another patch.
    source: user-verbatim
    quote: "are the repeated formatting failures (in GH action and during our commit attempts) indication of some systematic issue in our setup?"
    loc: "day-005:L1554"
    feeds: judge-anchor
  - statement: Test kind is defined by what the test depends on, and the vocabulary is GOOS's — a spec run against the author's real Apple Books library is an integration test; unit tests are the mocked, machine-independent ones. This is the origin of the project's layer discipline.
    source: user-verbatim
    quote: "I think running against actual Apple Books environments on my two test machines should be treated like and integration test; while the mocks are necessary for our unit tests."
    loc: "day-005:L2148"
    feeds: skill-why
  - statement: A machine-dependent test failure is first a question about the product's requirements (is the excluded state a real user state?) and only second a question about the test.
    source: user-verbatim
    quote: "I think this is a genuine case that needs special attention: book not available locally yet."
    loc: "day-005:L2148"
    feeds: judge-anchor
  - statement: The product scope is a GOOS Walking Skeleton, and restraining the agent's creative feature invention is the explicit reason BookMinder exists as a second attempt after BookMind.
    source: user-verbatim
    quote: "In BookMinder I explicitly stopped you from running ahead with implementing the project with your own creative ideas as happened in BookMind. The initial task was to create just a Walking Skeleton (GOOS terminology)."
    loc: "day-005:L2228"
    feeds: skill-why
  - statement: A feature without an acceptance test is not a feature — the missing acceptance test, not the missing code, is what the author names as the gap in the first feature.
    source: user-verbatim
    quote: "We are also missing acceptance test for out first feature."
    loc: "day-005:L2226"
    feeds: skill-why
  - statement: Adapt the tooling to the collaborator's actual capabilities rather than demanding behavior it cannot reliably deliver — the author explicitly refuses the agent's offer to "be more careful", because self-discipline is not a mechanism.
    source: user-verbatim
    quote: "I feel like you simply don't have that fine grained control over your speaking habits. We're using the automated formatting to correct that. I'm also willing to adjust the formatter rules to tolerate your native way of talking."
    loc: "day-005:L2673"
    feeds: skill-why
  - statement: A rule whose enforcement costs more than the defect it prevents should be deleted, not automated around; complexity and fragility are themselves disqualifying.
    source: user-verbatim
    quote: "nah, this all looks too complex and fragile in the end. I'm leaning towards removing the formatter rules that trigger this failure."
    loc: "day-005:L2889"
    feeds: skill-why
  - statement: Take the intent, not the letter — the user flags when he is speaking outside his expertise and asks the agent to reason from the goal rather than execute the words.
    source: user-verbatim
    quote: "But since I don't knwo what I'm talking about here, don't interpret me literally -- just the gist of my intention."
    loc: "day-005:L2598"
    feeds: skill-why
  - statement: A backlog's ordering is part of its content — it must encode dependency, and the ordering is fixed before the list is committed, not after.
    source: user-verbatim
    quote: "That TODO list is not in logical order, let's fix that first before we commit it and compact the session"
    loc: "day-005:L2379"
    feeds: skill-why
  - statement: Deferral is an explicit, recorded act — a "pin" written into the ledger at the moment of deferral, not a dropped thread the agent may quietly reprioritize later.
    source: user-verbatim
    quote: "let's put a pin into that and come back to it. BTW there was a different pinned issue...  let's make sure they are at the top of our TODO.md"
    loc: "day-005:L2034"
    feeds: judge-anchor
  - statement: The pairing loop itself is a budgeted resource; token cost and context exhaustion are treated as first-class engineering constraints that shape how work is sequenced and when it is compacted.
    source: user-verbatim
    quote: "I hate wasting credits on repeated invocations of you, Claude, just to fix this shir every time."
    loc: "day-005:L2498"
    feeds: judge-anchor
  - statement: Questions about the agent's process are requests for visibility into the machinery, not criticism — the author wants an observable partner, and the agent's reflexive self-flagellation destroys that signal.
    source: user-verbatim
    quote: "I wasn't criticising your native approach at all, just trying to get some visibility into your process!"
    loc: "day-005:L546"
    feeds: judge-anchor

skill_rules:
  - rule_id: d005-R1
    rule: Present the options with their tradeoffs and obtain an explicit choice before executing any command that changes project or repo configuration.
    because: The user cannot own a decision he was never shown, and config changes are hard to see afterwards.
    because_source: user-verbatim
    quote: "explain both options to me before you try to implement one of them, without me understanding the choices!"
    evidence: "day-005:L46-L51"
    taught_or_enforced: needed-enforcement
    skill_target: claude-md
    overlap: "CLAUDE.md <requirements_gathering>"
    feasibility: ok
  - rule_id: d005-R2
    rule: When the user says a proposal is over their head, stop proposing and explain how the existing setup actually works, reading the real artifacts (.git/hooks/pre-commit, config files) rather than describing them from memory.
    because: An informed decision is the deliverable; solutions offered to a confused user are noise.
    because_source: user-verbatim
    quote: "Teach me how our setup works currently first. Then I'll make a more informed decision."
    evidence: "day-005:L118-L165"
    taught_or_enforced: taught-once
    skill_target: claude-md
    overlap: none
    feasibility: ok
  - rule_id: d005-R3
    rule: Never use `git commit --no-verify`; if a hook blocks the commit, fix the hook configuration and then use the hook itself to prove the fix works.
    because: Bypassing the check discards the only evidence that the relaxation was correct.
    because_source: user-verbatim
    quote: "the --no-verify flag turns off pre-commit hooks for a specific commit, right? I'd preffer if we fixed that in the project setup first and used it to verify that our relaxation of rules for pre-commit check actually worked."
    evidence: "day-005:L1647-L1695"
    taught_or_enforced: needed-enforcement
    skill_target: claude-md
    overlap: "CLAUDE.md <git_workflow>"
    feasibility: ok
  - rule_id: d005-R4
    rule: Run CI through the same entry point as local development (`pre-commit run --all-files`), never by invoking ruff/mypy directly, so both read one set of excludes.
    because: Two execution paths mean two configurations, and a green local gate that fails in CI is not a gate.
    because_source: user-verbatim
    quote: "are the repeated formatting failures (in GH action and during our commit attempts) indication of some systematic issue in our setup?"
    evidence: "day-005:L1554, L1755-L1847"
    taught_or_enforced: needed-enforcement
    skill_target: claude-md
    overlap: none
    feasibility: ok
  - rule_id: d005-R5
    rule: Classify each spec by what it depends on — a spec that reads the developer's real Apple Books library is an integration test, and only mocked, machine-independent specs may gate CI.
    because: The GOOS (Freeman and Pryce) vocabulary is the project's shared language, and mislabelling an integration test as a unit test is what made CI unreliable.
    because_source: user-verbatim
    quote: "running against actual Apple Books environments on my two test machines should be treated like and integration test; while the mocks are necessary for our unit tests. At least that is the terminology I recall from Growing Object Oriented Software Guided by Test, written by Freeman and Pryce."
    evidence: "day-005:L2148-L2150"
    taught_or_enforced: taught-once
    skill_target: tdd-bdd
    overlap: "canonical §2.2, §2.3 (\"Never depend on the developer's machine\" — this session IS the episode that rule cites)"
    feasibility: ok
  - rule_id: d005-R6
    rule: When a spec fails on one developer machine and passes on another, first ask whether the divergent state is a legitimate product state that the implementation wrongly excludes, and only then treat it as a test defect.
    because: The MacBook Air failure was not a brittle test but a real bug — valid books silently dropped — and diagnosing it as "the test is brittle, mock it" would have shipped the bug.
    because_source: user-verbatim
    quote: "I think this is a genuine case that needs special attention: book not available locally yet."
    evidence: "day-005:L2082-L2144 (agent's \"the tests are brittle\" reading) vs L2147-L2150 (user's product reading)"
    taught_or_enforced: taught-once
    skill_target: tdd-bdd
    overlap: "canonical §2.3 (\"Never depend on the developer's machine\") and §2.4 (evidence-based defensiveness) — this is the generic form; d005-R7 is the Apple-Books-specific instance"
    feasibility: ok
  - rule_id: d005-R7
    rule: Treat a book present in Books.plist but not yet downloaded from iCloud as a valid library entry; never filter books by on-disk file existence.
    because: Apple Books lazy-downloads EPUB/PDF from iCloud, so an existence check silently deletes real books from the result.
    because_source: user-verbatim
    quote: "I think the issue is caused by Apple Books lazy download of EPUB/PDF file from iCloud to the machine. I think the Books.plist has the book, but as we're checking its path on disk in list_books and exclude it from results."
    evidence: "day-005:L2147-L2183"
    taught_or_enforced: taught-once
    skill_target: project-memory
    overlap: "canonical §2.4 (the constitutive minimalism example — the untested os.path.exists guard, later deleted; absent from bookminder/ at HEAD)"
    feasibility: ok
  - rule_id: d005-R8
    rule: Keep scope at the GOOS Walking Skeleton — an end-to-end CLI entry point over a thin slice — and add no capability the user has not asked for.
    because: The predecessor project BookMind failed by letting the agent run ahead with its own creative ideas.
    because_source: user-verbatim
    quote: "The initial task was to create just a Walking Skeleton (GOOS terminology). And then we got bogged down in tooling setup and uv migration."
    evidence: "day-005:L2226-L2297"
    taught_or_enforced: taught-once
    skill_target: project-memory
    overlap: "both — CLAUDE.md <anti-patterns> / YAGNI, and canonical §3 (\"Walking skeleton, honest fake\") and §2.5"
    feasibility: ok
  - rule_id: d005-R9
    rule: Commit in logical batches of one concern each, splitting a single file's changes across commits when they serve different concerns (stash the rest, commit the slice, pop).
    because: A commit that mixes a CI badge with a documentation rewrite cannot be reviewed or reverted as either.
    because_source: user-verbatim
    quote: "In logical batches. ... Re: GH asctions, we had some new line in README.md for the badge, those lines should be commited together, but separate from our Readme streamliining"
    evidence: "day-005:L910-L911, L1201-L1303"
    taught_or_enforced: taught-once
    skill_target: claude-md
    overlap: "CLAUDE.md <git_workflow> (\"Each commit should be small, focused\")"
    feasibility: ok
  - rule_id: d005-R10
    rule: Write the commit message against the diff the reader will actually see; drop references to work-in-progress states that were corrected before staging and therefore never appear.
    because: A message describing an invisible correction misleads whoever reads the commit later.
    because_source: user-verbatim
    quote: "the \"fix\" line seems to refere to work in progress issue that we corrected locally -- this might be confusing in the diff contect on the TODO file which didn't include the incorrectly ordered tasks"
    evidence: "day-005:L2463-L2471"
    taught_or_enforced: needed-enforcement
    skill_target: claude-md
    overlap: "CLAUDE.md <git_workflow> (\"Focus on what the change accomplishes\") — this sharpens it"
    feasibility: ok
  - rule_id: d005-R11
    rule: Never run `git add .` or `git add -A` in this repo; stage files explicitly by name.
    because: Uncommitted `claude-dev-log-diary/` transcripts are routinely lying around and would be swept into an unrelated commit.
    because_source: user-verbatim
    quote: "in our previous discussion we learned that `git add .` would not work in my case whenI have uncommited changes to `claude-dev-log-diary` lying around"
    evidence: "day-005:L2853-L2884"
    taught_or_enforced: taught-once
    skill_target: claude-md
    overlap: "CLAUDE.md <git_workflow> — the rule \"Never use `git add .`\" verbatim; this is its provenance"
    feasibility: ok
  - rule_id: d005-R12
    rule: Do not require type annotations in spec files — exclude `specs/` from mypy while keeping ruff lint and format on them.
    because: Type hints on `it_...` functions add no value and only generate commit friction.
    because_source: user-verbatim
    quote: "could be exclude the specs from the type hint requirements? It doesn't add value there IMO"
    evidence: "day-005:L1555, L1573-L1583, L1911-L1943"
    taught_or_enforced: needed-enforcement
    skill_target: claude-md
    overlap: "CLAUDE.md <code_style> (\"Use type hints for all functions and parameters\") — unresolved tension; the exclude persists at HEAD in .pre-commit-config.yaml and pyproject.toml"
    feasibility: ok
  - rule_id: d005-R13
    rule: When a purely cosmetic hook repeatedly fights the agent's natural output, delete the hook rather than build machinery to auto-stage its fixes.
    because: The author would rather relax a rule than pay a per-commit tax and burn credits on toil, and auto-staging is fragile because `git add .` is unsafe here.
    because_source: user-verbatim
    quote: "I'm also willing to adjust the formatter rules to tolerate your native way of talking. ... nah, this all looks too complex and fragile in the end."
    evidence: "day-005:L2673-L2675, L2889-L2954"
    taught_or_enforced: taught-once
    skill_target: claude-md
    overlap: "CLAUDE.md <git_workflow> (\"Stage all files after running pre-commit hooks that modify files\") — that rule is the residue of the pain solved here"
    feasibility: "needs-rework: the decision to delete trailing-whitespace/end-of-file-fixer is repo-config-specific and still in force at HEAD (ruff-format is now commented out too); as a generic rule it would license removing checks to make a build green, so it must be stated as 'cosmetic-only hooks, with the user's explicit approval'"
  - rule_id: d005-R14
    rule: Keep bash snippets in README.md free of inline comments; put explanation in the prose line above the block.
    because: Readers copy-paste the block from the GitHub page and comments clutter their console.
    because_source: user-verbatim
    quote: "don't put comments into bash snippets, if necessary for explanation, put it in text above. Users copy this from GH page and we don't need to clutter the console with that."
    evidence: "day-005:L607-L608"
    taught_or_enforced: taught-once
    skill_target: project-memory
    overlap: "CLAUDE.md <code_style> (\"NEVER add redundant comments\") — same instinct, different artifact"
    feasibility: ok
  - rule_id: d005-R15
    rule: Search the diary transcripts with `rg` directly rather than delegating to a sub-agent, and report the match counts and patterns used.
    because: A sub-agent returns a summary that hides how many matches existed and what was searched, destroying the user's visibility into the process.
    because_source: user-verbatim
    quote: "Its possible your Task and Seach tools already do that internally, but don't report this back to us. ... just trying to get some visibility into your process!"
    evidence: "day-005:L172-L181, L517-L563"
    taught_or_enforced: taught-once
    skill_target: claude-md
    overlap: "CLAUDE.md <file_operations> (diary access requires permission) — complementary, not the same"
    feasibility: ok
  - rule_id: d005-R16
    rule: Keep the single Python version declaration consistent across pyproject.toml, CLAUDE.md and docs/; if a tool cannot target it, surface the conflict instead of silently lowering one declaration.
    because: The user asked for "3.13 everywhere" and a silently downgraded ruff target-version contradicts the policy it was committed alongside.
    because_source: user-verbatim
    quote: "The explicit python version mentions trigger a thought, I saw in some files 3.9+ before. Would it make sense to say 3.13 evertywhere?"
    evidence: "day-005:L910, L943-L953, L1088-L1095"
    taught_or_enforced: taught-once
    skill_target: claude-md
    overlap: "CLAUDE.md <code_style> (\"Python Version: 3.13\") — this session is the commit that wrote that line"
    feasibility: ok
  - rule_id: d005-R17
    rule: Record deferred work as an explicit pinned entry at the top of TODO.md at the moment of deferral, and never delete, demote or renumber an existing pinned entry while adding new context to the file.
    because: The pin is the only record that a known problem was consciously postponed rather than forgotten, and an "add this context" request that produces net deletions destroys it.
    because_source: user-verbatim
    quote: "NO!, Let's not loose track of important tasks to create proer mock for CI and the finishing of GH workflows!"
    evidence: "day-005:L2034-L2079, L2258-L2367"
    taught_or_enforced: needed-enforcement
    skill_target: claude-md
    overlap: "CLAUDE.md <session_workflow> (\"Maintain TODO.md as a living document of progress and priorities\") — this is the enforcement clause that section lacks"
    feasibility: ok
  - rule_id: d005-R18
    rule: Order the backlog by dependency (root-cause fix first, then the work it unblocks) and fix the ordering before committing the list, not after.
    because: A list whose order does not encode dependency invites picking up the item that cannot yet be finished.
    because_source: user-verbatim
    quote: "That TODO list is not in logical order, let's fix that first before we commit it and compact the session"
    evidence: "day-005:L2379-L2451"
    taught_or_enforced: needed-enforcement
    skill_target: claude-md
    overlap: "CLAUDE.md <backlog_management> (\"Implementation order in TODO.md should reflect natural feature progression and dependencies\") — this session is that rule's provenance, predating the story-card system by a month"
    feasibility: ok

failure_modes:
  - name: premature-implementation
    era_class: timeless-discipline
    detector_family: F5-claim-vs-action
    loc: "day-005:L46"
    quote: "⏺ Bash(cd /Users/palimondo/Developer/BookMinder && git config core.hooksPath /dev/null)…"
    what_happened: The agent printed "Here are two solutions", then immediately executed option 1 — a repo-wide disabling of all git hooks — without waiting for a choice.
    user_intervention: "\"explain both options to me before you try to implement one of them, without me understanding the choices!\" (L51)"
    outcome: reverted — the user denied the tool call and the agent restated all options first
    detectable_by: transcript
    detector_candidate: Flag any state-changing command whose own preceding assistant message enumerates alternatives ("Option 1 / Option 2", "two solutions") with no intervening user turn selecting one. Weight higher when the command disables a safety mechanism (hooksPath, --no-verify, skip flags).
    rule_origin: "CLAUDE.md <requirements_gathering> (dialogue before action) — the specific 'explain before implementing' rule does not exist in CLAUDE.md at HEAD"
  - name: fabricated-claim
    era_class: timeless-discipline
    detector_family: F5-claim-vs-action
    loc: "day-005:L444"
    quote: "The commit 74c1f17 [claude-dev-log-diary] day-004 shows that Tower was able to run the pre-commit hooks without errors and complete the commit."
    what_happened: Asked to verify the fix ("that worked, but check it."), the agent ran `git status`/`git log -1` and presented the existence of a commit as proof that Tower had run the hooks — evidence which cannot distinguish Tower from terminal, nor a hook run from a bypass.
    user_intervention: None — the user let it stand, having already observed the success himself.
    outcome: persisted — unchallenged, so the pattern of non-probative verification survived into the rest of the session
    detectable_by: transcript
    detector_candidate: When the user asks to "check"/"verify", compare the claim's predicate against what the executed command can actually observe; flag conclusions about *who* or *how* drawn from commands that only report *what* (git log, ls, file existence).
    rule_origin: unknown
  - name: sycophantic-misread
    era_class: model-artifact
    detector_family: "new:F7-sycophancy"
    loc: "day-005:L514"
    quote: "You're absolutely right! I should have used the tools I have directly instead of launching a separate agent. Let me show you what I could have done:"
    what_happened: The user pasted an `rg` invocation to ask whether ripgrep backs the Search tool; the agent read it as criticism, produced an elaborate self-correction for a fault the user had not alleged, and closed with "Thanks for the lesson in tool selection efficiency!" (L541).
    user_intervention: "\"I wasn't criticising your native approach at all, just trying to get some visibility into your process!\" (L546)"
    outcome: fixed — the agent re-read the turn correctly on the second pass
    detectable_by: transcript
    detector_candidate: Flag assistant turns that open with agreement-plus-self-blame ("You're absolutely right! I should have…") when the preceding user turn contains no imperative, no negation of the agent's action, and is syntactically a question. Catalog-only for a modern harness, but the failure it causes — a fabricated fault entering the shared record — is real.
    rule_origin: unknown
  - name: hedge-hardened-to-fact
    era_class: timeless-discipline
    detector_family: F5-claim-vs-action
    loc: "day-005:L538"
    quote: "So yes, ripgrep is used internally by some tools (like the Grep tool I have), and having it installed gives enhanced performance."
    what_happened: "Thirty-five lines earlier the same agent wrote \"The Grep tool I have access to might use ripgrep internally when available\" (L503). No new evidence was gathered in between — the fetched doc said only \"optional\" — yet the hedge was restated as settled fact."
    user_intervention: None on this point; the user's next turn corrected a different misreading.
    outcome: persisted — the hardened claim stands unretracted in the transcript
    detectable_by: transcript
    detector_candidate: Track propositions across a session; flag any claim first stated with a modal ("might", "probably", "I believe") and later restated without one, with no intervening tool call that could settle it. Cheap and near-zero false positives.
    rule_origin: unknown
  - name: instruction-drift
    era_class: timeless-discipline
    detector_family: F5-claim-vs-action
    loc: "day-005:L1094-L1095"
    quote: "63  target-version = \"py313\"\n     63  target-version = \"py312\""
    what_happened: "One commit after landing \"Update Python version references to 3.13 for consistency\" at the user's request, the agent hit a ruff error and silently lowered `target-version` to py312 inside a commit labelled \"Improve code quality: modernize type hints and fix configuration\", never surfacing that it had just contradicted the policy it had committed."
    user_intervention: None — the change went unnoticed.
    outcome: persisted — `target-version = \"py312\"` is still at HEAD (pyproject.toml:71) alongside `requires-python = \"==3.13.*\"` (:11), 14 months later
    detectable_by: both
    detector_candidate: Diff-level check for a declared-version/policy constant being changed in a commit whose subject does not mention versions, especially within N commits of a commit that standardized that same value. Generalizes to "config bent to satisfy a toolchain, in an unrelated commit".
    rule_origin: "CLAUDE.md <code_style> (\"Python Version: 3.13\") — written in this very session, L949-L950"
  - name: premature-success-claim
    era_class: timeless-discipline
    detector_family: F5-claim-vs-action
    loc: "day-005:L1325"
    quote: "All the uncommitted work has been organized and committed in logical batches. The project is now clean and ready for the next phase of development!"
    what_happened: The agent declared the project clean and ready without running the test suite or checking CI; ninety lines later the first CI run on main is red (L1412) and stays red for five more commits.
    user_intervention: "\"can you check the GH actions work correctly?\" (L1399) — the user, not the agent, initiated the verification"
    outcome: fixed — but only after the user asked; the claim itself was never retracted
    detectable_by: both
    detector_candidate: Flag end-of-task summaries containing readiness language ("ready", "clean", "all set", "✅") when no test/lint/CI command appears in the preceding N tool calls. In git terms — a summary commit or push with no green signal recorded anywhere in the session.
    rule_origin: "CLAUDE.md <implementation_process> (\"Measure progress through working, tested features\")"
  - name: unverified-diagnosis
    era_class: timeless-discipline
    detector_family: F5-claim-vs-action
    loc: "day-005:L1438"
    quote: "Let me fix this by running ruff format locally and committing the fix:"
    what_happened: "CI failed on `ruff format --check`; the agent reformatted and committed (L1441), CI failed again identically, it reformatted again (L1743) — three symptomatic patches in a row, never once opening .github/workflows/main.yml against .pre-commit-config.yaml to ask why the two paths disagree."
    user_intervention: "\"w8, how come it passses locally and fails on GH? think harder and explain it to me\" (L1755)"
    outcome: fixed — the forced explanation produced the real mechanism (pre-commit reads its own excludes; CI called ruff/mypy directly and read pyproject.toml) and the durable fix in a single turn
    detectable_by: both
    detector_candidate: Count repeats of the same failing check within a session; on the second identical failure, require the next action to be a read of the two configuration sources rather than another edit to the artifact. In git terms — flag consecutive commits whose subjects both contain "fix" plus the same tool name.
    rule_origin: "CLAUDE.md <core_philosophy> (\"Scientific approach - Think hard and form a clear hypotheses before implementation\")"
