agent_era: claude-code
model: "claude-sonnet (unversioned label in /cost; Sonnet-4 era, released 2025-05-22) with claude-3-5-haiku as background model. locs: day-005:L2221-2223, L2975-2977, L3115-3116. Haiku consumed 645k input vs Sonnet's 429 input / 12.4M cache-read — background/utility traffic, not a silent downgrade of the main loop. In-content date anchor: CI run timestamps 2025-05-25T08:02:05Z (L1412)."
