philosophy:
  - statement: >-
      The author explicitly commissions pushback as a standing duty of the agent: being
      steered wrong by him is an expected event, and correcting it — with the purpose
      stated — is part of the job, not insubordination.
    source: user-verbatim
    quote: |-
      Then in the future, push back when I steer you in a wrong way, always explaining
      what's the purpose.
    loc: "day-003:L792"
    feeds: skill-why
  - statement: >-
      Explanatory prose inside config and code files is a recurring cost, not a service,
      because those files are read into LLM context repeatedly; the explanation belongs
      in docs/ where it is loaded only on demand.
    source: user-verbatim
    quote: |-
      but if you'll be reading these files into LLM context in the future, a lot of this
      verbose explanation would unnnecessarily inflate the volume of text in the context
      without adding much information.
    loc: "day-003:L1095"
    feeds: skill-why
  - statement: >-
      No backwards compatibility is owed to a project with no users; migrate fully and
      delete the superseded artifact rather than keeping parallel configs alive.
    source: user-verbatim
    quote: |-
      Also, I do not need to maintain any backwards comparibility, so we should fully
      modernize out project structure and not keep extra files around that only increate
      the maintenance burden.
    loc: "day-003:L1097"
    feeds: skill-why
  - statement: >-
      The author's measure of a session is value delivered versus scaffolding produced;
      a micro-project that has grown more boilerplate than behavior is failing regardless
      of how correct each individual piece of scaffolding is.
