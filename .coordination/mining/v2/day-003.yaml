skill_rules:
  - rule_id: d003-R1
    rule: >-
      Never suppress a failing pre-commit hook (SKIP=, --no-verify, -n) to make a commit
      succeed; treat the failure as a defect in your own pre-commit workflow and fix that.
    because: >-
      A blocked commit is information about the workflow, and bypassing the gate destroys
      the only signal that the workflow is wrong.
    because_source: user-verbatim
    quote: |-
      explain why? isn't this an issue with out prefommit hooks configuration in the project?
      or are you forgetting to run some linting step before commit?
    evidence: "day-003:L1674-L1693"
    taught_or_enforced: needed-enforcement
    skill_target: tdd-bdd
    overlap: none
    feasibility: ok
  - rule_id: d003-R2
    rule: >-
      Run the formatters/hooks before committing, then re-stage the files the hooks modified,
      and only then commit.
    because: >-
      Hooks that rewrite files leave the fixes unstaged, so the commit fails in a loop until
      the fixes are staged deliberately.
    because_source: user-paraphrase
    evidence: "day-003:L1703-L1742; rule written into CLAUDE.md at L1814"
    taught_or_enforced: needed-enforcement
    skill_target: claude-md
    overlap: >-
      CLAUDE.md <git_workflow> ("Stage all files after running pre-commit hooks that modify
      files") — this session is that line's verified origin (commit 2be02fe)
    feasibility: ok
  - rule_id: d003-R3
    rule: >-
      Before saying a change is ready to commit, execute it — run the suite, install the
      package, import it — and report the command and its output.
    because: >-
      The author will not accept "ready to be committed" as a claim; only an observed run
      counts, and the run he demanded here exposed a genuinely broken pyproject.toml.
    because_source: user-verbatim
    quote: |-
      before commiting, can you somehow verify these chonfiguration changes are working correctly?
    evidence: "day-003:L1273-L1397"
    taught_or_enforced: needed-enforcement
