    loc: "day-003:L2305"
    feeds: judge-anchor

skill_rules:
  - rule_id: d003-R1
    rule: >-
      Never suppress a failing pre-commit hook (SKIP=, --no-verify, --skip) to make a commit
      succeed; treat the failure as a defect in your own pre-commit workflow and fix that.
    because: >-
      A blocked commit is information about the workflow, and bypassing the gate destroys the
      only signal that the workflow is wrong.
    because_source: user-verbatim
    quote: |-
      explain why? isn't this an issue with out prefommit hooks configuration in the project?
      or are you forgetting to run some linting step before commit?
    evidence: "day-003:L1674-L1693"
    taught_or_enforced: needed-enforcement
    skill_target: tdd-bdd
    overlap: none
    feasibility: ok
  - rule_id: d003-R2
    rule: >-
      Run the formatters/hooks before committing, then re-stage the files the hooks modified,
      and only then commit.
    because: >-
      Hooks that rewrite files leave the fixes unstaged, so the commit fails in a loop until the
      fixes are staged deliberately.
    because_source: user-paraphrase
    evidence: "day-003:L1703-L1742, rule added to CLAUDE.md at L1814"
    taught_or_enforced: needed-enforcement
    skill_target: claude-md
    overlap: "CLAUDE.md <git_workflow> (\"Stage all files after running pre-commit hooks that modify files\") — this session is that line's origin"
    feasibility: ok
  - rule_id: d003-R3
    rule: >-
      Before saying a change is ready to commit, execute it — run the suite, install the package,
      import it — and report what you ran.
    because: >-
      The author will not accept "ready to be committed" as a claim; only an observed run counts
      as verification.
    because_source: user-verbatim
    quote: |-
      before commiting, can you somehow verify these chonfiguration changes are working correctly?
    evidence: "day-003:L1273-L1397"
    taught_or_enforced: needed-enforcement
    skill_target: tdd-bdd
    overlap: "CLAUDE.md <tdd_discipline> (\"Run All Tests\") covers specs but not configuration changes"
    feasibility: ok
  - rule_id: d003-R4
    rule: >-
      When you catch yourself writing "in the future we should X", stop and convert X into either
      a CLAUDE.md rule or a toolchain configuration change in the same turn.
    because: >-
      A process improvement that lives only in chat prose is lost at the next compaction.
    because_source: user-verbatim
    quote: |-
      When you say "in the future", it sound like an upgrade to CLAUDE.md process in in order...
      or is this something that can be automated in the configuration of the pre-commit hooks
