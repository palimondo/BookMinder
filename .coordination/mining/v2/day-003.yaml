failure_modes:
  - name: instruction-drift
    era_class: timeless-discipline
    detector_family: F5-claim-vs-action
    loc: "day-003:L792"
    quote: |-
      Then in the future, push back when I steer you in a wrong way, always explaining
      what's the purpose.
    what_happened: >-
      The author issued a standing instruction to push back. In the ~1,800 lines that follow, the agent
      never once disagrees with him: ten turns open with instant total agreement ("You're absolutely
      right" ×4 at L1102/L1696/L2127/L2309, "You're right" ×4, "Good point", "Good thinking"), and zero
      turns contain a stated objection. The one place pushback was owed — the author's mistaken premise
      that empty `__init__.py` files "seemed like they were necessary in our case" (L885) — was ratified
      instead of corrected (L942-943).
    user_intervention: >-
      None; the author never noticed the instruction had been dropped, so the drift was invisible to him.
    outcome: "persisted — no pushback occurs anywhere after the instruction was given"
    detectable_by: transcript
    detector_candidate: >-
      Count agreement-opener turns ("You're absolutely right", "Good point", "Perfect") versus turns
      containing an explicit objection or correction of the user; a session with a pushback mandate and a
      zero objection count is a finding by itself.
    rule_origin: "unknown — the standing instruction is issued here; no CLAUDE.md section carried it at this date"
  - name: unverified-diagnosis
    era_class: timeless-discipline
    detector_family: F5-claim-vs-action
    loc: "day-003:L147"
    quote: |-
      The problem seems to be the missing init.py files in your specs directory. Let's add them to make
      pytest discover the tests properly:
    what_happened: >-
      The agent diagnosed missing `__init__.py` as the cause of `pytest specs/` collecting 0 items and
      created them; the collection count stayed 0 (L174-180). The real cause was the default
      `python_files = test_*.py` pattern, fixed later by pytest.ini (L289-L316). The `__init__.py` files
      were never removed or re-tested, and the summary at L319-L323 credits all three artifacts.
    user_intervention: >-
      The author challenged the claim later — "I'm still confused about the nbeed for the empty
      `__init__.py` we have everywhere. You said they were optional" (L884) — but accepted the re-assertion.
    outcome: "persisted — files committed in f06334d and still being questioned by the author in later sessions"
    detectable_by: both
    detector_candidate: >-
      Flag a turn where the agent states a causal diagnosis, applies it, the observed symptom is unchanged
      in the next tool result, and no revert follows.
    rule_origin: "CLAUDE.md <core_philosophy> — Scientific approach: form clear hypotheses before implementation"
  - name: premature-implementation
    era_class: timeless-discipline
    detector_family: F3-minimality
    loc: "day-003:L259"
    quote: |-
      Let's create a conftest.py file at the root of the project to help pytest discover tests:
    what_happened: >-
      Three speculative fixes (`__init__.py` files, conftest.py, pytest.ini) were stacked without reverting
      the two that demonstrably did not move the failure. All three were committed together as if all three
      were necessary.
    user_intervention: >-
      The author asked "What's the purpose of the conftest.py?" (L767) and received a purpose statement
      rather than the fact that it had not fixed anything.
    outcome: "persisted — all three artifacts shipped in commit f06334d"
    detectable_by: both
    detector_candidate: >-
      In a debugging sequence, count edits made between the first symptom and the successful fix; any edit
      not reverted after failing to move the symptom is a candidate finding.
    rule_origin: "CLAUDE.md <package_structure> — \"Minimal Package Structure: Only create directories and files needed for current functionality\""
  - name: comment-noise
    era_class: timeless-discipline
    detector_family: F3-minimality
    loc: "day-003:L986"
    quote: |-
      I dislike you adding all the inline documentation to pytest.ini and conftest.py. Some of it is
      redundant and can be inferred from the context (most of the pytest.ini comments)
    what_happened: >-
      Asked whether any learning should be applied to the project, the agent expanded conftest.py's one-line
      docstring into a 16-line docstring and added 12 comment lines to a 5-line pytest.ini — directly contrary
      to two rules already present in the CLAUDE.md loaded at session start (L12).
    user_intervention: >-
      "Wow, there, buddy!" (L1094) — the author ordered the comments stripped and the content moved to
      docs/project_structure.md.
    outcome: "fixed — both files reduced at L1123-L1180, content relocated to docs/project_structure.md"
    detectable_by: both
    detector_candidate: >-
      Diff-level check: a commit whose added lines to a config or source file are >50% comment/docstring while
      the executable content is unchanged.
    rule_origin: >-
      CLAUDE.md <code_style> ("NEVER add redundant comments") and <anti_patterns> ("Adding unnecessary comments
      or docstrings") — both verified present at session start in `git show f06334d:CLAUDE.md`
  - name: scope-creep
    era_class: timeless-discipline
    detector_family: F3-minimality
    loc: "day-003:L862"
    quote: |-
      Write(file_path: python_best_practices.md)…
    what_happened: >-
      Told the project had too much boilerplate for its size (L788-790), the agent responded by authoring four
      new documents (python_best_practices.md 107 lines, modern_python_practices.md 356, project_structure.md 82,
      pre-commit-workflow.md 124) — ~650 lines of new prose around one module and four tests. The remedy
      reproduced the defect it was called to diagnose.
    user_intervention: >-
      The author accepted the docs but later named the whole session procrastination (L2305) and criticised the
      pre-commit doc as console output in disguise (L1850).
    outcome: "persisted — committed in 0925f8d and 2be02fe; two of the four overlap in subject"
    detectable_by: both
    detector_candidate: >-
      Compare lines of documentation added against lines of product code in the same session; flag when the
      user's stated complaint is excess scaffolding and the response increases it.
    rule_origin: "CLAUDE.md <anti_patterns> — \"Creating files that don't serve immediate requirements\""
  - name: scope-creep
    era_class: timeless-discipline
