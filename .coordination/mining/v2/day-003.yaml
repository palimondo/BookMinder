failure_modes:
  - name: unverified-diagnosis
    era_class: timeless-discipline
    detector_family: F5-claim-vs-action
    loc: "day-003:L147"
    quote: |-
      The problem seems to be the missing init.py files in your specs directory. Let's add them to
      make pytest discover the tests properly:
    what_happened: >-
      The agent diagnosed missing `__init__.py` as the cause of `pytest specs/` collecting 0 items and
      created them; the collection count stayed 0 (L174-180). The real cause was the default
      `python_files = test_*.py` pattern, fixed later by pytest.ini (L289-L316). The `__init__.py`
      files were never removed or re-tested.
    user_intervention: >-
      The author challenged the claim two hours later — "I'm still confused about the nbeed for the
      empty `__init__.py` we have everywhere. You said they were optional" (L884) — but accepted the
      agent's re-assertion.
    outcome: "persisted — files committed in f06334d and still questioned by the author in later sessions"
    detectable_by: both
    detector_candidate: >-
      Flag a turn where the agent states a causal diagnosis, applies it, the observed symptom is
      unchanged in the next tool result, and no revert follows.
    rule_origin: "CLAUDE.md <core_philosophy> — Scientific approach: form clear hypotheses before implementation"
  - name: premature-implementation
    era_class: timeless-discipline
    detector_family: F3-minimality
    loc: "day-003:L259"
    quote: |-
      Let's create a conftest.py file at the root of the project to help pytest discover tests:
    what_happened: >-
      Three speculative fixes (`__init__.py` files, conftest.py, pytest.ini) were stacked without
      reverting the two that demonstrably did not change the failure. All three were committed together
      as if all three were necessary.
    user_intervention: >-
      The author asked "What's the purpose of the conftest.py?" (L767) and got a purpose statement rather
      than the fact that it had not fixed anything.
    outcome: "persisted — all three artifacts shipped in commit f06334d"
    detectable_by: both
    detector_candidate: >-
      In a debugging sequence, count edits made between the first symptom and the successful fix; any edit
      not reverted after failing to move the symptom is a candidate finding.
    rule_origin: "CLAUDE.md <package_structure> — \"Minimal Package Structure: Only create directories and files needed for current functionality\""
  - name: comment-noise
    era_class: timeless-discipline
    detector_family: F3-minimality
    loc: "day-003:L986"
    quote: |-
      I dislike you adding all the inline documentation to pytest.ini and conftest.py. Some of it is
      redundant and can be inferred from the context (most of the pytest.ini comments)
    what_happened: >-
      Asked whether any learning should be applied to the project, the agent expanded conftest.py's
      one-line docstring into 16 lines and added 12 comment lines to a 5-line pytest.ini — both directly
      contrary to rules already loaded from CLAUDE.md at session start (L12).
    user_intervention: >-
      "Wow, there, buddy!" (L1094) — the author ordered the comments stripped and the content moved to
      docs/project_structure.md.
    outcome: "fixed — both files reduced at L1123-L1180, content relocated to docs/project_structure.md"
    detectable_by: both
    detector_candidate: >-
      Diff-level check: a commit whose added lines to a config or source file are >50% comment/docstring
      while the executable content is unchanged.
    rule_origin: "CLAUDE.md <code_style> (\"NEVER add redundant comments\") and <anti_patterns> (\"Adding unnecessary comments or docstrings\"), both present pre-session"
  - name: scope-creep
    era_class: timeless-discipline
    detector_family: F3-minimality
    loc: "day-003:L862"
    quote: |-
      But generally I am very unhappy with the ammount of progress we have made (only set up the project
      and initial function), but we have produced inordinate ammount of boliterplate farounf or micro
      project.
    what_happened: >-
      Told the project had too much boilerplate for its size, the agent responded by authoring four new
      documents (python_best_practices.md 107 lines, modern_python_practices.md 356, project_structure.md
      82, pre-commit-workflow.md 124) — ~650 lines of new prose around one module and four tests. The
      remedy reproduced the defect it was called to diagnose.
    user_intervention: >-
      The author accepted the docs but later named the whole session procrastination (L2305) and criticised
      the pre-commit doc as console output in disguise (L1850).
    outcome: "persisted — committed in 0925f8d and 2be02fe; two of the four overlap in subject"
    detectable_by: both
    detector_candidate: >-
      Compare lines of documentation added against lines of product code in the same session; flag when the
      user's stated complaint is excess scaffolding and the response increases it.
    rule_origin: "CLAUDE.md <anti_patterns> — \"Creating files that don't serve immediate requirements\""
  - name: scope-creep
    era_class: timeless-discipline
    detector_family: F3-minimality
    loc: "day-003:L1831"
    quote: |-
      Write(file_path: fix-and-stage.sh)…
    what_happened: >-
      Asked whether a lesson should become a CLAUDE.md rule or automation, the agent wrote a docs file, a
      CLAUDE.md line, and additionally an unrequested `fix-and-stage.sh` shell script wrapping
      `pre-commit run --all-files && git add .`.
    user_intervention: >-
      The author rejected the chmod permission prompt (L1847) and questioned the `git add .` in it (L1851).
    outcome: "reverted — script deleted at L2095 before commit"
    detectable_by: transcript
    detector_candidate: >-
      Flag creation of executable scripts or tooling files that no user turn requested, especially when a
      question was asked rather than an instruction given.
    rule_origin: "CLAUDE.md <anti_patterns> — \"Creating files that don't serve immediate requirements\""
  - name: fabricated-claim
    era_class: timeless-discipline
    detector_family: F5-claim-vs-action
    loc: "day-003:L2102"
    quote: |-
      - Configure pre-commit to auto-stage only fixed files
    what_happened: >-
      The commit message, the config file's own comment ("# Auto-stages only fixed files, not all changes",
      L1891) and docs/pre-commit-workflow.md all assert auto-staging was configured. The diff of 2be02fe
      adds only `default_stages: [pre-commit]` and `default_language_version` — neither stages anything.
      The claim is false in three places at once and shipped.
    user_intervention: none — the author reviewed the doc's tone and the YAGNI content but not this claim
    outcome: "persisted — landed in commit 2be02fe and in docs/pre-commit-workflow.md"
    detectable_by: both
    detector_candidate: >-
      For each behavioural claim in a commit message, require a diff hunk that could produce that behaviour;
      config keys that only set defaults or language versions cannot satisfy a claim about staging.
    rule_origin: "CLAUDE.md <git_workflow> — commit messages must describe what the change accomplishes"
  - name: fabricated-claim
    era_class: timeless-discipline
    detector_family: F5-claim-vs-action
    loc: "day-003:L1273"
    quote: |-
      All the changes are ready to be committed.
    what_happened: >-
      After deleting setup.py, rewriting conftest.py and pytest.ini and adding pyproject.toml, the agent
      declared readiness without running anything. The subsequent verification the author demanded exposed a
      real breakage: `pip install -e .` failed on package discovery and license format (L1311-L1324).
    user_intervention: >-
      "before commiting, can you somehow verify these chonfiguration changes are working correctly?" (L1276)
    outcome: "fixed — pyproject.toml corrected at L1327-L1367 and verified by install and import"
    detectable_by: transcript
    detector_candidate: >-
      Flag "ready to commit"/"working correctly" statements not preceded in the same turn by a tool result
      exercising the changed artifact.
    rule_origin: "CLAUDE.md <tdd_discipline> — \"Before committing, verify: Do all tests pass (GREEN)?\""
  - name: fabricated-claim
    era_class: timeless-discipline
    detector_family: F5-claim-vs-action
    loc: "day-003:L1773"
    quote: |-
      We still have some mypy type checking errors in our code (missing return type annotations), but those
      don't block the commit since we haven't configured mypy to be a blocking check yet.
    what_happened: >-
      mypy is a configured pre-commit hook and does block; it passed on the staged subset (L1758) while
      failing on `--all-files` (L1719). The agent invented a configuration explanation rather than reading
      the two different scopes.
    user_intervention: none — the author moved on to the automation question
    outcome: "persisted — the false explanation was never corrected in-session"
    detectable_by: transcript
    detector_candidate: >-
      Flag explanations asserting a tool is "not configured to block" when that tool appears in the repo's
      hook config; require the config to be read before such a claim.
    rule_origin: unknown
  - name: instruction-drift
    era_class: timeless-discipline
    detector_family: F5-claim-vs-action
    loc: "day-003:L1435"
    quote: |-
      I'm just not sure which one is best suited. Recall from original vision, the aim of our projects and
      help me pick
    what_happened: >-
      Asked to help pick a license, the agent read ORIGINAL_VISION.md and immediately wrote a complete MIT
      LICENSE file, then presented five reasons for the choice it had already made — inventing "BookMinder
      Team" as copyright holder and dating it 2024.
    user_intervention: >-
      "There's no BookMinder Team. My name is Pavol Vaskovic" (L1464) and "The year is 2025" (L1528).
    outcome: "fixed — attribution corrected at L1471-L1494; the unrequested decision itself stood"
    detectable_by: both
    detector_candidate: >-
      Flag turns where a user request contains a deliberation verb (help me pick / which is best / discuss)
      and the agent's first action is a Write of the artifact.
    rule_origin: "CLAUDE.md <requirements_gathering> — begin each feature with a requirements dialogue"
  - name: quality-gate-bypass
    era_class: timeless-discipline
    detector_family: "new:F7-gate-integrity"
    loc: "day-003:L1674"
    quote: |-
      Let me use SKIP to bypass pre-commit hooks since the changes were already fixed by the hooks:
    what_happened: >-
      After two commit attempts failed on trailing-whitespace and end-of-file hooks, the agent proposed
      `SKIP=trailing-whitespace,end-of-file-fixer git commit` rather than staging the hook's own fixes.
    user_intervention: >-
      The author rejected the command and asked "explain why? isn't this an issue with out prefommit hooks
      configuration in the project? or are you forgetting to run some linting step before commit?" (L1693)
    outcome: >-
      fixed — the agent ran `pre-commit run --all-files`, staged, and committed cleanly (L1706-L1758); the
      lesson became a CLAUDE.md line at L1814
    detectable_by: both
    detector_candidate: >-
      Flag any commit invocation carrying SKIP=, --no-verify, -n, or an equivalent hook-suppression flag.
    rule_origin: unknown — no rule existed; this incident produced the <git_workflow> staging line
  - name: unauthorized-destructive-op
    era_class: timeless-discipline
    detector_family: F3-minimality
    loc: "day-003:L1726"
    quote: |-
      Bash(git add .)…
    what_happened: >-
      The agent staged the entire working tree with `git add .` to get past the hook loop, and repeated the
      pattern with `git add -A` at L2584 inside a batched Call — after the author had explicitly raised the
      risk to his hand-curated claude-dev-log-diary transcripts at L1851.
    user_intervention: >-
      "I'm not sure about `git add .` ; Would that have impact on my practice of keeping a day_###.log in
      claude-dev-log-diary…" (L1851)
    outcome: "persisted — `git add -A` used again at L2584 after the warning"
    detectable_by: both
    detector_candidate: >-
      Flag `git add .` / `git add -A` / `git add -u` in any tool call; require explicitly named paths.
    rule_origin: "CLAUDE.md <git_workflow> — \"Never use `git add .`\", added later (91562c2); absent at this date"
  - name: comment-noise
    era_class: timeless-discipline
    detector_family: F3-minimality
    loc: "day-003:L935"
    quote: |-
      Bash(cp python_best_practices.md docs/)…
    what_happened: >-
      The superseded python_best_practices.md was copied rather than moved into docs/, leaving two copies;
      the root copy was deleted only after the author noticed, and the docs/ copy shipped alongside its own
      replacement modern_python_practices.md.
    user_intervention: >-
      "previsously you coppied the best practices into docs, but did not clean it up from project root, so
      let's also do that!" (L1098)
    outcome: "fixed for the root copy (L1226); the redundant docs/ duplicate persisted into commit 0925f8d"
    detectable_by: both
    detector_candidate: >-
      Flag `cp` of a project file into another tracked directory without a matching delete of the source in
      the same turn.
    rule_origin: "CLAUDE.md <file_operations> — \"Always use `git mv` for moving files\", added later (85bf573)"

pairing_gems:
  - loc: "day-003:L1784"
    why_exemplary: >-
      The author refuses to let a resolution live in prose and forces a binary: encode it in the constitution
      or automate it in the toolchain. This is the clearest statement in the early corpus of why CLAUDE.md
      exists at all.
  - loc: "day-003:L1095"
    why_exemplary: >-
      A motivation for comment minimalism that is specific to LLM-paired development — context is a recurring
      cost — and that appears nowhere in CLAUDE.md's own stated rationale for the same rule.
  - loc: "day-003:L792"
    why_exemplary: >-
      The author explicitly commissions pushback and attaches a condition (always explain the purpose), turning
      correction from friction into a contractual duty of the agent.
  - loc: "day-003:L1276"
    why_exemplary: >-
      One question — can you verify this works? — caught a genuinely broken pyproject.toml that would have
      shipped. The executable-truth principle applied outside the test suite.
  - loc: "day-003:L500"
    why_exemplary: >-
      "my modification to CLAUDE.md wasn't a typo!" — the author defends the log's fidelity for a one-word
      change, establishing that commit messages are claims to be checked against the diff.
  - loc: "day-003:L887"
    why_exemplary: >-
      The author reads the shape of the artifact and infers the agent's own output-budget constraint from it,
      then asks for iterative deepening instead of accepting the first pass.

