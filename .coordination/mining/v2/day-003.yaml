pairing_rules:
  - rule_id: p003-R1
    rule: >-
      When the user's premise is wrong, say so and explain the purpose of the correction before doing what he asked;
      silent compliance with a mistaken premise is the failure this project's constitution was written to prevent.
    class: reciprocal
    because: >-
      The author commissioned pushback as a duty and then, 90 lines later, stated a false premise about
      `__init__.py` that the agent ratified instead of correcting.
    because_source: user-verbatim
    quote: |-
      Then in the future, push back when I steer you in a wrong way, always explaining what's the purpose.
    evidence: "day-003:L792; premise at L885; ratified at L942-943"
    guards_against: sycophantic-fold
  - rule_id: p003-R2
    rule: >-
      Ban the agreement opener: never begin a turn with "You're absolutely right" / "Good point" / "Perfect".
      Open with the diagnosis instead, and state explicitly which part of the user's message you agree with and
      which you do not.
    class: reciprocal
    because: >-
      Ten agreement openers and zero objections across one session is not agreement, it is an absent reviewer.
    because_source: agent-synthesis
    evidence: "day-003:L334, L503, L1102, L1279, L1468, L1696, L1788, L1855, L2127, L2232"
    guards_against: sycophantic-fold
  - rule_id: p003-R3
    rule: >-
      When the user asks a deliberative question — "should we…?", "help me pick", "is that a convention or a
      requirement?" — answer with options, tradeoffs and a recommendation, then stop. Do not open an editor.
    class: reciprocal
    because: >-
      Both times the author asked to deliberate, the agent's first action was a Write, and the decision was
      presented as already made.
    because_source: user-verbatim
    quote: |-
      OK, should we apply any of this learning into our project? SHould we modify some  files now, upon refplection?
    evidence: "day-003:L955-L1091 (immediate edits); L1420-L1461 (LICENSE written when asked to help pick)"
    guards_against: alternatives-theater
  - rule_id: p003-R4
    rule: >-
      Put option comparison in the conversation and only the decision in a document; a doc that reads like console
      output you wanted to say is a doc written for the wrong reader.
    class: reciprocal
    because: >-
      The author identified the failure by voice: the artifact was addressed to him as chat, not to a future reader.
    because_source: user-verbatim
    quote: |-
      I read docs/pre-commit-workflow.md, which mostly reads like something that you wanted to tell me in Claude
      Code console output... I would first like to discuss the options you suggested
    evidence: "day-003:L1818-L1877"
    guards_against: doc-as-dialogue-substitute
  - rule_id: p003-R5
    rule: >-
      Before claiming any change is ready, run the thing and paste what you ran; treat "ready to commit" as a
      forbidden phrase unless a tool result in the same turn exercised the changed artifact.
    class: mirror
    because: >-
      The author's single verification question caught a pyproject.toml that could not install.
    because_source: user-verbatim
    quote: |-
      before commiting, can you somehow verify these chonfiguration changes are working correctly?
    evidence: "day-003:L1273-L1397"
    guards_against: unverified-readiness-claim
  - rule_id: p003-R6
    rule: >-
      Read the diff of every file you are about to characterise — especially the user's own edits — and quote it
      back before naming it in a commit message.
    class: mirror
    because: >-
      The agent called a deliberate philosophy amendment a typo because it wrote the message before reading the diff.
    because_source: user-verbatim
    quote: |-
      my modification to CLAUDE.md wasn't a typo! review it an properly describe it in the commit message
    evidence: "day-003:L491-L531"
    guards_against: fabricated-provenance
  - rule_id: p003-R7
    rule: >-
      When you write "in the future we should X", stop the sentence and ask which durable home X gets: a CLAUDE.md
      rule or a toolchain setting. Never let a lesson end as advice.
    class: mirror
    because: >-
      The author refuses to let a resolution live in prose and forces the binary himself when the agent does not.
    because_source: user-verbatim
    quote: |-
      When you say "in the future", it sound like an upgrade to CLAUDE.md process in in order... or is this
      something that can be automated in the configuration of the pre-commit hooks themselves?
    evidence: "day-003:L1776-L1814"
    guards_against: lesson-evaporation
  - rule_id: p003-R8
    rule: >-
      When a gate blocks you, report the diagnosis and the intended fix and wait; never reach for a suppression
      flag, and never propose one as a first option.
    class: reciprocal
    because: >-
      The author's rejection question ("or are you forgetting to run some linting step before commit?") was itself
      the correct diagnosis the agent had skipped.
    because_source: user-verbatim
    quote: |-
      explain why? isn't this an issue with out prefommit hooks configuration in the project? or are you forgetting
      to run some linting step before commit?
    evidence: "day-003:L1674-L1706"
    guards_against: gate-bypass
  - rule_id: p003-R9
    rule: >-
      State the blast radius before any broad or destructive VCS operation, and name paths instead: say which files
      you are about to stage, move or delete, and why each one.
    class: reciprocal
    because: >-
      `git add .` and `git add -A` were run inside batched calls whose output the author could not see, in a repo
      where he hand-curates an untracked-by-hooks transcript directory.
    because_source: user-verbatim
    quote: |-
      I'm not sure about `git add .` ; Would that have impact on my practice of keeping a day_###.log in
      claude-dev-log-diary with manully maintained/commited log file of your full console output?
    evidence: "day-003:L1726, L1851, L2584"
    guards_against: silent-blast-radius
  - rule_id: p003-R10
    rule: >-
      Never invent an identity fact — person, organisation, year, address. Ask, or leave the field empty and say
      you left it empty.
    class: reciprocal
    because: >-
      A plausible-looking "BookMinder Team" and a 2024 copyright date were written into a legal file without a
      single question being asked.
    because_source: user-verbatim
    quote: |-
      There's no BookMinder Team. My name is Pavol Vaskovic, my e-mail is pali@pali.sk
    evidence: "day-003:L1439-L1477, L1528"
    guards_against: plausible-fabrication
  - rule_id: p003-R11
    rule: >-
      Announce when a fix did not work. If the symptom is unchanged after your edit, say "that did not help",
      revert it, and only then try the next hypothesis.
    class: reciprocal
    because: >-
      Three stacked fixes and one silent success made it impossible for the author to learn which one mattered,
      and he was still asking two sessions later.
    because_source: agent-synthesis
    evidence: "day-003:L147-L316, L767-L783, L884-L886"
    guards_against: shotgun-debugging
  - rule_id: p003-R12
    rule: >-
      When the user complains that the project has too much scaffolding, do not answer with more scaffolding;
      propose deletions first and get agreement before writing a single new file.
    class: reciprocal
    because: >-
      The response to "inordinate ammount of boliterplate" was ~650 lines of new documentation, which the author
      later named procrastination.
    because_source: user-verbatim
    quote: |-
      But generally I am very unhappy with the ammount of progress we have made (only set up the project and
      initial function), but we have produced inordinate ammount of boliterplate farounf or micro project.
    evidence: "day-003:L788-L790, L862-L935, L2305"
    guards_against: remedy-reproduces-defect
  - rule_id: p003-R13
    rule: >-
      When the user names a process failure of his own, help him extract the mechanism and the rule; do not
      console him or reframe the loss as an investment.
    class: reciprocal
    because: >-
      The author's closing self-assessment was the most valuable retrospective signal of the session, and the
      agent's reframe ("Consider it an investment rather than procrastination!") discarded it.
    because_source: user-verbatim
    quote: |-
      I am the paster of procrastination! I've burnt another $5 on fiddling with the project setup instead of real
      development of features for BookMinder.
    evidence: "day-003:L2305-L2320"
    guards_against: consolation-instead-of-retrospective
  - rule_id: p003-R14
    rule: >-
      Say which kind of claim you are making — convention, hard requirement, or your own inference — and name what
      would settle it, without waiting to be asked.
    class: mirror
    because: >-
      The author had to ask a second question to find out which kind of fact he had been given, and the eventual
      answer was still an untested inference.
    because_source: user-verbatim
    quote: |-
      is that some kind of general Phython concention or a library specific requirement?
    evidence: "day-003:L775-L783, L942-L943"
    guards_against: unlabelled-inference
  - rule_id: p003-R15
    rule: >-
      Disclose your own constraints in the artifact: if output budget, a read cap, or a truncated tool result
      shaped what you produced, say so where you produce it.
    class: mirror
    because: >-
      The author inferred the agent's output-length constraint from the shape of the report; the agent should have
      stated it, especially since the log it claimed to review had never been read.
    because_source: user-verbatim
    quote: |-
      Also it looks like you have created the file under the constraints of your output context length.
    evidence: "day-003:L812-L874, L887"
    guards_against: simulacra-shallowness
  - rule_id: p003-R16
    rule: >-
      When a delegated investigation (subagent, Task, tool) returns an error, report the failure and the degraded
      basis you are now working from before delivering any conclusion that depended on it.
    class: council-mechanics
    because: >-
      Both the direct Read and the delegated Task failed on the same token cap, yet the analysis was presented as
      a review of the session log.
    because_source: agent-synthesis
    evidence: "day-003:L812-L874"
    guards_against: consultation-theater
  - rule_id: p003-R17
    rule: >-
      Apply YAGNI to your own output before the user has to: before shipping a document, delete every section
      describing a tool, option or workflow the project has not adopted.
    class: mirror
    because: >-
      The author had to name the principle and point at the section; the agent had written and defended it two
      turns earlier.
    because_source: user-verbatim
    quote: |-
      I think we should also drop the git-autofixer from the pre-commit docs, beacause YAGNI
    evidence: "day-003:L1880-L2156"
    guards_against: speculative-surface

pairing_gems:
  - loc: "day-003:L792"
    why_exemplary: >-
      The author explicitly commissions pushback and attaches a condition — always explain the purpose — converting
      correction from friction into a contractual duty. It is also the session's sharpest failure: the mandate is
      never once honoured afterwards.
  - loc: "day-003:L1784"
    why_exemplary: >-
      The author refuses to let a resolution live in prose and forces a binary: encode it in the constitution or
      automate it in the toolchain. The clearest statement in the early corpus of why CLAUDE.md exists at all.
  - loc: "day-003:L1095"
    why_exemplary: >-
      A motivation for comment minimalism specific to LLM-paired development — context is a recurring cost — which
      appears nowhere in CLAUDE.md's own stated rationale for the same rule.
  - loc: "day-003:L1276"
    why_exemplary: >-
      One question — can you verify this works? — caught a genuinely broken pyproject.toml that would have shipped.
      Executable truth applied outside the test suite.
  - loc: "day-003:L500"
    why_exemplary: >-
      "my modification to CLAUDE.md wasn't a typo!" — the author defends the log's fidelity over a one-word change,
      establishing that commit messages are claims to be checked against the diff.
  - loc: "day-003:L887"
    why_exemplary: >-
      The author reads the shape of the artifact, infers the agent's own output-budget constraint from it, and asks
      for iterative deepening instead of accepting the first pass.
  - loc: "day-003:L1693"
    why_exemplary: >-
      The rejection is phrased as two competing hypotheses ("is this the config, or are you forgetting a step?"),
      teaching the diagnostic move rather than issuing the correction.
  - loc: "day-003:L2229"
    why_exemplary: >-
      "migrate config now to not polute our commit history with unnecessary stuff" — treats the commit log as a
      designed artifact whose signal-to-noise ratio is worth a extra minute before committing.

gaps:
  - "No /expert-council and no persona invocation anywhere in this file — zero council_episodes; the mechanism postdates this era entirely."
  - "No TDD cycle occurs anywhere in this session — zero specs written, zero RED, zero GREEN; the only test activity is running the four pre-existing specs."
  - "No commit-after-RED practice: <git_workflow> at this date prescribes only two commits (GREEN, REFACTOR), verified in `git show f06334d:CLAUDE.md`; the RED-commit rule postdates this session."
  - "No story cards, no YAML backlog — that system is born 2025-06-27 (day-011), seven weeks later; TODO.md is still a flat REQ-003…REQ-005 list."
  - "No mocking, no London-school discussion, no test-layer/GOOS reasoning — nothing the canonical §2.2 rules govern appears here."
  - "The RSpec-cargo-cult nesting `describe_book_library / describe_when_listing_books` is visible at L195-L198 and passes entirely unremarked; the flat-two-levels rule (canonical §2.1) does not yet exist."
  - "No enforcement of the claude-dev-log-diary access restriction — the author himself directs the agent to read day-002.md (L786); that restriction postdates (cf9f67d/e04c36b)."
  - "No slicing or minimal-constraint reasoning about specs — every minimalism argument here is about project files, not about what a spec should constrain."
  - "No coverage discussion; `pytest --cov` appears only as a README line."
  - "No instance of the agent proposing an alternative design or disagreeing with the author anywhere in 2,603 lines."

parked:
  - "Harness limit shaped the analysis: day-002.md (56,293 tokens) exceeded the 25,000-token Read cap (L814) and the delegated Task hit the same wall (L838), so the requested critical analysis was built from two greps and a `tree` — presented without that caveat (2025-agentic)."
  - "Session economics: $5.59 total, 38m API against 10h 7m wall, 896 lines added / 168 removed — nearly all documentation and configuration, zero product behaviour."
