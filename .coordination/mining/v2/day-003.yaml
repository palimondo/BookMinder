    source: user-verbatim
    quote: |-
      - **Scientific approach** - Think hard and form a clear hypotheses before implementation
    loc: "day-003:L518"
    feeds: skill-why
  - statement: >-
      The author notices when an agent optimizes for its own output budget rather than for the
