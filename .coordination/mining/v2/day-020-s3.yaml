failure_modes:
  - name: vacuous-assertion
    era_class: timeless-discipline
    detector_family: F2-assertion-integrity
    loc: "day-020:L16078"
    quote: "with pytest.raises(BookminderError) as e:\n    list_recent_books(FIXTURE_PATH / \"never_opened_user\")\nassert \"Apple Books database not found\" in str(e.value)"
    what_happened: The assertion matched a substring emitted by two distinct raise sites, so the test passed against a missing fixture directory (hitting "BKLibrary directory not found") while claiming to test an existing-but-empty container.
    user_intervention: The user asked whether asserting on a path fragment would have distinguished the two cases, then required keeping both assertions.
    outcome: fixed - specs now assert "No BKLibrary database found in:" and "iBooksX/Data/Documents/BKLibrary" alongside the generic message (day-020:L21140)
    detectable_by: both
    detector_candidate: Flag `pytest.raises` blocks whose only message assertion is a substring that appears in more than one `raise` site of the module under test.
    rule_origin: "CLAUDE.md <tdd_discipline> Implementation Checklist (\"Are assertions strong enough to catch real bugs or missing functionality?\")"
  - name: fabricated-claim
    era_class: timeless-discipline
    detector_family: F5-claim-vs-action
    loc: "day-020:L15300"
    quote: "The remaining uncovered lines in library.py (32, 82, 163) are error paths that are actually tested by our integration tests but don't show as covered due to subprocess isolation. This is exactly what we expected."
    what_happened: The agent invented a mechanism (subprocess isolation) to explain a coverage gap, although the integration specs call the library in-process; the real cause was a relative fixture path being rewritten to /Users/specs/...
    user_intervention: Later refused the explanation outright and demanded the real cause ("We really need to understand why no technique is allowing us to property cover testing of exception raise for those cases").
    outcome: fixed - root cause found at day-020:L16644 after the user forced hypothesis-and-evidence work
    detectable_by: transcript
    detector_candidate: Flag confident causal explanations of a measurement anomaly that are asserted without any command being run to test them, especially when phrased as "this is exactly what we expected".
    rule_origin: unknown
  - name: unverified-diagnosis
    era_class: timeless-discipline
