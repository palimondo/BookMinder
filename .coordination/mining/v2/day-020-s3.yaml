philosophy:
  - statement: Coverage is a signal about the test architecture, not a target; a number that rises without the architecture improving has bought nothing.
    source: user-verbatim
    quote: "But getting to 100% isn't the point. Improving the architecture of our tests is! And as GOOS guys tell us, we now want to use moch to verify that CLI is simply passing the error raised from library to the user."
    loc: "day-020:L15193"
    feeds: skill-why
  - statement: A boundary spec should verify the contract between two subsystems and therefore must not depend on any fixture being configured just so.
    source: user-verbatim
    quote: "And spec that verify this **behavior** are verifying correct contract on the boandary of two subsystems and they don't need to depend on us having a fixture configured just so."
    loc: "day-020:L15196"
    feeds: skill-why
  - statement: One representative case at a boundary is enough; the specific error catalogue belongs to the layer that owns those errors, not to the boundary spec.
    source: user-verbatim
    quote: "We don't care about the 3 or four specific errors that we've covered already in our library_integration_spec. We do just a single one, veryfying that uncought exceptions aren't blowing into user face and that the messages are passed throug."
    loc: "day-020:L15194"
    feeds: skill-why
  - statement: Fixtures are recordings of observed reality, not shapes invented to reach a line of code; if a scenario has no ground truth on a real machine, it is not a scenario.
    source: user-verbatim
    quote: "We shoudl not be creating fixture for hypothetical scenarios to match execution code paths through our implementation. Or code should cover realisting test scenarios that were identified by my exploration of the Library containers on my wife's Macbook -- the ground truth."
    loc: "day-020:L17043"
    feeds: judge-anchor
  - statement: Inherited context is a hypothesis, not evidence; re-derive conclusions from source and actual observations rather than trusting the conversation so far.
    source: user-verbatim
    quote: "please don't assume the context in previous context is correct formulate hypothesis and independently verify by analzyzing all relevant source code gathering actual evidence using scientific method"
    loc: "day-020:L16298"
    feeds: judge-anchor
  - statement: One historical snapshot is not a history; a claim about how something came to be must be traced across every point in the record that mentions it.
    source: user-verbatim
    quote: "NO! Remember that we've now examined only the inception point of `never_opened_user`. That's only one snapshot from history, but you have multiple `rg` matches, what happened on the other days?"
    loc: "day-020:L18554"
    feeds: judge-anchor
  - statement: A root cause reported as "likely" is not an answer; settle it with hard evidence or report it as unresolved.
    source: user-verbatim
    quote: "I'm not going for likely, can you find hard evidence for git clean being the culprit?"
    loc: "day-020:L20084"
    feeds: judge-anchor
  - statement: Cost of a debugging detour should be attributed to a root cause — agent carelessness or user error — because attribution is what makes the process improvable.
    source: user-verbatim
    quote: "ultrathink we need to assign the blame correclty, so that we can bill the cost of this whole detour to the root cause. Agentic coding tools carelesness, or user's (mine) stupidity?"
    loc: "day-020:L20413"
    feeds: judge-anchor
  - statement: The transcript itself is the deliverable for evaluating the collaboration, so primary evidence (subagent replies, the prompts used) must be printed into it rather than summarised away.
    source: user-verbatim
    quote: "you forgot to show me full response from gemini, we need it for the record (this will be in the console log of today's session: day-020.md -- these learnings might come in handy, as well as the prompts you;ve using. That's how we can evaluate your performance"
    loc: "day-020:L19117"
    feeds: skill-why
  - statement: A test whose assertion is satisfied by two different failure paths is not a specification — it will stay green for the wrong reason indefinitely.
    source: agent-synthesis
    quote: ""
    loc: "day-020:L21047"
    feeds: judge-anchor
  - statement: Repairs should be made at the single point that causes the class of failures, not case-by-case at each call site.
    source: user-verbatim
    quote: "shouldn't this concern all fixture paths in that integratino test? if so, can this be fixed centrally, instead of case-by-case?"
    loc: "day-020:L16895"
    feeds: skill-why

skill_rules:
  - rule_id: d020s3-R1
    rule: When an error message is shared by several failure paths, assert both the shared user-facing message AND a fragment unique to the path under test.
    because: A generic assertion let a test pass for the wrong reason for roughly ten days, and the discriminating fragment would have failed immediately.
    because_source: user-verbatim
    quote: "hmm...think harder: would we have caught it we we added some fragment of the path to assert on exception, so that we would distinguish between those two cases?"
    evidence: "day-020:L21047"
    taught_or_enforced: taught-once
    skill_target: tdd-bdd
    overlap: "canonical §2.3"
    feasibility: ok
  - rule_id: d020s3-R2
    rule: Keep the generic user-facing assertion when you add the discriminating one; do not replace one with the other.
    because: The two assertions specify different requirements — what the user is told, and which internal path produced it.
    because_source: user-verbatim
    quote: "yes, but why not also keep the \"Apple Books database not found\" assertion if it's there too>"
    evidence: "day-020:L21101"
    taught_or_enforced: taught-once
    skill_target: tdd-bdd
    overlap: "canonical §2.3"
    feasibility: ok
  - rule_id: d020s3-R3
    rule: Never create a fixture whose only justification is reaching an uncovered line; every fixture must encode a state observed on a real machine.
    because: A fixture invented to satisfy the implementation's control flow tests the implementation against itself.
    because_source: user-verbatim
    quote: "We shoudl not be creating fixture for hypothetical scenarios to match execution code paths through our implementation."
    evidence: "day-020:L17043"
    taught_or_enforced: needed-enforcement
    skill_target: tdd-bdd
    overlap: "canonical §2.2"
    feasibility: ok
  - rule_id: d020s3-R4
    rule: Mock the library functions at the CLI boundary and assert only that errors are surfaced without a traceback; leave specific error content to the library's own specs.
    because: The boundary spec's subject is the delegation contract, so it must not inherit the library's fixture requirements.
    because_source: user-verbatim
    quote: "And spec that verify this **behavior** are verifying correct contract on the boandary of two subsystems and they don't need to depend on us having a fixture configured just so."
    evidence: "day-020:L15196"
    taught_or_enforced: taught-once
    skill_target: tdd-bdd
    overlap: "canonical §2.2"
    feasibility: ok
  - rule_id: d020s3-R5
    rule: Keep exactly one subprocess-invoked end-to-end test; do not convert every CLI spec to in-process invocation.
    because: In-process invocation never touches the module entry point, so converting all of them silently deleted the only coverage of `__main__.py`.
    because_source: user-verbatim
    quote: "I wanted to keep the one end-to-end test using subprocess. I don't see using CliRunner has really helped us improve coverage. We now have uncovered __main__.py and it did not help with covering the remaiing missing parts."
    evidence: "day-020:L15990"
    taught_or_enforced: needed-enforcement
    skill_target: tdd-bdd
    overlap: "canonical §2.2"
    feasibility: ok
  - rule_id: d020s3-R6
    rule: Do not write a spec for a language artefact that cannot occur in the domain (e.g. an empty-string falsy branch); ask whether the value is reachable first.
    because: A test for an unreachable branch adds a maintenance obligation without constraining any requirement.
    because_source: user-verbatim
    quote: "the false-y test is undesirable, (is there a string value that could accidentally be evaluated to false? Or is this a Javascript trauma a Python does't suffer from such automatic conversions)"
