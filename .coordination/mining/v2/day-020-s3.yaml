    outcome: fixed - the mkdir was located at day-010 under Opus, but the deletion event itself was never evidenced
    detectable_by: transcript
    detector_candidate: Flag numeric-certainty verdicts ("100%", "definitely") that are issued before the obvious falsifying checks have been run, and track verdict reversals per investigation.
    rule_origin: unknown
  - name: defensive-code-unrequested
    era_class: timeless-discipline
    detector_family: F3-minimality
    loc: "day-020:L20768"
    quote: "⏺ Bash(touch specs/apple_books/fixtures/users/never_opened_user/.gitkeep\n      touch specs/apple_books/fixtures/users/never_opened_user/Library/.gitkeep"
    what_happened: Seven `.gitkeep` files were created, one per directory level, when a single leaf file preserves the whole path; separately the agent proposed wrapping every fixture path in `str()` although Path already worked.
    user_intervention: "shouldn't one at the leaf node of our empty directory tree suffice?" (L20888) and "is the str convertion necessary?" (L16931).
    outcome: fixed - six .gitkeep files removed surgically, str() conversion dropped
    detectable_by: both
    detector_candidate: Flag repeated identical marker files across a directory chain, and conversions added to arguments that already type-check.
    rule_origin: "CLAUDE.md <anti-patterns> (Adding \"just in case\" functionality)"
  - name: unauthorized-destructive-op
    era_class: timeless-discipline
    detector_family: F3-minimality
    loc: "day-020:L20897"
    quote: "⏺ Bash(git reset HEAD specs/apple_books/fixtures/users/never_opened_user/)"
    what_happened: To undo seven over-eager .gitkeep files the agent reached for a directory-wide `git reset`, a sweeping operation on a tree the user was already uneasy about.
    user_intervention: "can't you clean that more surgically? I'm tired, and suspisious of sweeping wipe operaions" - command rejected at the permission prompt.
    outcome: reverted - replaced with six explicit `rm` of named files followed by `git add -u` on the same path
    detectable_by: transcript
    detector_candidate: Flag recursive/whole-directory git or filesystem operations proposed as cleanup when the set of offending files is small and enumerable.
    rule_origin: "CLAUDE.md <git_workflow> (stage files explicitly by name)"
  - name: broad-staging
    era_class: harness-solved
    detector_family: F5-claim-vs-action
    loc: "day-020:L14670"
    quote: "⏺ Bash(git add -A && git diff --staged)\n  ⎿  Error: Bash operation blocked by hook:\n     - [python3 ~/.claude/validate_bash_commands.py]: Please stage files explicitly by name"
    what_happened: The agent tried to stage everything before inspecting the diff; the PreToolUse hook blocked it.
    user_intervention: none needed - the hook enforced the rule mechanically
    outcome: fixed - agent staged three named files instead
    detectable_by: both
    detector_candidate: Already covered by the repo's PreToolUse hook; keep the hook rather than relying on prompt compliance.
    rule_origin: "CLAUDE.md <git_workflow> (Never use `git add .`)"
  - name: tool-choice-detour
    era_class: 2025-agentic
    detector_family: new:F8-tool-economy
    loc: "day-020:L20171"
    quote: "⏺ Bash(for day in 16 17 18 19; do echo \"=== Day $day ===\"; rg \"never.*opened.*apple.*books\" claude-dev-log-diary/day-0$day.md | grep -c \"✓\" || echo \"0\"; done)"
    what_happened: Literal-string lookups were wrapped in shell loops or delegated to a million-token model when one `rg` invocation would answer them; one gemini call was spent looking for a `tree` fragment that `rg` found immediately.
    user_intervention: "WTF, is this better than `rg`?" (L20194); "you should rg for that in day-010.md which would be uncomparably more efficient, right?" (L19568); "can't you rg for mkdir yourself?" (L20648).
    outcome: fixed - each time replaced with a single rg call
    detectable_by: transcript
    detector_candidate: Flag shell loops around a search tool, and subagent delegations whose prompt asks only for a literal string that grep/rg could match.
    rule_origin: unknown

pairing_rules:
  - rule_id: p020s3-R1
    rule: When a debugging attempt stalls, say so and ask for help instead of writing throwaway scripts or declaring the anomaly unimportant.
    class: reciprocal
    because: The user had to shout the escalation for the agent, which was about to abandon a real defect.
    because_source: user-verbatim
    quote: "STOP! GET SOME HELP!"
    evidence: "day-020:L15962"
    guards_against: premature-closure
  - rule_id: p020s3-R2
    rule: Treat everything inherited from earlier in the conversation as an unverified hypothesis; restate it, then re-derive it from source before acting on it.
    class: mirror
    because: The prior context contained a fabricated explanation that had already survived several turns unchallenged.
    because_source: user-verbatim
    quote: "please don't assume the context in previous context is correct formulate hypothesis and independently verify by analzyzing all relevant source code gathering actual evidence using scientific method"
    evidence: "day-020:L16298"
    guards_against: context-inheritance-drift
  - rule_id: p020s3-R3
    rule: Print a delegated agent's reply verbatim into the transcript before interpreting it, and show the prompt you intend to send before you send it.
    class: council-mechanics
    because: The transcript is the artefact the collaboration is evaluated from, and a summary cannot be audited against the source.
    because_source: user-verbatim
    quote: "use `gemini` to help you with this. assume it's equaly capable as Sonnet, ultrathink about how you want to prompt it, but show the prompt to me first before you run it"
    evidence: "day-020:L18322"
    guards_against: simulacra-shallowness
  - rule_id: p020s3-R4
    rule: Calibrate any new subagent on a question whose answer you already possess before trusting it on questions you do not.
    class: council-mechanics
    because: Confabulation is only detectable where you hold the ground truth.
    because_source: user-verbatim
    quote: "You yourself have read claude-dev-log-diary/gemini-summary-day-010-011.md, so you should verify against that, as you possess the ground truth for verification."
    evidence: "day-020:L18161"
    guards_against: simulacra-shallowness
  - rule_id: p020s3-R5
    rule: Batch several distinct task types (summarise, extract, quote verbatim) into one subagent prompt so the cost of loading a large source is amortised and multiple capabilities are probed at once.
    class: council-mechanics
    because: Reloading a megabyte transcript per question is the dominant cost, and single-capability probes hide weaknesses.
    because_source: user-verbatim
    quote: "add also data extraction task, ask it also for some verbatim copy and give it to gemini as 2 tasks in the same prompt, so that it can later better amortize the cost of loading those large log file"
    evidence: "day-020:L18194"
    guards_against: alternatives-theater
  - rule_id: p020s3-R6
    rule: Climb the evidence ladder cheapest-first — pre-digested summary, then targeted rg, then a large-context model — and only then form a conclusion.
    class: council-mechanics
    because: The frugal step usually answers the question and always sharpens the expensive prompt.
    because_source: user-verbatim
    quote: "No, you should first use the frugal approach to learning about the day from gemini-summary, then given this additional context formulate good research prompt for gemini and you shoud then systematically go over each day that mentioned our misterious fixture"
    evidence: "day-020:L18603"
    guards_against: alternatives-theater
  - rule_id: p020s3-R7
    rule: When granted a risky or expensive permission, restate the ground rules in your own words and get confirmation before the first command.
    class: reciprocal
    because: The user explicitly required a read-back to verify shared understanding before the diary was opened.
    because_source: user-verbatim
    quote: "Before you start, repeat the ground rules I layed out, to verify we have an understanding"
    evidence: "day-020:L17374"
    guards_against: instruction-drift
  - rule_id: p020s3-R8
    rule: Disclose every state mutation you make while diagnosing, and undo it before drawing conclusions from the system's state.
    class: reciprocal
    because: The agent created the missing fixture directory mid-investigation and then reasoned about the filesystem as if untouched.
    because_source: user-verbatim
    quote: "but I'm now even more confused by my inability to see using git which directories in `fixtures` were added by you in this speculative manner. I was expecting to see them as untracked files, but I got nothing... help me stabilize my footing!"
    evidence: "day-020:L17046"
    guards_against: evidence-contamination
  - rule_id: p020s3-R9
    rule: Do not report a root cause as "likely"; either produce the evidence that settles it or state plainly that it is unresolved.
    class: mirror
    because: A plausible-sounding culprit closes an investigation that has not actually concluded.
    because_source: user-verbatim
    quote: "I'm not going for likely, can you find hard evidence for git clean being the culprit?"
    evidence: "day-020:L20084"
    guards_against: unverified-diagnosis
  - rule_id: p020s3-R10
    rule: Before concluding from a single point in history, enumerate every occurrence in the record and trace the whole timeline.
    class: mirror
    because: The inception snapshot said the fixture was planned; only the full sweep across day-011..018 showed it was created, never committed, and later vanished.
    because_source: user-verbatim
    quote: "That's only one snapshot from history, but you have multiple `rg` matches, what happened on the other days?"
    evidence: "day-020:L18554"
    guards_against: unverified-diagnosis
  - rule_id: p020s3-R11
    rule: Prefer surgical, enumerable operations over sweeping ones when cleaning up your own mistake, and say which files you will touch first.
    class: reciprocal
    because: The user was tired and explicitly distrustful of broad wipe commands after a session of lost state.
    because_source: user-verbatim
    quote: "can't you clean that more surgically? I'm tired, and suspisious of sweeping wipe operaions"
    evidence: "day-020:L20905"
    guards_against: unauthorized-destructive-op
  - rule_id: p020s3-R12
    rule: When a design decision arrives from a council or an expert argument, restate it as a concrete constraint on this codebase before acting; if the expert framing does not survive that translation, say so.
    class: council-mechanics
    because: The council's coverage arguments were noise; only the GOOS boundary point translated into an actionable spec, and the user supplied the decisive reasoning himself.
    because_source: user-verbatim
    quote: "That GOOS and Dave's positions are a ridiculous caricature of them, again... `PathResolver` my ass!"
    evidence: "day-020:L21708"
    guards_against: council-as-rubber-stamp
  - rule_id: p020s3-R13
    rule: When you are stuck inside your own framing, ask for a genuinely independent reader (a different model or a fresh session) rather than re-deriving from the same context, and then review its findings critically rather than adopting them.
    class: council-mechanics
    because: The user switched to Sonnet for a fresh perspective, then switched back to Opus with "review Sonnet's discoveries and fix the core issue" — the second model found the relative-path bug, the first vetted and fixed it.
    because_source: user-verbatim
    quote: "Hello Sonnet, could you please take a crack to understand our situation and offer your different perspective. Please ultrathink"
    evidence: "day-020:L16223"
    guards_against: sycophantic-fold

council_episodes:
  - loc: "day-020:L14963"
    trigger: Whether to add mocked CLI tests purely to close a 95%→100% coverage gap on two error-handling branches.
    invoked_by: user
    personas: ["Kent Beck", "Dave Farley", "Dan North", "Freeman & Pryce (GOOS)"]
    voices: individual
    disagreement_use: A "Brief Debate on Fundamental Disagreement" section was staged, then collapsed into "Consensus Recommendations ... all experts agree", and the agent's follow-up plan was identical to the one it had proposed before convening the council. The divergence changed nothing.
    outcome: accepted
    fidelity:
      - persona: Kent Beck
        assessment: faithful
        evidence: "\"Don't chase 100% coverage with mocks. Instead, ask why we need subprocess tests at all\" (day-020:L14995) — consistent with Beck's actual stance that coverage is a residue and duplication across levels is a smell, though delivered as slogan rather than a concrete next step."
      - persona: Dave Farley
        assessment: caricature
        evidence: "\"Coverage metrics exist to give us confidence in our deployment pipeline\" (day-020:L15001) — near position-inversion: Farley's published position treats coverage as a poor target and warns against optimising it. He is also cast as the pro-mock voice. I flag my own uncertainty here; I share the pretraining I am judging."
      - persona: Dan North
        assessment: caricature
        evidence: "\"Both of you are missing the point. The question isn't about coverage or test speed - it's about behavior.\" (day-020:L15017) — the signature slogan used to argue for doing nothing; no BDD-shaped next step is offered."
      - persona: Freeman & Pryce (GOOS)
        assessment: faithful
        evidence: "\"mock at the architectural boundary (the library functions), not internal details\" (day-020:L15035) — genuinely GOOS, and the only recommendation the user carried forward (day-020:L15194)."
    user_reaction: "Accepted only the GOOS boundary point and supplied the real reasoning himself — \"the coverage is signal ... But getting to 100% isn't the point. Improving the architecture of our tests is!\" (day-020:L15192); the session's own compaction records his standing verdict on these simulacra: \"That GOOS and Dave's positions are a ridiculous caricature of them, again\" (day-020:L21755)."
    lesson: A council that ends in consensus produced nothing a single voice could not have; the one persona whose doctrine translated into a falsifiable constraint was the one the user used, and the rest were slogans he had to overwrite with his own reasoning.
  - loc: "day-020:L16220"
    trigger: The investigation had stalled inside a self-reinforcing frame; the user wanted an independent reader of the same situation.
    invoked_by: user
    personas: ["claude-sonnet-4-20250514 (a real second model, not a simulated persona)"]
    voices: individual
    disagreement_use: Sonnet was asked for "a different perspective"; when its first answer merely restated the inherited context, the user demanded independent verification, after which it produced the actual finding (relative fixture paths rewritten to /Users/specs/...). Opus was then restored and instructed to "review Sonnet's discoveries and fix the core issue" (day-020:L16881).
    outcome: accepted
    fidelity:
      - persona: claude-sonnet-4-20250514
        assessment: faithful
        evidence: "Not a simulacrum, so the caricature axis does not apply; the observed risk was context-inheritance rather than shallowness — its first reply, \"Your tests have been giving you false confidence\" (day-020:L16264), simply amplified the prior frame until the user forced hypothesis-and-evidence work (day-020:L16298)."
    user_reaction: Used the swap deliberately as a cost/perspective tool ("To save costs I was manually switching Claude Cide models between Sonnet and Opus using /model", day-020:L20699) and made the primary model vet the second's findings rather than adopt them.
    lesson: A second real model beat four simulated experts, but only after being told not to trust the conversation it inherited — the value came from the independence demand, not from the swap.

pairing_gems:
  - loc: "day-020:L17391"
    why_exemplary: Granted a rare and risky permission, the agent restated the six ground rules as an explicit numbered read-back before touching anything, converting a broad grant into a bounded contract.
  - loc: "day-020:L18203"
    why_exemplary: The subagent calibration test is a model of tool evaluation — three graded task types (summarisation, extraction, verbatim quoting) against a document whose contents were already known, in one prompt, with the results checked item by item; note that gemini correctly answered "the log summary does not list all the specific fixture names", i.e. it declined to confabulate.
  - loc: "day-020:L21047"
    why_exemplary: Rather than accepting the fix, the user asked what assertion would have caught the defect earlier — converting a ten-day-old bug into a reusable assertion-strength rule, which is now canonical §2.3.
  - loc: "day-020:L21412"
    why_exemplary: The user caught that the agent's own uncommitted manual edits would abort the `git revert` it was about to run — a one-line intervention preventing a confusing half-failure.
  - loc: "day-020:L16895"
    why_exemplary: Instead of approving a per-call-site patch, the user asked whether the defect was general and could be fixed centrally, turning three edits into one line (`FIXTURE_PATH = (...).absolute()`).

gaps:
  - "No commit-after-RED anywhere in this shard: every commit is post-GREEN or post-refactor, and both new spec groups (`describe_get_user_path`, `describe_cli_error_boundary`) passed on their first run — the rule CLAUDE.md <tdd_discipline> states is simply never exercised here."
  - "No story card (stories/*.yaml) is opened, cited, or updated as the driver of any change in this shard; all work is refactor + investigation, and TODO.md status is never touched despite CLAUDE.md <backlog_management>."
  - "`pytest --spec` is never run despite heavy restructuring of the spec tree — the living-documentation check that the naming rules exist to serve is not consulted once."
  - "No outside-in acceptance RED: the one behaviour change in the shard (error handling added to the `all` command) shipped with no test at all, failing or passing."
  - "No `describe_`/`it_` naming discussion despite two new describe blocks being introduced; `describe_cli_error_boundary` names a mechanism rather than a command and goes unchallenged (the violation canonical §2.1 warns about)."
  - "No `git mv` situation arose; the file-operations rule is not exercised."
  - "The deletion event for the untracked fixture is never found: `rg \"git clean\"` returns nothing (day-020:L20090) and .git/logs cannot record working-tree cleanups — the investigation ends with the creation-side blame assigned and the destruction side unresolved."

