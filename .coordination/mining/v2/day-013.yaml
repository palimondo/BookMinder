  - rule_id: d013-R14
    rule: Commit the Apple Books UI screenshots into `docs/` and reference them inline from `docs/apple_books.md` next to the claims they support.
    because: Prose descriptions of screenshots the agent can no longer see cannot be re-checked, and the research then has to be redone.
