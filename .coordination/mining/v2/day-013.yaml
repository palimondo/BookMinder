    rule: "Treat `BKLibrary-*.sqlite` as the authoritative library catalogue; `Books.plist` (and its `plutil -convert swift` rendering) omits cloud-only titles such as 'Lao Tzu: Tao Te Ching' even when freshly converted."
    because: A freshly regenerated plist still lacked books the database knew about, so plist absence proves nothing about library membership.
    because_source: agent-synthesis
    evidence: "day-013:L833-L839, L848-L860, L948-L951"
