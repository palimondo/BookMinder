  - rule_id: d013-R17
    rule: Do not trust `ZISSAMPLE` as the sample indicator — it reads 0 for titles the Apple Books UI labels 'Sample' (Snow Crash, Tiny Experiments); re-validate against the UI before specifying sample behaviour.
    because: The database column and the user-visible label disagreed on every sample checked.
