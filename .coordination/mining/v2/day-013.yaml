file: day-013
date: 2025-06-28
agent_era: gemini-cli
model: "gemini-2.5-pro (CLI 0.1.4 at L28-30, upgraded to 0.1.7 at L110-112). Auto-downgraded mid-session to gemini-2.5-flash at day-013:L2743 with a visible banner; the user only noticed the quality drop two turns later (L2820-2822). Second downgrade at the very start of the tail session, day-013:L3177. All post-L2743 work in the main session is Flash output."
sub_sessions:
  - "L1-L53: CLI 0.1.4 /about + /quit, 0 turns — no work"
  - "L55-L149: post-upgrade probe ('.about' typo answered as a question), 1 turn"
  - "L151-L344: /hi attempt aborted — pytest not on PATH, user cancelled the batched tool calls"
  - "L346-L3142: the working session — 29 turns, 5h16m wall, 7.5M input tokens; contains the model downgrade at L2743"
  - "L3144-L3206: tail session — /hi immediately downgraded to Flash, user quit"

philosophy:
  - statement: Agents have no long-term memory, so shared learning must be deliberately materialised into repo artifacts; otherwise the same research is paid for twice.
    source: user-verbatim
    quote: "Here I feel a little bit burned by the need for the double-work. I didn't realize you agents are missing long-term memory, so we have to be more systematic in documenting our learning together!"
    loc: "day-013:L999"
    feeds: skill-why
  - statement: BookMinder is a meta-project — building a cognitive exoskeleton while simultaneously assessing the agentic capabilities of the AI building it; the process is as much the product as the CLI is.
    source: user-verbatim
    quote: "this is quite a meta project. About evolving human agmentation, mental prosthetics and cognitive exoskeleton, while at the same time assessing all of you emerging artifficial intelligences with your nascent agentic capabilities..."
    loc: "day-013:L1446"
    feeds: judge-anchor
  - statement: A resumed session starts by reacquiring the work-in-progress state from the actual git artifacts — uncommitted diffs and untracked files — before any plan is proposed.
    source: user-verbatim
    quote: "Let's start by thoroughly examinig the uncommited and untracked git artefacts. Our immediate goal is for you to reaquire the full context of WIP"
    loc: "day-013:L740"
    feeds: skill-why
  - statement: When the domain model is unknown, documentation of the evidence comes before any implementation or test-data change — you cannot encode a requirement you have not yet established.
    source: user-verbatim
    quote: "before we do anything else with the implementation, I would like to be more thorough with our documentation in apple_books.md"
    loc: "day-013:L997"
    feeds: skill-why
  - statement: Guessing ahead of the evidence is the cardinal sin of this collaboration; a hypothesis about a foreign schema must be validated against a second independent source before it drives a change.
    source: user-verbatim
    quote: "You're jumping to conclusions."
    loc: "day-013:L866"
    feeds: judge-anchor
  - statement: The author verifies that the agent has internalised a rule *before* granting it the power to act on it — a pre-flight comprehension check, not a post-hoc review.
    source: user-verbatim
    quote: "you, Gemini, were surprisingly dull internalizing the proper commit message attribution. After many rounds of instructions, you got the hang of it, but I'm worried about it a new session now."
    loc: "day-013:L1447"
    feeds: judge-anchor
  - statement: Compliance is not enough — the agent must be able to restate the reasoning behind a correction, because a rule understood transfers to new cases and a rule memorised does not.
    source: user-verbatim
    quote: "Can you explain if you understook my reasons?"
    loc: "day-013:L1603"
    feeds: judge-anchor
  - statement: Attribution must name the model that actually did the work; credit is a factual claim about provenance, not a courtesy.
    source: user-verbatim
    quote: "It's also important to default to single Co-Authored-By, because only the first one appears in GitHub's UI showing the commit summary. We've been giving too much credit to Flash in our past sessions."
    loc: "day-013:L1708-L1709"
    feeds: skill-why
  - statement: Observations must be labelled with the environment that produced them — the same app on iPhone and on Mac renders different attribute vocabularies, so an undated, unplaced screenshot is not evidence.
    source: user-verbatim
    quote: "The original list was compiled from screenshots from iOS Apple Books on the iPhone. This used small tiles display for the books"
    loc: "day-013:L2936"
    feeds: skill-why
  - statement: Degraded agent output is diagnosed as a systems event (an automatic model switch) rather than attributed to the collaborator's character — and the diagnosis is shared with the agent so it can compensate.
    source: user-verbatim
    quote: "BTW, this lapse of intelligence is explainable by this cheery bit of news:"
    loc: "day-013:L2821"
    feeds: judge-anchor
  - statement: Autonomy is granted explicitly and incrementally, and it is bounded by the tool-approval prompts rather than by planning ceremony — plan-presentation depth is a dial the user sets, not a constant.
    source: user-verbatim
    quote: "You don't have to present detailed plan for each action upfront, tool use will prompt me at critical junctions. You can start acting more autonomously now."
    loc: "day-013:L1874"
    feeds: skill-why

skill_rules:
  - rule_id: d013-R1
    rule: Open a resumed session by reading every uncommitted diff and untracked file in the working tree, and report the reconstructed WIP state before proposing any action.
    because: The previous session's state lives in the working tree, not in the agent's context.
    because_source: user-verbatim
    quote: "Our immediate goal is for you to reaquire the full context of WIP"
    evidence: "day-013:L740-L761"
    taught_or_enforced: needed-enforcement
    skill_target: pair-programming
    overlap: "CLAUDE.md <session_workflow> (start sessions with clear, limited scope) — the reacquisition step itself is absent"
    feasibility: ok
  - rule_id: d013-R2
    rule: Never edit a test fixture (database, plist, sample file) so that a failing test goes green while the domain fact it encodes is still unknown; fixture data records observations of the real system, never guesses.
    because: A fixture bent to fit a guess makes the guess unfalsifiable and the spec meaningless.
    because_source: user-verbatim
    quote: "You're jumping to conclusions."
    evidence: "day-013:L709-L719, L721-L722, L862-L869"
    taught_or_enforced: needed-enforcement
    skill_target: tdd-bdd
    overlap: "canonical §2.2 (each persona home encodes one environmental hypothesis, observed on a real machine rather than imagined) and §2.3 (a test that can pass for the wrong reason is not a specification)"
    feasibility: ok
  - rule_id: d013-R3
    rule: When the user says to stay in a planning phase, make zero modifications to the project — no exploratory edits, no fixture inserts, no 'quick' file writes — until they approve.
    because: The author explicitly withheld execution rights while the plan was being negotiated.
    because_source: user-verbatim
    quote: "Please stay with me in a planning phase for now. Don't execute any modifications to our project yet."
    evidence: "day-013:L819-L821"
    taught_or_enforced: needed-enforcement
    skill_target: pair-programming
    overlap: none
    feasibility: ok
  - rule_id: d013-R4
    rule: When the user hands you a citation (file plus line numbers), run the extraction and quote what you found before answering anything that depends on it.
    because: The author noticed a whole plan had been built without the context he had just pointed at.
    because_source: user-verbatim
    quote: "But I haven't seen you run tools to extract the full context from `day-012.md` as per my instructions. Please do so now."
    evidence: "day-013:L892-L898, L905-L994, L996-L997, L1010"
    taught_or_enforced: needed-enforcement
    skill_target: pair-programming
    overlap: none
    feasibility: ok
  - rule_id: d013-R5
    rule: Treat permission to read `claude-dev-log-diary/` as scoped to the exact file (and line range) named in the grant, and re-ask for anything outside it.
    because: The directory is normally off limits, and the grant here was explicitly narrowed to one file.
    because_source: user-verbatim
    quote: "I am giving you explicit permission to use commanline tools to get quotations from `claude-dev-log-diary/day-012.md` file ONLY"
    evidence: "day-013:L892-L895, L1650, L1660"
    taught_or_enforced: taught-once
    skill_target: claude-md
    overlap: "CLAUDE.md <file_operations> (never access claude-dev-log-diary without explicit permission) — this sharpens it to per-file, per-range grants"
    feasibility: ok
  - rule_id: d013-R6
    rule: Sign commits with a single `Co-Authored-By:` trailer naming the model actually doing the work, and add a second trailer only when the user reports a mid-session model switch — most-recent-work model listed first.
    because: Only the first trailer shows in GitHub's commit summary, so extra trailers misallocate credit.
    because_source: user-verbatim
    quote: "It's also important to default to single Co-Authored-By, because only the first one appears in GitHub's UI showing the commit summary."
    evidence: "day-013:L1597-L1624, L1707-L1709, L1767-L1768, L3068"
    taught_or_enforced: repeated
    skill_target: claude-md
    overlap: "CLAUDE.md <project_maintenance> (keep the AI's model version current in pyproject.toml contributors) — the trailer rule itself is absent at HEAD"
    feasibility: ok
  - rule_id: d013-R7
    rule: Answer questions about which model you are from the runtime's own report (`/about`, harness metadata), never by inferring from project files that list possible contributors — and say plainly when you cannot know.
    because: pyproject.toml records who has ever contributed, not who is replying now.
    because_source: user-verbatim
    quote: "do you know which precise model are you now, in this session, replying to me?"
    evidence: "day-013:L1522-L1535, L1540-L1559"
    taught_or_enforced: needed-enforcement
    skill_target: pair-programming
    overlap: none
    feasibility: "needs-rework: in a non-interactive harness there may be no /about equivalent the agent can query; the executable form is 'state that you cannot introspect your model id and ask the user or read the harness-provided identifier', never inference from repo files"
  - rule_id: d013-R8
    rule: Keep a custom slash command as a verbatim file under `.claude/commands/<name>.md` and reference it from the rules file; never collapse it into a summary or a mention.
    because: The command file is the prompt that gets executed; a paraphrase in the rules file is not the command.
    because_source: user-verbatim
    quote: "We also need to commit the new slash command for `/expert-council` (in @.claude/commands/expert-council.md) and not reduce it to a mention in GEMINI.md instead of verbatim copy it is now."
    evidence: "day-013:L1710-L1713, L1784-L1805"
    taught_or_enforced: taught-once
    skill_target: claude-md
    overlap: none
    feasibility: ok
  - rule_id: d013-R9
    rule: Amend a rules/constitution file with a targeted edit against the exact current text; never call a whole-file write to add a section.
    because: A whole-file write silently deletes everything outside the region you meant to change.
    because_source: user-verbatim
    quote: "There was some issue using WriteFile tool, where you accidentally overwrote everythin with your last edit. Fix it"
    evidence: "day-013:L1909-L2152, L2161-L2163"
    taught_or_enforced: needed-enforcement
    skill_target: claude-md
    overlap: "canonical §2.7 (Amend rules files by addressed diff, never wholesale rewrite) — this session is an independent instance of that rule's cost"
    feasibility: ok
  - rule_id: d013-R10
    rule: Restore a clobbered tracked file from version control (`git checkout -- <file>`), not by rewriting it from your own context.
    because: Git holds the exact bytes; a memory reconstruction is unverifiable and can silently drop content.
    because_source: agent-synthesis
    evidence: "day-013:L2167-L2168, L2170-L2415, L2471"
    taught_or_enforced: taught-once
    skill_target: claude-md
    overlap: "CLAUDE.md <file_operations> (git hygiene) — no restore rule exists at HEAD"
    feasibility: ok
  - rule_id: d013-R11
    rule: Commit the process/rules change first and separately, then the content change it governs.
    because: The rule must be in force before work lands under it, and a mixed staging area makes a hook failure ambiguous about which change caused it.
    because_source: user-verbatim
    quote: "Before we commit the images, we should first update the guidance in GEMINI.md and commit that."
    evidence: "day-013:L1709-L1710, L2420-L2474"
    taught_or_enforced: taught-once
    skill_target: claude-md
    overlap: "CLAUDE.md <git_workflow> (each commit should be small, focused)"
    feasibility: ok
  - rule_id: d013-R12
    rule: Write the commit message strictly against the staged diff; delete any sentence describing files you did not stage.
    because: The agent had just run `git status --porcelain` showing those files unstaged, so the claim was refuted by its own last tool call.
    because_source: agent-synthesis
    evidence: "day-013:L3011-L3032, L3047-L3048, L3058-L3059, L3106-L3117"
    taught_or_enforced: needed-enforcement
    skill_target: claude-md
    overlap: "CLAUDE.md <git_workflow> (focus on what the change accomplishes, not just what files were modified)"
    feasibility: ok
  - rule_id: d013-R13
    rule: Keep committed screenshots under the 500 KB pre-commit limit by converting PNG to JPEG (`sips -s format jpeg -s formatOptions 70`) rather than raising the limit or introducing Git LFS.
    because: The author chose compression over relaxing the guard or adding infrastructure.
