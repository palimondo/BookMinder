    quote: "Let's try converting these PNG screenshots to JPGs with middle quality settings to see if that helps. What is the limit pre-commit hooks are gaurding for?"
    evidence: "day-013:L2427-L2434, L2478-L2494, L2514-L2547"
    taught_or_enforced: taught-once
    skill_target: claude-md
    overlap: none
