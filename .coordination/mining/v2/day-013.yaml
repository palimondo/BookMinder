    feasibility: ok
  - rule_id: d013-R15
    rule: Treat `ZSTATE = 5` rows in ZBKLIBRARYASSET as Series containers (Hainish, The Baroque Cycle), not as individual books, and never as the cloud indicator.
    because: The user's own library has no ZSTATE 5 books, and the two ZSTATE 5 rows render in the UI as series, not titles.
