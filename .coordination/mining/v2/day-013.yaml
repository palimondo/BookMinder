  - rule_id: d013-R19
    rule: Record which platform's Apple Books UI a screenshot came from — the iPhone tile view and the macOS list view use different attribute text, and 'Complete' on macOS is the long form of the progress percentage, not a status.
    because: Mixing the two vocabularies produced a documentation error the agent then defended twice.
