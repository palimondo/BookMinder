    quote: "Now I think it would be better to commit the docs/*.png into our repo and refference them inline from docs/apple_books.md"
    evidence: "day-013:L998-L999, L2724-L2734, L2854-L2862"
    taught_or_enforced: taught-once
    skill_target: project-memory
