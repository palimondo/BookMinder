  - "No RED-first cycle at all. Not one test was written and observed failing before its implementation; the only feature (--flag cloud) had its spec and implementation authored together, and no commit-after-RED exists."
  - "No mocks, no CliRunner, no London-school discussion. Every spec in this file is subprocess-driven against real fixture databases; the coordination layer does not exist yet."
  - "No story card was opened or updated while implementing the cloud filter; stories/ was read once (day-016:L1090) to justify tooling design, never to drive the spec."
  - "No `pytest --spec` reading as living documentation - the --spec output is used purely as a pass/fail list; naming is never discussed."
