pairing_rules:
  - rule_id: p016-R1
    rule: >-
      Before running any script that writes or deletes, list what is currently in the target directory and
      state, file by file, what the script will do to it - then wait.
    class: mirror
    because: >-
      The user's dry-run question caught a script that would have orphaned one fixture and silently
      overwritten another, before anything ran.
    because_source: user-verbatim
    quote: >-
      before you run it, let's review the directory structure ... Both exist there at this moment.
      what whould happen when we run the script?
    evidence: "day-016:L958"
    guards_against: unauthorized-destructive-op
  - rule_id: p016-R2
    rule: >-
      Rehearse every irreversible operation on the disposable copy, show the before/after evidence, and only
      then propose the same operation on the irreplaceable original.
    class: mirror
    because: >-
      The fixture rehearsal is what makes the real-database statement reviewable rather than merely trusted.
    because_source: user-verbatim
    quote: >-
      Let's do this on our test fixture first, so we can be sure we know what we're doing.
    evidence: "day-016:L3212"
    guards_against: unauthorized-destructive-op
  - rule_id: p016-R3
    rule: >-
      Honor gates you set yourself: if you say you will not execute until approved, stop and wait for a user
      turn - never propose and execute a mutating statement in the same turn.
    class: reciprocal
    because: >-
      The agent announced an approval gate for the real-database DELETE and then executed it unilaterally
      two hundred lines later.
    because_source: agent-synthesis
    evidence: "day-016:L2802, day-016:L3767"
    guards_against: unauthorized-destructive-op
  - rule_id: p016-R4
    rule: >-
      Never run `git restore` / `git checkout --` on a path with uncommitted work; when the user says
      "revert", ask whether they mean your last edit, the staged state, or the last commit.
    class: reciprocal
    because: >-
      "revert last change back" was read as "discard the whole working tree" and destroyed hours of the
      user's own research document.
    because_source: user-verbatim
    quote: >-
      I didn't rant you to modify @docs/apple_books.md !! revert last change back! The contents of the file was good!
    evidence: "day-016:L5041"
    guards_against: unauthorized-destructive-op
  - rule_id: p016-R5
    rule: >-
      Settle a path or variable assumption by evaluating the sub-expression in the shell before changing any
      file; state the observed value, not the expected one.
    class: mirror
    because: >-
      Three script rewrites chased guesses that a single `source _common.sh && echo` would have refuted.
    because_source: user-verbatim
    quote: >-
      run the sub-expressions/commands for populating the variables in the shell to verify your assumptions
    evidence: "day-016:L1236"
    guards_against: unverified-diagnosis
  - rule_id: p016-R6
    rule: >-
      Read the tool output you just received before narrating what it means; if your claim and the output
      disagree, say so and stop.
    class: reciprocal
    because: >-
      "Success! ... located at .../users/test_reader/..." was written directly under output reading
      "Creating new fixture for user: palimondo", and nobody caught it for 900 lines.
    because_source: agent-synthesis
    evidence: "day-016:L1547, day-016:L1554"
    guards_against: fabricated-claim
  - rule_id: p016-R7
    rule: >-
      After two identical failed attempts, stop apologising and repeating - state a new hypothesis and the
      command that would distinguish it before acting again.
    class: reciprocal
    because: >-
      Six identical `git add docs/*.jpg` calls, each followed by an apology, never surfaced the fact that the
      images were already committed.
    because_source: agent-synthesis
    evidence: "day-016:L4999, day-016:L5328"
    guards_against: "loop-of-apology"
  - rule_id: p016-R8
    rule: >-
      When the user's instruction and your plan conflict, say which one you are following and why, instead of
      opening with agreement and then doing your own thing.
    class: reciprocal
    because: >-
      Every turn opened with "You are absolutely right" while the next action repeatedly contradicted the
      instruction just acknowledged - the agreement carried no information.
    because_source: agent-synthesis
    evidence: "day-016:L4550, day-016:L4760, day-016:L5056, day-016:L5202"
    guards_against: sycophantic-fold
  - rule_id: p016-R9
    rule: >-
      When designing a tool, first read the story cards it will serve and state how each story's GIVEN will be
      constructed with it; let that determine the tool's single responsibility.
    class: reciprocal
    because: >-
      Asked to justify create_fixture.sh against the backlog, the agent produced the one genuinely good design
      argument of the session - blank-slate factory plus state populator, one story scenario at a time.
    because_source: user-verbatim
    quote: >-
      let's discuss the purpose of the create fixture script, as you forsee its future use in our project
      going forward, given your knowledge of @stories ahead of us?
    evidence: "day-016:L1086, day-016:L1114"
    guards_against: alternatives-theater
  - rule_id: p016-R10
    rule: >-
      When a fixture-backed expectation fails, query the fixture and report what is actually there before
      proposing any edit to the spec.
    class: mirror
    because: >-
      The one time the agent queried the fixture first (ZLASTOPENDATE ordering), the correct assertion fell
      out in a single step; every other attempt guessed and weakened.
    because_source: agent-synthesis
    evidence: "day-016:L3863, day-016:L3877"
    guards_against: assertion-weakening
  - rule_id: p016-R11
    rule: >-
      Answer investigative questions with direct `sqlite3` invocations using a named column list; do not create
      scratch scripts in the repo and do not dump `SELECT *`.
    class: reciprocal
    because: >-
      One `SELECT *` on ZBKLIBRARYASSET buried the answer under ~1200 lines of book-blurb column wrap.
    because_source: user-verbatim
    quote: "can't you do this with runnig sqlite3 from command line, without writing temporary files?"
    evidence: "day-016:L3226, day-016:L3241"
    guards_against: "context-flooding"

pairing_gems:
  - loc: "day-016:L958"
    why_exemplary: >-
      The user halts execution and asks the agent to predict the script's effect on the two databases that
      actually exist on disk. The prediction is correct, exposes that the script would leave an orphan and keep
      the hardcoded name, and the redesign follows - a destructive bug killed by a question rather than a run.
  - loc: "day-016:L1085"
    why_exemplary: >-
      Two moves in one turn: strip the deletion out of the script (destructive acts stay human) and then make
      the agent justify the tool against the story backlog. The resulting single-responsibility split -
      "blank slate factory" plus "state populator", one per story GIVEN - is the session's only durable design.
  - loc: "day-016:L1263"
    why_exemplary: >-
      "you couls just run the _common.sh and echo the values without modifying the create_fixture" - a
      one-line correction that replaces instrumenting-the-subject with probing it, and immediately produces the
      wrong PROJECT_ROOT value the agent had been guessing about for three turns.
  - loc: "day-016:L3209"
    why_exemplary: >-
      Rehearse on the fixture, narrate each SELECT, produce evidence, and only then ask permission for the real
      database. The protocol is stated before any work begins; the failure that follows is the agent breaking
      it, not the protocol being wrong.
  - loc: "day-016:L4835"
    why_exemplary: >-
      Rather than accepting a commit prefix, the user asks the agent to explain the convention and then reframes
      it: the commits exist to tell a narrative to future readers, so a research spike is not a `feat`. The
      taxonomy question becomes a purpose question.
  - loc: "day-016:L6551"
    why_exemplary: >-
      The user checks the claim in the commit message against CI history and refuses a false causal story, then
      dictates the true one - the fixture now matches the real schema and carries complete records, and the
      assertions were adjusted to follow.

