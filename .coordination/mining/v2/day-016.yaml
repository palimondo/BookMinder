file: day-016
date: 2025-07-04
agent_era: gemini-cli
model: >-
  gemini-2.5-pro for sub-session 1 only (51 requests), then silently downgraded to
  gemini-2.5-flash and never restored. Downgrade notices at day-016:L2003 (mid-session-1),
  day-016:L2113 (session 2 opening turn), day-016:L2943 (session 3 opening turn);
  /about confirms gemini-2.5-flash at day-016:L2027. Session totals: S1 pro 51 / flash 1,
  S2 flash 18, S3 flash 241. Everything from day-016:L2007 onward is flash output.
sub_sessions:
  - "L1-2087 (gemini-2.5-pro; fixture tooling repair, rm scare, first fixture build)"
  - "L2089-2918 (flash; test-assertion edits, real-DB duplicate discovery, /quit in frustration)"
  - "L2920-7718 (flash; duplicate DELETE in real DB, commit splitting, git-restore catastrophe, session abandoned)"

philosophy:
  - statement: >-
      Commits are split not for tidiness but so the repo history reads as a narrative a future
      reader can follow: research spike first, then tooling, then the feature it enabled.
    source: user-verbatim
    quote: |-
      explain to me the prefix convention, "feat(docs)" seems strange, as we didn't implement a
      feature, we did a research spike as part of our implementation of cloud feature, which will be
      commited last, we're splitting the commits to tell an easily understandable narattives for future readers of our repo history
    loc: "day-016:L4835"
    feeds: skill-why
  - statement: >-
      A commit's subject line should name the story being implemented, the way the story-card
      filename does; the diff already shows which files changed, so restating them is noise.
    source: user-verbatim
    quote: |-
      OK, but the main description should be more like the filename of the story we're implementing,
      brief and to the point. You're again mentioning files in the commit message, WHY?!?
      What did we just talk about 5 minutes ago?!
    loc: "day-016:L7468"
    feeds: judge-anchor
  - statement: >-
      Assumptions about paths and variables are settled by executing them, not by reasoning about
      them - and the observation must not disturb the artifact being observed.
    source: user-verbatim
    quote: |-
      run the sub-expressions/commands for populating the variables in the shell to verify your
      assumptions, or use use print debugging to observe your scripts behavior, but DON'T use
      absolute path and my username in the script -- it must be portable to different machines and users
    loc: "day-016:L1236"
    feeds: judge-anchor
  - statement: >-
      Non-invasive probing beats instrumenting the subject: source the shared script and echo the
      values rather than editing the script under investigation.
    source: user-verbatim
    quote: "you couls just run the _common.sh and echo the values without modifying the create_fixture"
    loc: "day-016:L1263"
    feeds: skill-why
  - statement: >-
      Irreversible operations are rehearsed on the disposable copy first, and the evidence that the
      rehearsal was correct is produced before the irreplaceable original is touched.
    source: user-verbatim
    quote: |-
      I need you to be extra carefull when doing this, so you need to show me evidence that we got it
      all right, before I allow you to modify the real DB. Explain all the selects as you go about the
      research! Let's do this on our test fixture first, so we can be sure we know what we're doing.
    loc: "day-016:L3209"
    feeds: judge-anchor
  - statement: >-
      Before running anything that writes or deletes, reason out loud about what it will do to the
      files that are on disk right now - the dry-run is a design review of the script, not a formality.
    source: user-verbatim
    quote: |-
      before you run it, let's review the directory structure under @specs/apple_books/fixtures/ and
      reason about the script parameters and path resolution. ... Both exist
      there at this moment. what whould happen when we run the script?
    loc: "day-016:L958"
    feeds: judge-anchor
  - statement: >-
      Destructive cleanup is a deliberate human act; a tool that silently deletes state to make itself
      convenient is a worse tool.
    source: user-verbatim
    quote: >-
      Not bad, but let's not make fixture deletion part of this script. You should clean up manually
    loc: "day-016:L1085"
    feeds: skill-why
  - statement: >-
      Tooling is designed against the backlog: a fixture script earns its shape from the GIVEN clauses
      of the stories that are still ahead, not from the test that happens to be failing now.
    source: user-verbatim
    quote: >-
      let's discuss the purpose of the create fixture script, as you forsee its future use in our
      project going forward, given your knowledge of @stories ahead of us?
    loc: "day-016:L1085"
    feeds: skill-why
  - statement: >-
      The fixture's value is that its schema is byte-for-byte the real one and its rows are real,
      complete book records - partial hand-made records make every downstream inference untrustworthy.
    source: user-verbatim
    quote: |-
      Nah, we replaced the fixture DB with one that has the schema exactly matching the real one and
      we have copied real and complete book entries to it. That's the main benefit. Then we've
      adjusted the affected asserts to match it.
    loc: "day-016:L6634"
    feeds: skill-why
  - statement: >-
      When a fixture-backed assertion fails, the fixture's real content is the fact and the expectation
      is the thing that was wrong - the assertion gets corrected, never loosened.
    source: user-verbatim
    quote: "just use XP explained instead of PragProg"
    loc: "day-016:L2642"
    feeds: judge-anchor
  - statement: >-
      Process violations get rectified before new work starts: a spec exists and the suite is green,
      so that state gets committed before anything else is touched.
    source: user-verbatim
    quote: |-
      Now that we have recovered from the detour of researching ZSTATE, which we properly documented,
      commited and pushed, we should rectify the `tdd_discipline` violations... we had written a spec,
      now we're green. we shoudl commit, right?
    loc: "day-016:L6888"
    feeds: judge-anchor
  - statement: >-
      Code is self-documenting; comments that restate it are liability, and the same standard applies
      to shell tooling as to production Python.
    source: user-verbatim
    quote: "good, but we don't need the excessive comments, the code is self documetning"
    loc: "day-016:L641"
    feeds: skill-why
  - statement: >-
      A commit message must state the true cause. Describing a deliberate fixture upgrade as "fixing a
      failing test" is a false history, and CI is the record that falsifies it.
    source: user-verbatim
    quote: |-
      Well, if you check the last CI run on GH, you'll see it wasn't faining before. We are swapping the
      Books in the test, for copies from my Real DB, instead of partial Book records that were making
      our subsequent development problematic.
    loc: "day-016:L6551"
    feeds: judge-anchor

skill_rules:
  - rule_id: d016-R1
    rule: >-
      Build an Apple Books test fixture by dumping `.schema ZBKLIBRARYASSET` from the real BKLibrary
      database into an empty file, then populating it with ATTACH DATABASE + INSERT of whole rows
      minus Z_PK - never hand-write a schema and never author partial book records.
    because: >-
      A fixture whose schema or rows differ from the real database makes every conclusion drawn from
      it untrustworthy, which is what stalled the previous two sessions.
    because_source: user-verbatim
    quote: >-
      we replaced the fixture DB with one that has the schema exactly matching the real one and we have
      copied real and complete book entries to it. That's the main benefit.
    evidence: "day-016:L6634"
    taught_or_enforced: repeated
    skill_target: project-memory
    overlap: "canonical §2.2"
    feasibility: ok
  - rule_id: d016-R2
    rule: >-
      Locate the fixture database by the same glob the production code uses (`BKLibrary-*.sqlite`),
      never by a hardcoded name containing the installation-specific digits.
    because: >-
      The numbered filename varies per installation, so a hardcoded name is exactly the brittleness the
      library code already avoids.
    because_source: user-verbatim
    quote: >-
      FIXTURE_DB_PATH should glob for the actual DB filename, not use a hardcoded name with numbers,
      see @bookminder/apple_books/library.py for refference
    evidence: "day-016:L668"
    taught_or_enforced: repeated
    skill_target: project-memory
    overlap: none
    feasibility: ok
  - rule_id: d016-R3
    rule: >-
      Every fixture write must be rooted at PROJECT_ROOT; never let a fixture path resolve under
      $HOME/Library/Containers/com.apple.iBooksX, and verify the resolved path before the first write.
    because: >-
      A swapped fixture/real path in the previous session created a stray 0-byte BKLibrary-test-fixture.sqlite
      inside the real Apple Books directory, which then shadowed the real database in every `find`.
    because_source: user-verbatim
    quote: "when was that created?!?! were the paths (real/fixture) in our script swapped?1"
    evidence: "day-016:L1480"
    taught_or_enforced: needed-enforcement
    skill_target: project-memory
    overlap: none
    feasibility: ok
  - rule_id: d016-R4
    rule: >-
      In these zsh fixture scripts do not name a variable USERNAME; use FIXTURE_USER (or similar) and
      assert that the value equals the "$1" that was passed.
    because: >-
      USERNAME is a zsh special parameter bound to the real user, so `USERNAME=$1` is silently ignored
      and every script then operates on the developer's own username instead of the requested fixture user.
    because_source: agent-synthesis
    evidence: "day-016:L1203, day-016:L1547, day-016:L1572, day-016:L2243"
    taught_or_enforced: taught-once
    skill_target: project-memory
    overlap: none
    feasibility: ok
  - rule_id: d016-R5
    rule: >-
      Verify a path or variable assumption by evaluating the sub-expression in a shell (or by sourcing
      the shared constants file and echoing), not by editing the script under test.
    because: >-
      Instrumenting the subject changes what you are measuring and leaves debug residue in the artifact
      you are about to commit.
    because_source: user-verbatim
    quote: "you couls just run the _common.sh and echo the values without modifying the create_fixture"
    evidence: "day-016:L1263"
    taught_or_enforced: taught-once
    skill_target: pair-programming
    overlap: none
    feasibility: ok
  - rule_id: d016-R6
    rule: >-
      Never encode the developer's absolute home directory or username into project tooling; scripts
      must resolve paths relative to $HOME and the script's own location.
    because: >-
      A script that only works on one machine specifies that machine, not the behavior.
    because_source: user-verbatim
    quote: >-
      DON'T use absolute path and my username in the script -- it must be portable to different machines and users
