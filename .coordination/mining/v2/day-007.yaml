philosophy:
  - statement: Diagnosis is a joint act that must complete before treatment begins; the agent's job at the start of a problem is to produce a shared understanding, not a fix.
    source: user-verbatim
    quote: "Check last GH failure and explore the failing test and tell me what is our problem first -- don't ruch to fixing it yet, we have to discuss it together."
    loc: "day-007:L88-L89"
    feeds: skill-why
  - statement: A plan is an artifact to be reviewed and approved before any edit; approval of the plan, not of the diff, is where the user exercises control.
    source: user-verbatim
    quote: "think hard about incremental steps to implement the proposed solution, show me the plan with detailed steps and let me approve it before you start making changes, please"
    loc: "day-007:L405-L406"
    feeds: skill-why
  - statement: Process rigor is proportional to project phase — while a walking skeleton is still being stood up, strict RED-GREEN-REFACTOR ceremony is overhead, and the simpler change that restores the feedback loop wins.
    source: user-verbatim
    quote: "I appreciate you trying to stick with the RED-GREEN-REFACTOR process, but since we are just at the step of trying to get the Walking skeleton up and running, we don't have to be that constrained by strict adherenc yet!"
    loc: "day-007:L570-L571"
    feeds: judge-anchor
  - statement: Duplication in the spec suite is a design smell before it is a maintenance cost — two copies of one test mean the layer that owns the behavior has not been decided.
    source: user-verbatim
    quote: "does it make sense to copy the integration spec? Having two copies of the same test smells funny to me... what do you think harder?"
    loc: "day-007:L658-L659"
    feeds: skill-why
  - statement: The coverage report is a process instrument, not a quality metric — uncovered implementation is evidence the agent wrote code the spec never demanded, and the remedy is subtraction.
    source: user-verbatim
    quote: "Yes, let's listen to our coverage report... we have implementation that's not covered by test. Your prior self was eager to code more that we've pinned down in the spec."
    loc: "day-007:L1799-L1800"
    feeds: judge-anchor
  - statement: Knowing which phase of the cycle you are in is itself a first-class question, answerable from evidence (the suite state, the coverage report) rather than from narrative.
    source: user-verbatim
    quote: "W8, based on the coverage stat, where in the TDD cycle are we at the moment?"
    loc: "day-007:L1780"
    feeds: judge-anchor
  - statement: The cycle does not end at GREEN; the refactor beat is owed and must be claimed, twice if necessary.
    source: user-verbatim
    quote: "Don't you think we should refactor now?"
    loc: "day-007:L2097"
    feeds: skill-why
  - statement: A test that cannot distinguish between outcomes verifies nothing — a sort assertion over a one-element fixture is decoration, and the honest response is to delete the feature it pretends to cover.
    source: user-verbatim
    quote: "I think the sort test now doesn't veryfy enything, because we have only single Book in out test Book.plist. I'm not confinced we need the sorting there at all."
    loc: "day-007:L2707-L2708"
    feeds: judge-anchor
  - statement: Domain semantics must be understood before behavior is built on them — the author refuses to keep a feature whose underlying field he cannot interpret, and reasons out loud about where the real signal lives instead.
    source: user-verbatim
    quote: "I'm uncertain about the semantics of the updated field in the Book.plist ... I think when working with BookMinder, we would focus on user's interactions with the book. I guess these are store in the SQL db, same place where the highlight live?"
    loc: "day-007:L2708-L2711"
    feeds: skill-why
  - statement: Spec structure is documentation structure — tests are grouped by the unit they specify, and the author imports Jest/RSpec habits deliberately (shared setup hoisted to the describe, one describe per function) rather than accepting whatever nesting the agent produced.
    source: user-verbatim
    quote: "in Jest, I would have moved the common setup between `it` to shared `describe` -- must the import of `list_books` be repeated in each `it`?  This brings me to illogical order of these tests"
    loc: "day-007:L2711-L2713"
    feeds: skill-why
  - statement: Platform lock-in is a deliberate scope decision, not a defect — a change must not be sold as buying portability the product does not want.
    source: user-verbatim
    quote: "we're still completely locked to apple platform because that's where Apple Books run. We are not trying to make a cross platform tool!"
    loc: "day-007:L6309-L6310"
    feeds: judge-anchor
  - statement: Verification is demanded proportionally — prove the change against the real data before committing, but skip the ceremony if the evidence already exists.
    source: user-verbatim
    quote: "can you test locally against real binary Books.plist, before we commit and push, to be sure we handle both? (I saw you ran some ad-hoc test before... You can skip and commit directly if the implementaion in library.py is identical to your test before)"
    loc: "day-007:L6281-L6282"
    feeds: skill-why
  - statement: The provenance of test data is part of the artifact — how a fixture was derived from reality must be written down or the fixture becomes unfalsifiable folklore.
    source: user-verbatim
    quote: "this is good, but we should document how we prepared the test data in fixture in /docs/fixtures.md to keep track of our thinking later"
    loc: "day-007:L1238"
    feeds: skill-why
  - statement: A design decision taken one session earlier is revisable the moment executable evidence contradicts it — the author had explicitly ordered the path-existence check kept (L657), then approved deleting it once the coverage report showed nothing demanded it.
    source: agent-synthesis
    loc: "day-007:L657 vs L1837-L1882"
    feeds: judge-anchor
  - statement: The process document is the authority to consult when orienting, ahead of the priority list.
    source: user-verbatim
    quote: "not yet, let's orient ourselves in the current state of the project's code. what does our process tell us to do?"
    loc: "day-007:L1718"
    feeds: skill-why

skill_rules:
  - rule_id: d007-R1
    rule: When a check fails, produce and present the diagnosis as a standalone deliverable and stop; do not open any edit until the user has agreed on what the problem is.
    because: A fix applied before a shared diagnosis is a guess the user cannot evaluate.
    because_source: user-verbatim
    quote: "tell me what is our problem first -- don't ruch to fixing it yet, we have to discuss it together."
    evidence: "day-007:L88-L89, honored at L201-L223"
    taught_or_enforced: taught-once
    skill_target: pair-programming
    overlap: "CLAUDE.md <core_philosophy> (\"Scientific approach - Think hard and form a clear hypotheses before implementation\")"
    feasibility: ok
  - rule_id: d007-R2
    rule: Before the first edit, write out the incremental steps with explicit commit boundaries and ask for approval; treat the plan, not the diff, as the approval gate.
    because: The user wants to buy or reject the approach while it is still cheap to change.
    because_source: user-verbatim
    quote: "show me the plan with detailed steps and let me approve it before you start making changes, please"
    evidence: "day-007:L405-L406, plan at L448-L538, approval sought at L560"
    taught_or_enforced: taught-once
    skill_target: pair-programming
    overlap: none
    feasibility: "needs-rework: a non-interactive harness has no user to approve; degrade to 'state the plan and its commit boundaries in one message before editing', which remains checkable"
  - rule_id: d007-R3
    rule: Match ceremony to phase — while the walking skeleton is still being stood up, prefer the smallest change that restores the feedback loop over a full RED-GREEN cycle per step, and say explicitly that you are doing so.
    because: Nine TDD micro-steps to make CI read a fixture file is process theatre that delays the skeleton the process exists to serve.
    because_source: user-verbatim
    quote: "since we are just at the step of trying to get the Walking skeleton up and running, we don't have to be that constrained by strict adherenc yet! Can we make it even simpler?"
    evidence: "day-007:L570-L573; agent's 9-step plan L448-L538 replaced by a 5-step plan L585-L642"
    taught_or_enforced: taught-once
    skill_target: tdd-bdd
    overlap: "canonical §3 (\"Walking skeleton, honest fake\") — in tension: canonical keeps an acceptance-RED pulling even inside the skeleton, whereas here the relaxation was granted for CI plumbing with no user-visible behavior"
    feasibility: "needs-rework: as stated it licenses skipping RED whenever work feels preliminary; must be narrowed to 'changes with no user-visible behavior (test plumbing, CI config)'"
  - rule_id: d007-R4
    rule: Never create a second copy of a spec to cover a second environment; decide which layer owns the behavior and keep exactly one spec for it.
    because: Two suites specifying one behavior will eventually disagree, and then neither is authoritative.
    because_source: user-verbatim
    quote: "Having two copies of the same test smells funny to me... what do you think harder?"
    evidence: "day-007:L658-L659 → agent scraps its own duplicate-spec plan at L715-L747"
    taught_or_enforced: taught-once
    skill_target: tdd-bdd
    overlap: "canonical §3 (Revert-and-narrate: \"refactor specs in place, never a parallel suite\") — this session is six weeks earlier provenance for that rule"
    feasibility: ok
  - rule_id: d007-R5
    rule: Run the full spec suite locally before every push, and never use CI as the first place a change is exercised.
    because: A CI round trip costs minutes and a red main; the same information was available locally in 0.04 seconds.
    because_source: user-verbatim
    quote: "I wanted to remind you to always run specs locally beforu pushit to GH. We would have caught this issue sooner..."
    evidence: "day-007:L1055-L1056"
    taught_or_enforced: needed-enforcement
    skill_target: tdd-bdd
    overlap: "CLAUDE.md <tdd_discipline> (\"Run All Tests: Execute `pytest` to confirm success and no regressions\")"
    feasibility: ok
  - rule_id: d007-R6
    rule: A local green counts as evidence only if you can name what would have made it red — after installing a test seam, prove the seam took effect (item counts, run time, the path actually read) before treating the pass as a result.
    because: The first fixture patch was inert and the suite still passed, because it silently kept reading the author's real 178-book library; the green proved nothing and cost two red CI runs.
    because_source: agent-synthesis
    evidence: "day-007:L884-L891 (patches BOOKS_PATH only) → L915 (\"4 passed in 0.28s\" against the real library) vs L1084 (\"4 passed in 0.04s\" against the fixture)"
    taught_or_enforced: taught-once
    skill_target: tdd-bdd
    overlap: "canonical §2.3 (\"A test that can pass for the wrong reason is not a specification\")"
    feasibility: ok
  - rule_id: d007-R7
    rule: Treat uncovered implementation lines as unspecified behavior and delete them; never write a test afterwards to cover code that already exists.
    because: A test written by someone who has read the implementation can only ratify it, and untested code can be wrong invisibly.
    because_source: user-verbatim
    quote: "we have implementation that's not covered by test. Your prior self was eager to code more that we've pinned down in the spec."
    evidence: "day-007:L1799-L1800, L1837, L1882 (\"abosolutelt, this is the way!\"), deletion at L1917-L1964"
    taught_or_enforced: taught-once
    skill_target: tdd-bdd
    overlap: "both — CLAUDE.md <package_structure> (\"No Implementation Without Tests\") and canonical §2.4, whose \"constitutive example\" IS this episode"
    feasibility: ok
  - rule_id: d007-R8
    rule: Never wrap a function body in a bare `except Exception` that prints and returns an empty default; let the exception propagate until a spec demands specific handling.
    because: It catches everything, prints to stdout where nothing can assert on it, and hides the failure behind an empty result.
    because_source: user-paraphrase
    evidence: "day-007:L1859-L1863 (agent's own four-point indictment), deletion at L1962-L1964"
    taught_or_enforced: taught-once
    skill_target: tdd-bdd
    overlap: "both — CLAUDE.md <code_style> (\"Error Handling: Use specific exceptions with context\") and canonical §2.4"
    feasibility: ok
  - rule_id: d007-R9
    rule: Delete any capability the current fixtures cannot falsify — untestable-now is the YAGNI detector.
    because: Sorting could not be exercised by a one-book fixture, so the parameter, its branch and its test were all decoration.
    because_source: user-verbatim
    quote: "I think the sort test now doesn't veryfy enything, because we have only single Book in out test Book.plist. I'm not confinced we need the sorting there at all."
    evidence: "day-007:L2707-L2708, removal at L2848-L2878"
