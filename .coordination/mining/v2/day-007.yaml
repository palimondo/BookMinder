    overlap: "CLAUDE.md <git_workflow> (\"Never use `git add .` - always stage files explicitly by name\") — the rule exists at HEAD but did NOT exist in the CLAUDE.md read in this session (snapshot at L3312-L3321), so this is part of its provenance"
    feasibility: ok
  - rule_id: d007-R14
    rule: A commit message may claim only what the diff does; never attribute a benefit (portability, dependency removal, platform independence) the change does not actually deliver.
    because: Removing a `plutil` subprocess did not loosen the Apple lock-in, and saying so would have written a false capability into the log.
