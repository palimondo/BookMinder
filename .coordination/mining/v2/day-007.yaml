  - rule_id: d007-R18
    rule: Prefer an `isinstance` narrowing over `typing.cast`; if you find yourself casting to make mypy quiet, treat it as a design signal and say so before committing.
    because: A cast tells the checker to stop looking, while a check tells the program what to do.
    because_source: agent-synthesis
    evidence: "day-007:L2278 (cast added), L2473-L2475 (replaced by isinstance), L8042 (cast added again), L8050 (\"using cast() is essentially lying to the type checker\"), L8064 (removed)"
