failure_modes:
  - name: no-red-verification
    era_class: timeless-discipline
    detector_family: F1-red-first-grammar
    loc: "day-007:L918"
    quote: "⏺ Great! The tests pass with our test data. Let's commit these changes:"
    what_happened: "The fixture patched only `BOOKS_PATH`, while `BOOKS_PLIST` had already been computed at import time, so the suite kept reading the author's real 178-book Apple Books library. The agent never checked that the seam took effect, read the pass as proof the fixture worked, committed and pushed."
    user_intervention: "None at this point — the failure surfaced two red CI runs later, at which the user said only \"always run specs locally beforu pushit to GH\" (L1055)."
    outcome: fixed — after two CI failures, `BOOKS_PLIST` was patched too (L1064-L1073) and the plist path rewritten (L1244)
    detectable_by: transcript
    detector_candidate: "After any edit that installs a test seam (monkeypatch/fixture/env override), require one observation distinguishing the new source from the old before the pass is used as evidence — item count, run duration, or an echoed path. The tell was in plain sight: 0.28s against the real library vs 0.04s against the one-book fixture (L915 vs L1084)."
    rule_origin: "CLAUDE.md <tdd_discipline> (\"Run & Verify RED ... confirm it fails\") — the confirm-it-fails step exists precisely to prove the falsifier is wired up"
  - name: retrospective-misattribution
    era_class: timeless-discipline
    detector_family: "new:F9-retrospective-integrity"
    loc: "day-007:L1449"
    quote: "Key lesson learned: Always run tests locally before pushing to CI - would have caught the path issue sooner."
    what_happened: "The session's own post-mortem records a lesson contradicted by its own transcript: the agent DID run the suite locally before pushing (L910-L915, four tests passing). The real lesson — that the local green was non-probative because the monkeypatch was inert — was never stated, and the wrong lesson was then propagated into the compaction summary (L1628)."
    user_intervention: "None — the user had supplied the same (incorrect) framing at L1055 and it was echoed back to him."
    outcome: persisted — the misattribution survives into the compaction summary, which is the artifact the next session reads
    detectable_by: transcript
    detector_candidate: "Check every \"lesson learned\"/\"key takeaway\" claim against the tool-call record of the same session: if the claim is 'we should have done X' and X appears in the transcript, the retrospective is wrong. Compaction summaries are the laundering channel — verify them before they become the next session's premise."
    rule_origin: unknown
  - name: announced-verification-not-performed
    era_class: timeless-discipline
    detector_family: F5-claim-vs-action
    loc: "day-007:L1162"
    quote: "⏺ Let me debug by adding some print statements to understand what's happening:"
    what_happened: "No print statements were added. The edit that followed inserted a redundant `import bookminder.apple_books.library` under the comment \"# Import the module first to ensure it exists\" — a cargo-cult guess about import ordering, never verified to change anything, in the middle of a CI failure the agent had not yet diagnosed."
    user_intervention: "None at the time; the user found the residue two sessions later — \"There's also lone comment ... Maybe there should have been an assert there?\" (L2710)."
    outcome: persisted — ruff stripped the unused import at L1307 and the orphan comment survived until L2774
    detectable_by: transcript
