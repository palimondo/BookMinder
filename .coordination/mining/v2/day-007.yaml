    feasibility: ok
  - rule_id: d007-R19
    rule: Document how each fixture was derived from real data, in docs/, in the same commit that adds the fixture.
    because: A fixture whose derivation is unrecorded cannot be regenerated or audited when the upstream format shifts.
    because_source: user-verbatim
