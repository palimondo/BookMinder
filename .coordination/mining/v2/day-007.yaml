  - rule_id: d007-R10
    rule: Keep the spec tree two levels at most, with one `describe_` per function or command; never add a "when …" nesting level that carries no information.
    because: The describe block is the story's name in `pytest --spec` output, and interleaving one function's tests inside another function's describe makes the living documentation illegible.
    because_source: user-verbatim
    quote: "This brings me to illogical order of these tests, we interleave `find_book_by_title` inbetween -- this could be improved by movind it to its own `describe`"
    evidence: "day-007:L2712-L2713 → restructure at L2779-L2840 (`describe_book_library`/`describe_when_listing_books` → `describe_list_books` + `describe_find_book_by_title`)"
    taught_or_enforced: taught-once
    skill_target: tdd-bdd
    overlap: "canonical §2.1 (\"The initial RSpec-cargo-cult nesting (describe_book_library / describe_when_listing_books) was deleted\") — this session is where that deletion happened"
    feasibility: ok
  - rule_id: d007-R11
    rule: Import the module under test once at the top of the spec file; never repeat the import inside each `it_`.
    because: Per-test imports are noise that the `--spec` reader has to skip and that hide which module the file is about.
    because_source: user-verbatim
    quote: "must the import of `list_books` be repeated in each `it`?"
    evidence: "day-007:L2712, applied at L2762 (`from bookminder.apple_books.library import find_book_by_title, list_books`)"
    taught_or_enforced: taught-once
    skill_target: tdd-bdd
    overlap: none
    feasibility: ok
  - rule_id: d007-R12
    rule: Keep docstrings to a single line on public functions, drop them entirely on private ones, and never emit NumPy-style Args/Returns blocks with underlines.
    because: The verbose form restates the signature, and ruff's D rules were empirically shown not to require anything on private functions.
    because_source: user-verbatim
    quote: "I'm bothered by the verbose style of docstrings on functions in `library.py`. Is that a standard formatting style, with Args and Returns underlines and description on new line?"
    evidence: "day-007:L2714-L2715, simplification at L2888-L2920, ruff probe at L3028-L3046"
    taught_or_enforced: taught-once
    skill_target: claude-md
    overlap: "both — CLAUDE.md <code_style> (\"Prefer self-documenting code over verbose docstrings\") and canonical §2.1"
    feasibility: ok
  - rule_id: d007-R13
    rule: Never stage with `git add -A` or `git add .`; name every path, and if the commit output lists a file you did not intend, stop and reset before pushing.
    because: The repo permanently carries loose diary transcripts and scratch fixtures, and blanket staging swept both into unrelated commits twice in one session.
    because_source: agent-synthesis
