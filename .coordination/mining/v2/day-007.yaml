  - rule_id: d007-R17
    rule: Treat `updateDate` in Books.plist as publisher-revision metadata, not reading activity; user interaction data (progress, highlights) lives in the Apple Books SQLite database.
    because: BookMinder is about the user's relationship to a book, and sorting by a publisher's push date answers a question nobody asked.
    because_source: user-verbatim
    quote: "it's probably related to Book's revision, when the publisher pushes a new version no Apple Books? I think when working with BookMinder, we would focus on user's interactions with the book. I guess these are store in the SQL db, same place where the highlight live?"
