  - rule_id: d007-R16
    rule: Read Books.plist with `plistlib.load(open(path, "rb"))` — it auto-detects binary and XML; never shell out to `plutil -convert`.
    because: The subprocess was pure ceremony, and the author spotted that `plistlib` on the very next line already did the job.
