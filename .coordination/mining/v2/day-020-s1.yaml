pairing_gems:
  - loc: "day-020:L899"
    why_exemplary: >-
      A complete method stated in one message: name the stress test, state the target
      property (only tightly-coupled specs fail), refuse to demand a complete plan, and
      require every step be checked against the goal. It is the shard's design charter.
  - loc: "day-020:L2372"
    why_exemplary: >-
      "And what will remain in the acceptance test, when we're done and why?" — Socratic
      verification that the agent understands the destination before executing the plan,
      catching hand-waving before it becomes a diff.
  - loc: "day-020:L4249"
    why_exemplary: >-
      Instructs a fresh model to distrust the inherited context and re-derive from source
      evidence; the fresh pass then found the real defect within a dozen turns after
      hours of confident wrong explanations.
  - loc: "day-020:L4419"
    why_exemplary: >-
      "did we mess this up during move of these test from acceptance to integration?" —
      bisecting a defect by provenance rather than by symptom; `git show 764c512~1`
      immediately exposed the lost absolute-path construction.
  - loc: "day-020:L6763"
    why_exemplary: >-
      Turns a costly detour into a permanent rule by asking which assertion would have
      caught it; this exchange is the direct origin of the canonical "assert which
      specific path fired" rule.
  - loc: "day-020:L5153"
    why_exemplary: >-
      Refuses to launch an expensive research query until the hypothesis under test is
      stated, converting "go find out about X" into a falsifiable question.
  - loc: "day-020:L3643"
    why_exemplary: >-
      The user applies GOOS himself — mock at the boundary to specify delegation, one
      case not four, no fixture dependence — more precisely and more actionably than the
      GOOS persona had managed in four separate council appearances.

gaps:
  - No commit-after-RED anywhere in the shard - every one of the ~12 commits is a GREEN or REFACTOR landing; the session contains no new behaviour and therefore no failing spec to commit first.
  - No RED verification of any kind - the only deliberate breakage (removing ZISSAMPLE) was a diagnostic probe, immediately reverted, never committed.
  - No story card touched - `stories/*.yaml` is never opened, no `status:` is updated, and the plan lives entirely in TodoWrite; the backlog_management rules in CLAUDE.md are dormant for this whole session.
  - No `pytest --spec` run - the living-documentation rendering is never exercised, which is why the mangled `describeformat` block name had to be spotted by eye (day-020:L2297).
  - No expert persona ever cites a book, page, chapter or actual sentence from its namesake; every position is paraphrase or invention.
  - No acceptance-criteria dialogue before the restructuring - the goal was stated in prose (day-020:L899) but never encoded as an executable check for "the restructuring worked", so the ZISSAMPLE stress test was never re-run to confirm the blast radius had shrunk.
  - The TODO item "Verify only database tests fail when ZISSAMPLE removed" is carried through every TodoWrite in the shard and is still unchecked at the end - the falsifier for the session's own goal was never executed.

