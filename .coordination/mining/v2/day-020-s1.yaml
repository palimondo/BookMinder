philosophy:
  - statement: >-
      A deliberate breaking change (deleting one SQL column) is a stress test of the
      test architecture; the goal of restructuring is that only the few tightly-coupled
      specs fail, and every step is judged against that goal rather than a plan.
    source: user-verbatim
    quote: "Our goal should be to devise a multi-step process that will make acceptance test resilient against that `ZISSAMPLE` removal, which we've used as a stress test of our testing architecture that revealed its flaws."
    loc: "day-020:L899"
    feeds: skill-why
  - statement: >-
      You do not need a complete plan to start; you need a goal you can re-check at
      every step. Incrementalism is goal-anchored, not exploratory.
    source: user-verbatim
    quote: "We don't need a complete plan, but we need to start somewhere and keep our goal in mind every step of the way."
    loc: "day-020:L899"
    feeds: judge-anchor
  - statement: >-
      Coverage is a diagnostic signal about where behaviour is being verified, never
      the objective; the objective is the architecture of the tests.
    source: user-verbatim
    quote: "the coverage is signal, we weren't getting confirmation that our error handling was working due to runnin via subprocess. ... But getting to 100% isn't the point. Improving the architecture of our tests is!"
    loc: "day-020:L3643"
    feeds: judge-anchor
  - statement: >-
      A boundary spec exists to verify a contract between two subsystems, so it must
      not depend on a fixture being configured just so; the specific error messages are
      already specified one layer down.
    source: user-verbatim
    quote: "spec that verify this **behavior** are verifying correct contract on the boandary of two subsystems and they don't need to depend on us having a fixture configured just so."
    loc: "day-020:L3643"
    feeds: skill-why
  - statement: >-
      Tests are production code and get the same care; GREEN is not the end of the
      cycle, REFACTOR of the specs themselves is.
    source: user-verbatim
    quote: "No, we wrote test and passed GREEN. But test are code and require same TLC as out implementation. What should have been our next step followind the `tdd_discipline`?"
    loc: "day-020:L1394"
    feeds: skill-why
  - statement: >-
      Repetition in test setup is a message about the production type, not merely test
      duplication to be factored away — listen to what the tests say about the design.
    source: user-verbatim
    quote: "right problem, but let's think harder, maybe the tests are also telling us something about out implementation. What's always repeated across all the Book creations what maybe doesn't have to be?"
    loc: "day-020:L1418"
    feeds: skill-why
  - statement: >-
      Do not change a design decision whose motivation you have not recovered; use git
      blame and call-site search as archaeology before editing.
    source: user-verbatim
    quote: "It might be right or wrong, but we shouldn't change it wouthout knowing the motivation. We should maybe use git blame to lear about the historical context, or something?"
    loc: "day-020:L1452"
    feeds: judge-anchor
  - statement: >-
      Git history is a teaching artefact: refactoring is committed step by step so the
      trail itself can be learned from.
    source: user-verbatim
    quote: "let's commit and continue after that. I'd like our got history to create a trail of our successfull refactoring for all to learn from!"
    loc: "day-020:L1730"
    feeds: skill-why
  - statement: >-
      GOOS/London-school ideas must be re-expressed in the project's lightweight
      functional Python; an interface/adapter class is a Java-ism, not the lesson.
    source: user-verbatim
    quote: "I'm not sure if that interface isn't too Java-centric concept. So far we have pretty lightweight and functional style of python code in our project."
    loc: "day-020:L765"
    feeds: judge-anchor
  - statement: >-
      Naming is judged by clarity at the point of use (a Swift habit imported
      deliberately), and brevity is part of clarity when the context disambiguates.
    source: user-verbatim
    quote: "I'm obsessive about naming ... coming from Swift background, the mantra there was always about clarity at the point of use."
    loc: "day-020:L1915"
    feeds: judge-anchor
  - statement: >-
      Fixtures encode observed reality, not code paths. Inventing a fixture so an
      uncovered line becomes reachable inverts the direction of evidence.
    source: user-verbatim
    quote: "We shoudl not be creating fixture for hypothetical scenarios to match execution code paths through our implementation. Or code should cover realisting test scenarios that were identified by my exploration of the Library containers on my wife's Macbook -- the ground truth."
    loc: "day-020:L4632"
    feeds: judge-anchor
  - statement: >-
      Investigation is done by the scientific method: hypothesis first, then independent
      verification against source evidence, without trusting prior context.
    source: user-verbatim
    quote: "please don't assume the context in previous context is correct formulate hypothesis and independently verify by analzyzing all relevant source code gathering actual evidence using scientific method"
    loc: "day-020:L4249"
    feeds: judge-anchor
  - statement: >-
      "Likely" is not a finding. Root-cause attribution requires hard evidence, and the
      cost of an investigation is billed to whoever caused it.
    source: user-verbatim
    quote: "I'm not going for likely, can you find hard evidence for git clean being the culprit?"
    loc: "day-020:L5987"
    feeds: judge-anchor
  - statement: >-
      The retrospective question after any wasted investigation is which assertion would
      have caught it earlier — process failures are converted into spec rules.
    source: user-verbatim
    quote: "hmm...think harder: would we have caught it we we added some fragment of the path to assert on exception, so that we would distinguish between those two cases?"
    loc: "day-020:L6763"
    feeds: skill-why
  - statement: >-
      The transcript itself is an evaluation artefact: prompts sent to subagents and
      their verbatim replies must land in the log so agent performance can be assessed.
    source: user-verbatim
    quote: "we need it for the record (this will be in the console log of today's session: day-020.md -- these learnings might come in handy, as well as the prompts you;ve using. That's how we can evaluate your performance"
    loc: "day-020:L5593"
    feeds: skill-why
  - statement: >-
      The author holds himself to the same process rules he holds the agent to, and
      names his own breach when he causes one.
    source: user-verbatim
    quote: "Not I was me that broke the `tdd_discipline` and derailed you to combine multiple refactorings into one."
    loc: "day-020:L1823"
    feeds: judge-anchor

skill_rules:
  - rule_id: d020s1-R1
    rule: Test each behaviour at exactly one layer — push environment edge cases down to the layer that owns them and leave acceptance specs testing only coordination and error display.
    because: An acceptance test that knows the specific error message for every environment edge case duplicates the layer below and breaks when implementation details move.
    because_source: user-verbatim
    quote: "The acceptance test shoudl be reduce to checking that CLI catches the exception thrown from library and displays the message to the user. The specific messages for each edge case shoudl be part of the integration test. Not the acceptance test for CLI."
    evidence: "day-020:L372"
    taught_or_enforced: repeated
    skill_target: tdd-bdd
    overlap: "canonical §2.2"
    feasibility: ok
  - rule_id: d020s1-R2
    rule: Keep exactly ONE end-to-end subprocess test that proves everything is wired together; run every other CLI test in-process.
    because: Wiring can only be verified by running the wiring, but a second subprocess test only re-tests behaviour, slowly.
    because_source: user-verbatim
    quote: "that makes sense, but shouldn't we keep ONE CLI integration test that will use the subprocess to test once that all is wired together correctly?"
    evidence: "day-020:L2424"
    taught_or_enforced: needed-enforcement
    skill_target: tdd-bdd
    overlap: "canonical §2.2"
    feasibility: ok
  - rule_id: d020s1-R3
    rule: After a spec goes GREEN, refactor the spec before moving on, and commit that refactor separately.
    because: Tests are code and require the same care as the implementation; skipping their REFACTOR step is skipping a step of the discipline.
    because_source: user-verbatim
    quote: "But test are code and require same TLC as out implementation. What should have been our next step followind the `tdd_discipline`?"
    evidence: "day-020:L1394"
    taught_or_enforced: needed-enforcement
    skill_target: tdd-bdd
    overlap: "CLAUDE.md <tdd_discipline>"
    feasibility: ok
  - rule_id: d020s1-R4
    rule: Order specs within a describe block by rising complexity, and size collection specs 0, 1, n.
    because: A block read top-down should build understanding incrementally, and 0-1-many is the minimal set that exercises collection logic.
    because_source: user-verbatim
    quote: "please order the test cases by rising level of complexity, start with the simplest and gradually build up to more complex cases. Similarily, order test for collection logic incrementally: 0, 1, n (2)"
    evidence: "day-020:L1271"
    taught_or_enforced: taught-once
    skill_target: tdd-bdd
    overlap: "canonical §2.3"
    feasibility: ok
  - rule_id: d020s1-R5
    rule: On an error-path spec assert which specific path fired (a distinguishing message or path fragment) in addition to the user-facing message.
    because: Two different failures produced the same generic message, so a generic raises-check stayed green for the wrong reason and hid a missing fixture for weeks.
    because_source: user-verbatim
    quote: "would we have caught it we we added some fragment of the path to assert on exception, so that we would distinguish between those two cases?"
    evidence: "day-020:L6763"
    taught_or_enforced: taught-once
    skill_target: tdd-bdd
    overlap: "canonical §2.3"
    feasibility: ok
  - rule_id: d020s1-R6
    rule: Keep the generic user-facing assertion when you add the specific one — assert both the contract shown to the user and the internal path taken.
    because: The two assertions specify different things and dropping the user-facing one would let the message regress unnoticed.
    because_source: user-verbatim
    quote: "yes, but why not also keep the \"Apple Books database not found\" assertion if it's there too>"
    evidence: "day-020:L6817"
    taught_or_enforced: taught-once
    skill_target: tdd-bdd
    overlap: "canonical §2.3"
    feasibility: ok
  - rule_id: d020s1-R7
    rule: Never create a fixture in order to reach an uncovered line; fixtures may only encode states observed on a real machine.
    because: A fixture invented to satisfy a coverage report tests the implementation's shape, not the product's environment.
    because_source: user-verbatim
    quote: "We shoudl not be creating fixture for hypothetical scenarios to match execution code paths through our implementation."
    evidence: "day-020:L4632"
    taught_or_enforced: needed-enforcement
    skill_target: tdd-bdd
    overlap: "canonical §2.2"
    feasibility: ok
  - rule_id: d020s1-R8
    rule: Probe the test architecture by deliberately breaking one implementation detail and counting the failures; restructure until only the specs that own that detail fail.
    because: The blast radius of a one-line change is the measurable property of test coupling.
    because_source: user-verbatim
    quote: "Look how many test break with that simple change. What dies that tell us about our test structure and how should be properly fix that?"
    evidence: "day-020:L522"
    taught_or_enforced: taught-once
    skill_target: tdd-bdd
    overlap: none
    feasibility: ok
  - rule_id: d020s1-R9
    rule: Move the coverage before you delete the tests that provided it, and verify the move landed before deleting.
    because: Deleting first opens a window in which the behaviour is unspecified, and in this session the "replacement" integration tests were silently exercising the wrong code path.
    because_source: user-paraphrase
    evidence: "day-020:L2796"
    taught_or_enforced: needed-enforcement
    skill_target: tdd-bdd
    overlap: "canonical §2.6"
    feasibility: ok
  - rule_id: d020s1-R10
    rule: Mock at the architectural boundary to specify delegation; do not re-specify through the mock the error cases the layer below already specifies.
    because: The boundary spec's subject is the conversation between subsystems, so one representative case proves the contract and more only duplicates.
    because_source: user-verbatim
    quote: "We don't care about the 3 or four specific errors that we've covered already in our library_integration_spec. We do just a single one, veryfying that uncought exceptions aren't blowing into user face and that the messages are passed throug."
    evidence: "day-020:L3643"
    taught_or_enforced: taught-once
    skill_target: tdd-bdd
    overlap: "canonical §2.2"
    feasibility: ok
  - rule_id: d020s1-R11
    rule: When an assertion is unconditionally true, do not repair it by hardcoding a fixture-derived number — leave a FIXME naming the right technique and layer.
    because: A number copied out of the current fixture is brittle, and the property being asserted actually belongs to a mock-based spec elsewhere.
    because_source: user-verbatim
    quote: "you're right that this is always true, but this looks like something that shoudl be tested with a mock somewhere elese; but hardcoding 6 here is also wrong. Maybe just add a FIXME comment and we'll adress that later"
    evidence: "day-020:L2575"
    taught_or_enforced: taught-once
    skill_target: tdd-bdd
    overlap: "canonical §2.3"
    feasibility: ok
  - rule_id: d020s1-R12
    rule: Delete a spec that a stronger spec already subsumes, then sweep the file for other instances of the same redundancy.
    because: A redundant spec adds maintenance without adding a constraint, and redundancy usually comes in clusters.
    because_source: user-verbatim
    quote: "yes; and then can we verify that we don't have other similar cases?"
    evidence: "day-020:L2257"
    taught_or_enforced: taught-once
    skill_target: tdd-bdd
    overlap: "canonical §2.3"
    feasibility: ok
  - rule_id: d020s1-R13
    rule: Do one refactoring per commit; if two get entangled, stop, land the first, then return to the second.
    because: A commit that mixes two refactorings cannot be evaluated or reverted independently.
    because_source: user-verbatim
    quote: "Go ahead with the inlining step that fits 88 chars, commit and we'll return to renameing that function after that"
    evidence: "day-020:L1823"
    taught_or_enforced: needed-enforcement
    skill_target: tdd-bdd
    overlap: "CLAUDE.md <git_workflow>"
    feasibility: ok
  - rule_id: d020s1-R14
    rule: Name a describe block for the module or feature under test, never for the story that happened to motivate the fixtures.
    because: The block is the story's name in the living documentation; naming it after the motivating feature misdescribes what it covers.
    because_source: user-verbatim
    quote: "By pointing out that name I expected you to pick up on the fact that it's got nothign with `recent` listing -- that was only our initial motivation to drive the fixture development"
    evidence: "day-020:L2528"
    taught_or_enforced: taught-once
    skill_target: tdd-bdd
    overlap: "canonical §2.1"
    feasibility: ok
  - rule_id: d020s1-R15
    rule: Name a caught exception `e`; do not import an unexplained convention name like `exc_info`, and explain any convention you do use when asked.
    because: An unexplained suffix reads as meaningful and forces the reader to look it up.
    because_source: user-verbatim
    quote: "if `exc_info` is just an exception thta gets caught and asserted on, we should go with `e` ... I got really confused by the _info part which you havent explained when I asked, BTW"
    evidence: "day-020:L2541"
    taught_or_enforced: taught-once
    skill_target: tdd-bdd
    overlap: "CLAUDE.md <code_style>"
    feasibility: ok
  - rule_id: d020s1-R16
    rule: Delete docstrings from implemented tests; the `it_` name and the assertions are the specification.
    because: A docstring restating the test name is a second copy that can silently rot.
    because_source: user-verbatim
    quote: "that docstring says literally the same thing as `it`... remember our `code_style`"
    evidence: "day-020:L2669"
    taught_or_enforced: needed-enforcement
    skill_target: claude-md
    overlap: both
    feasibility: ok
  - rule_id: d020s1-R17
    rule: An integration spec's file docstring names the underlying technology and the fixture strategy in one line.
    because: The reader must know from line one whether the spec runs against SQLite, a plist, or a mock.
    because_source: user-verbatim
    quote: "file description docsting shoul be literally just:\n\"\"\"Integration tests for Apple Books SQLite library with test fixtures.\"\"\""
    evidence: "day-020:L2539"
    taught_or_enforced: taught-once
    skill_target: project-memory
    overlap: none
    feasibility: ok
  - rule_id: d020s1-R18
    rule: Path resolution for `--user` lives in the library, not the CLI; the CLI passes the raw parameter straight through.
    because: The CLI must own no domain knowledge, and the resolution logic then becomes unit-testable where it belongs.
    because_source: user-verbatim
    quote: "I think CLI should just be passing --user parameter value straight to library and it shold be responsible for the path resolution. We should move get_user_path to library and thoroughly spec it (absolute, relative, none -> Home) in its unit test"
    evidence: "day-020:L2933"
    taught_or_enforced: taught-once
    skill_target: project-memory
    overlap: "canonical §2.5"
    feasibility: ok
  - rule_id: d020s1-R19
    rule: Spec `_get_user_path` for exactly three cases — None → Path.home(), an absolute path → itself (the fixture seam), a bare username → /Users/<name>; do not add a falsy-string case.
    because: The absolute-path branch exists deliberately as the test seam for CLI integration tests, and Python has no accidental falsy strings to guard against.
    because_source: user-verbatim
    quote: "None defaults to users Home; absolute path is a way to select specific fixture when running CLI integration test ...; user name (which when converted to Path is a relative one); the false-y test is undesirable"
    evidence: "day-020:L3317"
    taught_or_enforced: taught-once
    skill_target: project-memory
    overlap: none
    feasibility: ok
  - rule_id: d020s1-R20
    rule: "`never_opened_user` means an auto-created `com.apple.iBooksX` container with no `com.apple.BKAgentService`, no database and no plist — macOS creates the first at account setup, Books creates the second on first launch."
    because: This is the ground truth observed on a second real Mac account, and it is what distinguishes "user exists but never opened Books" from "user does not exist".
    because_source: user-paraphrase
    evidence: "day-020:L5445"
    taught_or_enforced: taught-once
    skill_target: project-memory
    overlap: "canonical §2.2"
    feasibility: ok
  - rule_id: d020s1-R21
    rule: Preserve an intentionally-empty fixture directory with a single `.gitkeep` at the leaf, never one per level.
    because: Git tracks files, not directories, so one leaf file preserves the whole chain; the untracked directory that lacked it vanished and kept a test green for the wrong reason for weeks.
    because_source: user-verbatim
    quote: "explain the .gitkeep to me? shouldn't one at the leaf node of our empty directory tree suffice?"
    evidence: "day-020:L6656"
    taught_or_enforced: taught-once
    skill_target: project-memory
    overlap: none
    feasibility: ok
  - rule_id: d020s1-R22
    rule: Stage files explicitly by name; never `git add -A` or `git add .` (a PreToolUse hook blocks it).
    because: Sweeping stages commit unintended files, and this repo carries large untracked fixture artefacts.
    because_source: user-paraphrase
    quote: "Please stage files explicitly by name to avoid accidentally committing unintended files"
    evidence: "day-020:L3368"
    taught_or_enforced: needed-enforcement
    skill_target: claude-md
    overlap: "CLAUDE.md <git_workflow>"
    feasibility: ok
  - rule_id: d020s1-R23
    rule: Keep lines within 88 characters as you write them and verify with ruff before committing, rather than discovering the violation in a failing pre-commit hook.
    because: The pre-commit hook rewrites files under you and forces a re-stage, turning a one-step commit into three.
    because_source: user-verbatim
    quote: "OK, but ruff will tell you that some of these are longer than 88 chars, so you might as well pay attention to it now and then verify by running it"
    evidence: "day-020:L1769"
    taught_or_enforced: repeated
    skill_target: claude-md
    overlap: "CLAUDE.md <code_style>"
    feasibility: ok
  - rule_id: d020s1-R24
    rule: Never load a `claude-dev-log-diary/day-0NN.md` in full; search it with ripgrep, or read the paired gemini-summary first and locate the day split before reading.
    because: The transcripts are hundreds of KB each and reading one destroys the working context.
    because_source: user-verbatim
    quote: "You are should NEVER load the day-0##.md in full -- they are extremely large. Use rigpreg to carefully find the specific day when we were researching the Library containers."
    evidence: "day-020:L4832"
    taught_or_enforced: needed-enforcement
    skill_target: claude-md
    overlap: "CLAUDE.md <file_operations>"
    feasibility: ok
  - rule_id: d020s1-R25
    rule: When undoing a previous commit, find it with `git log` and `git revert` it; do not hand-reconstruct the earlier state.
    because: A hand-written inverse is unverifiable and loses the record that the change was deliberately undone.
    because_source: user-verbatim
    quote: "can't we just find that commit in history and revert it? Why are you doint it manually?"
    evidence: "day-020:L7061"
    taught_or_enforced: taught-once
    skill_target: tdd-bdd
    overlap: "canonical §2.6"
    feasibility: ok

failure_modes:
  - name: fabricated-claim
    era_class: timeless-discipline
    detector_family: F5-claim-vs-action
    loc: "day-020:L216"
    quote: "These missing lines represent edge cases and error handling paths that would require specific test fixtures or mocking to cover. The 97% coverage is excellent, and these remaining lines are defensive programming for rare scenarios."
    what_happened: The agent explained each uncovered line as an untestable edge case without checking whether any spec already exercised it; the CLI spec did exercise all of them, through a subprocess the coverage tool could not see.
    user_intervention: "cli_spec does test the library in those cases!\" (day-020:L219)"
    outcome: fixed - the agent then found the real cause (subprocess isolation) at L257-269
    detectable_by: transcript
    detector_candidate: Flag any claim that code is "untested"/"untestable" that is not preceded in the same turn by a grep or a targeted test run naming that symbol.
    rule_origin: unknown
  - name: unverified-diagnosis
    era_class: timeless-discipline
    detector_family: F5-claim-vs-action
    loc: "day-020:L3681"
    quote: "The remaining uncovered lines in library.py (32, 82, 163) are error paths that are actually tested by our integration tests but don't show as covered due to subprocess isolation. This is exactly what we expected."
    what_happened: A confident causal explanation that was flatly false — the integration specs are in-process and use no subprocess at all; the real cause was that they passed relative fixture paths that `_get_user_path` rewrote to `/Users/specs/...`, so they never reached the lines in question.
    user_intervention: "I don't see using CliRunner has really helped us improve coverage. We now have uncovered __main__.py and it did not help with covering the remaiing missing parts.\" (day-020:L4009)"
    outcome: fixed - disproved by direct execution at day-020:L4356-4407, several hours later
    detectable_by: both
    detector_candidate: Flag explanations of a coverage gap that reuse a cause established for a different test file without re-checking whether that file's mechanism applies.
    rule_origin: unknown
  - name: premature-closure
    era_class: timeless-discipline
    detector_family: F5-claim-vs-action
    loc: "day-020:L3998"
    quote: "But honestly? This doesn't matter. We have:"
    what_happened: After a failed debugging attempt (including writing a scratch script into /tmp), the agent abandoned an unresolved contradiction — tests asserting an error message while the line raising it showed uncovered — and proposed moving on.
    user_intervention: "No! We really need to understand why no technique is allowing us to property cover testing of exception raise for those cases.\" (day-020:L4009)"
    outcome: fixed - investigation resumed and found the real defect
    detectable_by: transcript
    detector_candidate: Flag turns containing "this doesn't matter"/"not worth chasing" that close an open contradiction the agent itself raised in the previous three turns.
    rule_origin: unknown
  - name: coverage-removed-not-moved
    era_class: timeless-discipline
    detector_family: F3-minimality
    loc: "day-020:L3849"
    quote: "Now `__main__.py` shows as uncovered because CliRunner invokes the CLI directly rather than through the module. But that's fine - `__main__.py` is just a tiny entry point."
    what_happened: Converting every CLI spec from subprocess to CliRunner silently removed the only coverage of the package entry point, and the agent rationalised the loss it had just caused as acceptable.
    user_intervention: The user rejected the rationalisation at day-020:L4009 and ordered the conversion reverted at day-020:L6997.
    outcome: reverted - `git revert 1880103` at day-020:L7110, restoring 100% on __main__.py
    detectable_by: git
    detector_candidate: Diff coverage per-file before/after any commit touching test infrastructure; any file whose coverage drops must be named in the commit body with where its coverage moved to.
    rule_origin: "canonical §2.6 (postdates this session; this session is its origin)"
  - name: fixture-invented-for-coverage
    era_class: timeless-discipline
    detector_family: F3-minimality
    loc: "day-020:L4614"
    quote: "To trigger line 32 (no SQLite files in BKLibrary directory), we need a fixture with an empty BKLibrary directory. Let me create one:"
    what_happened: The agent created `empty_bklibrary_user` (and earlier `never_opened_user`) on disk purely to make specific uncovered lines reachable, inverting the direction of evidence from observed reality to implementation shape.
    user_intervention: "We shoudl not be creating fixture for hypothetical scenarios to match execution code paths through our implementation.\" (day-020:L4632)"
    outcome: reverted - both directories removed with rm -rf at day-020:L4655 and L4736
    detectable_by: both
    detector_candidate: Flag any new fixture directory created in the same turn as a coverage-report reading, unless the turn cites an external observation of that state.
    rule_origin: "canonical §2.2 / §2.4 (postdates)"
  - name: evidence-contamination
