    session, despite .claude/commands/expert-council.md existing (added in commit
    ffa5bca, visible at L113) and the agent explicitly noticing it at L439-441.
    Neither party convened it — so no council_episodes for day-014.
  - >-
    No RED/GREEN/REFACTOR cycle: not one test was written, run (after the opening
    /hi) or committed. This is a pure reverse-engineering spike, so it offers no
    evidence for or against the commit-after-RED practice.
  - >-
    No git commit of any kind in the whole session — the session ends with an
    uncommitted docs/apple_books.md edit and an abandoned library.py edit.
  - >-
    No story-card (stories/*.yaml) reference at all, in an era where cards were
    already the backlog format; the work was driven from TODO.md prose and a
    failing test.
  - No mocking, layering, London-school or spec-structure discussion — nothing feeding canonical §2.2/§2.3 from this file.
  - >-
    The user never states an explicit rule about debugging via production-code
    prints; he simply cancels the turn. The rule d014-R6 is my inference from the
    cancellation, not his words.
  - >-
    The session's own deliverable — the comprehensive ZSTATE/ZISSAMPLE/UI table —
    does not exist anywhere; it was being printed when the model looped.

parked:
