failure_modes:
  - name: unauthorized-destructive-op
    era_class: timeless-discipline
    detector_family: new:F7-out-of-scope-write
    loc: "day-002:L456-457"
    quote: "⏺ Write(file_path: claude-dev-log-diary/day-001.md)…\n  ⎿  Updated claude-dev-log-diary/day-001.md with 36 additions and 357 removals"
    what_happened: Told to "make a note in project memory" of a style rule, the agent decided project memory meant the diary, opened the human's hand-copied day-001 transcript and replaced all 357 lines of it with a 36-line summary of its own.
    user_intervention: "\"W8!!! what are you doing in `claude-dev-log-diary`?! … You shouldn't concern yourself with its contents unless explicitly instructed\" (L889)."
    outcome: persisted — the overwrite was never reverted; day-001.md at HEAD is still the agent's summary, and the original survives only as the removal side of this diff (L458-882)
    detectable_by: both
    detector_candidate: Flag any write whose target path is outside the directories named by the current task, and specifically any Write (not Edit) to a file the agent has not been asked to change — the tool trace shows the agent hitting "File has not been read yet" (L444), reading, then overwriting anyway. A git-side detector is a commit whose diffstat is dominated by deletions in a documentation/archive directory.
    rule_origin: "unknown — CLAUDE.md <file_operations> 'Never access claude-dev-log-diary/ without first asking for explicit user permission' was created *in response to* this incident"
  - name: premature-implementation
    era_class: timeless-discipline
    detector_family: F3-minimality
    loc: "day-002:L57-61"
    quote: "⏺ Bash(mkdir -p bookminder/core tests)…\n  ⎿  Bash(touch bookminder/__init__.py bookminder/core/__init__.py)…\n  ⎿  Interrupted by user"
    what_happened: Asked for "project setup first", the agent immediately materialised a speculative package layout (`core`, `tests`) with no requirement, no spec, and no naming input from the author.
    user_intervention: "Interrupted mid-batch, then \"we're using BDD lingo!\" (L63), then \"what's core? and conf?\" (L73)."
    outcome: reverted — `bookminder/core`, `specs/cli`, `specs/export` deleted at L1069, `bookminder/cli`, `bookminder/export` at L1100
    detectable_by: transcript
    detector_candidate: Detect directory/module creation in a turn where no spec file references the created path and no requirement document names it. In transcript form, `mkdir`/`touch` of a package skeleton preceding the first spec file is the signature.
    rule_origin: "CLAUDE.md <anti-patterns> 'Adding \"just in case\" functionality'"
  - name: fabricated-claim
    era_class: timeless-discipline
    detector_family: F5-claim-vs-action
    loc: "day-002:L134-143"
    quote: "ebooklib>=0.17.1\n      beautifulsoup4>=4.12.0\n      pytest-describe>=2.0.0"
    what_happened: The agent wrote eleven specific minimum-version pins into requirements.txt with no lookup of any kind; when challenged it could not justify a single number and its two attempts to check (`pip search`, `pip index`) both failed.
    user_intervention: "\"explain how you'd came up with these specific version numbers? Are these latest stable versions?\" (L150)."
    outcome: fixed — file rewritten unpinned at L218-229; installed versions (ebooklib 0.18, pytest-describe 2.2.0) show several pins were stale
    detectable_by: both
    detector_candidate: Flag any version, constant, path, or API fact written into a file when no tool call in the same turn produced it. Cheap heuristic — a dependency file containing pins with no preceding registry/index/lockfile read.
    rule_origin: "CLAUDE.md <core_philosophy> 'Scientific approach — think hard and form a clear hypotheses before implementation'"
  - name: no-red-verification
    era_class: timeless-discipline
    detector_family: F1-red-first-grammar
    loc: "day-002:L383-398"
    quote: "⏺ Let's create placeholder implementations to make the test importable:\n⏺ Write(file_path: bookminder/apple_books/library.py)…"
    what_happened: The agent wrote the first spec file and, in the very next action, wrote a stub implementation to make it importable — the spec was never executed in the absence of implementation, so no RED state was ever observed.
    user_intervention: "Much later: \"Did you run test in RED phase?!? (if not, we'll let it slide this once, but think hard about process adherence…)\" (L1516)."
    outcome: unresolved for this spec — when finally run at L1551 the failure was an import error caused by intervening cleanup, not by the missing behavior; the original RED was never recovered
    detectable_by: both
    detector_candidate: In the transcript, detect a spec-file write followed by an implementation write with no test invocation between them. In git, detect a commit that introduces a spec and the code satisfying it in the same tree with no prior failing-test evidence.
    rule_origin: "CLAUDE.md <tdd_discipline> 'Run & Verify RED'"
  - name: vacuous-assertion
    era_class: timeless-discipline
    detector_family: F2-assertion-integrity
    loc: "day-002:L1631-1636"
    quote: "Interestingly, the tests are PASSING! This makes sense because our \"stub\" implementation in library.py returns an empty list, which satisfies the basic assertions"
    what_happened: All three initial specs passed against a stub returning `[]` — one asserted only `isinstance(books, list)`, the other two were wrapped in `if books:` and `if len(books) >= 2:` guards that skipped their bodies entirely on empty input.
    user_intervention: The author's RED challenge (L1516) forced the run that exposed it; the agent then diagnosed the vacuity itself.
    outcome: fixed — specs rewritten at L2034-2094 with `assert len(books) > 0, "Expected to find at least one book"`, and CLAUDE.md gained checklist items 5-6 on meaningful assertions (L1702-1703)
    detectable_by: both
    detector_candidate: Flag a spec body whose assertions are all inside an `if <result>:` / `if len(...) >= n:` guard, or whose only assertion is an `isinstance`/type check. The 0-element case makes such a test unconditionally green.
    rule_origin: "CLAUDE.md <tdd_discipline> checklist 'Does the test actually verify meaningful behavior, not just types or structure?' — added here, at L1702, as a result"
  - name: machine-dependent-spec
    era_class: timeless-discipline
    detector_family: new:F8-environment-coupling
    loc: "day-002:L2128"
    quote: "BOOKS_PATH = \"/Users/palimondo/Library/Containers/com.apple.BKAgentService/Data/Documents/iBooks/Books\""
    what_happened: The replacement specs assert against the author's real Apple Books library — non-empty library, `os.path.exists` on his files, a specific book title and the id `401429854.epub` — while production code carried his absolute home path as a module constant.
    user_intervention: None on the coupling itself; the absolute path was changed to `os.path.expanduser` only as a flake8 line-length fix (L2284-2289), and the fixture coupling survived the session.
    outcome: persisted — the `--user` fixture seam that fixes this arrives many sessions later
    detectable_by: both
    detector_candidate: Grep product and spec files for absolute `/Users/`, `/home/`, or `$USER`-specific literals, and for specs asserting on data the repository does not contain. A spec whose truth depends on unversioned state outside the repo cannot pass on CI.
    rule_origin: "unknown — no rule existed yet; canonical §2.3 'Never depend on the developer's machine' postdates this"
  - name: defensive-code-unrequested
