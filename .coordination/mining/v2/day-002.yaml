philosophy:
  - statement: Code — especially a lot of it — is a liability, so the work is to minimize what must be written, not to maximize what gets produced.
    source: user-verbatim
    quote: "Code, especially a lot of it is a liability."
    loc: "day-002:L636 (day-001 user turn, preserved inside the overwrite diff)"
    feeds: skill-why
  - statement: Assumptions must be encoded as executable specification, because that is the only thing that keeps you grounded as the implementation grows more complex — specs are ballast against drift, not proof of correctness.
    source: user-verbatim
    quote: "we must codify all our assumptions in executable specification, so that we stay grounded"
    loc: "day-002:L638 (day-001 user turn, preserved inside the overwrite diff)"
    feeds: skill-why
  - statement: The agent's default coding style is not merely low-quality, it is *value-misaligned* — so alignment on method must be negotiated explicitly before any code is written.
    source: user-verbatim
    quote: "we shoudl also make sure we are fully aligned on the methodology and development process."
    loc: "day-002:L586 (day-001 user turn, preserved inside the overwrite diff)"
    feeds: judge-anchor
  - statement: The named lineage of the whole method is Dave Farley's Modern Software Engineering — engineering discipline, fast feedback, scientific method — not TDD-as-ritual.
    source: user-verbatim
    quote: "Yes. BUT let's talk about programming philosophy. I'm fully aligned with Dave Farley's Modern Software Engineering. Are you familiar with it?"
    loc: "day-002:L616 (day-001 user turn, preserved inside the overwrite diff)"
    feeds: skill-why
  - statement: Structure cannot be chosen before requirements exist; the agent proposing a package layout is a category error, and the correct response to "what modules?" is to run the requirements dialogue.
    source: user-verbatim
    quote: "I don't know yet... did you gather requirements in a dialog with me?"
    loc: "day-002:L83"
    feeds: judge-anchor
  - statement: The first increment is a Walking Skeleton — an end-to-end MVP of the broad vision (CLI plus MCP), not a deep vertical slice of one feature.
    source: user-verbatim
    quote: "I would like to build a Walking Skeleton first. Command line tool and MCP integration. So an MVP of broader vision."
    loc: "day-002:L113"
    feeds: skill-why
  - statement: The product exists so the author can talk to an LLM about the book he is reading — last chapter read, new highlights since the last conversation. This motivation is stated once, in prose, and never appears in a commit message.
    source: user-verbatim
    quote: "I'd like to talk to LLMs like Claude about the books that I am reading on my iPhone. Then we should be able to talk about last"
    loc: "day-002:L94"
    feeds: skill-why
  - statement: RED is a ladder of failure kinds, not a single assertion failure — ModuleNotFoundError and an unfinished environment are legitimate, informative RED states that drive the next minimal step. Excluding them from "correct reason to fail" is a misunderstanding of TDD.
    source: user-verbatim
    quote: "the \"correct reason\" for failing test in our case was the missing import and unfinished setup of the project environment"
    loc: "day-002:L1768"
    feeds: skill-why
  - statement: Toolchain compatibility is itself a hypothesis with an acceptance criterion (does pytest-describe/pytest-spec work on the newest stable Python?), pursued by trying the newest and falling back only on evidence — environment setup is an experiment, not a chore.
    source: user-verbatim
    quote: "We went into the project setup phase in order to verify that our BDD/TDD toolset is compatible with the python version we have installed."
    loc: "day-002:L1517"
    feeds: skill-why
  - statement: Ground rules belong in one place — the agent's constitution — not a second philosophy document; two files holding the same principles is a maintenance defect and one of them must go.
    source: user-verbatim
    quote: "These are great, but doesn't this belong to CLAUDE.md?"
    loc: "day-002:L742 (day-001 user turn, preserved inside the overwrite diff)"
    feeds: skill-why
  - statement: A recurring correction is a defect in the rules, not in the moment — the fix is to amend the constitution so the human stops hand-holding, and the agent is expected to propose that amendment itself.
    source: user-verbatim
    quote: "How should we update it so that I don't have to hold your hand the whole time?"
    loc: "day-002:L1191"
    feeds: judge-anchor
  - statement: Spec function names are the documentation for both reader and machine; a docstring restating the name is duplication that will rot, and `pytest --spec` is the rendering that makes the names load-bearing.
    source: user-verbatim
    quote: "remember we'll get a human readable description when we run `pytest --spec` and you and me both can read the function names with underscores just fine"
    loc: "day-002:L400"
    feeds: skill-why
  - statement: Self-documenting code means intention carried by names; prose restating adjacent code is actively unwanted, not merely redundant.
    source: user-verbatim
    quote: "your directives are to write self-documenting code, which reveals its intention using proper variable and function naming, not by re-stating the obvious in the surrounding prose."
    loc: "day-002:L2400"
    feeds: skill-why
  - statement: The discipline is scoped deliberately — the human's own artifacts (the transcript diary) are exempt from the quality regime on purpose, because a playground and a codebase are different kinds of thing.
    source: user-verbatim
    quote: "I'd liek to keep it is my playground without the straightjacke we force on code."
    loc: "day-002:L3589"
    feeds: skill-why
  - statement: YAGNI is a judgement the pair exercises together, not a rule the agent applies mechanically — the author knowingly grants exceptions (keeping check-yaml because YAML is in the vision) while naming them as exceptions.
