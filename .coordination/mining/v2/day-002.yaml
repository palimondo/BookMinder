pairing_gems:
  - loc: "day-002:L1516"
    why_exemplary: "\"Did you run test in RED phase?!? (if not, we'll let it slide this once, but think hard about process adherence and if we need to further improve the descriptions in CLAUDE.md)\" — catches the violation, grants amnesty for it, and in the same breath redirects the energy from apology to a durable amendment. The correction is aimed at the rules, not the agent."
  - loc: "day-002:L1768"
    why_exemplary: "The author reverts the agent's *rule*, not its code, and explains the TDD insight behind it — import errors are legitimate RED. This is the rarest kind of intervention in the corpus — correcting the constitution the agent wrote about itself — and it produced the cleanest revert commit of the session."
  - loc: "day-002:L1191"
    why_exemplary: "\"How should we update it so that I don't have to hold your hand the whole time?\" — the meta-move that generates the Implementation Checklist. The author delegates the design of his own guardrails to the agent while keeping the veto."
  - loc: "day-002:L1131"
    why_exemplary: "\"not yet. what's specs/conftest.py? what are the __init__.py files everywhere?\" — a commit is blocked not because something is wrong but because something is unexplained. Understanding is treated as a precondition for history."
  - loc: "day-002:L3052"
    why_exemplary: "\"(Even though we don't have any yet, I'll let you keep it, since it is in our vision... but :-) you know what I think)\" — YAGNI applied as judgement with a named exception and visible humour, demonstrating that the rules are heuristics the pair operates, not a compiler."
  - loc: "day-002:L2792"
    why_exemplary: "\"We keep having this discussion.\" — the author explicitly names a recurrence rather than re-explaining, which is the diagnostic that a rule (not a reminder) is missing; <package_structure> is written minutes later."

