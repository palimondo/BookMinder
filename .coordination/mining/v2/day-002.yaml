    loc: "day-002:L150"
    feeds: skill-why

skill_rules:
  - rule_id: d002-R1
    rule: Run a requirements dialogue and get the answers before creating any directory, module, or dependency list.
    because: Structure chosen before requirements is a guess, and the author would rather answer four questions than delete four directories.
    because_source: user-verbatim
    quote: "I don't know yet... did you gather requirements in a dialog with me?"
    evidence: "day-002:L83 (after rejections at L61, L71)"
    taught_or_enforced: needed-enforcement
    skill_target: tdd-bdd
    overlap: "CLAUDE.md <requirements_gathering>"
    feasibility: "needs-rework: requires a live human to answer; in a non-interactive harness restate as 'if no requirement document names the structure, stop and ask rather than infer it'"
  - rule_id: d002-R2
    rule: Never write a version number, pin, or constraint you have not checked against the live index; prefer unpinned or minimal constraints until a compatibility problem is observed.
    because: Version numbers recalled from training are fabrications that look like research, and hard pins invent compatibility problems that do not exist yet.
    because_source: user-verbatim
    quote: "explain how you'd came up with these specific version numbers? Are these latest stable versions?"
    evidence: "day-002:L150 (rejected requirements.txt at L132-148; replaced by unpinned list at L185-198)"
    taught_or_enforced: taught-once
    skill_target: tdd-bdd
    overlap: none
    feasibility: ok
  - rule_id: d002-R3
    rule: Write no docstrings in spec files; the describe_/it_ names are the specification text.
    because: A docstring duplicates the name that `pytest --spec` already renders, and duplicated documentation is documentation that can rot out of sync.
    because_source: user-verbatim
    quote: "Please don't write doctrings in specs, these are redundant with describe_/it_ functions"
    evidence: "day-002:L400"
    taught_or_enforced: repeated
    skill_target: tdd-bdd
    overlap: both
    feasibility: ok
  - rule_id: d002-R4
    rule: Name spec files `<module_name>_spec.py`.
    because: It is the common BDD convention and it makes the spec tree readable as a map of the modules it specifies.
    because_source: user-verbatim
    quote: "the file shold be called library_spec.py if we follow common BDD conventions, right?"
    evidence: "day-002:L926 (renamed from describe_book_library.py at L930)"
