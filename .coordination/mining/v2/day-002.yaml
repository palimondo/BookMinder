    quote: "(Even though we don't have any yet, I'll let you keep it, since it is in our vision... but :-) you know what I think)"
    loc: "day-002:L3052"
    feeds: judge-anchor
  - statement: Nothing gets committed that the author does not understand — every unexplained artifact (conftest.py, __init__.py, __pycache__, egg-info) is interrogated before it enters history, and the agent's job includes teaching.
