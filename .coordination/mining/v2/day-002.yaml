    loc: "day-002:L1131"
    feeds: judge-anchor
  - statement: "Executable truth extends to documentation and configuration: a documented command that has never been run is an unverified claim, and the author checks it by running it himself."
    source: user-paraphrase
    quote: ""
    loc: "day-002:L3483"
    feeds: skill-why
  - statement: Pretrained recall is not evidence — version numbers, package requirements, and API facts must be checked against the live world before they are written down.
    source: user-verbatim
