skill_rules:
  - rule_id: d002-R1
    rule: Run the specific new spec and observe it fail before writing any implementation, and say so explicitly.
    because: A spec that has never been executed in a failing state has not been shown to be capable of failing at all.
    because_source: user-verbatim
    quote: "Did you run test in RED phase?!?"
    evidence: "day-002:L1516"
    taught_or_enforced: needed-enforcement
    skill_target: tdd-bdd
    overlap: both
    feasibility: ok
  - rule_id: d002-R2
    rule: Treat import errors, missing modules and unfinished environment setup as legitimate RED — record them as the failure, and let each one drive the next minimal step rather than clearing them before declaring RED.
    because: The RED phase encompasses every failure that tells you what to build next, and demanding an assertion failure specifically would skip the steps that build the package itself.
    because_source: user-verbatim
    quote: "Wait. Think hard, the \"correct reason\" for failing test in our case was the missing import and unfinished setup of the project environment."
    evidence: "day-002:L1768 (agent had encoded the opposite rule at L1690 and was made to revert it at L1805-L1827, commit 8950797)"
    taught_or_enforced: taught-once
    skill_target: tdd-bdd
    overlap: none
    feasibility: ok
  - rule_id: d002-R3
    rule: Before claiming a spec is meaningful, check whether it would still pass against a stub returning an empty collection; guard every loop or conditional assertion with a non-emptiness assertion.
    because: Assertions of the form `isinstance(x, list)` plus `if x:` are satisfied by a function that does nothing, so the spec certifies the stub instead of the requirement.
    because_source: agent-synthesis
    evidence: "day-002:L1625-L1637 (three specs PASS against `return []`; the agent's own diagnosis: \"This isn't a proper RED state since we're not actually testing anything meaningful.\" at L1637)"
