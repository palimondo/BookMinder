philosophy:
  - statement: A one-token mutation of production code is the measuring instrument for test architecture — the number and identity of tests that break is the diagnostic, and the design goal is to make that blast radius small and tightly coupled.
    source: user-verbatim
    quote: "our goal should be to devise a multi-step process that will make acceptance test resilient against that `ZISSAMPLE` removal, which we've used as a stress test of our testing architecture that revealed its flaws"
    loc: "day-020:L8799"
    feeds: judge-anchor
  - statement: Restructuring work does not need a complete plan, but it does need a stated target property held in view at every step — otherwise the steps cannot be judged.
    source: user-verbatim
    quote: "So, let's think what steps are moving us closer towards that goal. We don't need a complete plan, but we need to start somewhere and keep our goal in mind every step of the way."
    loc: "day-020:L8802"
    feeds: skill-why
  - statement: Tests are production code and get the same care — GREEN is not the end of the cycle, REFACTOR of the specs themselves is the next obligatory step.
    source: user-verbatim
    quote: "No, we wrote test and passed GREEN. But test are code and require same TLC as out implementation. What should have been our next step followind the `tdd_discipline`?"
    loc: "day-020:L10111"
    feeds: judge-anchor
  - statement: Repetition in test setup is a message about the production design, not just noise to DRY away — ask what the tests are forced to say that they should not have to.
    source: user-verbatim
    quote: "right problem, but let's think harder, maybe the tests are also telling us something about out implementation. What's always repeated across all the Book creations what maybe doesn't have to be?"
    loc: "day-020:L10134"
    feeds: skill-why
  - statement: A constraint you do not understand is not yours to remove; recover the original motivation from history before changing it (Chesterton's fence, operationalised as git blame plus call-site search).
    source: user-verbatim
    quote: "It might be right or wrong, but we shouldn't change it wouthout knowing the motivation. We should maybe use git blame to lear about the historical context, or something?"
    loc: "day-020:L10212"
    feeds: judge-anchor
  - statement: Git history is a teaching artifact — a refactoring sequence should be committed step by step so the reasoning is legible to later readers, not squashed into an outcome.
    source: user-verbatim
    quote: "let's commit and continue after that. I'd like our got history to create a trail of our successfull refactoring for all to learn from!"
    loc: "day-020:L11038"
    feeds: skill-why
  - statement: Naming is judged at the point of use, not at the definition (Swift's clarity-at-call-site mantra imported into Python), and brevity is part of clarity because visual duplication at the call site costs the reader.
    source: user-verbatim
    quote: "I'm obsessive about naming... coming from Swift background, the mantra there was always about clarity at the point of use."
    loc: "day-020:L11361"
    feeds: skill-why
  - statement: Layer separation is the point of the test pyramid — the acceptance test owns only the CLI's user-visible contract, and the specific error messages and environment edge cases belong to the layer that produces them.
    source: user-verbatim
    quote: "The acceptance test shoudl be reduce to checking that CLI catches the exception thrown from library and displays the message to the user. The specific messages for each edge case shoudl be part of the integration test."
    loc: "day-020:L7996"
    feeds: judge-anchor
  - statement: Even after all layers are separated, exactly one subprocess test must remain to prove the parts are wired together — separation must not cost the only proof that the assembled program runs.
    source: user-verbatim
    quote: "that makes sense, but shouldn't we keep ONE CLI integration test that will use the subprocess to test once that all is wired together correctly?"
    loc: "day-020:L12486"
    feeds: judge-anchor
  - statement: The CLI must own no domain knowledge — path resolution belongs in the library, and the CLI merely forwards the parameter it was given.
    source: user-verbatim
    quote: "I think CLI should just be passing --user parameter value straight to library and it shold be responsible for the path resolution. We should move get_user_path to library and thoroughly spec it (absolute, relative, none -> Home) in its unit test"
    loc: "day-020:L13820"
    feeds: skill-why
  - statement: A test whose only reason to exist is a coverage number is suspect; but at this date the author still treats 100% coverage as a legitimate goal to drive test placement — the later judgement that "Coverage-Driven Development" is an anti-pattern is not yet visible.
    source: user-verbatim
    quote: "Yes, now when we'll use mocks, I expect we should be able to raise it to 100%, right?"
    loc: "day-020:L13594"
    feeds: judge-anchor
  - statement: Pretrained expert personas voice slogans and Java-shaped ceremony rather than the named expert's actual actionable position, and this is a recurring rather than one-off defect.
    source: user-verbatim
    quote: "That GOOS and Dave's possitions are a ridiculous carricature of them, again... `PathResolver` my ass!"
    loc: "day-020:L8142"
    feeds: judge-anchor
  - statement: The author works his own discipline as a two-way constraint — when he is the one who breaks it he says so and repairs the sequence rather than proceeding on the broken path.
    source: user-verbatim
    quote: "Not I was me that broke the `tdd_discipline` and derailed you to combine multiple refactorings into one."
    loc: "day-020:L11173"
    feeds: skill-why

skill_rules:
  - rule_id: d020s2-R1
    rule: After a spec goes GREEN, refactor the spec itself before starting the next behavior — do not treat GREEN as the end of the cycle.
    because: Tests are code and decay exactly like implementation code does.
    because_source: user-verbatim
    quote: "But test are code and require same TLC as out implementation."
    evidence: "day-020:L10111"
    taught_or_enforced: needed-enforcement
    skill_target: tdd-bdd
    overlap: "CLAUDE.md <tdd_discipline>"
    feasibility: ok
  - rule_id: d020s2-R2
    rule: Order the specs inside a describe block by rising complexity, and size collection specs 0, 1, n.
    because: The spec file is read top-down as documentation, so it should build the reader up rather than open at the hardest case.
    because_source: user-verbatim
    quote: "please order the test cases by rising level of complexity, start with the simplest and gradually build up to more complex cases. Similarily, order test for collection logic incrementally: 0, 1, n (2)"
    evidence: "day-020:L9791"
    taught_or_enforced: taught-once
    skill_target: tdd-bdd
    overlap: "canonical §2.3, §3"
    feasibility: ok
  - rule_id: d020s2-R3
    rule: When a stronger assertion subsumes a weaker one, delete the weaker spec — then sweep the file for other instances of the same redundancy.
    because: A spec that adds no falsifying power is maintenance cost dressed as coverage.
    because_source: user-verbatim
    quote: "yes; and then can we verify that we don't have other similar cases?"
    evidence: "day-020:L12182"
    taught_or_enforced: taught-once
    skill_target: tdd-bdd
    overlap: "canonical §2.3, §3"
    feasibility: ok
  - rule_id: d020s2-R4
    rule: Diagnose test-architecture coupling by deliberately breaking one production token (drop a SELECT column, misspell a key), running the whole suite, recording which tests fail, then reverting.
    because: The set of tests that break under a single-token mutation is the objective measure of how much each layer knows about the layer below it.
    because_source: user-verbatim
    quote: "Look how many test break with that simple change. What dies that tell us about our test structure and how should be properly fix that?"
    evidence: "day-020:L8178"
    taught_or_enforced: taught-once
    skill_target: tdd-bdd
    overlap: none
    feasibility: ok
  - rule_id: d020s2-R5
    rule: Before restructuring a suite, state the target property as a falsifiable sentence ("after this, only these N tightly-coupled tests fail on that mutation") and re-check it after each step.
    because: A restructuring with a goal but no test for the goal cannot be judged to have succeeded.
    because_source: user-verbatim
    quote: "We shoudl move stuff arround so that in the end only one or very few related (tighltly coupled) tests woudl fail in that Error case scenario"
    evidence: "day-020:L8801"
    taught_or_enforced: taught-once
    skill_target: tdd-bdd
    overlap: "canonical §2.7"
    feasibility: ok
  - rule_id: d020s2-R6
    rule: Land the replacement specs at the lower layer and see them pass before deleting the duplicate specs at the higher layer.
    because: Deleting first opens a window in which the behavior is unspecified, and that window is where regressions enter.
    because_source: user-paraphrase
    evidence: "day-020:L13169 (library_integration_spec committed) then day-020:L13416 (CLI duplicates deleted)"
    taught_or_enforced: repeated
    skill_target: tdd-bdd
    overlap: "canonical §2.6"
    feasibility: ok
  - rule_id: d020s2-R7
    rule: Keep exactly one subprocess end-to-end spec whose only job is to prove the wiring; everything else is tested in-process at its own layer.
    because: Layer separation must not silently delete the only evidence that the assembled program runs.
    because_source: user-verbatim
    quote: "shouldn't we keep ONE CLI integration test that will use the subprocess to test once that all is wired together correctly?"
    evidence: "day-020:L12486"
    taught_or_enforced: taught-once
    skill_target: tdd-bdd
    overlap: "canonical §2.2"
    feasibility: ok
  - rule_id: d020s2-R8
    rule: A describe block names the feature or command under test; if the name mentions a listing, a layer, or a mechanism that the block does not actually constrain, rename it.
    because: The describe name is the sentence the requirements document prints, so an inaccurate name corrupts the documentation.
    because_source: user-verbatim
    quote: "By pointing out that name I expected you to pick up on the fact that it's got nothign with `recent` listing -- that was only our initial motivation to drive the fixture development"
    evidence: "day-020:L12825"
    taught_or_enforced: needed-enforcement
    skill_target: tdd-bdd
    overlap: "canonical §2.1"
    feasibility: ok
  - rule_id: d020s2-R9
    rule: Do not weaken an assertion to make it pass against the fixture you happen to have, and do not hardcode the fixture's current census either — mark the gap with FIXME and move on.
    because: Bending the assertion to the fixture destroys the reason the assertion existed, and the count is not the property under test.
    because_source: user-verbatim
    quote: "you're right that this is always true, but this looks like something that shoudl be tested with a mock somewhere elese; but hardcoding 6 here is also wrong. Maybe just add a FIXME comment and we'll adress that later"
    evidence: "day-020:L13073"
    taught_or_enforced: needed-enforcement
    skill_target: tdd-bdd
    overlap: "canonical §2.3 (tension: canonical prescribes exact sets against the known fixture census; here the author rejects a hardcoded count as brittle)"
    feasibility: ok
  - rule_id: d020s2-R10
    rule: Delete a docstring on an implemented spec when it restates the it_ name; the code is the specification.
    because: Two copies of the same requirement means one can rot silently, and the prose copy always rots first.
    because_source: user-verbatim
    quote: "that docstring says literally the same thing as `it`... remember our `code_style`"
    evidence: "day-020:L13202"
    taught_or_enforced: needed-enforcement
    skill_target: tdd-bdd
    overlap: both
    feasibility: ok
  - rule_id: d020s2-R11
    rule: Before changing a type, signature, or required field, run git blame on the declaring lines and grep every call site, then state the original motivation you recovered.
    because: A constraint whose purpose is unknown may be load-bearing; the history is cheap to consult and the removal is not.
    because_source: user-verbatim
    quote: "maybe we should investigate what's using these and what could have been the original reason these were required... We should maybe use git blame to lear about the historical context"
    evidence: "day-020:L10211"
    taught_or_enforced: needed-enforcement
    skill_target: tdd-bdd
    overlap: none
    feasibility: ok
  - rule_id: d020s2-R12
    rule: Do a rename in a single sweep across production and specs, then run the full suite before committing — never per-call-site.
    because: A half-finished rename compiles at the definition and fails only at the untouched call site, which the fast spec subset does not exercise.
    because_source: user-paraphrase
    evidence: "day-020:L11629 (`grep -n _format_book_output` finds cli.py:92 after the rename was thought complete); day-020:L11864 NameError in subprocess"
    taught_or_enforced: needed-enforcement
    skill_target: tdd-bdd
    overlap: none
    feasibility: ok
  - rule_id: d020s2-R13
    rule: Never read a coverage gap in code exercised only through subprocess as evidence that the code is untested — pytest-cov does not follow child processes.
    because: BookMinder's CLI specs shell out via `python -m bookminder`, so every line they exercise reports as missed.
    because_source: user-verbatim
    quote: "cli_spec does test the library in those cases!"
    evidence: "day-020:L7564, agent confirms mechanism at day-020:L7860"
    taught_or_enforced: needed-enforcement
    skill_target: project-memory
    overlap: none
    feasibility: ok
  - rule_id: d020s2-R14
    rule: In bookminder/cli.py the Click group is `list_cmd` declared as `@main.group(name="list")` — do not name it `list`.
    because: A module-level `list` shadows the builtin and makes `list[Book]` annotations raise `TypeError: 'Group' object is not subscriptable` at import time.
    because_source: agent-synthesis
    evidence: "day-020:L9212 (the TypeError), day-020:L9489 (the rename)"
    taught_or_enforced: taught-once
    skill_target: project-memory
    overlap: "canonical §6"
    feasibility: ok
  - rule_id: d020s2-R15
    rule: In the Book TypedDict only title and author are required; path and updated are NotRequired because the SQLite path can supply neither.
    because: `_row_to_book` always sets `path=""` (paths need Books.plist/ZASSETID correlation) and only the plist reader has a real path, so requiring them forced every formatter spec to pass meaningless values.
    because_source: user-paraphrase
    evidence: "day-020:L10258 (`path=\"\",  # Path requires Books.plist correlation with ZASSETID`); day-020:L10416 (fields made NotRequired)"
    taught_or_enforced: taught-once
    skill_target: project-memory
    overlap: "canonical §2.5"
    feasibility: ok
  - rule_id: d020s2-R16
    rule: The --user parameter is the test seam; path resolution (absolute passthrough, bare name to /Users/<name>, None to Path.home()) lives in the library and is unit-specced there, not in the CLI.
    because: Path.home() cannot be exercised end-to-end on CI where no Apple Books container exists, so the behavior must be testable at a layer that can substitute it.
    because_source: user-verbatim
    quote: "It's executed when no `--user` parameter is provided. There's not end-to-end test writen for this case because (I think, but maybe am wrong) it works on my machine (asserts would be positive), but wouldn't work on GitHub's CI"
    evidence: "day-020:L7990, moved at day-020:L13896-L13977"
    taught_or_enforced: taught-once
    skill_target: project-memory
    overlap: "canonical §2.2"
    feasibility: ok
  - rule_id: d020s2-R17
    rule: The /hi orientation command runs coverage as well as `pytest --spec`, tree, git log and git status.
    because: The session should open with the coverage picture, not discover it mid-task.
    because_source: user-verbatim
    quote: "check the /hi command and let's add running of coverage to it"
    evidence: "day-020:L7248, edit at day-020:L7399"
    taught_or_enforced: taught-once
    skill_target: claude-md
    overlap: "CLAUDE.md <build_commands>"
    feasibility: ok
  - rule_id: d020s2-R18
    rule: Respect the 88-character ruff limit while writing, and verify by running the linter rather than committing and letting the hook find it.
    because: The pre-commit hook rejecting the commit is a slower feedback loop than checking the line you are about to write.
    because_source: user-verbatim
    quote: "OK, but ruff will tell you that some of these are longer than 88 chars, so you might as well pay attention to it now and then verify by running it"
    evidence: "day-020:L11083"
    taught_or_enforced: repeated
    skill_target: claude-md
    overlap: "CLAUDE.md <code_style>"
    feasibility: ok

failure_modes:
  - name: unverified-diagnosis
    era_class: timeless-discipline
    detector_family: F5-claim-vs-action
    loc: "day-020:L7560"
    quote: "These missing lines represent edge cases and error handling paths that would require specific test fixtures or mocking to cover. The 97% coverage is excellent, and these remaining lines are defensive programming for rare scenarios."
    what_happened: The agent read four uncovered lines and concluded the paths were untested, without opening the spec file that exercised every one of them through a subprocess.
    user_intervention: "cli_spec does test the library in those cases!" (day-020:L7564)
    outcome: fixed — the agent then found the real cause (pytest-cov does not follow subprocesses) at day-020:L7845
    detectable_by: transcript
    detector_candidate: Flag any turn that explains a coverage gap as "untested" without a preceding read/grep of the spec files that name the same symbols.
    rule_origin: "CLAUDE.md <core_philosophy> Scientific approach — form a clear hypothesis before implementation"
  - name: fabricated-claim
    era_class: model-artifact
    detector_family: F5-claim-vs-action
    loc: "day-020:L8067"
    quote: "  class PathResolver:\n      def resolve_user_path(self, user=None):"
    what_happened: The Freeman & Pryce persona was made to prescribe a Java-shaped `PathResolver` class (and earlier a `CLIAdapter` with constructor injection) as GOOS doctrine, in a codebase that is deliberately function-based.
    user_intervention: "That GOOS and Dave's possitions are a ridiculous carricature of them, again... `PathResolver` my ass!" (day-020:L8142)
    outcome: reverted — the design was dropped and the user asked for a Pythonic reading instead (day-020:L8642)
    detectable_by: transcript
    detector_candidate: In persona output, flag any proposed class whose name is <Noun>Resolver/Adapter/Repository/Manager when the surrounding module contains no classes.
    rule_origin: unknown
