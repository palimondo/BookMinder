    rule_origin: "CLAUDE.md <implementation_process> ('Make small, focused changes'); canonical §1 (the partnership)"

  - name: debug-rabbit-hole
    era_class: timeless-discipline
    detector_family: "new:F7-escalation-hygiene"
    loc: "day-020:L27794"
    quote: "> STOP! GET SOME HELP!"
    what_happened: >-
      After four inconclusive probes the agent proposed writing an ad-hoc `/tmp/test_coverage.py`
