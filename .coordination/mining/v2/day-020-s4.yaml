  - name: wrong-layer-test
    era_class: timeless-discipline
    detector_family: F4-layering
    loc: "day-020:L25908"
    quote: "100 -      def it_handles_non_existent_relative_user_path():\n101 -          user_name = \"non_existent_user\"\n102 -          result = _run_cli_with_user(user_name, use_fixture=False)"
    what_happened: >-
      The "move edge cases to the library" step also deleted the one spec covering CLI
      relative-path resolution, which was not a library edge case and was not recreated
      anywhere; overall coverage dropped 97% → 94% and the loss was narrated as expected.
    user_intervention: The user accepted the drop on the promise that mocks would restore it, which happened only partially (the path logic later moved to the library and was re-specified at L26818).
    outcome: fixed — but two commits later and by a different route than the one announced.
    detectable_by: git
    detector_candidate: >-
      In a commit claiming to "move" tests, diff the set of deleted `it_` names against the
