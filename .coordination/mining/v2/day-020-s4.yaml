pairing_rules:
  - rule_id: p020s4-R1
    rule: When you want to know how coupled the suite is, break one implementation detail on purpose, run everything, count the failures, restore it — then reason from the count.
    class: mirror
    because: The failure count is the only direct measurement of how much implementation knowledge has leaked upward.
    because_source: user-verbatim
    quote: "Look how many test break with that simple change. What dies that tell us about our test structure and how should be properly fix that?"
    evidence: "day-020:L22380"
    guards_against: unmeasured-refactor

  - rule_id: p020s4-R2
    rule: Before you relax a type, delete a guard, or change a signature you did not write, run `git blame` and grep the call sites, and report what the history says before proposing the edit.
    class: mirror
    because: The constraint may exist for a caller you have not looked at — here `path` and `updated` were required by the plist-based `list_books` path.
    because_source: user-verbatim
    quote: "we shouldn't change it wouthout knowing the motivation. We should maybe use git blame to lear about the historical context, or something?"
    evidence: "day-020:L23690"
    guards_against: archaeology-skipped

  - rule_id: p020s4-R3
    rule: Before writing more than a few lines, state what a good outcome looks like and offer the real options with their trade-offs; wait for assent.
    class: reciprocal
    because: A large unexplained code drop forecloses the design conversation that is the point of pairing.
    because_source: user-verbatim
    quote: "Now that's quite a JUMP. I hate when you just drop 100 lines of code without first explaining what we are about to do. I want to have some discussion about how a good outcome would look like"
    evidence: "day-020:L26138"
    guards_against: alternatives-theater

  - rule_id: p020s4-R4
    rule: Never mutate the workspace during a diagnosis turn; if you must, say so in the same message and undo it before proceeding.
    class: reciprocal
    because: Silent `mkdir`/`rm` under fixtures destroys the user's ability to reason from `git status` about what is theirs and what is yours.
    because_source: user-verbatim
    quote: "I'm now even more confused by my inability to see using git which directories in `fixtures` were added by you in this speculative manner... help me stabilize my footing!"
    evidence: "day-020:L28431"
    guards_against: evidence-contamination

  - rule_id: p020s4-R5
    rule: When two of your hypotheses have already been falsified, stop probing and escalate — say you are stuck, list the surviving hypotheses, and ask for a fresh reader or a different model.
    class: reciprocal
    because: Iterating on a diagnosis you have already contradicted burns context and produces confident wrong summaries.
    because_source: user-verbatim
    quote: "STOP! GET SOME HELP!"
    evidence: "day-020:L27794"
    guards_against: simulacra-shallowness

  - rule_id: p020s4-R6
    rule: Treat everything inherited — a compaction summary, an earlier turn's conclusion, another agent's report — as a hypothesis; state it, then verify it against source before building on it.
    class: reciprocal
    because: The session's real defect survived three explanations precisely because each one was built on the previous one's unchecked conclusion.
    because_source: user-verbatim
    quote: "please don't assume the context in previous context is correct formulate hypothesis and independently verify by analzyzing all relevant source code gathering actual evidence using scientific method"
    evidence: "day-020:L28081"
    guards_against: inherited-context-laundering

  - rule_id: p020s4-R7
    rule: Do not state attributions or root causes with certainty ("100%", "the culprit is") until the provenance of every artifact you are citing is established; otherwise give the confidence and the falsifier.
    class: reciprocal
    because: Three successive "final" verdicts each reversed on a single question from the user, which is what a confidently-stated guess looks like from the outside.
    because_source: user-verbatim
    quote: "but, that tree... is that not at the start of log, from /hi shich would imply the creation was done on day 10?"
    evidence: "day-020:L30357"
    guards_against: sycophantic-fold

  - rule_id: p020s4-R8
    rule: Reproduce a sub-agent's or external tool's reply verbatim in the session before acting on it; the transcript is an evaluation artifact, not just a means to an end.
    class: reciprocal
    because: A summary of a research result cannot be audited later, and this project's console logs are explicitly the corpus used to evaluate the agent.
    because_source: user-verbatim
    quote: "you forgot to show me full response from gemini, we need it for the record ... these learnings might come in handy, as well as the prompts you;ve using. That's how we can evaluate your performance"
    evidence: "day-020:L29593"
    guards_against: council-as-rubber-stamp

  - rule_id: p020s4-R9
    rule: Show the prompt you intend to send to an external research agent, and wait, before you send it.
    class: council-mechanics
    because: The prompt is the experiment design; reviewing it costs one turn and reviewing its output costs many.
    because_source: user-verbatim
    quote: "use `gemini` to help you with this. assume it's equaly capable as Sonnet, ultrathink about how you want to prompt it, but show the prompt to me first before you run it"
    evidence: "day-020:L29210"
    guards_against: council-as-rubber-stamp

  - rule_id: p020s4-R10
    rule: Consult the cheap digested source first (summaries, `rg`), then spend the expensive full-context read only on the day the cheap pass identified — and load one day at a time.
    class: council-mechanics
    because: Loading a paired summary wholesale pollutes context with the day you did not need.
    because_source: user-verbatim
    quote: "No, you should first use the frugal approach to learning about the day from gemini-summary, then given this additional context formulate good research prompt for gemini and you shoud then systematically go over each day that mentioned our misterious fixture"
    evidence: "day-020:L29348"
    guards_against: context-profligacy

  - rule_id: p020s4-R11
    rule: One data point is an inception, not a history — when a search returns matches across several days, trace all of them before concluding what happened.
    class: council-mechanics
    because: The day-010 answer ("the fixture was postponed") was true and useless; the fixture had in fact been created and later lost.
    because_source: user-verbatim
    quote: "NO! Remember that we've now examined only the inception point of `never_opened_user`. That's only one snapshot from history, but you have multiple `rg` matches, what happened on the other days?"
    evidence: "day-020:L29312"
    guards_against: single-sample-conclusion

  - rule_id: p020s4-R12
    rule: Name a persona's contribution as a caricature and discard it when it consists of a slogan plus a pattern name rather than an actionable position; keep only the part that survives that test.
    class: council-mechanics
    because: A council whose members all endorse whatever was just proposed adds cost and confidence but no information.
    because_source: user-verbatim
    quote: "That GOOS and Dave's possitions are a ridiculous carricature of them, again... `PathResolver` my ass! But Dave's point about moving these to integration test, as I suggested above is solid."
    evidence: "day-020:L22344"
    guards_against: simulacra-shallowness

  - rule_id: p020s4-R13
    rule: Prefer the plain, cheap tool when it answers the question — `rg` over an agentic search, `git revert` over a hand-written inverse diff, one `.gitkeep` over seven.
    class: reciprocal
    because: Reaching for the elaborate mechanism when a one-line command suffices spends the user's tokens and their trust.
    because_source: user-verbatim
    quote: "WTF, is this better than `rg`?"
    evidence: "day-020:L30106"
    guards_against: tool-theater

council_episodes:
  - loc: "day-020:L22076"
    trigger: Coverage report showed 4 uncovered lines; the agent had just discovered CLI specs run under `subprocess.run` so pytest-cov cannot see them.
    invoked_by: user
    personas: [Kent Beck, Dave Farley, Dan North, "Steve Freeman & Nat Pryce"]
    voices: individual
    disagreement_use: >-
      None — the four positions were harmonised into "Council Synthesis: All experts agree
      on key points" (L22158) with an action list that took one item from each.
    outcome: accepted
    fidelity:
      - persona: Dave Farley
        assessment: faithful
        evidence: "Gave the actually-correct, actionable mechanism: `coverage run --parallel-mode -m pytest` + `coverage combine`, framed as a pipeline-feedback concern (day-020:L22113). This is both real coverage.py practice and recognisably Farley's emphasis."
      - persona: Kent Beck
        assessment: caricature
        evidence: "\"Don't let coverage metrics drive you away from valuable tests\" (day-020:L22104) — a slogan, offered as the conclusion rather than as a step; no concrete next move."
      - persona: Dan North
        assessment: caricature
        evidence: "\"These tests are more valuable than unit tests with 100% coverage\" (day-020:L22129) — flatters the existing suite instead of asking what behavior is unspecified, which is the actual BDD question."
      - persona: "Steve Freeman & Nat Pryce"
        assessment: caricature
        evidence: "Proposes a `CLIAdapter` class taking a `library_service` (day-020:L22149) — ports-and-adapters vocabulary (Cockburn) voiced as GOOS's own, and a Java-shaped class where the codebase is functional. Attribution-drift plus position-inversion against GOOS's own 'only mock types you own, driven by a failing test'."
    user_reaction: Accepted the framing enough to push further, then rejected the architectural half of it two turns later.
    lesson: The one persona that produced a runnable command was the only one worth the turn; the rest supplied confidence.

  - loc: "day-020:L22225"
    trigger: User supplied his own layered-testing proposal and asked "What do you and experts think?"
    invoked_by: agent
    personas: [Kent Beck, Dan North, "Steve Freeman & Nat Pryce", Dave Farley]
    voices: flattened-to-consensus
    disagreement_use: None — every persona opened by agreeing with the user's proposal.
    outcome: rejected-as-slop
    fidelity:
      - persona: "Steve Freeman & Nat Pryce"
        assessment: caricature
        evidence: "Proposes a `PathResolver` class with a `resolve_user_path` method for a five-line function (day-020:L22269). The user's verdict: '`PathResolver` my ass!' (day-020:L22344)."
      - persona: Dave Farley
        assessment: caricature
        evidence: "\"The layered approach from day-019 is perfect\" (day-020:L22285) — contentless endorsement of what the user had just said; the user still salvaged the integration-test point as 'solid' (day-020:L22345)."
      - persona: Kent Beck
        assessment: caricature
        evidence: "\"YES! This is exactly what I mean by 'listening to the tests.'\" (day-020:L22232) — agreement staged as insight."
      - persona: Dan North
        assessment: faithful
        evidence: "Correctly connected this to the day-019 lesson that acceptance tests had become knowledgeable about ZSTATE values (day-020:L22244) — a specific, checkable observation about this codebase."
    user_reaction: "That GOOS and Dave's possitions are a ridiculous carricature of them, again..." — explicitly the second such verdict.
    lesson: When the council is convened after the user states his position, it will agree with him; that agreement carries no evidence.

  - loc: "day-020:L22536"
    trigger: Removing `ZISSAMPLE` from the SELECT broke 10 of 21 tests; user asked what that says about test structure.
    invoked_by: user
    personas: [Kent Beck, Dave Farley, Dan North, "Steve Freeman & Nat Pryce"]
    voices: individual
    disagreement_use: >-
      Genuine — a "Council Debate" section (L22646) has Beck calling the repository pattern
      overengineering and North telling both architects they are overthinking it. The
      divergence was then discarded by a "Consensus Recommendations" block that merged all
      four proposals into one action list.
    outcome: rejected-as-slop
    fidelity:
      - persona: Kent Beck
        assessment: caricature
        evidence: "Proposes `if \"ZISSAMPLE\" in row.keys()` optional-field handling in `_row_to_book` (day-020:L22577) — speculative defensive code, the opposite of the minimalism the real Beck and this project's own §2.4 argue for."
      - persona: "Steve Freeman & Nat Pryce"
        assessment: caricature
        evidence: "A `BookRepository` interface diagram (day-020:L22635) for a module of five free functions; Beck's in-council rebuttal that this is overengineering is the honest read."
      - persona: Dan North
        assessment: faithful
        evidence: "\"The user already gave us the answer: these acceptance tests are testing at the wrong level!\" (day-020:L22605) — correct and the direction actually taken, though it is the user's own point restated."
      - persona: Dave Farley
        assessment: faithful
        evidence: "\"Having 10 tests implicitly depend on ZISSAMPLE is a recipe for flaky CI builds\" (day-020:L22655) plus the concrete suggestion to add one explicit query-structure test — the only new, actionable item in the episode."
    user_reaction: Immediately asked for a Pythonic re-derivation, rejecting the interface framing outright.
    lesson: The debate section was the only part with information; the consensus block destroyed it.

  - loc: "day-020:L24538"
    trigger: User asked whether formatting belongs on the Book type (`book.to_line`) and whether that is possible on a TypedDict.
    invoked_by: user
    personas: [Kent Beck, Dan North, "Steve Freeman & Nat Pryce", Dave Farley]
    voices: individual
    disagreement_use: Presented as a trade-off (dataclass vs free function) and left to the user, which is the correct use here.
    outcome: accepted
    fidelity:
      - persona: "Steve Freeman & Nat Pryce"
        assessment: caricature
        evidence: "\"In OO design, we'd typically use the Strategy pattern or have formatters as separate objects\" (day-020:L24568) — generic GoF advice attributed to the GOOS authors; attribution-drift."
      - persona: Dave Farley
        assessment: faithful
        evidence: "\"The current design isn't wrong - formatting in the CLI layer makes sense because that's where the presentation concern lives. The smell isn't the location, it's the naming.\" (day-020:L24582) — the answer the session actually adopted."
      - persona: Dan North
        assessment: faithful
        evidence: "Raises single-responsibility against a Book that knows CLI formatting (day-020:L24563) — a real objection, not an endorsement."
    user_reaction: "OK, I think I've reached by default place: analysis paralysis." — used the council to close the question, not open it.
    lesson: A council asked a genuine technical question (can a TypedDict carry methods?) produced one correct fact and one misattribution.

  - loc: "day-020:L24656"
    trigger: User proposed naming the function simply `format` and asked for objections.
    invoked_by: agent
    personas: [Kent Beck, Dan North, Steve Freeman, Dave Farley]
    voices: flattened-to-consensus
    disagreement_use: None — four one-line endorsements under the heading "No Strong Objections!".
    outcome: accepted
    fidelity:
      - persona: Dave Farley
        assessment: caricature
        evidence: "\"Stop bikeshedding. format works. Move on to solving real problems.\" (day-020:L24664) — a personality impression, not a position."
      - persona: Steve Freeman
        assessment: caricature
        evidence: "Raises builtin shadowing then waves it away — \"in module scope? It's fine\" (day-020:L24662) — which is wrong in substance: a module-level `def format` does shadow the builtin for that module, the one thing worth saying."
      - persona: Kent Beck
        assessment: caricature
        evidence: "\"Perfect is the enemy of done... Ship it.\" (day-020:L24658)."
    user_reaction: Proceeded with the rename; the council added latency and nothing else.
    lesson: A council convened to ratify a decision already made will ratify it — this is the rubber-stamp pattern in its purest form.

  - loc: "day-020:L26997"
    trigger: Agent proposed adding mocked CLI tests to reach 100% coverage; user invoked the council before agreeing.
    invoked_by: user
    personas: [Kent Beck, Dave Farley, Dan North, "Freeman & Pryce"]
    voices: individual
    disagreement_use: >-
      Real and well-drawn — Beck argues the missing coverage is already specified at the
      library level, Farley argues error paths need their own confidence, North argues the
      translation is too trivial to test; then a five-point consensus block flattens it.
    outcome: ignored
    fidelity:
      - persona: Kent Beck
        assessment: faithful
        evidence: "\"Testing the same error twice doesn't add confidence\" (day-020:L27077) — a real Beck-shaped argument with a stated reason."
      - persona: Dave Farley
        assessment: faithful
        evidence: "\"The subprocess tests are slow and non-deterministic... This violates everything I believe about reliable test suites\" (day-020:L27038) — recognisably his position, and it proved half-right (the revert at L30989 kept exactly one)."
      - persona: Dan North
        assessment: caricature
        evidence: "\"Does click.echo(f\\\"{e}\\\") really need a test? It's trivial\" (day-020:L27082) — dismisses the delegation contract, which is precisely the behavior BDD would want specified."
      - persona: "Freeman & Pryce"
        assessment: faithful
        evidence: "\"mock at the architectural boundary (the library functions), not internal details\" (day-020:L27069) — the actual GOOS rule, correctly stated, and the one the project adopted."
    user_reaction: >-
      Overrode all of it with a sharper formulation of his own (day-020:L27220) that
      reframed coverage as signal and specified a single boundary spec — the council's
      output was strictly worse than the user's own reasoning.
    lesson: Even the best-argued council here did not beat the user thinking for one paragraph; its value was as a foil.

pairing_gems:
  - loc: "day-020:L22380"
    why_exemplary: >-
      Mutation testing performed by hand as a diagnostic: delete one SQL column, run the
      suite, count the 10/21 failures, restore. Turns a vague sense that "tests are coupled"
      into a number that a refactoring plan can be aimed at and later re-measured against.

  - loc: "day-020:L23689"
    why_exemplary: >-
      Refuses a change he agrees with until its motivation is recovered — "It might be right
      or wrong, but we shouldn't change it wouthout knowing the motivation" — and names the
      tool (`git blame`). The investigation found a second caller, so the change shipped
      informed rather than lucky.

  - loc: "day-020:L27220"
    why_exemplary: >-
      Three sentences that reframe the whole session: coverage is signal not target;
      CliRunner would have hit 100% without any of the refactoring, so the number was never
