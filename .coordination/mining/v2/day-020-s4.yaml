      / `^it_[a-z0-9_]+$`; a rename that alters a describe name should also be checked
      against `pytest --spec` output, which was never run in this shard.
    rule_origin: "canonical §2.1 (the describe name is the story's name in the documentation)"

  - name: vacuous-assertion
    era_class: timeless-discipline
    detector_family: F2-assertion-integrity
    loc: "day-020:L25453"
    quote: "76 +          assert len(books) > 10  # Should have more than recent limit"
    what_happened: >-
