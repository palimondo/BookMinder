    what_happened: The agent ran `git add -A && git diff --staged` despite the explicit repo rule against blanket staging.
    user_intervention: None needed — a PreToolUse hook blocked it.
    outcome: fixed — the agent restaged the three files by name.
    detectable_by: both
    detector_candidate: "Grep transcripts for `git add -A` / `git add .`; already enforced mechanically here, so the value is as a regression check on the hook."
    rule_origin: "CLAUDE.md <git_workflow> ('Never use `git add .` - always stage files explicitly by name')"

  - name: scope-creep
    era_class: timeless-discipline
    detector_family: F3-minimality
    loc: "day-020:L30485"
    quote: "touch specs/apple_books/fixtures/users/never_opened_user/.gitkeep\n      touch specs/apple_books/fixtures/users/never_opened_user/Library/.gitkeep…"
    what_happened: Having learned that git cannot track empty directories, the agent created seven `.gitkeep` files, one per level of the fixture path.
    user_intervention: "explain the .gitkeep to me? shouldn't one at the leaf node of our empty directory tree suffice?" (day-020:L30571)
    outcome: fixed — six removed surgically after the user refused a `git reset HEAD <dir>` sweep ("I'm tired, and suspisious of sweeping wipe operaions", L30587).
    detectable_by: git
