    user_intervention: "you're right that this is always true, but this looks like something that shoudl be tested with a mock somewhere elese; but hardcoding 6 here is also wrong." (day-020:L25622)
    outcome: fixed — reverted to `assert len(books) > 0` plus title-set assertions; the limit property was correctly identified as belonging to a future `--limit` story.
    detectable_by: both
    detector_candidate: >-
      Flag magic-number comparisons against fixture cardinality introduced in the same
      diff as the fixture-reading call, with no census assertion establishing the number.
    rule_origin: "canonical §2.3 (exact sets of the known fixture census)"

  - name: premature-implementation
    era_class: timeless-discipline
    detector_family: F3-minimality
