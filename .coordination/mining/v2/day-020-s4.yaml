    outcome: fixed — the actual `mkdir` was located by `rg` in day-010 and the model in force was confirmed from the single `/model Opus` line.
    detectable_by: transcript
    detector_candidate: >-
      Flag numerically-certain attributions ("100%", "the culprit is") whose supporting
