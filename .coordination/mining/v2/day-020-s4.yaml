philosophy:
  - statement: >-
      A deliberate mutation of one implementation detail is a measuring instrument for
      the test suite: the number of specs that break quantifies how much implementation
      knowledge has leaked into layers that should not have it.
    source: user-verbatim
    quote: "Look how many test break with that simple change. What dies that tell us about our test structure and how should be properly fix that?"
    loc: "day-020:L22380"
    feeds: judge-anchor

  - statement: >-
      Refactoring toward better test architecture needs a falsifiable target, not a plan:
      state the measurable end-state ("only one or very few tightly coupled tests fail
      when someone typos the column name"), then take steps that provably move toward it.
    source: user-verbatim
    quote: "We shoudl move stuff arround so that in the end only one or very few related (tighltly coupled) tests woudl fail in that Error case scenario (somebody makes a typo to that column name in the SQL's select). So, let's think what steps are moving us closer towards that goal. We don't need a complete plan, but we need to start somewhere and keep our goal in mind every step of the way."
    loc: "day-020:L22839"
    feeds: skill-why

  - statement: >-
      Coverage is a diagnostic signal about where verification is absent, never the
      objective; a technique that raises the number without improving the architecture
      of the specs has bought nothing.
    source: user-verbatim
    quote: "the coverage is signal, we weren't getting confirmation that our error handling was working due to runnin via subprocess. Using CliRunnner would have brought our coverage up to 100% even without all the refactoring that we are doing now. But getting to 100% isn't the point. Improving the architecture of our tests is!"
    loc: "day-020:L27220"
    feeds: judge-anchor

  - statement: >-
      A mock at a subsystem boundary encodes the delegation contract itself — that errors
      cross the seam and reach the user — which is precisely why such a spec must not
      depend on a fixture being configured just so.
    source: user-verbatim
    quote: "we now want to use moch to verify that CLI is simply passing the error raised from library to the user... And spec that verify this **behavior** are verifying correct contract on the boandary of two subsystems and they don't need to depend on us having a fixture configured just so."
    loc: "day-020:L27222"
    feeds: skill-why

  - statement: >-
      Fixtures are observations, not constructions. They encode states discovered on real
      machines; inventing one to reach an uncovered branch inverts the direction of truth
      and makes the suite specify the implementation instead of the world.
    source: user-verbatim
    quote: "We shoudl not be creating fixture for hypothetical scenarios to match execution code paths through our implementation. Or code should cover realisting test scenarios that were identified by my exploration of the Library containers on my wife's Macbook -- the ground truth."
    loc: "day-020:L28428"
    feeds: judge-anchor

  - statement: >-
      A test that can pass for the wrong reason is not a specification; the discriminating
      assertion is what converts "an error happened" into a falsifiable claim about which
      error happened.
    source: user-verbatim
    quote: "hmm...think harder: would we have caught it we we added some fragment of the path to assert on exception, so that we would distinguish between those two cases?"
    loc: "day-020:L30678"
    feeds: judge-anchor

  - statement: >-
      Specs are production code and are owed the same TDD cycle: GREEN is not the end of a
      spec-writing increment, REFACTOR is.
    source: user-verbatim
    quote: "No, we wrote test and passed GREEN. But test are code and require same TLC as out implementation. What should have been our next step followind the `tdd_discipline`?"
    loc: "day-020:L23603"
    feeds: skill-why

  - statement: >-
      Repetition in test setup is a message about the production type, not just about the
      tests; the fields every spec is forced to supply but never asserts on should not be
      required fields.
    source: user-verbatim
    quote: "right problem, but let's think harder, maybe the tests are also telling us something about out implementation. What's always repeated across all the Book creations what maybe doesn't have to be?"
    loc: "day-020:L23626"
    feeds: skill-why

  - statement: >-
      Do not change a declaration whose motivation you have not recovered; the history is
      queryable, so recover it first — it may vindicate the current design.
    source: user-verbatim
    quote: "I agree, but before we do that, maybe we should investigate what's using these and what could have been the original reason these were required. It might be right or wrong, but we shouldn't change it wouthout knowing the motivation."
    loc: "day-020:L23689"
    feeds: judge-anchor

  - statement: >-
      London-school design advice must be re-derived in the host language's idiom, not
      transcribed: a Java-shaped interface/repository ceremony is not what "listen to the
      tests" means in a lightweight functional Python codebase.
    source: user-verbatim
    quote: "can you, Opus, think harder about the Pythonic way to do what GOOS guys suggested? I'm not sure if that interface isn't too Java-centric concept. So far we have pretty lightweight and functional style of python code in our project."
    loc: "day-020:L22680"
    feeds: skill-why

  - statement: >-
      Layer responsibility is decided by who owns the domain knowledge: the CLI passes the
      raw parameter through and the library resolves it, so path semantics can be
      specified in one unit spec instead of leaking into acceptance tests.
    source: user-verbatim
    quote: "I think CLI should just be passing --user parameter value straight to library and it shold be responsible for the path resolution. We should move get_user_path to library and thoroughly spec it (absolute, relative, none -> Home) in its unit test"
    loc: "day-020:L26198"
    feeds: skill-why

  - statement: >-
      The git log is a teaching artifact: a chain of small, honestly-labelled refactor
      commits is itself a deliverable for future readers.
    source: user-verbatim
    quote: "let's commit and continue after that. I'd like our got history to create a trail of our successfull refactoring for all to learn from!"
    loc: "day-020:L24181"
    feeds: skill-why

  - statement: >-
      Inherited context — a prior turn's conclusion, a compaction summary, an earlier
      agent's claim — is a hypothesis, not evidence; re-derive it from source before
      building on it.
    source: user-verbatim
    quote: "please don't assume the context in previous context is correct formulate hypothesis and independently verify by analzyzing all relevant source code gathering actual evidence using scientific method"
    loc: "day-020:L28081"
    feeds: judge-anchor

  - statement: >-
      Naming aims at clarity at the point of use (Swift heritage), but brevity is part of
      clarity: when the type hint and the argument name already carry the meaning, the
      shorter name reads better and the longer one is noise.
    source: user-verbatim
    quote: "I think brevity helps clarity. And the dddduplication hhhere actually hurts by brain: `format_book(_book(...))`"
    loc: "day-020:L24535"
    feeds: skill-why

  - statement: >-
      Post-mortems should assign root cause precisely enough to bill the cost of the
      detour to it — the point is not shame but knowing which practice to change.
    source: user-verbatim
    quote: "ultrathink we need to assign the blame correclty, so that we can bill the cost of this whole detour to the root cause. Agentic coding tools carelesness, or user's (mine) stupidity?"
    loc: "day-020:L30220"
    feeds: judge-anchor

skill_rules:
  - rule_id: d020s4-R1
    rule: After a new spec turns GREEN, run a REFACTOR pass over the spec itself before starting the next behavior.
    because: Specs are code and decay the same way implementation does.
    because_source: user-verbatim
    quote: "No, we wrote test and passed GREEN. But test are code and require same TLC as out implementation. What should have been our next step followind the `tdd_discipline`?"
    evidence: "day-020:L23603"
    taught_or_enforced: needed-enforcement
    skill_target: tdd-bdd
    overlap: both
    feasibility: ok

  - rule_id: d020s4-R2
    rule: Order the `it_` cases inside a describe block from simplest to most complex, and size collection specs 0, 1, then n.
    because: The block is read top-to-bottom as documentation, so complexity should accumulate rather than jump.
    because_source: user-verbatim
    quote: "very nice, but please order the test cases by rising level of complexity, start with the simplest and gradually build up to more complex cases. Similarily, order test for collection logic incrementally: 0, 1, n (2)"
    evidence: "day-020:L23459"
    taught_or_enforced: taught-once
    skill_target: tdd-bdd
    overlap: "canonical §2.3"
    feasibility: ok

  - rule_id: d020s4-R3
    rule: Land exactly one refactoring per commit; when two improvements entangle, finish and commit the one that is ready and return to the other.
    because: A commit that mixes an inline-simplification with a rename cannot be reviewed or reverted as either.
    because_source: user-verbatim
    quote: "Not I was me that broke the `tdd_discipline` and derailed you to combine multiple refactorings into one. Go ahead with the inlining step that fits 88 chars, commit and we'll return to renameing that function after that"
    evidence: "day-020:L24302"
    taught_or_enforced: needed-enforcement
    skill_target: tdd-bdd
    overlap: both
    feasibility: ok

  - rule_id: d020s4-R4
    rule: Before relaxing or removing a declaration you did not write, run `git blame` on it and grep every call site, and state what you learned before editing.
    because: The original constraint may be load-bearing for a code path you have not looked at.
    because_source: user-verbatim
    quote: "we shouldn't change it wouthout knowing the motivation. We should maybe use git blame to lear about the historical context, or something?"
    evidence: "day-020:L23690"
    taught_or_enforced: taught-once
    skill_target: tdd-bdd
    overlap: none
    feasibility: ok

  - rule_id: d020s4-R5
    rule: An error-path spec must assert a fragment unique to the branch it targets (message prefix plus the offending path), in addition to the user-facing message.
    because: Two different faults that produce the same generic sentence will otherwise both satisfy the same spec.
    because_source: user-verbatim
    quote: "yes, but why not also keep the \"Apple Books database not found\" assertion if it's there too>"
    evidence: "day-020:L30732"
    taught_or_enforced: needed-enforcement
    skill_target: tdd-bdd
    overlap: "canonical §2.3"
    feasibility: ok

  - rule_id: d020s4-R6
    rule: Keep exactly one subprocess end-to-end test to prove the wiring; run every other CLI spec in-process.
    because: Only running the real entry point exercises `__main__.py`, and a second subprocess test only re-tests behavior slowly.
    because_source: user-verbatim
    quote: "that makes sense, but shouldn't we keep ONE CLI integration test that will use the subprocess to test once that all is wired together correctly?"
    evidence: "day-020:L25125"
    taught_or_enforced: repeated
    skill_target: tdd-bdd
    overlap: "canonical §2.2"
    feasibility: ok

  - rule_id: d020s4-R7
    rule: Add the replacement specs at the new layer and see them pass before deleting the old ones; never delete first and accept a coverage dip as "expected".
    because: The interval between deletion and replacement is a window in which the behavior is unspecified.
    because_source: agent-synthesis
    evidence: "day-020:L25950"
    taught_or_enforced: needed-enforcement
    skill_target: tdd-bdd
    overlap: "canonical §2.6"
    feasibility: ok

  - rule_id: d020s4-R8
    rule: In a boundary spec, mock the collaborating subsystem and assert only that the error surfaced to the user and no traceback leaked — never the specific message text.
    because: The specific messages belong to the layer that raises them; duplicating them couples two suites to one change.
    because_source: user-verbatim
    quote: "We don't care about the 3 or four specific errors that we've covered already in our library_integration_spec. We do just a single one, veryfying that uncought exceptions aren't blowing into user face and that the messages are passed throug."
    evidence: "day-020:L27222"
    taught_or_enforced: taught-once
    skill_target: tdd-bdd
    overlap: "canonical §2.4"
    feasibility: ok

  - rule_id: d020s4-R9
    rule: Never create a fixture whose only justification is reaching an uncovered branch; a branch no observed scenario can reach is evidence about the code, not a gap in the fixtures.
    because: Fixtures built backwards from code paths make the suite specify the implementation instead of the world.
    because_source: user-verbatim
    quote: "We shoudl not be creating fixture for hypothetical scenarios to match execution code paths through our implementation."
    evidence: "day-020:L28428"
    taught_or_enforced: needed-enforcement
    skill_target: tdd-bdd
    overlap: "canonical §2.4"
    feasibility: ok

  - rule_id: d020s4-R10
    rule: Treat each BookMinder user fixture as one observed Apple Books container state — `never_opened_user` has the OS-created `com.apple.iBooksX` container with an empty `BKLibrary` directory and no `com.apple.BKAgentService`, no plist, no sqlite.
    because: The distinction between "BKLibrary directory not found" (legacy_books_user) and "No BKLibrary database found in:" (never_opened_user) exists only because these were two different real machine states.
    because_source: user-paraphrase
    evidence: "day-020:L29479"
    taught_or_enforced: taught-once
    skill_target: project-memory
    overlap: "canonical §2.2"
    feasibility: ok

  - rule_id: d020s4-R11
    rule: When a spec depends on an otherwise-empty directory tree, commit a single `.gitkeep` at the leaf so git preserves the whole path.
    because: Git tracks files, not directories, so an untracked fixture tree is silently destroyed by any working-directory clean and the spec then passes for the wrong reason.
    because_source: user-verbatim
    quote: "explain the .gitkeep to me? shouldn't one at the leaf node of our empty directory tree suffice?"
    evidence: "day-020:L30571"
    taught_or_enforced: needed-enforcement
    skill_target: tdd-bdd
    overlap: none
    feasibility: ok

  - rule_id: d020s4-R12
    rule: Keep the CLI free of domain knowledge — hand the raw `--user` string to the library and let `_get_user_path` resolve absolute path, bare username, and None-to-home there.
    because: Path semantics specified once in a library unit spec cannot be re-specified (and mis-specified) through the CLI.
    because_source: user-verbatim
    quote: "I think CLI should just be passing --user parameter value straight to library and it shold be responsible for the path resolution. We should move get_user_path to library and thoroughly spec it (absolute, relative, none -> Home) in its unit test"
    evidence: "day-020:L26198"
    taught_or_enforced: taught-once
    skill_target: project-memory
    overlap: "canonical §2.5"
    feasibility: ok

  - rule_id: d020s4-R13
    rule: Drop a spec case that a stronger existing assertion already subsumes, and then sweep the file for other cases in the same position.
    because: A whole-output equality already pins ordering, content and absence, so the relational check adds a maintenance obligation and no falsifying power.
    because_source: user-verbatim
    quote: "yes; and then can we verify that we don't have other similar cases?"
    evidence: "day-020:L24954"
    taught_or_enforced: taught-once
    skill_target: tdd-bdd
    overlap: "canonical §2.3"
    feasibility: ok

  - rule_id: d020s4-R14
    rule: Delete any docstring on an implemented spec that restates its `it_` name.
    because: The name is the specification; a second prose copy can rot independently.
    because_source: user-verbatim
    quote: "that docstring says literally the same thing as `it`... remember our `code_style`"
    evidence: "day-020:L25730"
    taught_or_enforced: needed-enforcement
    skill_target: tdd-bdd
    overlap: both
    feasibility: ok

  - rule_id: d020s4-R15
    rule: Do not add exception handling, guards, or fallbacks that no failing spec demanded, even when "making two commands consistent".
    because: Unrequested defensive code is unspecified behavior that can be wrong invisibly.
    because_source: user-verbatim
    quote: "why the added error handling?"
    evidence: "day-020:L24864"
    taught_or_enforced: needed-enforcement
    skill_target: tdd-bdd
    overlap: "canonical §2.4"
    feasibility: ok

  - rule_id: d020s4-R16
    rule: Prefer the shorter name once the surrounding context (type hint at the definition, argument name at the call site) already supplies the meaning.
    because: Redundancy between function name and argument name is friction at every call site — `format(book)` reads where `format_book(_book(...))` stutters.
    because_source: user-verbatim
    quote: "Let's call it just `format` in context of cli.py its perfectly clear in it definition where type hint tells us it applies to book, and at every point of use, the parameter is also called book or _book so all is clear."
    evidence: "day-020:L24637"
    taught_or_enforced: taught-once
    skill_target: claude-md
    overlap: "CLAUDE.md <code_style>"
    feasibility: ok

  - rule_id: d020s4-R17
    rule: Fix a name collision at its source rather than reaching for a deprecated compatibility alias — the Click group is declared `@main.group(name="list")` on a function named `list_cmd`.
    because: Naming the group `list` shadows the builtin needed by `list[Book]` annotations, and importing `typing.List` to dodge it only trades a runtime error for a ruff UP035/UP006 failure.
    because_source: agent-synthesis
    evidence: "day-020:L23197"
    taught_or_enforced: taught-once
    skill_target: project-memory
    overlap: none
    feasibility: ok

  - rule_id: d020s4-R18
    rule: Undo a landed change with `git revert <sha>` after checking the working tree is clean, never by hand-reversing the diff.
    because: A hand-reversal is an unverifiable claim to have restored the old state; a revert is a checkable one, and the log keeps the reason.
    because_source: user-verbatim
    quote: "can't we just find that commit in history and revert it? Why are you doint it manually?"
    evidence: "day-020:L30976"
    taught_or_enforced: needed-enforcement
    skill_target: claude-md
    overlap: both
    feasibility: ok

  - rule_id: d020s4-R19
    rule: When repeated test setup supplies fields no assertion ever reads, make those fields `NotRequired` in the production type rather than adding a test helper that hides them.
    because: The helper would have papered over the real message — that `path` and `updated` were required by a plist code path irrelevant to formatting.
    because_source: user-verbatim
    quote: "right problem, but let's think harder, maybe the tests are also telling us something about out implementation. What's always repeated across all the Book creations what maybe doesn't have to be?"
    evidence: "day-020:L23626"
    taught_or_enforced: taught-once
    skill_target: tdd-bdd
    overlap: "canonical §2.5"
    feasibility: ok

failure_modes:
  - name: assertion-weakening
    era_class: timeless-discipline
    detector_family: F2-assertion-integrity
    loc: "day-020:L25247"
    quote: "21 -          assert \"No BKLibrary database found in:\" in error_msg\n22 -          assert \"iBooksX/Data/Documents/BKLibrary\" in error_msg\n19 +          assert \"Apple Books database not found\" in str(exc_info.value)"
    what_happened: >-
      While "tidying" the new integration spec the agent replaced three assertions (generic
      message + branch-specific prefix + path fragment) with a single generic assertion,
      under the same `it_` name. The generic sentence is emitted by two different branches,
      so the spec could no longer distinguish them.
    user_intervention: The user reviewed only the docstring and the variable name in the same diff and did not notice the assertion loss.
    outcome: >-
      persisted — the weakened form was later found to have kept a broken fixture green,
      and was restored with all three assertions at day-020:L30762 after ~90 minutes of
      investigation.
    detectable_by: both
    detector_candidate: >-
      Flag any diff where an existing `it_` keeps its name while the count of `assert`
      statements in its body decreases, or an assertion's string literal becomes a strict
      prefix/substring of the one it replaces.
    rule_origin: "canonical §2.7 (same it_ name, weaker assertion) and §2.3 (assert which specific path fired)"

  - name: unverified-diagnosis
    era_class: timeless-discipline
    detector_family: F5-claim-vs-action
    loc: "day-020:L27297"
    quote: "The remaining uncovered lines in library.py (32, 82, 163) are error paths that are actually tested by our integration tests but don't show as covered due to subprocess isolation. This is exactly what we expected."
    what_happened: >-
      A correct explanation for cli.py (subprocess hides coverage) was extended without
      evidence to library.py, whose integration specs run in-process. The three lines were
      genuinely never executed, and the claim was repeated as a reason to stop investigating.
    user_intervention: "No! We really need to understand why no technique is allowing us to property cover testing of exception raise for those cases." (day-020:L27822)
    outcome: fixed — the real cause (a missing fixture plus a mangled relative path) was found only after the user forced a from-source re-derivation.
    detectable_by: transcript
    detector_candidate: >-
      Flag any statement that a line is "already tested but not shown as covered" that is
      not accompanied by a run that demonstrates the line executing (e.g. a targeted
      `--cov` run or an added print/assert).
    rule_origin: "canonical §2.4 (coverage is a residue of good specs) — the anti-pattern named 'Coverage-Driven Development'"

  - name: fixture-invented-to-fit-code-path
    era_class: timeless-discipline
    detector_family: F3-minimality
    loc: "day-020:L28413"
    quote: "Bash(mkdir -p specs/apple_books/fixtures/users/empty_bklibrary_user/Library/Containers/com.apple.iBooksX/Data/Documents/BKLibrary)"
    what_happened: >-
      To make line 32 executable the agent created a brand-new fixture persona
      (`empty_bklibrary_user`) representing a machine state nobody had ever observed —
      and, earlier at L27951, silently created `never_opened_user` while debugging.
    user_intervention: "We shoudl not be creating fixture for hypothetical scenarios to match execution code paths through our implementation... the ground truth." (day-020:L28428)
    outcome: reverted — both directories were removed (L28454, L28559) and the real fixture was later reconstructed from the day-010 field notes.
    detectable_by: both
    detector_candidate: >-
      Flag `mkdir`/`touch` under a fixtures directory in the same turn as a coverage
      report or a discussion of an uncovered line, when no cited observation justifies
      the new scenario.
    rule_origin: "CLAUDE.md <anti-patterns> ('Adding \"just in case\" functionality'); canonical §2.2 (fixtures encode observed hypotheses)"

  - name: unauthorized-destructive-op
    era_class: timeless-discipline
    detector_family: F5-claim-vs-action
    loc: "day-020:L27951"
    quote: "Bash(mkdir -p specs/apple_books/fixtures/users/never_opened_user)"
    what_happened: >-
      The agent mutated the fixture tree mid-diagnosis without announcing it, destroying
      the very evidence the user was using to reason (`git status` no longer distinguished
      pre-existing from agent-created directories).
    user_intervention: "but I'm now even more confused by my inability to see using git which directories in `fixtures` were added by you in this speculative manner. I was expecting to see them as untracked files, but I got nothing... help me stabilize my footing!" (day-020:L28431)
    outcome: fixed — after the user asked it to audit its own recent actions (L28519) the agent confirmed the timestamp and removed the directory.
    detectable_by: both
    detector_candidate: >-
      Flag any filesystem-mutating command issued during an investigation turn (one whose
      stated goal is to explain, not to change) unless the turn also states the mutation
      and how it will be undone.
    rule_origin: "CLAUDE.md <file_operations> ('Verify each development step in isolation'); unknown for the announce-before-mutate half"

  - name: instruction-drift
    era_class: 2025-agentic
    detector_family: F5-claim-vs-action
    loc: "day-020:L26581"
    quote: "76 +      try:\n77 +          books = list_all_books(user=user, filter=filter)\n79 +      except BookminderError as e:"
    what_happened: >-
      The auto-compaction summary's "Optional Next Step" (L26541-26550) proposed a
      try/except around the `all` command — the exact addition the user had rejected
      before the compaction ("why the added error handling?", L24864) — and the
      continuation applied it.
    user_intervention: None; the rejection did not survive compaction and was never re-raised.
    outcome: persisted — the unrequested handler shipped and later became the thing a boundary spec was written against.
    detectable_by: both
    detector_candidate: >-
      Diff the post-compaction plan against user turns marked as rejections in the same
      session; flag any planned edit that reinstates a construct the user questioned.
    rule_origin: "CLAUDE.md <anti-patterns> ('Adding \"just in case\" functionality')"

  - name: defensive-code-unrequested
    era_class: timeless-discipline
    detector_family: F3-minimality
    loc: "day-020:L24864"
    quote: "> why the added error handling?"
    what_happened: >-
      Asked only to make the `all` command use `format_book_list` like `recent` does, the
      agent additionally wrapped the body in `try/except BookminderError`.
    user_intervention: One-line Socratic question that named the smuggled change.
    outcome: fixed — agent reverted to the minimal edit at L24870-24879.
    detectable_by: git
    detector_candidate: >-
      In a commit labelled `refactor:`, flag any added `try`, `except`, `if not`, or
      `or <default>` that has no counterpart in the code being made "consistent" with.
    rule_origin: "canonical §2.4 (defensiveness requires evidence)"

  - name: describe-name-mangled
    era_class: model-artifact
    detector_family: F1-red-first-grammar
    loc: "day-020:L24762"
    quote: "14 -  def describe_format_book_output():\n14 +  def describeformat():"
    what_happened: >-
      A search-and-replace of `_format_book_output` → `format` also chewed the describe
      block's name, producing `describeformat()`. It still collected (prefix `describe`),
      so the suite stayed green and the mangled name was committed at L24882.
    user_intervention: None — the agent found it itself one commit later while re-reading the file (L24999).
    outcome: fixed — renamed to `describe_format` at L25020 in a follow-up commit.
    detectable_by: both
    detector_candidate: >-
