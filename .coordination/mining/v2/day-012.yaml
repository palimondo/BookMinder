pairing_rules:
  - rule_id: p012-R1
    rule: >-
      Before submitting an edit that your tool must express as a full-file
      replacement, say in words what the diff adds and confirm that nothing
      existing is removed.
    class: reciprocal
    because: >-
      The user judges the edit from the preview, and an append that looks like an
      overwrite reads as destruction of the project's contract.
    because_source: user-verbatim
    quote: |-
      Your task is to add new acceptance test to this file. You must keep everything that's already there.
    evidence: "day-012:L946"
    guards_against: unauthorized-destructive-op

  - rule_id: p012-R2
    rule: >-
      Before changing a fixture or an expected value to turn a test green, state
      the assumption the expectation rests on and check it against real data;
      name what result would falsify it.
    class: mirror
    because: >-
      The author's first move on every red test was to interrogate the assumption,
      never the fixture.
    because_source: user-verbatim
    quote: |-
      First validate you assumption against my real Apple Books database.
    evidence: "day-012:L2255"
    guards_against: fixture-bent-to-test

  - rule_id: p012-R3
    rule: >-
      When the user points you at a manual, a doc section, or a file, read it
      before answering; never argue from pretrained memory about what a tool can
      or cannot do.
    class: mirror
    because: >-
      Two turns and a pasted man page were spent overriding a confident, wrong
      recollection about plutil.
    because_source: user-verbatim
    quote: |-
      I told you to check man plutil:
    evidence: "day-012:L2465"
    guards_against: fabricated-claim

  - rule_id: p012-R4
    rule: >-
      Enumerate the whole evidence set first — list every candidate instance, then
      check each — rather than generalizing from the first agreeing pair.
    class: mirror
    because: >-
      The author's systematic sweep of all cloud-iconed screenshots is what
      revealed ZSTATE 1, 3 and 6 all carry the icon.
    because_source: user-verbatim
    quote: |-
      w8, let's be systematic in our exploration. Check all *.png in @docs. Get a list of all with cloud icon and then investifate all of them in my AB database
    evidence: "day-012:L2804"
    guards_against: unverified-diagnosis

  - rule_id: p012-R5
    rule: >-
      When a story card's title implies an interface it does not specify, stop and
      ask which reading is intended instead of inventing the flag.
    class: reciprocal
    because: >-
      The agent invented a `--enhanced` flag from the card name
      list-recent-books-enhanced and spent a turn implementing the wrong story.
    because_source: user-verbatim
    quote: |-
      there is no `--enhanced` flad. That story is about enhancing the display of the books so that they show also flags
    evidence: "day-012:L900"
    guards_against: spec-invention

  - rule_id: p012-R6
    rule: >-
      When the user cites a rules-file section by tag (e.g. <tdd_discipline>),
      re-read that section before your next edit rather than paraphrasing it back.
    class: mirror
    because: >-
      The tag is a pointer to an agreed rule; paraphrasing it produces agreement
      without changed behavior.
    because_source: user-verbatim
    quote: |-
      only cloud, don't add other flags yet, remember <tdd_discipline>
    evidence: "day-012:L1772"
    guards_against: instruction-drift

  - rule_id: p012-R7
    rule: >-
      After a correction, do not stop at agreement — restate the rule as a
      concrete check you will run before the next edit, then run it visibly.
    class: reciprocal
    because: >-
      Three separate "You are absolutely right, I was taking too large a step"
      turns produced three more over-large steps.
    because_source: agent-synthesis
    evidence: "day-012:L1774"
    guards_against: sycophantic-fold

  - rule_id: p012-R8
    rule: >-
      Convene the council on the failure that just happened, not on the plan you
      have already announced; if the council merely ratifies your stated next step,
      say so and do not spend the round.
    class: council-mechanics
    because: >-
      The second council (L1121-1163) restated the agent's own already-announced
      next step in four voices and changed nothing.
    because_source: agent-synthesis
    evidence: "day-012:L1162"
    guards_against: council-as-rubber-stamp

  - rule_id: p012-R9
    rule: >-
      Give each persona a distinct falsifiable position and report where they
      disagree; when all voices converge, name the convergence and treat it as a
      signal that the panel added no information.
    class: council-mechanics
    because: >-
      Every round here ended in declared unanimity, and the one genuinely divergent
      remark (GOOS on brittle output tests, L2021) was dropped without follow-up.
    because_source: agent-synthesis
    evidence: "day-012:L1055"
    guards_against: council-as-rubber-stamp

  - rule_id: p012-R10
    rule: >-
      Anchor each persona's advice in a position that person actually holds and
      can be cited for; mark paraphrase as paraphrase and never invent a named
      rule for them.
    class: council-mechanics
    because: >-
      "Kent Beck" was made to invoke a "don't change working code rule" that is not
      his, and "Dave Farley" cited a `list_books` function that no longer existed.
    because_source: agent-synthesis
    evidence: "day-012:L1993"
    guards_against: simulacra-shallowness

  - rule_id: p012-R11
    rule: >-
      When you break previously passing tests as a side effect of a step, say so
      explicitly and justify the breakage; never narrate a wider red as "exactly
      what we want".
    class: reciprocal
    because: >-
      The author's whole method depends on knowing which single failure is being
      driven.
    because_source: agent-synthesis
    evidence: "day-012:L1756"
    guards_against: green-suite-regression

council_episodes:
  - loc: "day-012:L985"
    trigger: >-
      Immediately after the attempted wholesale overwrite of cli_spec.py; the user
      asked for the mindset to be re-established before any more implementation.
    invoked_by: user
    personas: ["Kent Beck (TDD)", "Dave Farley (Continuous Delivery)", "Dan North (BDD)", "Steve Freeman & Nat Pryce (GOOS)"]
    voices: flattened-to-consensus
    disagreement_use: >-
      None — the round closes "The council is unanimous" (L1055); four voices state
      the same conclusion in four idioms.
    outcome: accepted
    fidelity:
      - persona: Kent Beck
        assessment: faithful
        evidence: >-
          "Take the smallest possible step ... Add a single it 'shows only cloud
          books' test. Get it to fail because the --flag option doesn't exist"
          (L998-1000) — actionable and matches Beck's actual small-steps/RGR stance.
      - persona: Dave Farley
        assessment: caricature
        evidence: >-
          The user explicitly asked for Modern Software Engineering ("Please try to
          recall all you know about Moder Software Engineering by Dave Farley",
          L948); the response engages none of that book's content and reduces
          Farley to a factory-line analogy plus tool mechanics — "read the file,
          append the new test case, and write the file back" (L1016).
      - persona: Dan North
        assessment: faithful
        evidence: >-
          "The describe 'a context' and it 'does a thing' structure is a
          conversation" (L1028) — consistent with North's actual BDD framing,
          though generic.
      - persona: Steve Freeman & Nat Pryce
        assessment: caricature
        evidence: >-
          "Listening to the tests" is repurposed to mean "match the existing file's
          formatting convention" — "The existing cli_spec.py file already shows you
          how it wants to be extended" (L1040); GOOS's actual doctrine is that
          difficulty writing a test reveals a design defect. Uncertainty flagged:
          the outside-in half of the same answer (L1048) is faithful.
    user_reaction: >-
      Accepted without comment and immediately used as the platform for the next
      instruction.
    lesson: >-
      A council convened on a real failure produced one actionable step (Beck's)
      and three restatements; the named-book request went unanswered.

  - loc: "day-012:L1121"
    trigger: >-
      User-scheduled checkpoint after the Gherkin-docstring placeholders landed
      ("Am them we' reconvene the /expert-council", L1075).
    invoked_by: user
    personas: ["Kent Beck (TDD)", "Dave Farley (Continuous Delivery)", "Dan North (BDD)", "Steve Freeman & Nat Pryce (GOOS)"]
    voices: flattened-to-consensus
    disagreement_use: >-
      None — "The council agrees: the next step is to implement the first test
      case" (L1162), which is verbatim the plan the agent had already stated at
      L1118 before convening.
    outcome: accepted
    fidelity:
      - persona: Kent Beck
        assessment: faithful
        evidence: >-
          "Don't write any more test code than you need to see it fail for the
          right reason" (L1130) — the sharpest and most usable line of the round.
      - persona: Dave Farley
        assessment: fabrication
        evidence: >-
          "This involves adding the --flag option to the list_books function in
          bookminder/cli.py" (L1139) — cli.py had been rewritten to click with a
          `recent` command, as the agent discovered two turns later (L1333); the
          persona asserts a codebase fact that is false. The framing "make the
          smallest possible change to the implementation to make the new test fail"
          also inverts red-first.
      - persona: Dan North
        assessment: faithful
        evidence: >-
          "The Gherkin scenarios are our script ... Write the code in your test
          that actually runs that command" (L1147) — consistent and actionable.
      - persona: Steve Freeman & Nat Pryce
        assessment: faithful
        evidence: >-
          "Don't try to implement the database logic yet ... make the smallest
          change to the CLI to satisfy it" (L1157) — genuine outside-in GOOS.
    user_reaction: >-
      Silent acceptance; the user's next intervention was a correction of step size
      two turns later.
    lesson: >-
      A council asked to bless an already-announced plan returns the plan, plus at
      least one invented fact about the codebase.

  - loc: "day-012:L1985"
    trigger: >-
      User demand after the premature `local` branch and the rewritten display
      string: "Patience Grasshopper. Call /expert-council immediately!"
    invoked_by: user
    personas: ["Kent Beck (TDD)", "Dave Farley (Continuous Delivery)", "Dan North (BDD)", "Steve Freeman & Nat Pryce (GOOS)"]
    voices: flattened-to-consensus
    disagreement_use: >-
      One genuine divergence — GOOS alone raised a new claim (the existing tests
      are too weak to catch the formatting regression) rather than restating the
      minimality point; it was never acted on.
    outcome: accepted
    fidelity:
      - persona: Kent Beck
        assessment: fabrication
        evidence: >-
          "You also broke the 'don't change working code' rule" (L1993) — no such
          named Beck rule exists; his actual doctrine (Tidy First) is to separate
          structural from behavioral change. The first half of the same answer
          ("You wrote code for a test that doesn't exist yet") is faithful.
      - persona: Dave Farley
        assessment: faithful
        evidence: >-
          "That elif flag == \"local\": block has zero test coverage ... Untested
          code paths move you away from that goal [shippable]" (L2002) — genuinely
          CD-shaped and specific to the diff.
      - persona: Dan North
        assessment: faithful
        evidence: >-
          "This is how scope creep happens at the micro-level" (L2012), tied to the
          story card's literal `when:` clause.
      - persona: Steve Freeman & Nat Pryce
        assessment: faithful
        evidence: >-
          "perhaps the existing tests are too brittle or not specific enough about
          the output format" (L2022) — the only remark in any round that generated
          new information; it anticipates the exact-equality formatter rule the
          project later adopts (canonical §2.3).
    user_reaction: >-
      Accepted; the user did not challenge any persona's fidelity in this session.
    lesson: >-
      The council's value came entirely from the two voices that cited the actual
      diff; the two that reached for doctrine produced an invented rule and a
      slogan.

pairing_gems:
  - loc: "day-012:L946"
    why_exemplary: >-
      The rebuke and the reason arrive together: the user names the violation, then
      in three sentences derives why the spec file is inviolable from what a
      failing test means. It is the clearest statement of the project's ATDD
      rationale anywhere in the corpus.

  - loc: "day-012:L1073"
    why_exemplary: >-
      A four-part instruction that is simultaneously praise, correction, method and
      checkpoint: keep the names, drop the mocks, put the story's scenario in the
      docstring with a `pass` body, then reconvene. It decomposes one edit into a
      reviewable sequence without writing any of it for the agent.

  - loc: "day-012:L2465"
    why_exemplary: >-
      Rather than repeating the assertion a third time, the user pastes the man
      page's ARGUMENTS block — correcting a confident hallucination with the
      primary source instead of with authority.

  - loc: "day-012:L2628"
    why_exemplary: >-
      The user disproves the agent's hypothesis with fresh screenshots, names the
      new concept ("Series"), and in the same breath converts the disproof into a
      documentation task and the next investigation — a failed hypothesis turned
      into durable project knowledge without blame.

