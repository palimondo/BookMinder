file: day-012
date: 2025-06-27
agent_era: gemini-cli
model: >-
  gemini-2.5-pro, silently downgraded mid-session to gemini-2.5-flash
  ("Slow response times detected. Automatically switching from gemini-2.5-pro to
  gemini-2.5-flash ... for the remainder of this session", day-012:L2350);
  /about confirms gemini-2.5-flash at day-012:L3271. Gemini CLI 0.1.4.
  22 turns, 9.64M input tokens, 11h 9m wall (day-012:L3330-3339).
sub_sessions:
  - "L1-L3341 (single continuous session; ends in an unrecoverable API-400 loop L3049-3254)"

philosophy:
  - statement: >-
      Acceptance tests are the project's contract with its users; their value is
      that a newly failing test proves a contract was broken, which is why the
      spec file may only ever be added to, never replaced.
    source: user-verbatim
    quote: |-
      We practice ATDD, acceptance test driven development. ATs define what our project does. When they pass, we know the system does something we specified. Or more
      precisely, if a test starts failing, we know we have broken some contract with our users.
    loc: "day-012:L946"
    feeds: skill-why

  - statement: >-
      The outermost acceptance test must exercise the real system end-to-end;
      mocks at that layer are an implementation detail smuggled into the
      specification.
    source: user-verbatim
    quote: |-
      But what was that part with the mocker?! We are now writing the outermost acceptance test.
    loc: "day-012:L1073"
    feeds: judge-anchor

  - statement: >-
      A spec is written in two moves: first the name plus the story's scenario as
      the whole body, then the executable body. Naming the behavior is a separate,
      reviewable act from implementing the check.
    source: user-verbatim
    quote: |-
      Take just the function names from your last proposed edit and write the corresponding Gherkin scenario from the story into their docstrings.
      body is just `pass` nothing else.
    loc: "day-012:L1074"
    feeds: skill-why

  - statement: >-
      Slicing is done by naming the one branch that exists and explicitly parking
      its symmetric twin — the opposite case is a different story, not the other
      half of this one.
    source: user-verbatim
    quote: |-
      I think we should stay with the recent command. One small step. Only add the --flag cloud. Also, mark the second test for local as skipped for now, while we
      work on the fist.
    loc: "day-012:L1338"
    feeds: skill-why

  - statement: >-
      Minimality is enforced by citing the constitution's own section rather than
      re-arguing it — the rule exists so the conversation need not repeat.
    source: user-verbatim
    quote: |-
      only cloud, don't add other flags yet, remember <tdd_discipline>
    loc: "day-012:L1772"
    feeds: judge-anchor

  - statement: >-
      Working output is extended, never restyled, while a feature is being added:
      an append is reviewable, a rewrite silently changes behavior other tests
      already own.
    source: user-verbatim
    quote: |-
      what happened to the parentheses and % in progress? You shoudl only append to the back of that string -- not rewrite it.
    loc: "day-012:L1975"
    feeds: skill-why

  - statement: >-
      Domain assumptions are validated against real observed data before any test
      or fixture is shaped around them — the fixture may not be edited to rescue a
      hypothesis.
    source: user-verbatim
    quote: |-
      First validate you assumption against my real Apple Books database.
    loc: "day-012:L2255"
    feeds: judge-anchor

  - statement: >-
      Exploration is exhaustive before it is conclusive: enumerate every instance
      of the observable, then check each against the data, rather than
      generalizing from the first two rows that agree.
    source: user-verbatim
    quote: |-
      w8, let's be systematic in our exploration. Check all *.png in @docs. Get a list of all with cloud icon and then investifate all of them in my AB database
    loc: "day-012:L2804"
    feeds: skill-why

  - statement: >-
      A story card that misleads is a shared defect to be re-specified and
      re-ordered, not a licence for the agent to invent the interface the title
      implies.
    source: user-verbatim
    quote: |-
      Actually, it looks like you misunderstood, or we've poorly specified it in the stories in our previous session... there is no `--enhanced` flad.
    loc: "day-012:L900"
    feeds: skill-why

  - statement: >-
      A disproved hypothesis is project knowledge, not waste — the falsification
      is written into the domain document before work resumes.
    source: user-verbatim
    quote: |-
      These aren't individual books ZSTATE=5 seems like "Series" -- a new concept that we haven't identified before in our analysis.
      This might be worthy an update, a note somewhere in, @docs/apple_books.md
    loc: "day-012:L2629"
    feeds: skill-why

skill_rules:
  - rule_id: d012-R1
    rule: >-
      Never submit an edit that replaces a spec file wholesale; read the file,
      then produce a diff that only adds — every pre-existing test must survive
      byte-for-byte.
    because: >-
      The acceptance suite is the executable contract with users, so deleting a
      test silently deletes a requirement.
    because_source: user-verbatim
    quote: |-
      Why are you completely overwriting `cli_spec`?!? WTF!!! Your task is to add new acceptance test to this file. You must keep everything that's already there.
    evidence: "day-012:L946"
    taught_or_enforced: needed-enforcement
    skill_target: tdd-bdd
    overlap: "canonical §2.7"
    feasibility: ok

  - rule_id: d012-R2
    rule: >-
      Write the outermost acceptance test without mocks — invoke the real entry
      point and assert on real output.
    because: >-
      A mock at the acceptance layer specifies the test double, not the system the
      user runs.
    because_source: user-verbatim
    quote: |-
      But what was that part with the mocker?! We are now writing the outermost acceptance test.
    evidence: "day-012:L1073"
    taught_or_enforced: needed-enforcement
    skill_target: tdd-bdd
    overlap: "canonical §2.2"
    feasibility: "needs-rework: canonical §2.2 later settles on CliRunner+mocks for coordination specs plus exactly ONE subprocess wiring test; state the rule as 'no mocks in the one end-to-end spec' rather than 'no mocks in cli_spec.py', which is how it reads here"

  - rule_id: d012-R3
    rule: >-
      Land a new spec in two commits' worth of moves: first the describe/it names
      carrying the story's when/then as the entire body, then the executable body.
    because: >-
      Naming the behavior is a decision the pair reviews before any assertion
      commits you to a mechanism.
    because_source: user-verbatim
    quote: |-
      Take just the function names from your last proposed edit and write the corresponding Gherkin scenario from the story into their docstrings.
      body is just `pass` nothing else.
    evidence: "day-012:L1074"
    taught_or_enforced: taught-once
    skill_target: tdd-bdd
    overlap: "both"
    feasibility: ok

  - rule_id: d012-R4
    rule: >-
      Give a placeholder spec `@pytest.mark.skip`, never a bare `pass` body, so an
      unimplemented scenario shows as pending rather than green.
    because: >-
      A `pass` body renders as a passing tick in `pytest --spec`, so the living
      documentation claims a behavior nothing verifies.
    because_source: user-paraphrase
    evidence: "day-012:L1244"
    taught_or_enforced: needed-enforcement
    skill_target: tdd-bdd
    overlap: "canonical §2.1"
    feasibility: ok

  - rule_id: d012-R5
    rule: >-
      Keep exactly one spec red at a time; mark every not-yet-worked scenario
      skipped before starting the one you are driving.
    because: >-
      A single red test names the next decision; several red tests hide which
      failure you are actually chasing.
    because_source: user-verbatim
    quote: |-
      Also, mark the second test for local as skipped for now, while we work on the fist.
    evidence: "day-012:L1338"
    taught_or_enforced: taught-once
    skill_target: tdd-bdd
    overlap: "canonical §3"
    feasibility: ok

  - rule_id: d012-R6
    rule: >-
      Implement only the branch the current red test demands; do not add the
      symmetric or negated case in the same edit.
    because: >-
      The opposite case is a separate scenario with no failing test pulling it
      into existence, so it ships untested.
    because_source: user-verbatim
    quote: |-
      only cloud, don't add other flags yet, remember <tdd_discipline>
    evidence: "day-012:L1772"
    taught_or_enforced: needed-enforcement
    skill_target: tdd-bdd
    overlap: "CLAUDE.md <anti-patterns>"
    feasibility: ok

  - rule_id: d012-R7
    rule: >-
      When adding an element to formatted output, append to the existing format
      expression; do not restructure the expression in the same change.
    because: >-
      A rewrite quietly alters output other tests already specify, converting a
      feature addition into an unreviewed regression.
    because_source: user-verbatim
    quote: |-
      You shoudl only append to the back of that string -- not rewrite it.
    evidence: "day-012:L1975"
    taught_or_enforced: needed-enforcement
    skill_target: tdd-bdd
    overlap: none
    feasibility: ok

  - rule_id: d012-R8
    rule: >-
      Never edit a test fixture to make a failing test pass until the assumption
      behind the expected value has been confirmed against real observed data.
    because: >-
      A fixture invented to satisfy a hypothesis makes the test prove the
      hypothesis it was built from.
    because_source: user-verbatim
    quote: |-
      First validate you assumption against my real Apple Books database.
    evidence: "day-012:L2255"
    taught_or_enforced: needed-enforcement
    skill_target: tdd-bdd
    overlap: "canonical §2.4"
    feasibility: ok

  - rule_id: d012-R9
    rule: >-
      Before generalizing from a data pattern, enumerate the complete candidate
      set from the ground-truth artifact and check every member.
    because: >-
      Two agreeing rows are not a mapping; the disconfirming case is the one that
      decides the rule.
    because_source: user-verbatim
    quote: |-
      Check all *.png in @docs. Get a list of all with cloud icon and then investifate all of them in my AB database
    evidence: "day-012:L2804"
    taught_or_enforced: needed-enforcement
    skill_target: tdd-bdd
    overlap: "CLAUDE.md <implementation_process>"
    feasibility: ok

  - rule_id: d012-R10
    rule: >-
      Run `source .venv/bin/activate` before any pytest invocation in BookMinder.
    because: >-
      pytest is installed only inside the project venv; a bare `pytest` returns
      "command not found" and looks like a broken project.
    because_source: agent-synthesis
    evidence: "day-012:L38"
    taught_or_enforced: taught-once
    skill_target: project-memory
    overlap: "CLAUDE.md <build_commands>"
    feasibility: ok

  - rule_id: d012-R11
    rule: >-
      Treat `ZSTATE = 5` in ZBKLIBRARYASSET as a Series/collection entry, not a
      cloud-only book.
    because: >-
      The two ZSTATE=5 rows in the author's library ("Hainish", "The Baroque
      Cycle") are shown by Apple Books as series, confirmed by screenshot.
    because_source: user-verbatim
    quote: |-
      These aren't individual books ZSTATE=5 seems like "Series" -- a new concept that we haven't identified before in our analysis.
    evidence: "day-012:L2629"
    taught_or_enforced: taught-once
    skill_target: project-memory
    overlap: none
    feasibility: ok

  - rule_id: d012-R12
