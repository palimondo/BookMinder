    outcome: "unresolved — never applied; the project later adopts mocked coordination specs, but as a separate layer beside one subprocess wiring test (canonical §2.2)"
    detectable_by: transcript
    detector_candidate: >-
      Flag any proposal to introduce mocking into a spec file the user has
      previously designated as the outermost/end-to-end test, especially when the
      stated motivation is that real data is inconvenient.
    rule_origin: "CLAUDE.md <core_philosophy> (Design for testability) — invoked here to justify weakening the acceptance layer"

  - name: silent-model-downgrade
